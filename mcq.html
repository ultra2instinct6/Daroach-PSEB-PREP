  /* ---------------- Question index ----------------
     Every question is stamped with its own subject and indexed by id so that a
     mixed custom set can still render the correct subject label / accent per
     card, and so filters can rebuild a set from stored ids alone. */
  const BY_ID = {};
  const ALL_QUESTIONS = [];
  Object.keys(BANKS).forEach(s => {
    BANKS[s].questions.forEach(qq => {
      qq.subj = s;
      BY_ID[qq.id] = qq;
      ALL_QUESTIONS.push(qq);
    });
  });

  /* ---------------- State ---------------- */
  const STORE_KEY = "bolo_mcq_v1";
  const ATTEMPTS_KEY = "bolo_mcq_attempts_v1";
  const HISTORY_KEY = "bolo_mcq_history_v1";
  const THEME_KEY = "bolo.theme.v1";
  const THEMES = {
    NEON: {
      label: "Neon",
      subjectAccents: { SCIENCE: "#00e5ff", MATH: "#2ecc71", ENGLISH: "#b026ff" }
    },
    CLASSIC: {
      label: "Classic",
      subjectAccents: { SCIENCE: "#0b56c5", MATH: "#f26a21", ENGLISH: "#179c65" }
    }
  };
  const LETTERS = ["A", "B", "C", "D", "E"];
  const DEFAULT_SECS = 60;

  let subject = "SCIENCE";
  let lang = "pa";
  let theme = "NEON";
  let mode = "TUTOR";      // "TUTOR" = instant grading, "EXAM" = graded on submit
  let qIndex = 0;
  let answers = {};   // { [qid]: pickedIndex } — index into the *shuffled* option list
  let struck = {};    // { [qid]: { [optIndex]: true } } — ruled-out distractors
  let flags = {};     // { [qid]: true } — marked for review
  let times = {};     // { [qid]: ms spent before answering }
  let clues = {};     // { [qid]: true } — clue revealed for this question
  let recorded = {};  // { [qid]: true } — already folded into lifetime history
  let order = null;   // null = bank order; array of indices when shuffled
  let optOrders = {}; // { [qid]: permutation } — options shuffled per run to kill position bias
  let qShownAt = Date.now();
  let finished = false;
  let submitted = false;   // exam blocks stay hidden until this flips
  let customIds = null;    // non-null => a filtered custom set is the active run
  let customLabel = "";
  let secsPerQ = DEFAULT_SECS; // exam timer budget per question; 0 = untimed
  let examEndsAt = 0;          // epoch ms for the block deadline; 0 = no timer
  let timerHandle = null;

  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY)) || {};
    if (saved.lang === "en" || saved.lang === "pa") lang = saved.lang;
    if (BANKS[saved.subject]) subject = saved.subject;
    if (saved.mode === "TUTOR" || saved.mode === "EXAM") mode = saved.mode;
    if (typeof saved.secsPerQ === "number" && saved.secsPerQ >= 0) secsPerQ = saved.secsPerQ;
  } catch (e) {}
  try {
    const savedTheme = JSON.parse(localStorage.getItem(THEME_KEY)) || {};
    if (THEMES[savedTheme.theme]) theme = savedTheme.theme;
  } catch (e) {}

  const qCard = document.getElementById("qCard");
  const progressTrack = document.getElementById("progressTrack");
  const scoreVal = document.getElementById("scoreVal");
  const scorePill = document.getElementById("scorePill");
  const logoDot = document.getElementById("logoDot");
  const auraBleed = document.getElementById("auraBleed");
  const announcer = document.getElementById("ariaAnnouncer");
  const themePill = document.getElementById("themePill");
  const timerPill = document.getElementById("timerPill");
  const timerVal = document.getElementById("timerVal");
  const setPill = document.getElementById("setPill");
  const setPillLabel = document.getElementById("setPillLabel");
  const customModal = document.getElementById("customModal");
  const submitModal = document.getElementById("submitModal");

  const bank = () => BANKS[subject];
  const bankOf = qq => BANKS[qq && qq.subj] || BANKS[subject];
  const inCustom = () => Array.isArray(customIds);
  /* Saved runs are namespaced: one per subject bank plus one for the custom set. */
  const scope = () => (inCustom() ? "CUSTOM" : subject);

  const questions = () => {
    if (inCustom()) return customIds.map(id => BY_ID[id]).filter(Boolean);
    const qs = bank().questions;
    return order ? order.map(i => qs[i]) : qs;
  };
  const q = () => questions()[qIndex];

  /* The per-question option permutation. Regenerated when absent or stale
     (e.g. a restored run whose question has since gained or lost an option). */
  function optOrder(qq) {
    let ord = optOrders[qq.id];
    if (!validPermutation(ord, qq.options.length)) {
      ord = shuffled(qq.options.map((_, i) => i));
      optOrders[qq.id] = ord;
    }
    return ord;
  }
  function opts(qq) { return optOrder(qq).map(i => qq.options[i]); }

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const primary = obj => obj[lang];
  const secondary = obj => obj[lang === "pa" ? "en" : "pa"];
  const pick = (pa, en) => (lang === "pa" ? pa : en);
  const accentFor = subj => THEMES[theme].subjectAccents[subj] || "#00e5ff";
  function activeAccent() {
    const cur = finished ? null : q();
    return accentFor(cur ? cur.subj : subject);
  }

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        subject, lang, mode, secsPerQ, activeScope: scope()
      }));
    } catch (e) {}
  }
  function persistTheme() { try { localStorage.setItem(THEME_KEY, JSON.stringify({ theme })); } catch (e) {} }

  /* ---------------- Lifetime history (account-free progress) ----------------
     Independent of any single run: which questions have ever been attempted,
     which are still wrong, which are flagged, and rolling accuracy by subject.
     This is what powers the "Unused / Incorrect / Flagged" custom-quiz filters. */
  let history = { seen: {}, wrong: {}, flagged: {}, subjects: {} };

  function loadHistory() {
    let raw = {};
    try { raw = JSON.parse(localStorage.getItem(HISTORY_KEY)) || {}; } catch (e) { raw = {}; }
    const obj = v => (v && typeof v === "object" ? v : {});
    history = {
      seen: obj(raw.seen),
      wrong: obj(raw.wrong),
      flagged: obj(raw.flagged),
      subjects: obj(raw.subjects)
    };
    /* Drop ids that no longer exist in the bank after a content update. */
    ["seen", "wrong", "flagged"].forEach(k => {
      Object.keys(history[k]).forEach(id => { if (!BY_ID[id]) delete history[k][id]; });
    });
  }
  function persistHistory() {
    history.updatedAt = Date.now();
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }
  function recordResult(qq, correct) {
    if (recorded[qq.id]) return;       // one history entry per question per run
    recorded[qq.id] = true;
    history.seen[qq.id] = true;
    if (correct) delete history.wrong[qq.id]; else history.wrong[qq.id] = true;
    const s = history.subjects[qq.subj] || (history.subjects[qq.subj] = { attempts: 0, correct: 0 });
    s.attempts++;
    if (correct) s.correct++;
    persistHistory();
  }
  function recordFlag(qq, on) {
    if (on) history.flagged[qq.id] = true; else delete history.flagged[qq.id];
    persistHistory();
  }
  function resetHistory() {
    history = { seen: {}, wrong: {}, flagged: {}, subjects: {} };
    persistHistory();
    attempts = {};
    try { localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(attempts)); } catch (e) {}
    customIds = null;
    customLabel = "";
    resetRun(false);
    persist();
    render();
  }

  /* ---------------- Offline attempt persistence ----------------
     The whole run (picked answers, struck options, flags, per-question
     timings, clues opened, option shuffle, exam deadline and position) is
     stored per scope so a student on patchy data can close the tab mid-test
     and resume exactly where they left off. assets/pwa.js additionally mirrors
     this key into IndexedDB. */
  let attempts = {};
  try { attempts = JSON.parse(localStorage.getItem(ATTEMPTS_KEY)) || {}; } catch (e) { attempts = {}; }

  function persistAttempt() {
    attempts[scope()] = {
      qIndex, answers, struck, flags, times, clues, recorded, order, optOrders,
      finished, submitted, mode, secsPerQ, examEndsAt,
      customIds: inCustom() ? customIds : null,
      customLabel,
      savedAt: Date.now()
    };
    try { localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(attempts)); } catch (e) {}
  }

  /* A saved run holds positional indices (the shuffle order and the per-question
     option permutation). Those go stale if the bank is edited in a later deploy,
     so validate them on restore — everything else is keyed by question id and
     survives untouched. */
  function validPermutation(arr, length) {
    if (!Array.isArray(arr) || arr.length !== length) return false;
    const seen = new Set();
    for (const v of arr) {
      if (!Number.isInteger(v) || v < 0 || v >= length || seen.has(v)) return false;
      seen.add(v);
    }
    return true;
  }

  function restoreAttempt() {
    const a = attempts[scope()];
    if (!a || typeof a !== "object") return false;
    const obj = v => (v && typeof v === "object" ? v : {});
    answers = obj(a.answers);
    struck = obj(a.struck);
    flags = obj(a.flags);
    times = obj(a.times);
    clues = obj(a.clues);
    recorded = obj(a.recorded);
    finished = !!a.finished;
    submitted = !!a.submitted;
    if (typeof a.secsPerQ === "number" && a.secsPerQ >= 0) secsPerQ = a.secsPerQ;
    examEndsAt = typeof a.examEndsAt === "number" ? a.examEndsAt : 0;
    if (inCustom()) {
      order = null;
    } else {
      order = validPermutation(a.order, bank().questions.length) ? a.order : null;
    }
    const pool = inCustom() ? questions() : bank().questions;
    optOrders = {};
    if (a.optOrders && typeof a.optOrders === "object") {
      pool.forEach(qq => {
        if (validPermutation(a.optOrders[qq.id], qq.options.length)) optOrders[qq.id] = a.optOrders[qq.id];
      });
    }
    const total = questions().length;
    qIndex = typeof a.qIndex === "number" && a.qIndex >= 0 && a.qIndex < total ? a.qIndex : 0;
    /* Drop answers/strikes that point at options a since-edited question no
       longer has, so scoring can never dereference undefined. */
    Object.keys(answers).forEach(id => {
      const qq = BY_ID[id];
      if (!qq || !(Number.isInteger(answers[id]) && answers[id] >= 0 && answers[id] < qq.options.length)) {
        delete answers[id];
      }
    });
    qShownAt = Date.now();
    return true;
  }

  /* Restore the custom set itself (ids + label) before anything reads scope(). */
  function restoreCustomSet() {
    const a = attempts.CUSTOM;
    if (!a || !Array.isArray(a.customIds)) return false;
    const ids = a.customIds.filter(id => BY_ID[id]);
    if (!ids.length) return false;
    customIds = ids;
    customLabel = typeof a.customLabel === "string" ? a.customLabel : "Custom set";
    return true;
  }

  /* ---------------- Theme ---------------- */
  function updateThemePill() {
    if (!themePill) return;
    const label = THEMES[theme].label;
    themePill.textContent = "Theme: " + label;
    themePill.setAttribute("aria-label", "Switch color theme. Current: " + label);
  }
  function applyTheme(themeName, announce) {
    theme = THEMES[themeName] ? themeName : "NEON";
    document.body.dataset.theme = theme;
    updateThemePill();
    persistTheme();
    if (announce) announcer.textContent = "Theme " + THEMES[theme].label;
    render();
  }

  function applyAccent() {
    const accent = activeAccent();
    document.documentElement.style.setProperty("--accent", accent);
    auraBleed.style.background = "radial-gradient(ellipse at center, " + accent + "22 0%, " + accent + "0d 40%, transparent 72%)";
  }

  /* ---------------- Grading / reveal gate ----------------
     Tutor mode grades the moment an option is picked; exam mode records the
     answer silently and only reveals once the block is submitted. */
  const isAnswered = qq => answers[qq.id] !== undefined;
  const isRevealed = qq => (mode === "TUTOR" ? isAnswered(qq) : submitted);
  const answersLocked = qq => (mode === "TUTOR" ? isAnswered(qq) : submitted);

  function scoreParts() {
    let correct = 0, attempted = 0;
    questions().forEach(qq => {
      const picked = answers[qq.id];
      if (picked === undefined) return;
      attempted++;
      if (opts(qq)[picked].correct) correct++;
    });
    return { correct, attempted };
  }

  function renderScore() {
    const s = scoreParts();
    scoreVal.textContent = s.correct + " / " + s.attempted;
    /* Live score would leak grading during a timed block. */
    if (scorePill) scorePill.hidden = mode === "EXAM" && !submitted;
  }

  function renderProgress() {
    progressTrack.innerHTML = "";
    questions().forEach((qq, i) => {
      const seg = document.createElement("button");
      seg.type = "button";
      seg.className = "progress-seg";
      seg.dataset.jump = i;
      const picked = answers[qq.id];
      let state = " (unanswered)";
      if (picked !== undefined) {
        if (isRevealed(qq)) {
          const ok = opts(qq)[picked].correct;
          seg.classList.add(ok ? "seen-correct" : "seen-wrong");
          state = ok ? " (correct)" : " (incorrect)";
        } else {
          seg.classList.add("answered");
          state = " (answered)";
        }
      }
      if (flags[qq.id]) seg.classList.add("flagged");
      if (i === qIndex && !finished) seg.classList.add("current");
      seg.setAttribute("aria-label", "Go to question " + (i + 1) + state + (flags[qq.id] ? ", flagged" : ""));
      progressTrack.appendChild(seg);
    });
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  /* ---------------- Simulated peer response statistics ----------------
     There is no backend, so the split is derived deterministically from the
     question id and its difficulty: the same question always shows the same
     distribution, harder questions show a flatter (more forgiving) spread, and
     an authored `peerPct` on an option always wins. Returns percentages in the
     question's *authored* option order. */
  function hash32(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function peerPcts(qq) {
    const authored = qq.options.every(o => typeof o.peerPct === "number");
    if (authored) return qq.options.map(o => o.peerPct);

    const base = { Easy: 78, Medium: 62, Hard: 46 }[qq.diff] || 62;
    const correctIdx = qq.options.findIndex(o => o.correct);
    const jitter = (hash32(qq.id) % 13) - 6;
    const correctPct = Math.max(28, Math.min(88, base + jitter));
    const wrongIdxs = qq.options.map((_, i) => i).filter(i => i !== correctIdx);
    const weights = wrongIdxs.map(i => 1 + (hash32(qq.id + ":" + i) % 60) / 40);
    const weightSum = weights.reduce((a, b) => a + b, 0) || 1;

    const out = new Array(qq.options.length).fill(0);
    out[correctIdx] = correctPct;
    let spent = 0;
    wrongIdxs.forEach((idx, k) => {
      const share = Math.max(2, Math.round(((100 - correctPct) * weights[k]) / weightSum));
      out[idx] = share;
      spent += share;
    });
    /* Absorb rounding drift on the largest distractor so the bars total 100%. */
    const drift = 100 - correctPct - spent;
    if (wrongIdxs.length) {
      let biggest = wrongIdxs[0];
      wrongIdxs.forEach(i => { if (out[i] > out[biggest]) biggest = i; });
      out[biggest] = Math.max(2, out[biggest] + drift);
    } else {
      out[correctIdx] = 100;
    }
    return out;
  }

  /* ---------------- Question card ---------------- */
  function renderQuestion() {
    const qq = q();
    if (!qq) { renderEmptyState(); return; }
    const picked = answers[qq.id];
    const answered = picked !== undefined;
    const revealed = isRevealed(qq);
    const locked = answersLocked(qq);
    const strikes = struck[qq.id] || {};
    const langBtnLabel = lang === "pa" ? "EN ⇄ ਪੰਜਾਬੀ" : "ਪੰਜਾਬੀ ⇄ EN";

    let html = '<div class="q-meta">' +
      '<span class="meta-rune hot">' + esc(primary(bankOf(qq).label)) + '</span>' +
      '<span class="meta-rune">' + esc(qq.ch) + '</span>' +
      '<span class="meta-rune">' + esc(qq.competency) + '</span>' +
      (qq.diff ? '<span class="meta-rune diff-' + qq.diff.toLowerCase() + '">' + esc(qq.diff) + '</span>' : '') +
      '<button class="flag-btn' + (flags[qq.id] ? " active" : "") + '" type="button" data-flag aria-pressed="' + (flags[qq.id] ? "true" : "false") + '" aria-label="Flag question for review">' + (flags[qq.id] ? "⚑ Flagged" : "⚐ Flag") + '</button>' +
      '<button class="lang-flip" type="button" data-flip-lang>' + langBtnLabel + '</button>' +
      '</div>';

    if (mode === "EXAM" && !submitted) {
      html += '<div class="exam-banner">⏱ <span>' +
        pick("ਟਾਈਮਡ ਪ੍ਰੀਖਿਆ ਮੋਡ — ਉੱਤਰ ਦਰਜ ਹੋਣਗੇ ਪਰ ਸਹੀ/ਗਲਤ ਸਬਮਿਟ ਕਰਨ ਤੋਂ ਬਾਅਦ ਹੀ ਦਿਖੇਗਾ।",
          "Timed Exam Mode — answers are recorded now and graded only after you submit the block.") +
        '</span></div>';
    }

    html += '<div class="q-prompt">' + primary(qq.prompt) + '</div>' +
      '<div class="q-prompt-sub">' + secondary(qq.prompt) + '</div>';

    /* Progressive clue: available before committing, and only in Tutor mode. */
    if (qq.hint && mode === "TUTOR" && !answered) {
      const open = !!clues[qq.id];
      html += '<button class="clue-btn" type="button" data-clue aria-expanded="' + (open ? "true" : "false") + '" aria-controls="cluePanel">💡 ' +
        (open ? pick("ਸੰਕੇਤ ਲੁਕਾਓ", "Hide the clue") : pick("ਸੰਕੇਤ ਚਾਹੀਦਾ ਹੈ?", "Need a Clue?")) + '</button>';
      if (open) {
        html += '<div class="clue-panel" id="cluePanel">' +
          '<div class="clue-title">' + pick("ਮੁੱਖ ਸੰਕੇਤ · KEY CLUE", "Key Clue · ਮੁੱਖ ਸੰਕੇਤ") + '</div>' +
          '<div class="clue-body">' + primary(qq.hint) + '</div>' +
          '<div class="clue-sub">' + secondary(qq.hint) + '</div></div>';
      }
    } else if (qq.hint && clues[qq.id] && revealed) {
      html += '<div class="clue-panel"><div class="clue-title">' + pick("ਵਰਤਿਆ ਗਿਆ ਸੰਕੇਤ", "Clue you used") + '</div>' +
        '<div class="clue-body">' + primary(qq.hint) + '</div></div>';
    }

    const shown = opts(qq);
    shown.forEach((opt, i) => {
      let optClass = "option";
      let rowClass = "option-row";
      let strikeClass = "strike-btn";
      const isStruck = !!strikes[i] && !locked;
      if (isStruck) { rowClass += " struck"; strikeClass += " active"; }
      if (revealed) {
        if (opt.correct) optClass += " correct";
        else if (picked === i) optClass += " incorrect";
      } else if (picked === i) {
        optClass += " picked";
      }
      const subT = secondary(opt.t) !== primary(opt.t) ? '<span class="opt-sub">' + secondary(opt.t) + '</span>' : '';
      const tick = !revealed && picked === i ? '<span class="opt-tick" aria-hidden="true">●</span>' : '';
      html += '<div class="' + rowClass + '">' +
        '<button class="' + strikeClass + '" type="button" data-strike="' + i + '" aria-pressed="' + (isStruck ? "true" : "false") + '" aria-label="' + (isStruck ? "Restore option " : "Rule out option ") + LETTERS[i] + '" ' + (locked ? "disabled" : "") + '>✕</button>' +
        '<button class="' + optClass + '" type="button" data-pick="' + i + '" ' + (locked ? "disabled" : "") +
        (isStruck ? ' aria-disabled="true"' : "") +
        (picked === i ? ' aria-current="true"' : "") + '>' +
        '<span class="opt-letter">' + LETTERS[i] + '.</span>' +
        '<span class="opt-text">' + primary(opt.t) + subT + '</span>' + tick +
        '</button></div>';
    });

    if (revealed) html += explanationHTML(qq, picked, shown);

    html += actionBarHTML(qq, answered);

    qCard.innerHTML = html;
    qCard.classList.remove("swap");
    void qCard.offsetWidth;
    qCard.classList.add("swap");
  }

  function renderEmptyState() {
    qCard.innerHTML = '<div class="summary"><h2>' + pick("ਕੋਈ ਪ੍ਰਸ਼ਨ ਨਹੀਂ", "No questions here") + '</h2>' +
      '<p>' + pick("ਇਸ ਫਿਲਟਰ ਲਈ ਕੋਈ ਪ੍ਰਸ਼ਨ ਨਹੀਂ ਮਿਲਿਆ। ਕੋਈ ਹੋਰ ਸੈੱਟ ਬਣਾਓ।",
        "No questions match this set. Build another one.") + '</p>' +
      '<div class="summary-actions"><button class="btn-next" type="button" data-open-custom>⚙️ ' +
      pick("ਕਸਟਮ ਕੁਇਜ਼", "Create Custom Quiz") + '</button>' +
      '<button class="btn-ghost" type="button" data-exit-custom>' + pick("ਵਿਸ਼ਾ ਬੈਂਕ ’ਤੇ ਵਾਪਸ", "Back to subject bank") + '</button></div></div>';
  }

  /* Rationales → peer stats → trap alert → high-yield table → objective. */
  function explanationHTML(qq, picked, shown) {
    const perm = optOrder(qq);
    const pcts = peerPcts(qq);
    const answered = picked !== undefined;
    const wasCorrect = answered && shown[picked].correct;
    const verdictClass = !answered ? "" : (wasCorrect ? "good" : "bad");
    const verdictText = !answered
      ? pick("— ਇਹ ਪ੍ਰਸ਼ਨ ਖਾਲੀ ਛੱਡਿਆ ਗਿਆ", "— Left unanswered")
      : (wasCorrect ? pick("✓ ਸਹੀ ਉੱਤਰ!", "✓ Correct!") : pick("✕ ਗਲਤ ਉੱਤਰ", "✕ Incorrect"));

    let html = '<div class="feedback">' +
      '<div class="verdict ' + verdictClass + '">' + verdictText + '</div>';

    shown.forEach((opt, i) => {
      let rClass = "rationale";
      if (opt.correct) rClass += " good";
      else if (picked === i) rClass += " bad";
      html += '<div class="' + rClass + '"><strong>' + LETTERS[i] + '.</strong> ' + primary(opt.r) + '</div>';
    });

    /* Peer response bars — normalise mistakes on genuinely hard questions. */
    html += '<div class="peer-wrap"><div class="peer-title">' +
      pick("ਹੋਰ ਵਿਦਿਆਰਥੀਆਂ ਦੇ ਜਵਾਬ · PEER RESPONSES", "Peer Responses · ਹੋਰ ਵਿਦਿਆਰਥੀਆਂ ਦੇ ਜਵਾਬ") + '</div>';
    shown.forEach((opt, i) => {
      const pct = pcts[perm[i]];
      const cls = opt.correct ? " good" : (picked === i ? " mine" : "");
      const tag = opt.correct ? pick(" (ਸਹੀ ਉੱਤਰ)", " (Correct)") : (picked === i ? pick(" (ਤੁਹਾਡਾ)", " (You)") : "");
      html += '<div class="peer-row"><span class="peer-key' + cls + '">' + LETTERS[i] + '</span>' +
        '<span class="peer-bar"><span class="peer-fill' + cls + '" style="width:' + pct + '%"></span></span>' +
        '<span class="peer-pct">' + pct + "%" + esc(tag) + '</span></div>';
    });
    const correctPct = pcts[qq.options.findIndex(o => o.correct)];
    html += '<div class="peer-note">' + (correctPct < 55
      ? pick("ਇਹ ਪ੍ਰਸ਼ਨ ਬਹੁਤਿਆਂ ਨੂੰ ਔਖਾ ਲੱਗਦਾ ਹੈ — ਸਿਰਫ਼ " + correctPct + "% ਸਹੀ ਕਰਦੇ ਹਨ।",
          "This one trips most students up — only " + correctPct + "% get it right.")
      : pick("ਜ਼ਿਆਦਾਤਰ ਵਿਦਿਆਰਥੀ (" + correctPct + "%) ਇਹ ਸਹੀ ਕਰਦੇ ਹਨ — ਯਾਦ ਰੱਖਣ ਯੋਗ ਨੁਕਤਾ।",
          "Most students (" + correctPct + "%) get this right — worth locking in.")) +
      '</div></div>';

    const trap = trapFor(qq, pcts);
    if (trap) {
      html += '<div class="trap-box"><div class="trap-title">⚠ ' +
        pick("ਆਮ ਗਲਤੀ · COMMON PITFALL", "Common Pitfall · ਆਮ ਗਲਤੀ") + '</div>' +
        '<div class="trap-body">' + trap + '</div></div>';
    }

    if (qq.table) html += highYieldHTML(qq.table);

    html += '<div class="objective"><div class="objective-title">' +
      pick("ਵਿੱਦਿਅਕ ਉਦੇਸ਼ · Educational Objective", "Educational Objective · ਵਿੱਦਿਅਕ ਉਦੇਸ਼") +
      '</div><div class="objective-body">' + primary(qq.objective) + '</div></div></div>';
    return html;
  }

  /* Authored trap text wins; otherwise the most-chosen distractor is surfaced
     with its own rationale so every question still gets a pitfall callout. */
  function trapFor(qq, pcts) {
    if (qq.trap) return primary(qq.trap);
    let worst = -1;
    qq.options.forEach((o, i) => {
      if (o.correct) return;
      if (worst === -1 || pcts[i] > pcts[worst]) worst = i;
    });
    if (worst === -1) return "";
    const perm = optOrder(qq);
    const letter = LETTERS[perm.indexOf(worst)];
    return pick(
      pcts[worst] + "% ਵਿਦਿਆਰਥੀ ਵਿਕਲਪ " + letter + " ਚੁਣਦੇ ਹਨ। " + primary(qq.options[worst].r),
      pcts[worst] + "% of students fall for option " + letter + ". " + primary(qq.options[worst].r)
    );
  }

  function highYieldHTML(table) {
    let html = '<details class="hy-box"><summary>📊 ' +
      (table.title ? primary(table.title) : pick("ਤੇਜ਼ ਸਾਰ", "High-Yield Summary")) + '</summary>' +
      '<div class="hy-inner"><table class="hy-table"><thead><tr>';
    (table.headers || []).forEach(h => { html += '<th>' + primary(h) + '</th>'; });
    html += '</tr></thead><tbody>';
    (table.rows || []).forEach(row => {
      html += '<tr>';
      row.forEach(cell => { html += '<td>' + primary(cell) + '</td>'; });
      html += '</tr>';
    });
    html += '</tbody></table>';
    if (table.note) html += '<div class="hy-note">' + primary(table.note) + '</div>';
    return html + '</div></details>';
  }

  function actionBarHTML(qq, answered) {
    const total = questions().length;
    const isLast = qIndex === total - 1;
    const answeredCount = questions().filter(x => answers[x.id] !== undefined).length;
    const examLive = mode === "EXAM" && !submitted;

    let nextLabel;
    if (examLive && isLast) nextLabel = pick("ਸਮੀਖਿਆ ਤੇ ਸਬਮਿਟ", "Review &amp; Submit");
    else if (isLast) nextLabel = pick("ਨਤੀਜਾ ਦੇਖੋ", "See Results");
    else if (answered || submitted) nextLabel = pick("ਅਗਲਾ ਪ੍ਰਸ਼ਨ", "Next Question");
    else nextLabel = pick("ਛੱਡੋ", "Skip");

    const nextAttr = examLive && isLast ? "data-submit" : "data-next";
    let mid = '<span class="q-counter">' + pick("ਪ੍ਰਸ਼ਨ", "Question") + " " + (qIndex + 1) + " / " + total + '</span>';
    if (examLive && !isLast) {
      mid += '<button class="results-link" type="button" data-submit>' +
        pick("ਸਮੀਖਿਆ ਤੇ ਸਬਮਿਟ ▸", "Review &amp; Submit ▸") + '</button>';
    } else if (!examLive && answeredCount === total && !isLast) {
      mid += '<button class="results-link" type="button" data-finish>' + pick("ਨਤੀਜਾ ਦੇਖੋ ▸", "See Results ▸") + '</button>';
    }

    return '<div class="action-bar">' +
      '<button class="btn-prev" type="button" data-prev ' + (qIndex === 0 ? "disabled" : "") + '>◀ ' + pick("ਪਿਛਲਾ", "Prev") + '</button>' +
      mid +
      '<button class="' + (nextAttr === "data-submit" ? "btn-submit" : "btn-next") + '" type="button" ' + nextAttr + '>' + nextLabel + ' <span>▶</span></button>' +
      '</div>';
  }

  function fmtTime(ms) {
    const s = Math.round(ms / 1000);
    return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s";
  }
  function fmtClock(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  /* ---------------- Timed Exam Mode block timer ---------------- */
  function timerActive() { return mode === "EXAM" && !submitted && secsPerQ > 0 && examEndsAt > 0; }

  function startTimer(reset) {
    stopTimer();
    if (mode !== "EXAM" || submitted || !secsPerQ) { examEndsAt = 0; renderTimer(); return; }
    if (reset || !examEndsAt) examEndsAt = Date.now() + secsPerQ * 1000 * Math.max(1, questions().length);
    if (examEndsAt <= Date.now()) { submitBlock(true); return; }
    timerHandle = setInterval(tickTimer, 500);
    renderTimer();
  }
  function stopTimer() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  }
  function tickTimer() {
    if (!timerActive()) { stopTimer(); renderTimer(); return; }
    if (examEndsAt - Date.now() <= 0) { stopTimer(); submitBlock(true); return; }
    renderTimer();
  }
  function renderTimer() {
    if (!timerPill) return;
    if (!timerActive()) { timerPill.hidden = true; return; }
    const left = examEndsAt - Date.now();
    timerPill.hidden = false;
    timerVal.textContent = fmtClock(left);
    timerPill.classList.toggle("urgent", left <= 60000);
    timerPill.setAttribute("aria-label", "Time remaining " + fmtClock(left));
  }

  /* ---------------- Submission ---------------- */
  function openSubmitDialog() {
    const qs = questions();
    const answered = qs.filter(x => answers[x.id] !== undefined).length;
    const flagged = qs.filter(x => flags[x.id]).length;
    const unanswered = qs.length - answered;
    document.getElementById("submitModalSub").textContent =
      pick("ਸਬਮਿਟ ਕਰਨ ਤੋਂ ਬਾਅਦ ਸਾਰੇ ਉੱਤਰ ਅਤੇ ਵਿਆਖਿਆਵਾਂ ਖੁੱਲ੍ਹ ਜਾਣਗੀਆਂ।",
        "Submitting locks the block and opens every answer and explanation.");
    document.getElementById("submitGrid").innerHTML =
      histBox(answered, pick("ਉੱਤਰ ਦਿੱਤੇ", "Answered")) +
      histBox(unanswered, pick("ਬਾਕੀ", "Unanswered")) +
      histBox(flagged, pick("ਫਲੈਗ", "Flagged")) +
      (timerActive() ? histBox(fmtClock(examEndsAt - Date.now()), pick("ਸਮਾਂ ਬਾਕੀ", "Time Left")) : "");
    document.getElementById("submitMsg").textContent = unanswered
      ? pick(unanswered + " ਪ੍ਰਸ਼ਨ ਅਜੇ ਖਾਲੀ ਹਨ — ਇਹ ਗਲਤ ਗਿਣੇ ਜਾਣਗੇ।",
          unanswered + " question(s) are still blank and will be scored as unattempted.")
      : "";
    openModal(submitModal);
  }

  function submitBlock(byTimer) {
    closeModal(submitModal);
    stopTimer();
    submitted = true;
    finished = true;
    examEndsAt = 0;
    /* Grade the whole block into lifetime history in one pass. */
    questions().forEach(qq => {
      const p = answers[qq.id];
      if (p !== undefined) recordResult(qq, opts(qq)[p].correct);
    });
    render();
    /* Announced after render so the results heading does not clobber it. */
    announcer.textContent = byTimer
      ? pick("ਸਮਾਂ ਪੂਰਾ — ਬਲਾਕ ਆਪਣੇ ਆਪ ਸਬਮਿਟ ਹੋ ਗਿਆ", "Time is up. The block was submitted automatically.")
      : pick("ਬਲਾਕ ਸਬਮਿਟ ਹੋ ਗਿਆ", "Block submitted");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------------- Results ---------------- */
  function renderSummary() {
    const qs = questions();
    const s = scoreParts();
    const total = qs.length;
    const skipped = total - s.attempted;
    const wrong = s.attempted - s.correct;
    const pct = total ? Math.round((s.correct / total) * 100) : 0;
    const accuracy = s.attempted ? Math.round((s.correct / s.attempted) * 100) : 0;
    const timedIds = qs.filter(x => times[x.id] !== undefined && answers[x.id] !== undefined);
    const avgMs = timedIds.length ? timedIds.reduce((a, x) => a + times[x.id], 0) / timedIds.length : 0;
    const totalMs = qs.reduce((a, x) => a + (times[x.id] || 0), 0);
    const cluesUsed = qs.filter(x => clues[x.id]).length;

    const heading = pct >= 80 ? pick("ਸ਼ਾਨਦਾਰ ਪ੍ਰਦਰਸ਼ਨ!", "Outstanding!") :
      pct >= 50 ? pick("ਵਧੀਆ ਕੋਸ਼ਿਸ਼!", "Good effort!") :
      pick("ਦੁਬਾਰਾ ਅਭਿਆਸ ਕਰੋ", "Keep practising");
    const body = lang === "pa"
      ? "ਤੁਸੀਂ " + total + " ਵਿੱਚੋਂ " + s.correct + " ਪ੍ਰਸ਼ਨ ਸਹੀ ਕੀਤੇ। ਹਰ ਵਿਆਖਿਆ ਨੂੰ ਦੁਬਾਰਾ ਪੜ੍ਹਨਾ ਸਭ ਤੋਂ ਤੇਜ਼ ਰੀਵੀਜ਼ਨ ਹੈ।"
      : "You answered " + s.correct + " of " + total + " correctly. Re-reading each rationale is the fastest revision.";

    const setName = inCustom() ? customLabel : primary(bank().label);
    const modeName = mode === "EXAM" ? pick("ਟਾਈਮਡ ਪ੍ਰੀਖਿਆ", "Timed Exam") : pick("ਟਿਊਟਰ", "Tutor");

    let html = '<div class="summary">' +
      '<div class="summary-orb"><span class="summary-score">' + pct + '%</span></div>' +
      '<h2>' + heading + '</h2>' +
      '<div class="q-meta" style="justify-content:center;margin-bottom:14px;">' +
      '<span class="meta-rune hot">' + esc(setName) + '</span>' +
      '<span class="meta-rune">' + esc(modeName) + '</span></div>' +
      '<p>' + body + '</p>' +
      '<div class="stat-grid">' +
      '<div class="stat-box"><span class="stat-num" style="color:var(--green)">' + s.correct + '</span><span class="stat-label">' + pick("ਸਹੀ", "Correct") + '</span></div>' +
      '<div class="stat-box"><span class="stat-num" style="color:var(--red)">' + wrong + '</span><span class="stat-label">' + pick("ਗਲਤ", "Incorrect") + '</span></div>' +
      '<div class="stat-box"><span class="stat-num">' + skipped + '</span><span class="stat-label">' + pick("ਛੱਡੇ", "Skipped") + '</span></div>' +
      '<div class="stat-box"><span class="stat-num">' + accuracy + '%</span><span class="stat-label">' + pick("ਸ਼ੁੱਧਤਾ", "Accuracy") + '</span></div>' +
      (avgMs ? '<div class="stat-box"><span class="stat-num">' + fmtTime(avgMs) + '</span><span class="stat-label">' + pick("ਔਸਤ ਸਮਾਂ/ਪ੍ਰਸ਼ਨ", "Avg Time/Q") + '</span></div>' : '') +
      (totalMs ? '<div class="stat-box"><span class="stat-num">' + fmtTime(totalMs) + '</span><span class="stat-label">' + pick("ਕੁੱਲ ਸਮਾਂ", "Total Time") + '</span></div>' : '') +
      (cluesUsed ? '<div class="stat-box"><span class="stat-num" style="color:var(--amber)">' + cluesUsed + '</span><span class="stat-label">' + pick("ਸੰਕੇਤ ਵਰਤੇ", "Clues Used") + '</span></div>' : '') +
      '</div>';

    html += breakdownHTML(qs, x => x.ch, pick("ਅਧਿਆਇ ਅਨੁਸਾਰ ਪ੍ਰਦਰਸ਼ਨ", "Performance by Chapter"));

    /* Mixed sets get a subject split too. */
    if (new Set(qs.map(x => x.subj)).size > 1) {
      html += breakdownHTML(qs, x => primary(BANKS[x.subj].label), pick("ਵਿਸ਼ੇ ਅਨੁਸਾਰ", "Performance by Subject"));
    }

    const diffKeys = new Set(qs.map(x => x.diff || "—"));
    if (diffKeys.size > 1) {
      html += breakdownHTML(qs, x => x.diff || "—", pick("ਮੁਸ਼ਕਲ ਪੱਧਰ ਅਨੁਸਾਰ", "Performance by Difficulty"),
        ["Easy", "Medium", "Hard", "—"]);
    }

    html += '<div class="break-section"><div class="break-title">' +
      pick("ਪ੍ਰਸ਼ਨ ਸਮੀਖਿਆ — ਵਿਆਖਿਆ ਲਈ ਛੂਹੋ", "Question Review — tap to revisit") + '</div><div class="review-list">';
    qs.forEach((x, i) => {
      const p = answers[x.id];
      const v = p === undefined ? '<span class="rv-verdict rv-skip">—</span>' :
        (opts(x)[p].correct ? '<span class="rv-verdict rv-good">✓</span>' : '<span class="rv-verdict rv-bad">✕</span>');
      html += '<button class="review-item" type="button" data-review="' + i + '">' +
        '<span class="rv-num">Q' + (i + 1) + '</span>' + v +
        '<span class="rv-text">' + primary(x.prompt) + '</span>' +
        (clues[x.id] ? '<span class="rv-flag" title="Clue used">💡</span>' : '') +
        (flags[x.id] ? '<span class="rv-flag">⚑</span>' : '') +
        '</button>';
    });
    html += '</div></div>';

    html += '<div class="summary-actions" style="margin-top:26px;">' +
      '<button class="btn-next" type="button" data-restart>↻ ' + pick("ਦੁਬਾਰਾ ਅਭਿਆਸ", "Practice Again") + '</button>' +
      '<button class="btn-next" type="button" data-shuffle>⤨ ' + pick("ਮਿਲਾ ਕੇ ਦੁਬਾਰਾ", "Shuffle &amp; Retry") + '</button>' +
      '<button class="btn-ghost" type="button" data-open-custom>⚙️ ' + pick("ਕਸਟਮ ਕੁਇਜ਼", "Custom Quiz") + '</button>' +
      '<a class="btn-next" href="index.html" style="text-decoration:none;">◂ ' + pick("ਮੁੱਖ ਮੇਨੂ", "Main Menu") + '</a>' +
      '</div></div>';

    qCard.innerHTML = html;
    announcer.textContent = heading + " " + pct + "%";
  }

  /* Grouped correct/total bars used for the chapter, subject and difficulty splits. */
  function breakdownHTML(qs, keyFn, title, preferredOrder) {
    const groups = {};
    qs.forEach(x => {
      const key = keyFn(x);
      groups[key] = groups[key] || { total: 0, correct: 0 };
      groups[key].total++;
      const p = answers[x.id];
      if (p !== undefined && opts(x)[p].correct) groups[key].correct++;
    });
    const keys = preferredOrder ? preferredOrder.filter(k => groups[k]) : Object.keys(groups);
    if (!keys.length) return "";
    let html = '<div class="break-section"><div class="break-title">' + title + '</div>';
    keys.forEach(key => {
      const c = groups[key];
      const p = Math.round((c.correct / c.total) * 100);
      const cls = p >= 70 ? "" : p >= 40 ? " mid" : " low";
      html += '<div class="break-row"><span class="break-name">' + esc(key) + '</span>' +
        '<span class="break-bar"><span class="break-fill' + cls + '" style="width:' + p + '%"></span></span>' +
        '<span class="break-score">' + c.correct + '/' + c.total + '</span></div>';
    });
    return html + '</div>';
  }

  /* ---------------- Render root ---------------- */
  function renderChrome() {
    document.querySelectorAll("[data-mode]").forEach(b => {
      const on = b.dataset.mode === mode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    document.querySelectorAll("[data-subject]").forEach(b => {
      b.classList.toggle("active", !inCustom() && b.dataset.subject === subject);
    });
    if (setPill) {
      setPill.hidden = !inCustom();
      if (inCustom()) setPillLabel.textContent = customLabel;
    }
    renderTimer();
  }

  function render() {
    applyAccent();
    renderChrome();
    renderScore();
    renderProgress();
    if (finished) renderSummary(); else renderQuestion();
    persistAttempt();
  }

  function resetRun(shuffle) {
    qIndex = 0; answers = {}; struck = {}; flags = {}; times = {}; clues = {}; recorded = {};
    optOrders = {}; finished = false; submitted = false;
    if (shuffle) {
      if (inCustom()) customIds = shuffled(customIds);
      else order = shuffled(bank().questions.map((_, i) => i));
    } else if (!inCustom()) {
      order = null;
    }
    qShownAt = Date.now();
    startTimer(true);
  }

  function setSubject(s) {
    if (!BANKS[s] || (s === subject && !inCustom())) return;
    persistAttempt();
    stopTimer();
    customIds = null;
    customLabel = "";
    subject = s;
    /* Resume this subject's saved run if one exists, otherwise start fresh. */
    if (!restoreAttempt()) resetRun(false);
    else startTimer(false);
    logoDot.textContent = ".MCQ";
    persist();
    render();
  }

  function exitCustom() {
    if (!inCustom()) return;
    persistAttempt();
    stopTimer();
    customIds = null;
    customLabel = "";
    if (!restoreAttempt()) resetRun(false); else startTimer(false);
    persist();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function setMode(next) {
    if (next !== "TUTOR" && next !== "EXAM") return;
    if (next === mode) return;
    mode = next;
    if (mode === "EXAM") {
      submitted = false;
      startTimer(true);
      announcer.textContent = pick("ਟਾਈਮਡ ਪ੍ਰੀਖਿਆ ਮੋਡ ਚਾਲੂ", "Timed exam mode on");
    } else {
      stopTimer();
      examEndsAt = 0;
      announcer.textContent = pick("ਟਿਊਟਰ ਮੋਡ ਚਾਲੂ", "Tutor mode on");
    }
    persist();
    render();
  }

  function goTo(i) {
    if (i < 0 || i >= questions().length) return;
    qIndex = i;
    finished = false;
    qShownAt = Date.now();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function answerCurrent(i) {
    const qq = q();
    if (!qq || answersLocked(qq)) return;
    if (!opts(qq)[i]) return;
    if ((struck[qq.id] || {})[i]) return; // struck options are ruled out
    const first = answers[qq.id] === undefined;
    answers[qq.id] = i;
    if (first) times[qq.id] = (times[qq.id] || 0) + (Date.now() - qShownAt);
    const wasCorrect = opts(qq)[i].correct;
    if (mode === "TUTOR") {
      recordResult(qq, wasCorrect);
      announcer.textContent = wasCorrect ? "Correct" : "Incorrect";
    } else {
      announcer.textContent = pick("ਵਿਕਲਪ " + LETTERS[i] + " ਦਰਜ ਹੋਇਆ", "Option " + LETTERS[i] + " recorded");
    }
    render();
  }

  function toggleStrike(i) {
    const qq = q();
    if (!qq || answersLocked(qq)) return;
    struck[qq.id] = struck[qq.id] || {};
    struck[qq.id][i] = !struck[qq.id][i];
    announcer.textContent = struck[qq.id][i]
      ? pick("ਵਿਕਲਪ " + LETTERS[i] + " ਰੱਦ ਕੀਤਾ", "Option " + LETTERS[i] + " ruled out")
      : pick("ਵਿਕਲਪ " + LETTERS[i] + " ਬਹਾਲ", "Option " + LETTERS[i] + " restored");
    renderQuestion();
    persistAttempt();
  }

  function advance() {
    if (qIndex < questions().length - 1) {
      qIndex++;
      qShownAt = Date.now();
      render();
    } else if (mode === "EXAM" && !submitted) {
      openSubmitDialog();
      return;
    } else {
      finished = true;
      render();
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------------- Modals ---------------- */
  let lastFocus = null;
  function openModal(el) {
    lastFocus = document.activeElement;
    el.hidden = false;
    const focusable = el.querySelector("button, [href], input, select");
    if (focusable) focusable.focus();
  }
  function closeModal(el) {
    if (!el || el.hidden) return;
    el.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function anyModalOpen() { return !customModal.hidden || !submitModal.hidden; }

  /* ---------------- Custom quiz builder ---------------- */
  const cfg = { subject: "SCIENCE", pool: "all", count: "10", mode: "TUTOR", secs: DEFAULT_SECS };

  function poolFor(subj, poolType) {
    let list = subj === "MIXED" ? ALL_QUESTIONS.slice() : (BANKS[subj] ? BANKS[subj].questions.slice() : []);
    if (poolType === "unused") list = list.filter(x => !history.seen[x.id]);
    else if (poolType === "incorrect") list = list.filter(x => history.wrong[x.id]);
    else if (poolType === "flagged") list = list.filter(x => history.flagged[x.id]);
    return list;
  }

  function histBox(num, label) {
    return '<div class="history-box"><span class="history-num">' + num + '</span><span class="history-label">' + label + '</span></div>';
  }

  function renderCustomModal() {
    /* Validate the config against what the history actually contains *before*
       painting, so a chip can never show as active while it is disabled. */
    const poolCounts = {};
    document.querySelectorAll('[data-cfg="pool"]').forEach(b => {
      poolCounts[b.dataset.val] = poolFor(cfg.subject, b.dataset.val).length;
    });
    if (!poolCounts[cfg.pool]) cfg.pool = "all";
    const available = poolFor(cfg.subject, cfg.pool).length;
    if (cfg.count !== "all" && Number(cfg.count) > available) cfg.count = "all";

    document.querySelectorAll("[data-cfg]").forEach(b => {
      const on = String(cfg[b.dataset.cfg]) === b.dataset.val;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    /* Live counts on each pool chip, and lock the ones with nothing in them. */
    document.querySelectorAll('[data-cfg="pool"]').forEach(b => {
      const n = poolCounts[b.dataset.val];
      let count = b.querySelector(".chip-count");
      if (!count) { count = document.createElement("span"); count.className = "chip-count"; b.appendChild(count); }
      count.textContent = n;
      b.disabled = n === 0;
    });
    document.getElementById("cfgTimerField").hidden = cfg.mode !== "EXAM";

    document.querySelectorAll('[data-cfg="count"]').forEach(b => {
      b.disabled = b.dataset.val !== "all" && Number(b.dataset.val) > available;
    });

    const totalSeen = Object.keys(history.seen).length;
    const subjRows = Object.keys(BANKS).map(s => {
      const st = history.subjects[s] || { attempts: 0, correct: 0 };
      const acc = st.attempts ? Math.round((st.correct / st.attempts) * 100) + "%" : "—";
      return histBox(acc, primary(BANKS[s].label));
    }).join("");
    document.getElementById("historyGrid").innerHTML =
      histBox(totalSeen + "/" + ALL_QUESTIONS.length, pick("ਹੱਲ ਕੀਤੇ", "Attempted")) +
      histBox(Object.keys(history.wrong).length, pick("ਗਲਤ", "Incorrect")) +
      histBox(Object.keys(history.flagged).length, pick("ਫਲੈਗ", "Flagged")) +
      subjRows;

    const take = cfg.count === "all" ? available : Math.min(Number(cfg.count), available);
    const msg = document.getElementById("customMsg");
    msg.textContent = available
      ? pick(take + " ਪ੍ਰਸ਼ਨ ਚੁਣੇ ਜਾਣਗੇ (" + available + " ਉਪਲਬਧ)।",
          take + " question(s) will be drawn from " + available + " available.")
      : pick("ਇਸ ਫਿਲਟਰ ਵਿੱਚ ਕੋਈ ਪ੍ਰਸ਼ਨ ਨਹੀਂ।", "No questions match this filter yet.");
    msg.classList.toggle("warn", !available);
    document.querySelector("[data-start-custom]").disabled = !available;
    /* Reset the two-step confirm whenever the dialog is re-rendered. */
    const resetBtn = document.querySelector("[data-reset-history]");
    if (resetBtn.dataset.armed !== "1") resetBtn.textContent = "↺ " + pick("ਇਤਿਹਾਸ ਰੀਸੈੱਟ", "Reset History");
  }

  function startCustomQuiz() {
    const pool = poolFor(cfg.subject, cfg.pool);
    if (!pool.length) return;
    const take = cfg.count === "all" ? pool.length : Math.min(Number(cfg.count), pool.length);
    const chosen = shuffled(pool).slice(0, take);

    persistAttempt();
    stopTimer();
    customIds = chosen.map(x => x.id);
    const subjName = cfg.subject === "MIXED" ? pick("ਮਿਲਿਆ-ਜੁਲਿਆ", "Mixed") : primary(BANKS[cfg.subject].label);
    const poolName = {
      all: pick("ਸਾਰੇ", "All"),
      unused: pick("ਨਵੇਂ", "Unused"),
      incorrect: pick("ਗਲਤ", "Incorrect"),
      flagged: pick("ਫਲੈਗ", "Flagged")
    }[cfg.pool];
    customLabel = subjName + " · " + poolName + " · " + take + "Q";
    mode = cfg.mode;
    secsPerQ = cfg.mode === "EXAM" ? cfg.secs : DEFAULT_SECS;
    resetRun(false);
    persist();
    closeModal(customModal);
    render();
    announcer.textContent = pick("ਕਸਟਮ ਕੁਇਜ਼ ਸ਼ੁਰੂ", "Custom quiz started") + " — " + customLabel;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------------- Events ---------------- */
  document.body.addEventListener("click", e => {
    const openCustom = e.target.closest("[data-open-custom]");
    if (openCustom) {
      if (!inCustom()) cfg.subject = subject;
      cfg.mode = mode;
      cfg.secs = secsPerQ || DEFAULT_SECS;
      renderCustomModal();
      openModal(customModal);
      return;
    }

    const closeBtn = e.target.closest("[data-close-modal]");
    if (closeBtn) { closeModal(closeBtn.closest(".modal-backdrop")); return; }

    /* Click on the dimmed backdrop (but not the panel) closes the dialog. */
    if (e.target.classList && e.target.classList.contains("modal-backdrop")) { closeModal(e.target); return; }

    const chip = e.target.closest("[data-cfg]");
    if (chip && !chip.disabled) {
      cfg[chip.dataset.cfg] = chip.dataset.cfg === "secs" ? Number(chip.dataset.val) : chip.dataset.val;
      renderCustomModal();
      return;
    }

    const startBtn = e.target.closest("[data-start-custom]");
    if (startBtn && !startBtn.disabled) { startCustomQuiz(); return; }

    const resetBtn = e.target.closest("[data-reset-history]");
    if (resetBtn) {
      if (resetBtn.dataset.armed === "1") {
        resetBtn.dataset.armed = "";
        resetHistory();
        renderCustomModal();
        document.getElementById("customMsg").textContent = pick("ਸਾਰਾ ਇਤਿਹਾਸ ਮਿਟਾ ਦਿੱਤਾ ਗਿਆ।", "History cleared.");
      } else {
        resetBtn.dataset.armed = "1";
        resetBtn.textContent = "⚠ " + pick("ਪੱਕਾ? ਦੁਬਾਰਾ ਦਬਾਓ", "Sure? Tap again");
        document.getElementById("customMsg").textContent =
          pick("ਇਹ ਸਾਰੇ ਸਕੋਰ, ਫਲੈਗ ਅਤੇ ਸੁਰੱਖਿਅਤ ਦੌਰ ਮਿਟਾ ਦੇਵੇਗਾ।",
            "This clears every score, flag and saved run on this device.");
      }
      return;
    }

    const exitBtn = e.target.closest("[data-exit-custom]");
    if (exitBtn) { exitCustom(); return; }

    const themeBtn = e.target.closest("[data-toggle-theme]");
    if (themeBtn) { applyTheme(theme === "NEON" ? "CLASSIC" : "NEON", true); return; }

    const modeBtn = e.target.closest("[data-mode]");
    if (modeBtn) { setMode(modeBtn.dataset.mode); return; }

    const subjBtn = e.target.closest("[data-subject]");
    if (subjBtn) { setSubject(subjBtn.dataset.subject); return; }

    const flip = e.target.closest("[data-flip-lang]");
    if (flip) { lang = lang === "pa" ? "en" : "pa"; persist(); render(); return; }

    const clueBtn = e.target.closest("[data-clue]");
    if (clueBtn) {
      const qq = q();
      clues[qq.id] = !clues[qq.id];
      renderQuestion();
      persistAttempt();
      const panel = document.querySelector(".clue-panel");
      if (clues[qq.id] && panel) announcer.textContent = primary(qq.hint);
      return;
    }

    const flagBtn = e.target.closest("[data-flag]");
    if (flagBtn) {
      const qq = q();
      flags[qq.id] = !flags[qq.id];
      recordFlag(qq, flags[qq.id]);
      announcer.textContent = flags[qq.id] ? "Question flagged for review" : "Flag removed";
      render();
      return;
    }

    const jumpSeg = e.target.closest("[data-jump]");
    if (jumpSeg) { goTo(parseInt(jumpSeg.dataset.jump, 10)); return; }

    const reviewBtn = e.target.closest("[data-review]");
    if (reviewBtn) { goTo(parseInt(reviewBtn.dataset.review, 10)); return; }

    const submitBtn = e.target.closest("[data-submit]");
    if (submitBtn) { openSubmitDialog(); return; }

    const confirmBtn = e.target.closest("[data-confirm-submit]");
    if (confirmBtn) { submitBlock(false); return; }

    const finishBtn = e.target.closest("[data-finish]");
    if (finishBtn) { finished = true; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }

    const prevBtn = e.target.closest("[data-prev]");
    if (prevBtn && !prevBtn.disabled) { goTo(qIndex - 1); return; }

    const strikeBtn = e.target.closest("[data-strike]");
    if (strikeBtn && !strikeBtn.disabled) { toggleStrike(parseInt(strikeBtn.dataset.strike, 10)); return; }

    const pickBtn = e.target.closest("[data-pick]");
    if (pickBtn && !pickBtn.disabled) { answerCurrent(parseInt(pickBtn.dataset.pick, 10)); return; }

    const nextBtn = e.target.closest("[data-next]");
    if (nextBtn && !nextBtn.disabled) { advance(); return; }

    const shuffleBtn = e.target.closest("[data-shuffle]");
    if (shuffleBtn) { resetRun(true); render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }

    const restartBtn = e.target.closest("[data-restart]");
    if (restartBtn) { resetRun(false); render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  });

  /* Desktop shortcut: right-click an option to rule it out, UWorld-style. */
  qCard.addEventListener("contextmenu", e => {
    const row = e.target.closest("[data-pick], [data-strike]");
    if (!row) return;
    e.preventDefault();
    const i = parseInt(row.dataset.pick !== undefined ? row.dataset.pick : row.dataset.strike, 10);
    if (!Number.isNaN(i)) toggleStrike(i);
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && anyModalOpen()) {
      closeModal(customModal);
      closeModal(submitModal);
      return;
    }
    if (anyModalOpen() || finished) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    const letters = { a: 0, b: 1, c: 2, d: 3, e: 4 };
    const key = e.key.toLowerCase();
    if (key in letters) {
      /* Shift + letter rules the option out instead of picking it. */
      if (e.shiftKey) toggleStrike(letters[key]);
      else answerCurrent(letters[key]);
    } else if (key === "f") {
      const qq = q();
      if (!qq) return;
      flags[qq.id] = !flags[qq.id];
      recordFlag(qq, flags[qq.id]);
      render();
    } else if (key === "h") {
      const qq = q();
      if (!qq || !qq.hint || mode !== "TUTOR" || isAnswered(qq)) return;
      clues[qq.id] = !clues[qq.id];
      renderQuestion();
      persistAttempt();
    } else if (key === "arrowleft") {
      if (qIndex > 0) goTo(qIndex - 1);
    } else if (key === "enter" || key === "arrowright") {
      const qq = q();
      if (qIndex < questions().length - 1) { qIndex++; qShownAt = Date.now(); render(); }
      else if (mode === "EXAM" && !submitted) openSubmitDialog();
      else if (qq && answers[qq.id] !== undefined) { finished = true; render(); }
    }
  });

  /* Keep a restored timer honest across tab suspension. */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && timerActive()) tickTimer();
  });
  window.addEventListener("pagehide", persistAttempt);

  /* ---------------- Boot ---------------- */
  loadHistory();
  let bootScope = "";
  try { bootScope = (JSON.parse(localStorage.getItem(STORE_KEY)) || {}).activeScope || ""; } catch (e) {}
  if (bootScope === "CUSTOM") restoreCustomSet();
  if (!restoreAttempt()) resetRun(false);
  /* Runs that ran out of time while the tab was closed submit on restore. */
  if (mode === "EXAM" && !submitted && secsPerQ > 0 && examEndsAt > 0 && examEndsAt <= Date.now()) {
    submitted = true;
    finished = true;
    examEndsAt = 0;
  }
  startTimer(false);
  applyTheme(theme, false);
})();
</script>
<script>
/* Exit half of the page transition: fade the veil back in before any
   same-origin navigation (e.g. "Menu"), matching index.html and the decks. */
(function () {
  "use strict";
  function reducedMotion() {
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
  }
  setTimeout(function () { document.body.classList.add("page-entered"); }, 700);
  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var link = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!link || (link.target && link.target !== "_self") || link.hasAttribute("download")) return;
    var raw = link.getAttribute("href") || "";
    if (!raw || raw.charAt(0) === "#" || /^(mailto:|tel:|javascript:)/i.test(raw)) return;
    var url;
    try { url = new URL(link.href, window.location.href); } catch (err) { return; }
    if (url.origin !== window.location.origin || url.pathname === window.location.pathname) return;
    e.preventDefault();
    document.body.classList.add("page-leaving");
    var target = link.href;
    setTimeout(function () { window.location.href = target; }, reducedMotion() ? 120 : 260);
  });
  window.addEventListener("pageshow", function () {
    document.body.classList.remove("page-leaving");
  });
}());
</script>
