<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BOLO.MCQ — PSEB Class 10 Question Engine</title>
<!-- Memory card: routes per-learner storage to the active profile slot; must run before any other script. -->
<script src="assets/memory-card.js"></script>
<!-- Google Analytics (GA4) — shared loader, see assets/analytics.js -->
<script src="assets/analytics.js"></script>
<!-- Google AdSense — must stay as literal markup in <head>: the AdSense
     verification crawler reads raw HTML and does not execute JavaScript,
     so this tag cannot be moved into a shared .js loader. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8195165720925396"
     crossorigin="anonymous"></script>
<meta name="description" content="Bilingual Punjabi-English MCQ practice engine for PSEB Class 10 — 238 board-pattern questions across Science, Math and English with rationales, difficulty tags, flagging and performance analytics.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<style>
  :root {
    --bg-void: #000000;
    --text-bold: #ffffff;
    --text-dim: #8e9bb0;
    --panel: rgba(18, 18, 22, 0.94);
    --border: rgba(255, 255, 255, 0.08);
    --accent: #00e5ff;
    --green: #2ecc71;
    --red: #ff4d6d;
    --amber: #ffaa00;
    --fluid-curve: cubic-bezier(0.16, 1, 0.3, 1);
    --font-gurmukhi: 'Noto Sans Gurmukhi', 'Mukta Mahee', 'Gurmukhi Sangam MN', 'Nirmala UI', 'Raavi', 'Lohit Gurmukhi', sans-serif;
  }
  /* CLASSIC = light colorway matching the lecture decks (legacy palette). */
  body[data-theme="CLASSIC"] {
    --bg-void: #f8fbff;
    --text-bold: #182437;
    --text-dim: #5c6f86;
    --panel: rgba(255, 255, 255, 0.92);
    --border: rgba(11, 74, 168, 0.14);
    --green: #179c65;
    --red: #c73a2e;
    --amber: #f26a21;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg-void); }
  body {
    min-height: 100vh;
    background: var(--bg-void);
    color: var(--text-bold);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, var(--font-gurmukhi);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body::before {
    content: '';
    position: fixed;
    inset: -5%;
    z-index: -3;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.035;
  }
  .aura-bleed {
    position: fixed;
    top: -20vh;
    left: 50%;
    z-index: -2;
    width: 130vw;
    height: 90vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0, 140, 255, 0.14) 0%, rgba(0, 110, 255, 0.05) 40%, transparent 72%);
    pointer-events: none;
    transition: background 0.9s var(--fluid-curve);
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 10%, rgba(0, 0, 0, 0.94) 100%);
  }

  /* Page transition veil — matches the menu and the lecture decks so moving
     between them is one continuous dissolve instead of a hard cut. */
  .page-veil {
    position: fixed;
    inset: 0;
    z-index: 99999;
    pointer-events: none;
    background: var(--bg-void);
    opacity: 1;
    animation: veilFadeOut 420ms var(--fluid-curve) forwards;
  }
  /* Safety net: the inline script adds .page-entered shortly after load, so
     the veil can never stay up if the arrival animation never ran. */
  body.page-entered .page-veil { animation: none; opacity: 0; visibility: hidden; }
  body.page-leaving .page-veil { animation: veilFadeIn 300ms var(--fluid-curve) forwards; opacity: 1; visibility: visible; }
  @keyframes veilFadeOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
  @keyframes veilFadeIn { from { opacity: 0; visibility: visible; } to { opacity: 1; visibility: visible; } }
  @media (prefers-reduced-motion: reduce) {
    .page-veil { animation-duration: 160ms; }
    body.page-leaving .page-veil { animation-duration: 140ms; }
  }

  button { border: 0; font: inherit; color: inherit; background: none; cursor: pointer; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }

  /* ---------- Header ---------- */
  .mcq-header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 22px;
    padding: max(18px, env(safe-area-inset-top)) clamp(16px, 4vw, 44px) 16px;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.78) 78%, transparent 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .header-logo {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    color: var(--text-bold);
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 2px;
    text-decoration: none;
    white-space: nowrap;
  }
  .header-logo .dot-mode { color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); transition: color 0.5s var(--fluid-curve), text-shadow 0.5s var(--fluid-curve); }
  .home-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.3s var(--fluid-curve);
  }
  .home-pill:hover { color: #fff; border-color: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }

  .router {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
  }
  .router-btn {
    padding: 8px 14px;
    border-radius: 999px;
    color: var(--text-dim);
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    transition: all 0.3s var(--fluid-curve);
  }
  .router-btn:hover { color: #fff; }
  .router-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12); }

  .header-spacer { flex: 1; }
  .score-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 15px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    font-size: 0.64rem;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .score-pill strong { color: var(--accent); font-variant-numeric: tabular-nums; transition: color 0.4s; }
  /* Exam mode hides the live score; the class rule would otherwise beat [hidden]. */
  .score-pill[hidden] { display: none; }
  .theme-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    transition: all 0.3s var(--fluid-curve);
  }
  .theme-pill:hover { color: #fff; border-color: color-mix(in srgb, var(--accent) 55%, transparent); transform: translateY(-1px); }

  /* ---------- Stage ---------- */
  .stage {
    width: min(94vw, 860px);
    margin: clamp(8px, 2vh, 26px) auto clamp(60px, 8vh, 90px);
    animation: riseIn 0.7s var(--fluid-curve);
  }
  @keyframes riseIn { 0% { opacity: 0; transform: translateY(26px) scale(0.97); filter: blur(8px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

  .progress-track { display: flex; gap: 5px; margin-bottom: 20px; }
  .progress-seg { flex: 1; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); transition: background 0.45s var(--fluid-curve), box-shadow 0.45s; }
  .progress-seg.seen-correct { background: var(--green); box-shadow: 0 0 8px color-mix(in srgb, var(--green) 60%, transparent); }
  .progress-seg.seen-wrong { background: var(--red); box-shadow: 0 0 8px color-mix(in srgb, var(--red) 55%, transparent); }
  .progress-seg.current { background: var(--accent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }
  /* Exam mode: an answered question is marked as "recorded", never graded. */
  .progress-seg.answered { background: color-mix(in srgb, var(--accent) 55%, transparent); }

  .q-card {
    position: relative;
    padding: clamp(20px, 4.5vw, 34px);
    border: 1px solid var(--border);
    border-top: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 26px;
    background: var(--panel);
    box-shadow: 0 34px 80px rgba(0, 0, 0, 0.85), 0 0 60px -30px var(--accent), inset 0 1px 1px rgba(255, 255, 255, 0.06);
    transition: border-color 0.5s var(--fluid-curve), box-shadow 0.5s var(--fluid-curve);
  }
  .q-card.swap { animation: riseIn 0.5s var(--fluid-curve); }

  .q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
  .meta-rune {
    padding: 6px 12px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-dim);
    font-family: var(--font-gurmukhi);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .meta-rune.hot { border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); }
  .lang-flip {
    margin-left: auto;
    padding: 7px 13px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-dim);
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 1.4px;
    transition: all 0.3s var(--fluid-curve);
  }
  .lang-flip:hover { color: #fff; border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

  .q-prompt {
    font-family: var(--font-gurmukhi);
    font-size: clamp(1.04rem, 3.4vw, 1.28rem);
    font-weight: 700;
    line-height: 1.65;
    margin-bottom: 8px;
  }
  .q-prompt-sub {
    color: var(--text-dim);
    font-size: clamp(0.8rem, 2.6vw, 0.9rem);
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .option-row { display: flex; align-items: stretch; gap: 9px; margin-bottom: 10px; }
  .strike-btn {
    flex: none;
    width: 42px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 900;
    transition: all 0.3s var(--fluid-curve);
  }
  .strike-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
  .strike-btn.active { border-color: color-mix(in srgb, var(--red) 40%, transparent); background: color-mix(in srgb, var(--red) 10%, transparent); color: var(--red); }

  .option {
    flex: 1;
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 13px;
    min-height: 54px;
    padding: 14px 17px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.025);
    text-align: left;
    transition: all 0.35s var(--fluid-curve);
    overflow: hidden;
  }
  .option:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.06); transform: translateX(3px); }
  .option:disabled { cursor: default; }
  .opt-letter { flex: none; padding-top: 1px; color: var(--text-dim); font-size: 0.95rem; font-weight: 900; font-variant-numeric: tabular-nums; transition: color 0.4s; }
  .opt-text { font-family: var(--font-gurmukhi); font-size: clamp(0.86rem, 2.8vw, 0.98rem); font-weight: 600; line-height: 1.55; }
  .opt-sub { display: block; margin-top: 3px; color: var(--text-dim); font-size: 0.74rem; font-weight: 600; }

  .option-row.struck .option { opacity: 0.3; }
  .option-row.struck .opt-text { text-decoration: line-through; }

  .option.correct { border-color: color-mix(in srgb, var(--green) 65%, transparent); background: color-mix(in srgb, var(--green) 9%, transparent); box-shadow: 0 0 26px -8px var(--green); }
  .option.correct .opt-letter { color: var(--green); }
  .option.incorrect { border-color: color-mix(in srgb, var(--red) 65%, transparent); background: color-mix(in srgb, var(--red) 9%, transparent); box-shadow: 0 0 26px -8px var(--red); animation: shake 0.4s var(--fluid-curve); }
  .option.incorrect .opt-letter { color: var(--red); }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* ---------- Feedback ---------- */
  .feedback { margin-top: 22px; animation: riseIn 0.5s var(--fluid-curve); }
  .verdict { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-family: var(--font-gurmukhi); font-size: 1rem; font-weight: 900; letter-spacing: 0.4px; }
  .verdict.good { color: var(--green); text-shadow: 0 0 18px color-mix(in srgb, var(--green) 45%, transparent); }
  .verdict.bad { color: var(--red); text-shadow: 0 0 18px color-mix(in srgb, var(--red) 45%, transparent); }

  .rationale {
    margin-bottom: 8px;
    padding: 11px 15px;
    border-left: 3px solid rgba(255, 255, 255, 0.1);
    border-radius: 0 11px 11px 0;
    background: rgba(255, 255, 255, 0.02);
    color: #cbd5e1;
    font-family: var(--font-gurmukhi);
    font-size: 0.84rem;
    font-weight: 600;
    line-height: 1.65;
  }
  .rationale strong { color: #fff; }
  .rationale.good { border-left-color: var(--green); background: color-mix(in srgb, var(--green) 5%, transparent); }
  .rationale.bad { border-left-color: var(--red); background: color-mix(in srgb, var(--red) 5%, transparent); }

  .objective {
    margin-top: 16px;
    padding: 16px 18px;
    border-left: 4px solid var(--accent);
    border-radius: 0 13px 13px 0;
    background: color-mix(in srgb, var(--accent) 5%, transparent);
  }
  .objective-title { margin-bottom: 6px; color: var(--accent); font-size: 0.6rem; font-weight: 900; letter-spacing: 1.8px; text-transform: uppercase; }
  .objective-body { font-family: var(--font-gurmukhi); font-size: 0.86rem; font-weight: 600; line-height: 1.7; color: #e6edf5; }

  .action-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .q-counter { color: var(--text-dim); font-size: 0.66rem; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .btn-next {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 46px;
    padding: 12px 24px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 13px;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    color: #fff;
    font-family: var(--font-gurmukhi);
    font-size: 0.84rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    transition: all 0.3s var(--fluid-curve);
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 26px -10px var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .btn-next:disabled { opacity: 0.3; cursor: default; transform: none; box-shadow: none; }

  /* ---------- Summary ---------- */
  .summary { text-align: center; padding: clamp(10px, 3vw, 24px) 0; }
  .summary-orb {
    position: relative;
    width: 128px;
    height: 128px;
    margin: 6px auto 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #ffffff 0%, #f2feff 12%, #b6f4ff 28%, #6fdcff 46%, rgba(40, 160, 250, 0.55) 68%, rgba(16, 110, 225, 0) 100%);
    box-shadow: 0 0 48px rgba(90, 210, 255, 0.4), 0 0 110px rgba(0, 150, 255, 0.28);
    animation: orbBreathe 3s ease-in-out infinite;
  }
  @keyframes orbBreathe { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.05); filter: brightness(1.15); } }
  .summary-score { display: flex; align-items: center; justify-content: center; position: absolute; inset: 0; color: #013; font-size: 1.7rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .summary h2 { font-family: var(--font-gurmukhi); font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 900; margin-bottom: 8px; }
  .summary p { color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.92rem; font-weight: 600; line-height: 1.7; max-width: 460px; margin: 0 auto 24px; }
  .summary-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

  /* ---------- v1.1 — difficulty, flag, navigator, breakdowns ---------- */
  .meta-rune.diff-easy { border-color: color-mix(in srgb, var(--green) 30%, transparent); color: var(--green); }
  .meta-rune.diff-medium { border-color: color-mix(in srgb, var(--amber) 30%, transparent); color: var(--amber); }
  .meta-rune.diff-hard { border-color: color-mix(in srgb, var(--red) 30%, transparent); color: var(--red); }
  /* PSEB blueprint chips — same rune shape, mark weighting drives the hue. */
  .meta-rune.pseb-mark[data-marks="1M_OBJECTIVE"] { border-color: color-mix(in srgb, var(--blue, #38bdf8) 34%, transparent); color: var(--blue, #38bdf8); }
  .meta-rune.pseb-mark[data-marks="2M_SHORT"] { border-color: color-mix(in srgb, var(--green) 34%, transparent); color: var(--green); }
  .meta-rune.pseb-mark[data-marks="3M_NUMERICAL_OR_DIAGRAM"] { border-color: color-mix(in srgb, var(--amber) 38%, transparent); color: var(--amber); }
  .meta-rune.pseb-mark[data-marks="5M_LONG_DERIVATION"] { border-color: color-mix(in srgb, var(--red) 38%, transparent); color: var(--red); }
  /* A real previous-year tag is the strongest signal on the card, so it is
     the only rune that gets a filled treatment. */
  .meta-rune.pseb-pyq { background: var(--amber); border-color: transparent; color: #221500; font-weight: 900; }
  .meta-rune.pseb-bloom { opacity: 0.85; }

  .flag-btn {
    padding: 6px 11px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-size: 0.66rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    transition: all 0.3s var(--fluid-curve);
  }
  .flag-btn:hover { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
  .flag-btn.active { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 60%, transparent); background: color-mix(in srgb, var(--amber) 10%, transparent); }

  .progress-seg { border: 0; padding: 0; cursor: pointer; }
  .progress-seg:hover { box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 55%, transparent); }
  .progress-seg.flagged { outline: 1.5px solid var(--amber); outline-offset: 1.5px; }

  .btn-prev {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 46px;
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-family: var(--font-gurmukhi);
    font-size: 0.78rem;
    font-weight: 800;
    transition: all 0.3s var(--fluid-curve);
  }
  .btn-prev:hover:not(:disabled) { color: var(--text-bold); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
  .btn-prev:disabled { opacity: 0.25; cursor: default; }
  .results-link {
    padding: 7px 13px;
    border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    border-radius: 999px;
    background: color-mix(in srgb, var(--amber) 8%, transparent);
    color: var(--amber);
    font-family: var(--font-gurmukhi);
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    transition: all 0.3s var(--fluid-curve);
  }
  .results-link:hover { background: color-mix(in srgb, var(--amber) 16%, transparent); transform: translateY(-1px); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto 26px; }
  .stat-box { padding: 14px 10px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255, 255, 255, 0.02); text-align: center; }
  .stat-num { display: block; color: var(--accent); font-size: 1.15rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stat-label { display: block; margin-top: 4px; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.56rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }

  .break-section { max-width: 620px; margin: 26px auto 0; text-align: left; }
  .break-title { margin-bottom: 12px; color: var(--accent); font-family: var(--font-gurmukhi); font-size: 0.62rem; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase; }
  .break-row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
  .break-name { flex: 0 0 42%; overflow: hidden; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.72rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .break-bar { flex: 1; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
  .break-fill { height: 100%; border-radius: 99px; background: var(--green); transition: width 0.8s var(--fluid-curve); }
  .break-fill.low { background: var(--red); }
  .break-fill.mid { background: var(--amber); }
  .break-score { flex: none; min-width: 44px; color: var(--text-dim); font-size: 0.68rem; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }

  .review-list { display: flex; flex-direction: column; gap: 6px; max-width: 620px; margin: 14px auto 0; text-align: left; }
  .review-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.02);
    font-family: var(--font-gurmukhi);
    text-align: left;
    transition: all 0.3s var(--fluid-curve);
  }
  .review-item:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: rgba(255, 255, 255, 0.05); transform: translateX(3px); }
  .rv-num { flex: none; color: var(--text-dim); font-size: 0.68rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .rv-verdict { flex: none; font-size: 0.85rem; font-weight: 900; }
  .rv-verdict.rv-good { color: var(--green); }
  .rv-verdict.rv-bad { color: var(--red); }
  .rv-verdict.rv-skip { color: var(--text-dim); }
  .rv-text { flex: 1; overflow: hidden; color: var(--text-bold); font-size: 0.76rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .rv-flag { flex: none; color: var(--amber); font-size: 0.8rem; }

  body[data-theme="CLASSIC"] .flag-btn { border-color: rgba(11, 74, 168, 0.18); background: rgba(11, 86, 197, 0.05); }
  body[data-theme="CLASSIC"] .btn-prev { border-color: rgba(11, 74, 168, 0.16); background: rgba(11, 86, 197, 0.04); }
  body[data-theme="CLASSIC"] .stat-box, body[data-theme="CLASSIC"] .review-item { border-color: rgba(11, 74, 168, 0.14); background: rgba(11, 86, 197, 0.035); }
  body[data-theme="CLASSIC"] .break-bar { background: rgba(11, 74, 168, 0.12); }
  body[data-theme="CLASSIC"] .review-item:hover { background: rgba(11, 86, 197, 0.08); }

  /* ---------- v2.0 — test modes, clues, peer stats, custom quiz ---------- */

  /* Segmented Tutor ⇄ Exam switch in the header. */
  .mode-switch {
    display: inline-flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
  }
  .mode-btn {
    padding: 7px 12px;
    border-radius: 999px;
    color: var(--text-dim);
    font-size: 0.55rem;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    white-space: nowrap;
    transition: all 0.3s var(--fluid-curve);
  }
  .mode-btn:hover { color: var(--text-bold); }
  .mode-btn.active { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text-bold); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }

  .tool-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    white-space: nowrap;
    transition: all 0.3s var(--fluid-curve);
  }
  .tool-pill:hover { color: var(--text-bold); border-color: color-mix(in srgb, var(--accent) 55%, transparent); transform: translateY(-1px); }

  /* Block countdown — only rendered in Timed Exam Mode. */
  .timer-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    border-radius: 999px;
    background: color-mix(in srgb, var(--amber) 9%, transparent);
    color: var(--amber);
    font-size: 0.64rem;
    font-weight: 900;
    letter-spacing: 1.2px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .timer-pill[hidden] { display: none; }
  .timer-pill.urgent { border-color: color-mix(in srgb, var(--red) 55%, transparent); background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); animation: timerPulse 1s ease-in-out infinite; }
  @keyframes timerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* Badge shown when a filtered custom set (not a full subject bank) is running. */
  .set-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px 7px 13px;
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 9%, transparent);
    color: var(--accent);
    font-size: 0.56rem;
    font-weight: 800;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .set-pill[hidden] { display: none; }
  .set-pill button { padding: 0 5px; color: inherit; font-size: 0.8rem; font-weight: 900; line-height: 1; opacity: 0.7; }
  .set-pill button:hover { opacity: 1; }

  /* ---------- Clue (progressive disclosure) ---------- */
  .clue-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 16px;
    padding: 9px 15px;
    border: 1px dashed color-mix(in srgb, var(--amber) 48%, transparent);
    border-radius: 999px;
    background: color-mix(in srgb, var(--amber) 7%, transparent);
    color: var(--amber);
    font-family: var(--font-gurmukhi);
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.6px;
    transition: all 0.3s var(--fluid-curve);
  }
  .clue-btn:hover { background: color-mix(in srgb, var(--amber) 14%, transparent); transform: translateY(-1px); }
  .clue-btn[aria-expanded="true"] { border-style: solid; }
  .clue-panel {
    margin-bottom: 18px;
    padding: 14px 17px;
    border-left: 3px solid var(--amber);
    border-radius: 0 13px 13px 0;
    background: color-mix(in srgb, var(--amber) 7%, transparent);
    animation: riseIn 0.4s var(--fluid-curve);
  }
  .clue-title { margin-bottom: 6px; color: var(--amber); font-size: 0.56rem; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase; }
  .clue-body { font-family: var(--font-gurmukhi); font-size: 0.85rem; font-weight: 600; line-height: 1.7; }
  .clue-sub { margin-top: 5px; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.74rem; font-weight: 600; line-height: 1.6; }

  /* ---------- Option states for Exam Mode (answer recorded, not graded) ---------- */
  .option.picked { border-color: color-mix(in srgb, var(--accent) 65%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: 0 0 26px -10px var(--accent); }
  .option.picked .opt-letter { color: var(--accent); }
  .opt-tick { margin-left: auto; flex: none; color: var(--accent); font-size: 0.9rem; font-weight: 900; }
  /* Desktop: the strike button stays quiet until the row is hovered or focused. */
  @media (hover: hover) and (pointer: fine) {
    .strike-btn { opacity: 0.25; }
    .option-row:hover .strike-btn,
    .option-row:focus-within .strike-btn,
    .strike-btn.active { opacity: 1; }
  }
  .option[aria-disabled="true"] { cursor: default; }

  /* ---------- Peer response statistics ---------- */
  .peer-wrap { margin: 18px 0 6px; }
  .peer-title { margin-bottom: 10px; color: var(--text-dim); font-size: 0.56rem; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase; }
  .peer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .peer-key { flex: none; min-width: 18px; color: var(--text-dim); font-size: 0.7rem; font-weight: 900; }
  .peer-key.good { color: var(--green); }
  .peer-key.mine { color: var(--accent); }
  .peer-bar { flex: 1; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
  .peer-fill { display: block; height: 100%; border-radius: 99px; background: rgba(255, 255, 255, 0.22); transition: width 0.8s var(--fluid-curve); }
  .peer-fill.good { background: var(--green); }
  .peer-fill.mine { background: var(--red); }
  .peer-pct { flex: none; min-width: 78px; color: var(--text-dim); font-size: 0.66rem; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
  .peer-note { margin-top: 8px; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.68rem; font-weight: 600; line-height: 1.6; }

  /* ---------- Trap alert + high-yield summary ---------- */
  .trap-box {
    margin-top: 16px;
    padding: 14px 17px;
    border-left: 4px solid var(--red);
    border-radius: 0 13px 13px 0;
    background: color-mix(in srgb, var(--red) 6%, transparent);
  }
  .trap-title { margin-bottom: 6px; color: var(--red); font-size: 0.58rem; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase; }
  .trap-body { font-family: var(--font-gurmukhi); font-size: 0.84rem; font-weight: 600; line-height: 1.7; color: #e6edf5; }

  .hy-box { margin-top: 16px; border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); border-radius: 14px; background: rgba(255, 255, 255, 0.02); overflow: hidden; }
  .hy-box > summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 16px;
    color: var(--accent);
    font-family: var(--font-gurmukhi);
    font-size: 0.66rem;
    font-weight: 900;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    list-style: none;
  }
  .hy-box > summary::-webkit-details-marker { display: none; }
  .hy-box > summary::after { content: '▾'; margin-left: auto; font-size: 0.8rem; transition: transform 0.3s var(--fluid-curve); }
  .hy-box[open] > summary::after { transform: rotate(180deg); }
  .hy-inner { padding: 0 16px 16px; }
  .hy-table { width: 100%; border-collapse: collapse; font-family: var(--font-gurmukhi); }
  .hy-table th, .hy-table td { padding: 9px 11px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font-size: 0.76rem; font-weight: 600; line-height: 1.55; text-align: left; vertical-align: top; }
  .hy-table th { color: var(--accent); font-size: 0.6rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
  .hy-table tr:last-child td { border-bottom: 0; }
  .hy-note { margin-top: 10px; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.72rem; font-weight: 600; line-height: 1.6; }

  /* ---------- Exam-mode banner + submit bar ---------- */
  .exam-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding: 10px 14px;
    border: 1px dashed color-mix(in srgb, var(--amber) 40%, transparent);
    border-radius: 12px;
    color: var(--amber);
    font-family: var(--font-gurmukhi);
    font-size: 0.68rem;
    font-weight: 700;
    line-height: 1.5;
  }
  .btn-submit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-height: 46px;
    padding: 12px 22px;
    border: 1px solid color-mix(in srgb, var(--amber) 55%, transparent);
    border-radius: 13px;
    background: color-mix(in srgb, var(--amber) 12%, transparent);
    color: var(--amber);
    font-family: var(--font-gurmukhi);
    font-size: 0.82rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    transition: all 0.3s var(--fluid-curve);
  }
  .btn-submit:hover { transform: translateY(-2px); background: color-mix(in srgb, var(--amber) 20%, transparent); box-shadow: 0 8px 26px -12px var(--amber); }

  /* ---------- Modal (custom quiz, submit confirm, history) ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    animation: veilIn 0.25s var(--fluid-curve);
  }
  .modal-backdrop[hidden] { display: none; }
  @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: min(94vw, 520px);
    max-height: 88vh;
    overflow-y: auto;
    padding: clamp(20px, 4vw, 28px);
    border: 1px solid var(--border);
    border-top: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 22px;
    background: var(--panel);
    box-shadow: 0 34px 90px rgba(0, 0, 0, 0.8), 0 0 60px -30px var(--accent);
    animation: riseIn 0.4s var(--fluid-curve);
  }
  .modal-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .modal-title { font-family: var(--font-gurmukhi); font-size: 1.05rem; font-weight: 900; }
  .modal-sub { margin-top: 4px; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.74rem; font-weight: 600; line-height: 1.55; }
  .modal-close { margin-left: auto; flex: none; width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 10px; color: var(--text-dim); font-size: 0.95rem; font-weight: 900; transition: all 0.3s var(--fluid-curve); }
  .modal-close:hover { color: var(--text-bold); border-color: rgba(255, 255, 255, 0.24); }
  .field { margin-bottom: 16px; }
  .field-label { margin-bottom: 8px; color: var(--text-dim); font-size: 0.56rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-family: var(--font-gurmukhi);
    font-size: 0.68rem;
    font-weight: 800;
    transition: all 0.3s var(--fluid-curve);
  }
  .chip:hover:not(:disabled) { color: var(--text-bold); border-color: rgba(255, 255, 255, 0.24); }
  .chip.active { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--text-bold); }
  .chip:disabled { opacity: 0.32; cursor: not-allowed; }
  .chip .chip-count { margin-left: 6px; opacity: 0.7; font-size: 0.62rem; font-variant-numeric: tabular-nums; }
  .modal-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 22px; }
  .modal-foot .btn-next { flex: 1; justify-content: center; }
  .btn-ghost {
    min-height: 46px;
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-family: var(--font-gurmukhi);
    font-size: 0.76rem;
    font-weight: 800;
    transition: all 0.3s var(--fluid-curve);
  }
  .btn-ghost:hover { color: var(--text-bold); border-color: rgba(255, 255, 255, 0.24); }
  .btn-ghost.danger { border-color: color-mix(in srgb, var(--red) 40%, transparent); color: var(--red); }
  .btn-ghost.danger:hover { background: color-mix(in srgb, var(--red) 10%, transparent); border-color: color-mix(in srgb, var(--red) 65%, transparent); }
  .history-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-bottom: 4px; }
  .history-box { padding: 11px 8px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255, 255, 255, 0.02); text-align: center; }
  .history-num { display: block; color: var(--accent); font-size: 1rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .history-label { display: block; margin-top: 3px; color: var(--text-dim); font-size: 0.52rem; font-weight: 800; letter-spacing: 0.9px; text-transform: uppercase; }
  .modal-msg { margin-top: 12px; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.72rem; font-weight: 600; line-height: 1.6; }
  .modal-msg.warn { color: var(--amber); }

  /* ---------- CLASSIC (light) colorway — matches lecture deck legacy palette ---------- */
  html:has(body[data-theme="CLASSIC"]) { background: #f8fbff; }
  body[data-theme="CLASSIC"] { background: linear-gradient(145deg, #f8fbff 0%, #eef4ff 100%); }
  body[data-theme="CLASSIC"]::before { background-image: radial-gradient(rgba(11, 86, 197, 0.26) 1px, transparent 1px); opacity: 0.6; }
  body[data-theme="CLASSIC"]::after { background: radial-gradient(circle at center, transparent 34%, rgba(11, 74, 168, 0.05) 100%); }
  body[data-theme="CLASSIC"] .mcq-header { background: linear-gradient(180deg, rgba(248, 251, 255, 0.95) 0%, rgba(248, 251, 255, 0.82) 78%, transparent 100%); }
  body[data-theme="CLASSIC"] .home-pill { border-color: rgba(11, 74, 168, 0.16); background: rgba(255, 255, 255, 0.9); }
  body[data-theme="CLASSIC"] .home-pill:hover { color: #0b56c5; border-color: rgba(11, 74, 168, 0.34); }
  body[data-theme="CLASSIC"] .router { background: rgba(255, 255, 255, 0.88); }
  body[data-theme="CLASSIC"] .router-btn:hover { color: #0b56c5; }
  body[data-theme="CLASSIC"] .router-btn.active { background: rgba(11, 86, 197, 0.1); color: #0b56c5; box-shadow: none; }
  body[data-theme="CLASSIC"] .score-pill { background: rgba(255, 255, 255, 0.9); }
  body[data-theme="CLASSIC"] .theme-pill { background: rgba(255, 255, 255, 0.9); }
  body[data-theme="CLASSIC"] .theme-pill:hover { color: #0b56c5; }
  body[data-theme="CLASSIC"] .progress-seg { background: rgba(11, 74, 168, 0.14); }
  body[data-theme="CLASSIC"] .q-card { box-shadow: 0 22px 64px rgba(16, 42, 82, 0.14), 0 0 60px -34px var(--accent), inset 0 1px 1px rgba(255, 255, 255, 0.9); }
  body[data-theme="CLASSIC"] .meta-rune { border-color: rgba(11, 74, 168, 0.1); background: rgba(11, 86, 197, 0.055); }
  body[data-theme="CLASSIC"] .lang-flip { border-color: rgba(11, 74, 168, 0.18); background: rgba(11, 86, 197, 0.05); }
  body[data-theme="CLASSIC"] .lang-flip:hover { color: #0b56c5; }
  body[data-theme="CLASSIC"] .strike-btn { border-color: rgba(11, 74, 168, 0.12); background: rgba(11, 86, 197, 0.035); }
  body[data-theme="CLASSIC"] .strike-btn:hover { color: var(--text-bold); background: rgba(11, 86, 197, 0.09); }
  body[data-theme="CLASSIC"] .option { border-color: rgba(11, 74, 168, 0.14); background: rgba(11, 86, 197, 0.03); }
  body[data-theme="CLASSIC"] .option:hover:not(:disabled) { border-color: rgba(11, 74, 168, 0.34); background: rgba(11, 86, 197, 0.07); }
  body[data-theme="CLASSIC"] .rationale { border-left-color: rgba(11, 74, 168, 0.24); background: rgba(11, 86, 197, 0.035); color: #33475e; }
  body[data-theme="CLASSIC"] .rationale strong { color: var(--text-bold); }
  body[data-theme="CLASSIC"] .objective-body { color: var(--text-bold); }
  body[data-theme="CLASSIC"] .btn-next { color: var(--text-bold); }
  body[data-theme="CLASSIC"] .verdict.good, body[data-theme="CLASSIC"] .verdict.bad { text-shadow: none; }
  body[data-theme="CLASSIC"] .mode-switch,
  body[data-theme="CLASSIC"] .tool-pill { background: rgba(255, 255, 255, 0.9); border-color: rgba(11, 74, 168, 0.16); }
  body[data-theme="CLASSIC"] .mode-btn:hover,
  body[data-theme="CLASSIC"] .tool-pill:hover { color: #0b56c5; }
  body[data-theme="CLASSIC"] .peer-bar { background: rgba(11, 74, 168, 0.12); }
  body[data-theme="CLASSIC"] .peer-fill { background: rgba(11, 74, 168, 0.32); }
  body[data-theme="CLASSIC"] .trap-body, body[data-theme="CLASSIC"] .clue-body { color: var(--text-bold); }
  body[data-theme="CLASSIC"] .hy-box { background: rgba(11, 86, 197, 0.03); }
  body[data-theme="CLASSIC"] .hy-table th, body[data-theme="CLASSIC"] .hy-table td { border-bottom-color: rgba(11, 74, 168, 0.14); }
  body[data-theme="CLASSIC"] .modal-backdrop { background: rgba(16, 42, 82, 0.4); }
  body[data-theme="CLASSIC"] .modal { box-shadow: 0 26px 70px rgba(16, 42, 82, 0.22), 0 0 60px -34px var(--accent); }
  body[data-theme="CLASSIC"] .modal-close,
  body[data-theme="CLASSIC"] .chip,
  body[data-theme="CLASSIC"] .btn-ghost,
  body[data-theme="CLASSIC"] .history-box { border-color: rgba(11, 74, 168, 0.16); background: rgba(11, 86, 197, 0.04); }
  body[data-theme="CLASSIC"] .btn-submit { color: #a2490f; }
  body[data-theme="CLASSIC"] .option.picked .opt-tick { color: var(--accent); }

  @media (max-width: 640px) {
    .mcq-header { gap: 10px 12px; }
    .router-btn { padding: 7px 10px; font-size: 0.54rem; }
    .score-pill { padding: 7px 11px; font-size: 0.56rem; }
    .theme-pill { padding: 7px 9px; font-size: 0.53rem; }
    .strike-btn { width: 36px; }
    .action-bar { flex-direction: column-reverse; align-items: stretch; }
    .btn-next { justify-content: center; }
    .mode-btn { padding: 7px 10px; font-size: 0.5rem; }

(async () => {

  const BANKS = {

      questions: [
        {
          id: "SCI-CH1-01", ch: "Ch 1 · ਰਸਾਇਣਕ ਪ੍ਰਤੀਕ੍ਰਿਆਵਾਂ", competency: "Understanding", diff: "Easy",
          hint: { pa: "ਹਵਾ ਵਿੱਚ ਸਿਰਫ਼ ਇੱਕ ਹੀ ਕਿਰਿਆਸ਼ੀਲ ਗੈਸ ਵੱਡੀ ਮਾਤਰਾ ਵਿੱਚ ਹੁੰਦੀ ਹੈ ਜਿਸ ਨਾਲ ਧਾਤ ਸੜਦੇ ਸਮੇਂ ਜੁੜ ਸਕਦੀ ਹੈ।", en: "Air supplies just one reactive gas in bulk that a burning metal can grab — decide which element that is first." },
          trap: { pa: "ਤਿੰਨੇ ਗਲਤ ਵਿਕਲਪ ਅਸਲੀ ਮੈਗਨੀਸ਼ੀਅਮ ਯੋਗਿਕ ਹਨ, ਇਸ ਲਈ ਪਛਾਣੇ-ਪਛਾਣੇ ਲੱਗਦੇ ਹਨ। ਪਰ ਹਵਾ ਵਿੱਚ ਨਾ ਕਲੋਰੀਨ ਹੈ ਤੇ ਨਾ ਨਾਈਟ੍ਰਿਕ ਐਸਿਡ — ਹਮੇਸ਼ਾ ਪੁੱਛੋ ਕਿ ਦੂਜਾ ਪ੍ਰਤੀਕਾਰਕ ਉਪਲਬਧ ਵੀ ਹੈ ਜਾਂ ਨਹੀਂ।", en: "All three distractors are genuine magnesium compounds, so they feel familiar. But air contains no chlorine and no nitric acid — always check that the other reactant is actually available before naming a product." },
          prompt: { pa: "ਮੈਗਨੀਸ਼ੀਅਮ ਰਿਬਨ ਨੂੰ ਹਵਾ ਵਿੱਚ ਸਾੜਨ 'ਤੇ ਕਿਹੜਾ ਯੋਗਿਕ ਬਣਦਾ ਹੈ?", en: "When a magnesium ribbon is burnt in air, which compound is formed?" },

            { t: { pa: "ਮੈਗਨੀਸ਼ੀਅਮ ਆਕਸਾਈਡ (MgO)", en: "Magnesium oxide (MgO)" }, correct: true,

            { t: { pa: "ਮੈਗਨੀਸ਼ੀਅਮ ਕਲੋਰਾਈਡ (MgCl₂)", en: "Magnesium chloride (MgCl₂)" }, correct: false,

            { t: { pa: "ਮੈਗਨੀਸ਼ੀਅਮ ਹਾਈਡ੍ਰੋਕਸਾਈਡ (Mg(OH)₂)", en: "Magnesium hydroxide (Mg(OH)₂)" }, correct: false,

            { t: { pa: "ਮੈਗਨੀਸ਼ੀਅਮ ਨਾਈਟ੍ਰੇਟ (Mg(NO₃)₂)", en: "Magnesium nitrate (Mg(NO₃)₂)" }, correct: false,
              r: { pa: "ਨਾਈਟ੍ਰੇਟ ਨਾਈਟ੍ਰਿਕ ਐਸਿਡ ਨਾਲ ਬਣਦਾ ਹੈ; ਸਾੜਨ ਦੀ ਮੁੱਖ ਉਪਜ MgO ਹੈ।", en: "Nitrate forms with nitric acid; the main burning product is MgO." } }
          ],
          objective: { pa: "ਸੰਯੋਜਨ ਪ੍ਰਤੀਕ੍ਰਿਆ: ਧਾਤ + ਆਕਸੀਜਨ → ਧਾਤ ਆਕਸਾਈਡ। ਮੈਗਨੀਸ਼ੀਅਮ ਚਮਕਦਾਰ ਚਿੱਟੀ ਲਾਟ ਨਾਲ ਸੜ ਕੇ MgO ਦਿੰਦਾ ਹੈ।", en: "Combination reaction: metal + oxygen → metal oxide. Magnesium burns with a dazzling white flame to give MgO." }
        },
        {
          id: "SCI-CH1-02", ch: "Ch 1 · ਰਸਾਇਣਕ ਪ੍ਰਤੀਕ੍ਰਿਆਵਾਂ", competency: "Analysis", diff: "Medium",
          hint: { pa: "ਗਿਣੋ ਕਿ ਕਿੰਨੇ ਪ੍ਰਤੀਕਾਰਕ ਤੇ ਕਿੰਨੀਆਂ ਉਪਜਾਂ ਹਨ, ਫਿਰ ਦੇਖੋ ਕਿ ਕੀ ਇੱਕ ਸ਼ੁੱਧ ਤੱਤ ਦੂਜੇ ਨੂੰ ਉਸਦੇ ਯੋਗਿਕ ਵਿੱਚੋਂ ਬਾਹਰ ਧੱਕ ਰਿਹਾ ਹੈ।", en: "Count the reactants and the products, then ask whether one free element is pushing another out of its compound." },
          trap: { pa: "ਬਹੁਤ ਸਾਰੇ ਵਿਦਿਆਰਥੀ 'ਦੂਹਰੀ ਵਿਸਥਾਪਨ' ਚੁਣ ਲੈਂਦੇ ਹਨ ਕਿਉਂਕਿ ਦੋ ਪ੍ਰਤੀਕਾਰਕ ਤੇ ਦੋ ਉਪਜਾਂ ਦਿਖਦੀਆਂ ਹਨ। ਪਰ ਦੂਹਰੀ ਵਿਸਥਾਪਨ ਲਈ ਦੋਵੇਂ ਪ੍ਰਤੀਕਾਰਕ ਯੋਗਿਕ ਹੋਣੇ ਚਾਹੀਦੇ ਹਨ ਜੋ ਆਇਨ ਵਟਾਉਂਦੇ ਹਨ; ਇੱਥੇ Al ਇੱਕ ਸ਼ੁੱਧ ਤੱਤ ਹੈ।", en: "Many students pick 'double displacement' because they see two reactants and two products. Double displacement needs two compounds swapping ions; here Al is a free element, so only a single displacement can happen." },
          table: {
            title: { pa: "ਪ੍ਰਤੀਕ੍ਰਿਆਵਾਂ ਦੀਆਂ ਕਿਸਮਾਂ", en: "Reaction Types at a Glance" },
            headers: [{ pa: "ਕਿਸਮ", en: "Type" }, { pa: "ਪੈਟਰਨ", en: "Pattern" }, { pa: "ਉਦਾਹਰਨ", en: "Example" }],
            rows: [
              [{ pa: "ਸੰਯੋਜਨ", en: "Combination" }, { pa: "A + B → AB", en: "A + B → AB" }, { pa: "2Mg + O₂ → 2MgO", en: "2Mg + O₂ → 2MgO" }],

              [{ pa: "ਵਿਸਥਾਪਨ", en: "Displacement" }, { pa: "A + BC → AC + B", en: "A + BC → AC + B" }, { pa: "Fe₂O₃ + 2Al → Al₂O₃ + 2Fe", en: "Fe₂O₃ + 2Al → Al₂O₃ + 2Fe" }],
              [{ pa: "ਦੂਹਰੀ ਵਿਸਥਾਪਨ", en: "Double displacement" }, { pa: "AB + CD → AD + CB", en: "AB + CD → AD + CB" }, { pa: "AgNO₃ + NaCl → AgCl↓ + NaNO₃", en: "AgNO₃ + NaCl → AgCl↓ + NaNO₃" }],
            ],
            note: { pa: "ਸ਼ੁੱਧ ਤੱਤ ਦਿਖੇ ਤਾਂ ਵਿਸਥਾਪਨ ਸੋਚੋ; ਦੋਵੇਂ ਪਾਸੇ ਯੋਗਿਕ ਹੋਣ ਤਾਂ ਦੂਹਰੀ ਵਿਸਥਾਪਨ।", en: "See a free element? Think displacement. Two compounds swapping partners? Double displacement." }
          },
          prompt: { pa: "Fe₂O₃ + 2Al → Al₂O₃ + 2Fe — ਇਹ ਪ੍ਰਤੀਕ੍ਰਿਆ ਕਿਸ ਕਿਸਮ ਦੀ ਹੈ?", en: "Fe₂O₃ + 2Al → Al₂O₃ + 2Fe — what type of reaction is this?" },
          options: [
            { t: { pa: "ਵਿਸਥਾਪਨ ਪ੍ਰਤੀਕ੍ਰਿਆ", en: "Displacement reaction" }, correct: true,
              r: { pa: "ਐਲੂਮੀਨੀਅਮ, ਲੋਹੇ ਨਾਲੋਂ ਵੱਧ ਕਿਰਿਆਸ਼ੀਲ ਹੈ, ਇਸ ਲਈ ਇਹ Fe ਨੂੰ ਉਸਦੇ ਆਕਸਾਈਡ ਵਿੱਚੋਂ ਵਿਸਥਾਪਿਤ ਕਰ ਦਿੰਦਾ ਹੈ — ਇਹ ਥਰਮਿਟ ਪ੍ਰਤੀਕ੍ਰਿਆ ਹੈ ਜੋ ਰੇਲ ਪਟੜੀਆਂ ਜੋੜਨ ਲਈ ਵਰਤੀ ਜਾਂਦੀ ਹੈ।", en: "Aluminium is more reactive than iron, so it displaces Fe from its oxide — the thermit reaction used to weld railway tracks." } },
            { t: { pa: "ਸੰਯੋਜਨ ਪ੍ਰਤੀਕ੍ਰਿਆ", en: "Combination reaction" }, correct: false,
              r: { pa: "ਸੰਯੋਜਨ ਵਿੱਚ ਦੋ ਪਦਾਰਥ ਮਿਲ ਕੇ ਇੱਕ ਹੀ ਉਪਜ ਬਣਾਉਂਦੇ ਹਨ; ਇੱਥੇ ਦੋ ਉਪਜਾਂ ਹਨ।", en: "Combination gives a single product from two reactants; here two products form." } },
            { t: { pa: "ਅਪਘਟਨ ਪ੍ਰਤੀਕ੍ਰਿਆ", en: "Decomposition reaction" }, correct: false,
              r: { pa: "ਅਪਘਟਨ ਵਿੱਚ ਇੱਕ ਯੋਗਿਕ ਟੁੱਟਦਾ ਹੈ; ਇੱਥੇ ਦੋ ਪਦਾਰਥ ਪ੍ਰਤੀਕ੍ਰਿਆ ਕਰ ਰਹੇ ਹਨ।", en: "Decomposition means one compound splitting apart; here two reactants combine and exchange." } },
            { t: { pa: "ਦੂਹਰੀ ਵਿਸਥਾਪਨ ਪ੍ਰਤੀਕ੍ਰਿਆ", en: "Double displacement reaction" }, correct: false,
              r: { pa: "ਦੂਹਰੀ ਵਿਸਥਾਪਨ ਵਿੱਚ ਦੋ ਯੋਗਿਕ ਆਪਸ ਵਿੱਚ ਆਇਨ ਵਟਾਉਂਦੇ ਹਨ (ਜਿਵੇਂ AgNO₃ + NaCl); ਇੱਥੇ ਸਿਰਫ਼ ਇੱਕ ਤੱਤ ਦੂਜੇ ਨੂੰ ਹਟਾਉਂਦਾ ਹੈ।", en: "Double displacement is an exchange of ions between two compounds (like AgNO₃ + NaCl); here a single element displaces another." } }
          ],
          objective: { pa: "ਵਿਸਥਾਪਨ: ਵੱਧ ਕਿਰਿਆਸ਼ੀਲ ਧਾਤ ਘੱਟ ਕਿਰਿਆਸ਼ੀਲ ਧਾਤ ਨੂੰ ਉਸਦੇ ਯੋਗਿਕ ਵਿੱਚੋਂ ਕੱਢ ਦਿੰਦੀ ਹੈ। ਥਰਮਿਟ ਪ੍ਰਤੀਕ੍ਰਿਆ (Fe₂O₃ + Al) ਬਹੁਤ ਤਾਪ ਛੱਡਦੀ ਹੈ — ਰੇਲ ਪਟੜੀਆਂ ਦੀ ਵੈਲਡਿੰਗ।", en: "Displacement: a more reactive metal pushes a less reactive one out of its compound. The highly exothermic thermit reaction (Fe₂O₃ + Al) welds railway tracks." }

        {
          id: "SCI-CH3-03", ch: "Ch 3 · ਧਾਤਾਂ ਅਤੇ ਅਧਾਤਾਂ", competency: "Analysis", diff: "Medium",

            { t: { pa: "ਕਾਪਰ ਸਲਫੇਟ ਗਰਮੀ ਨਾਲ ਅਪਘਟਿਤ ਹੋ ਜਾਂਦਾ ਹੈ", en: "The copper sulphate decomposes on its own" }, correct: false,

        {

          trap: { pa: "ਬਹੁਤੇ ਵਿਦਿਆਰਥੀ ਜ਼ਾਈਲਮ ਤੇ ਫਲੋਇਮ ਦੇ ਕੰਮ ਆਪਸ ਵਿੱਚ ਬਦਲ ਦਿੰਦੇ ਹਨ। ਯਾਦ ਰੱਖਣ ਦਾ ਤਰੀਕਾ: ਫ-ਲੋਇਮ = ਫੂਡ (ਭੋਜਨ)।", en: "Most students swap the two. Memory aid: pHloem = pHood (food); xylem sounds like 'water-line' going up." },
          options: [
            { t: { pa: "ਜ਼ਾਈਲਮ ਪਾਣੀ ਤੇ ਖਣਿਜ ਜੜ੍ਹਾਂ ਤੋਂ ਉੱਪਰ ਲਿਜਾਂਦਾ ਹੈ; ਫਲੋਇਮ ਭੋਜਨ ਨੂੰ ਦੋਵੇਂ ਦਿਸ਼ਾਵਾਂ ਵਿੱਚ ਪਹੁੰਚਾਉਂਦਾ ਹੈ", en: "Xylem carries water and minerals upward from the roots; phloem carries food in both directions" }, correct: true,
              r: { pa: "ਜ਼ਾਈਲਮ ਵਿੱਚ ਵਹਾਅ ਇੱਕ-ਦਿਸ਼ਾਵੀ (ਉੱਪਰ) ਹੈ ਤੇ ਵਾਸ਼ਪ-ਉਤਸਰਜਨ ਖਿੱਚ ਨਾਲ ਚੱਲਦਾ ਹੈ। ਫਲੋਇਮ ਪੱਤਿਆਂ ਤੋਂ ਭੋਜਨ ਨੂੰ ਜਿੱਥੇ ਲੋੜ ਹੋਵੇ ਉੱਥੇ ਭੇਜਦਾ ਹੈ — ਉੱਪਰ ਵੀ ਤੇ ਹੇਠਾਂ ਜੜ੍ਹਾਂ ਤੱਕ ਵੀ — ਜਿਸ ਲਈ ATP ਊਰਜਾ ਲੱਗਦੀ ਹੈ।", en: "Flow in xylem is one-way (upward) and is driven by transpiration pull. Phloem moves food from the leaves to wherever it is needed — upward and down to the roots — using ATP energy." } },
            { t: { pa: "ਜ਼ਾਈਲਮ ਭੋਜਨ ਲਿਜਾਂਦਾ ਹੈ ਅਤੇ ਫਲੋਇਮ ਪਾਣੀ ਲਿਜਾਂਦਾ ਹੈ", en: "Xylem carries food and phloem carries water" }, correct: false,
              r: { pa: "ਇਹ ਬਿਲਕੁਲ ਉਲਟ ਹੈ — ਜ਼ਾਈਲਮ ਪਾਣੀ ਲਈ ਤੇ ਫਲੋਇਮ ਭੋਜਨ ਲਈ ਹੈ।", en: "This is exactly reversed — xylem is for water and phloem is for food." } },
            { t: { pa: "ਦੋਵੇਂ ਸਿਰਫ਼ ਪਾਣੀ ਹੀ ਲਿਜਾਂਦੇ ਹਨ, ਪਰ ਵੱਖ-ਵੱਖ ਗਤੀ ਨਾਲ", en: "Both carry only water, but at different speeds" }, correct: false,
              r: { pa: "ਜੇ ਦੋਵੇਂ ਪਾਣੀ ਹੀ ਲਿਜਾਂਦੇ ਤਾਂ ਪੱਤਿਆਂ ਵਿੱਚ ਬਣਿਆ ਭੋਜਨ ਬਾਕੀ ਪੌਦੇ ਤੱਕ ਕਦੇ ਨਾ ਪਹੁੰਚਦਾ।", en: "If both carried only water, the food made in the leaves could never reach the rest of the plant." } },
            { t: { pa: "ਜ਼ਾਈਲਮ ਦੋਵੇਂ ਦਿਸ਼ਾਵਾਂ ਵਿੱਚ ਪਾਣੀ ਲਿਜਾਂਦਾ ਹੈ ਅਤੇ ਇਸ ਲਈ ATP ਖ਼ਰਚਦਾ ਹੈ", en: "Xylem carries water in both directions and spends ATP to do it" }, correct: false,
              r: { pa: "ਜ਼ਾਈਲਮ ਦਾ ਵਹਾਅ ਸਿਰਫ਼ ਉੱਪਰ ਵੱਲ ਹੈ ਅਤੇ ਦਿਨ ਵੇਲੇ ਇਹ ਵਾਸ਼ਪ-ਉਤਸਰਜਨ ਖਿੱਚ ਨਾਲ ਚੱਲਦਾ ਹੈ — ATP ਦੀ ਲੋੜ ਫਲੋਇਮ ਨੂੰ ਪੈਂਦੀ ਹੈ।", en: "Xylem flow is upward only and is driven by transpiration pull during the day — it is phloem that needs ATP." } }
          ],
          objective: { pa: "ਪੌਦਿਆਂ ਵਿੱਚ ਪਰਿਵਹਨ: ਜ਼ਾਈਲਮ — ਪਾਣੀ ਤੇ ਖਣਿਜ, ਇੱਕ-ਦਿਸ਼ਾਵੀ (ਉੱਪਰ), ਵਾਸ਼ਪ-ਉਤਸਰਜਨ ਖਿੱਚ, ਊਰਜਾ ਨਹੀਂ ਲੱਗਦੀ। ਫਲੋਇਮ — ਭੋਜਨ (ਸਥਾਨਾਂਤਰਨ), ਦੋ-ਦਿਸ਼ਾਵੀ, ATP ਲੱਗਦੀ ਹੈ।", en: "Transport in plants: xylem — water and minerals, one-way (upward), driven by transpiration pull, needs no energy. Phloem — food (translocation), two-way, requires ATP." }
        },
        {
          id: "SCI-CH6B-02", ch: "Ch 6 · ਕੰਟਰੋਲ ਅਤੇ ਤਾਲਮੇਲ", competency: "Application", diff: "Medium",
          prompt: { pa: "ਇੱਕ ਵਿਅਕਤੀ ਦੇ ਖ਼ੂਨ ਵਿੱਚ ਸ਼ੱਕਰ ਦੀ ਮਾਤਰਾ ਲਗਾਤਾਰ ਵਧੀ ਰਹਿੰਦੀ ਹੈ। ਕਿਹੜੀ ਗ੍ਰੰਥੀ ਦਾ ਕਿਹੜਾ ਹਾਰਮੋਨ ਘੱਟ ਬਣ ਰਿਹਾ ਹੈ?", en: "A person's blood sugar level stays persistently high. Which gland is under-secreting which hormone?" },
          hint: { pa: "ਪੁੱਛੋ ਕਿ ਕਿਹੜਾ ਹਾਰਮੋਨ ਖ਼ੂਨ ਦੀ ਸ਼ੱਕਰ ਨੂੰ *ਘਟਾਉਣ* ਦਾ ਕੰਮ ਕਰਦਾ ਹੈ — ਉਸੇ ਦੀ ਕਮੀ ਨਾਲ ਸ਼ੱਕਰ ਵਧੀ ਰਹੇਗੀ।", en: "Ask which hormone's job is to *lower* blood sugar — a shortage of exactly that one leaves sugar high." },
          trap: { pa: "ਐਡਰੀਨਲਿਨ ਇਸ ਲਈ ਫਸਾਉਂਦਾ ਹੈ ਕਿਉਂਕਿ ਇਸਦਾ ਸੰਬੰਧ ਵੀ ਖ਼ੂਨ ਦੀ ਸ਼ੱਕਰ ਨਾਲ ਹੈ — ਪਰ ਇਹ ਸ਼ੱਕਰ ਵਧਾਉਂਦਾ ਹੈ। ਇਸਦੀ ਕਮੀ ਨਾਲ ਸ਼ੱਕਰ ਘਟੇਗੀ, ਵਧੇਗੀ ਨਹੀਂ — ਹਮੇਸ਼ਾ ਅਸਰ ਦੀ ਦਿਸ਼ਾ ਜਾਂਚੋ।", en: "Adrenaline tempts because it is also linked to blood sugar — but it raises it. A deficiency would lower sugar, not raise it, so always check the direction of the effect." },
          options: [
            { t: { pa: "ਪੈਨਕ੍ਰੀਆਸ — ਇਨਸੁਲਿਨ", en: "Pancreas — insulin" }, correct: true,
              r: { pa: "ਇਨਸੁਲਿਨ ਖ਼ੂਨ ਦੀ ਸ਼ੱਕਰ ਨੂੰ ਸੈੱਲਾਂ ਵਿੱਚ ਪਹੁੰਚਾ ਕੇ ਉਸਦਾ ਪੱਧਰ ਘਟਾਉਂਦਾ ਹੈ। ਇਸਦੀ ਕਮੀ ਨਾਲ ਮਧੂਮੇਹ (ਡਾਇਬਟੀਜ਼) ਹੁੰਦਾ ਹੈ।", en: "Insulin lowers blood sugar by moving glucose into cells. Too little of it causes diabetes mellitus." } },
            { t: { pa: "ਥਾਇਰਾਇਡ — ਥਾਇਰਾਕਸਿਨ", en: "Thyroid — thyroxine" }, correct: false,
              r: { pa: "ਥਾਇਰਾਕਸਿਨ ਉਪਾਪਚਯ ਦੀ ਦਰ ਕੰਟਰੋਲ ਕਰਦਾ ਹੈ; ਇਸਦੀ ਕਮੀ ਨਾਲ ਗਲਗੰਡ (goitre) ਹੁੰਦਾ ਹੈ, ਖ਼ੂਨ ਦੀ ਸ਼ੱਕਰ ਨਹੀਂ ਵਧਦੀ।", en: "Thyroxine controls metabolic rate; its deficiency causes goitre, not a raised blood sugar level." } },
            { t: { pa: "ਪਿਟੂਟਰੀ — ਵਾਧਾ ਹਾਰਮੋਨ", en: "Pituitary — growth hormone" }, correct: false,
              r: { pa: "ਵਾਧਾ ਹਾਰਮੋਨ ਸਰੀਰ ਦੇ ਵਾਧੇ ਨੂੰ ਕੰਟਰੋਲ ਕਰਦਾ ਹੈ; ਇਸਦੀ ਕਮੀ ਨਾਲ ਬੌਣਾਪਣ ਹੁੰਦਾ ਹੈ।", en: "Growth hormone controls body growth; too little of it causes dwarfism." } },
            { t: { pa: "ਐਡਰੀਨਲ — ਐਡਰੀਨਲਿਨ", en: "Adrenal — adrenaline" }, correct: false,
              r: { pa: "ਐਡਰੀਨਲਿਨ ਐਮਰਜੈਂਸੀ ਵੇਲੇ ਦਿਲ ਦੀ ਧੜਕਣ ਵਧਾਉਂਦਾ ਹੈ; ਇਹ ਅਸਲ ਵਿੱਚ ਖ਼ੂਨ ਦੀ ਸ਼ੱਕਰ ਵਧਾਉਂਦਾ ਹੈ, ਘਟਾਉਂਦਾ ਨਹੀਂ।", en: "Adrenaline raises heart rate in emergencies; it actually increases blood sugar rather than lowering it." } }
          ],
          objective: { pa: "ਮਨੁੱਖੀ ਹਾਰਮੋਨ: ਇਨਸੁਲਿਨ (ਪੈਨਕ੍ਰੀਆਸ) — ਖ਼ੂਨ ਦੀ ਸ਼ੱਕਰ ਘਟਾਉਂਦਾ; ਥਾਇਰਾਕਸਿਨ (ਥਾਇਰਾਇਡ, ਆਇਓਡੀਨ ਚਾਹੀਦੀ) — ਉਪਾਪਚਯ; ਐਡਰੀਨਲਿਨ (ਐਡਰੀਨਲ) — ਲੜੋ-ਜਾਂ-ਭੱਜੋ; ਵਾਧਾ ਹਾਰਮੋਨ (ਪਿਟੂਟਰੀ) — ਵਾਧਾ।", en: "Human hormones: insulin (pancreas) — lowers blood sugar; thyroxine (thyroid, needs iodine) — metabolism; adrenaline (adrenal) — fight-or-flight; growth hormone (pituitary) — growth." }
        },
        {
          id: "SCI-CH7-02", ch: "Ch 7 · ਜੀਵ ਪ੍ਰਜਣਨ ਕਿਵੇਂ ਕਰਦੇ ਹਨ", competency: "Understanding", diff: "Medium",
          prompt: { pa: "ਹਾਈਡ੍ਰਾ ਅਤੇ ਖ਼ਮੀਰ (yeast) ਕਿਸ ਵਿਧੀ ਨਾਲ ਅਲਿੰਗੀ ਪ੍ਰਜਣਨ ਕਰਦੇ ਹਨ?", en: "By which method do Hydra and yeast reproduce asexually?" },
          hint: { pa: "ਸੋਚੋ ਕਿ ਕਿਹੜੀ ਵਿਧੀ ਵਿੱਚ ਜਨਕ ਦੇ ਸਰੀਰ 'ਤੇ ਛੋਟਾ ਉਭਾਰ ਉੱਗਦਾ ਹੈ ਜੋ ਬਾਅਦ ਵਿੱਚ ਵੱਖ ਹੋ ਜਾਂਦਾ ਹੈ।", en: "Think about which method starts as a small outgrowth on the parent that later separates." },
          trap: { pa: "ਦੋ-ਖੰਡੀ ਵਿਭਾਜਨ ਸਭ ਤੋਂ ਵੱਧ ਚੁਣਿਆ ਜਾਂਦਾ ਹੈ ਕਿਉਂਕਿ ਇਹ ਸਭ ਤੋਂ ਵੱਧ ਜਾਣੀ-ਪਛਾਣੀ ਅਲਿੰਗੀ ਵਿਧੀ ਹੈ। ਫ਼ਰਕ ਇਹ ਹੈ: ਵਿਭਾਜਨ ਵਿੱਚ ਜਨਕ ਬਰਾਬਰ ਦੋ ਹਿੱਸਿਆਂ ਵਿੱਚ ਵੰਡਿਆ ਜਾਂਦਾ ਹੈ, ਜਦਕਿ ਮੁਕੁਲਨ ਵਿੱਚ ਜਨਕ ਕਾਇਮ ਰਹਿੰਦਾ ਹੈ ਤੇ ਛੋਟੀ ਕਲੀ ਵੱਖ ਹੁੰਦੀ ਹੈ।", en: "Binary fission is the most-chosen answer because it is the best-known asexual method. The distinction: in fission the parent splits into two equal halves, whereas in budding the parent persists and a smaller bud separates." },
          options: [
            { t: { pa: "ਮੁਕੁਲਨ (Budding)", en: "Budding" }, correct: true,
              r: { pa: "ਜਨਕ ਦੇ ਸਰੀਰ 'ਤੇ ਇੱਕ ਉਭਾਰ (ਕਲੀ) ਬਣਦੀ ਹੈ ਜੋ ਵੱਡੀ ਹੋ ਕੇ ਵੱਖ ਹੋ ਜਾਂਦੀ ਹੈ ਤੇ ਨਵਾਂ ਜੀਵ ਬਣ ਜਾਂਦੀ ਹੈ।", en: "A bud grows out of the parent's body, enlarges and then detaches to become a new individual." } },
            { t: { pa: "ਦੋ-ਖੰਡੀ ਵਿਭਾਜਨ (Binary fission)", en: "Binary fission" }, correct: false,
              r: { pa: "ਇਹ ਅਮੀਬਾ ਤੇ ਲਿਸ਼ਮੈਨੀਆ ਵਰਗੇ ਇੱਕ-ਕੋਸ਼ੀ ਜੀਵਾਂ ਦੀ ਵਿਧੀ ਹੈ, ਜਿੱਥੇ ਸਰੀਰ ਦੋ ਬਰਾਬਰ ਹਿੱਸਿਆਂ ਵਿੱਚ ਵੰਡਿਆ ਜਾਂਦਾ ਹੈ।", en: "That is the method of unicellular organisms like Amoeba and Leishmania, where the body splits into two equal halves." } },
            { t: { pa: "ਪੁਨਰਜਣਨ (Regeneration)", en: "Regeneration" }, correct: false,
              r: { pa: "ਪਲੈਨੇਰੀਆ ਵਿੱਚ ਕੱਟੇ ਹੋਏ ਟੁਕੜੇ ਤੋਂ ਪੂਰਾ ਜੀਵ ਬਣਦਾ ਹੈ — ਪਰ ਇਹ ਹਾਈਡ੍ਰਾ ਦੀ ਆਮ ਪ੍ਰਜਣਨ ਵਿਧੀ ਨਹੀਂ।", en: "In Planaria a whole organism regrows from a cut piece — but that is not Hydra's normal mode of reproduction." } },
            { t: { pa: "ਬੀਜਾਣੂ ਨਿਰਮਾਣ (Spore formation)", en: "Spore formation" }, correct: false,
              r: { pa: "ਰਾਈਜ਼ੋਪਸ (ਬਰੈੱਡ ਮੋਲਡ) ਬੀਜਾਣੂ ਥੈਲੀਆਂ ਰਾਹੀਂ ਪ੍ਰਜਣਨ ਕਰਦਾ ਹੈ, ਹਾਈਡ੍ਰਾ ਨਹੀਂ।", en: "Rhizopus (bread mould) reproduces through sporangia; Hydra does not." } }
          ],
          objective: { pa: "ਅਲਿੰਗੀ ਪ੍ਰਜਣਨ ਦੀਆਂ ਵਿਧੀਆਂ: ਦੋ-ਖੰਡੀ ਵਿਭਾਜਨ (ਅਮੀਬਾ), ਬਹੁ-ਖੰਡੀ ਵਿਭਾਜਨ (ਪਲਾਜ਼ਮੋਡੀਅਮ), ਮੁਕੁਲਨ (ਹਾਈਡ੍ਰਾ, ਖ਼ਮੀਰ), ਖੰਡਨ (ਸਪਾਇਰੋਗਾਇਰਾ), ਪੁਨਰਜਣਨ (ਪਲੈਨੇਰੀਆ), ਬੀਜਾਣੂ ਨਿਰਮਾਣ (ਰਾਈਜ਼ੋਪਸ), ਕਾਇਕ ਪ੍ਰਵਰਧਨ (ਆਲੂ, ਬ੍ਰਾਇਓਫਿਲਮ)।", en: "Modes of asexual reproduction: binary fission (Amoeba), multiple fission (Plasmodium), budding (Hydra, yeast), fragmentation (Spirogyra), regeneration (Planaria), spore formation (Rhizopus), vegetative propagation (potato, Bryophyllum)." }
        },
        {
          id: "SCI-CH8-02", ch: "Ch 8 · ਅਨੁਵੰਸ਼ਿਕਤਾ", competency: "Analysis", diff: "Medium",
          prompt: { pa: "ਮਨੁੱਖਾਂ ਵਿੱਚ ਬੱਚੇ ਦਾ ਲਿੰਗ ਕੌਣ ਨਿਰਧਾਰਿਤ ਕਰਦਾ ਹੈ ਅਤੇ ਕਿਉਂ?", en: "In humans, which parent determines the sex of the child, and why?" },
          hint: { pa: "ਹਰ ਮਾਪੇ ਦਾ ਗੁਣਸੂਤਰ ਜੋੜਾ ਲਿਖੋ (XX ਜਾਂ XY) ਤੇ ਪੁੱਛੋ ਕਿ ਕਿਸ ਕੋਲ ਦੇਣ ਲਈ ਦੋ ਵੱਖਰੇ ਵਿਕਲਪ ਹਨ।", en: "Write down each parent's pair (XX or XY) and ask which of them has two different options to pass on." },
          trap: { pa: "'ਦੋਵੇਂ ਬਰਾਬਰ' ਸਭ ਤੋਂ ਵਾਜਬ ਤੇ ਨਿਆਂਪੂਰਨ ਲੱਗਦਾ ਹੈ, ਇਸੇ ਲਈ ਫਸਾਉਂਦਾ ਹੈ — ਅਤੇ 22 ਜੋੜਿਆਂ ਲਈ ਇਹ ਸੱਚ ਵੀ ਹੈ। ਪਰ ਲਿੰਗ ਸਿਰਫ਼ 23ਵੇਂ ਜੋੜੇ ਨਾਲ ਤੈਅ ਹੁੰਦਾ ਹੈ, ਜਿੱਥੇ ਸਿਰਫ਼ ਪਿਤਾ ਕੋਲ ਚੋਣ ਹੈ।", en: "'Both equally' feels the most reasonable and even-handed, which is why it tempts — and it is true for 22 of the pairs. But sex is settled by the 23rd pair alone, where only the father has a choice to offer." },
          options: [
            { t: { pa: "ਪਿਤਾ, ਕਿਉਂਕਿ ਉਹ X ਜਾਂ Y ਵਿੱਚੋਂ ਕੋਈ ਇੱਕ ਗੁਣਸੂਤਰ ਦਿੰਦਾ ਹੈ", en: "The father, because he contributes either an X or a Y chromosome" }, correct: true,
              r: { pa: "ਮਾਂ ਦੇ ਸਾਰੇ ਅੰਡਾਣੂਆਂ ਵਿੱਚ X ਹੁੰਦਾ ਹੈ। ਪਿਤਾ ਦੇ ਸ਼ੁਕਰਾਣੂ ਅੱਧੇ X ਤੇ ਅੱਧੇ Y ਹੁੰਦੇ ਹਨ — XX ਤੋਂ ਲੜਕੀ, XY ਤੋਂ ਲੜਕਾ। ਇਸ ਲਈ ਨਿਰਧਾਰਨ ਪਿਤਾ ਵੱਲੋਂ ਹੁੰਦਾ ਹੈ।", en: "All the mother's eggs carry X. The father's sperms are half X and half Y — XX gives a girl, XY a boy. So the determining contribution comes from the father." } },
            { t: { pa: "ਮਾਂ, ਕਿਉਂਕਿ ਬੱਚਾ ਉਸਦੇ ਸਰੀਰ ਵਿੱਚ ਵਿਕਸਿਤ ਹੁੰਦਾ ਹੈ", en: "The mother, because the child develops inside her body" }, correct: false,

            { t: { pa: "ਮਾਂ, ਕਿਉਂਕਿ ਉਹ X ਜਾਂ Y ਵਿੱਚੋਂ ਕੋਈ ਇੱਕ ਦਿੰਦੀ ਹੈ", en: "The mother, because she contributes either an X or a Y" }, correct: false,

            { t: { pa: "ਦੋਵੇਂ ਬਰਾਬਰ, ਕਿਉਂਕਿ ਦੋਵੇਂ ਅੱਧੇ ਗੁਣਸੂਤਰ ਦਿੰਦੇ ਹਨ", en: "Both equally, because each contributes half the chromosomes" }, correct: false,
              r: { pa: "ਇਹ ਬਾਕੀ 22 ਜੋੜਿਆਂ ਲਈ ਸਹੀ ਹੈ, ਪਰ ਲਿੰਗ ਗੁਣਸੂਤਰ ਵਿਸ਼ੇਸ਼ ਹਨ: ਸਿਰਫ਼ ਪਿਤਾ ਕੋਲ ਹੀ ਦੋ ਵੱਖਰੇ ਵਿਕਲਪ (X ਜਾਂ Y) ਹਨ।", en: "True for the other 22 pairs, but the sex chromosomes are special: only the father has two different options (X or Y)." } }
          ],
          objective: { pa: "ਲਿੰਗ ਨਿਰਧਾਰਨ: ਮਨੁੱਖਾਂ ਵਿੱਚ 23 ਜੋੜੇ ਗੁਣਸੂਤਰ ਹੁੰਦੇ ਹਨ; 23ਵਾਂ ਜੋੜਾ ਲਿੰਗ ਗੁਣਸੂਤਰ ਹੈ। ਔਰਤ XX, ਮਰਦ XY। ਮਾਂ ਹਮੇਸ਼ਾ X ਦਿੰਦੀ ਹੈ; ਪਿਤਾ X ਜਾਂ Y — ਇਸ ਲਈ ਲਿੰਗ ਪਿਤਾ ਦੇ ਸ਼ੁਕਰਾਣੂ 'ਤੇ ਨਿਰਭਰ ਕਰਦਾ ਹੈ।", en: "Sex determination: humans have 23 pairs of chromosomes; the 23rd pair are the sex chromosomes. Female XX, male XY. The mother always gives X; the father gives X or Y — so the sex depends on the father's sperm." }
        },
        {

          prompt: { pa: "ਇੱਕ ਵਸਤੂ ਨੂੰ 10 cm ਫੋਕਸ ਦੂਰੀ ਵਾਲੇ ਅਵਤਲ ਦਰਪਣ ਤੋਂ 20 cm ਦੂਰ ਰੱਖਿਆ ਗਿਆ ਹੈ। ਪ੍ਰਤਿਬਿੰਬ ਕਿਹੋ ਜਿਹਾ ਬਣੇਗਾ?", en: "An object is placed 20 cm from a concave mirror of focal length 10 cm. What is the nature of the image?" },
          hint: { pa: "ਪਹਿਲਾਂ R = 2f ਕੱਢੋ ਅਤੇ ਦੇਖੋ ਕਿ ਵਸਤੂ ਕਿਸ ਖ਼ਾਸ ਬਿੰਦੂ (F, C, ਜਾਂ ਉਸ ਤੋਂ ਪਰੇ) 'ਤੇ ਬੈਠੀ ਹੈ — ਫਿਰ ਗਣਨਾ ਦੀ ਲੋੜ ਵੀ ਨਹੀਂ ਪਵੇਗੀ।", en: "First work out R = 2f and see which special point the object sits on (F, C, or beyond) — then you may not even need the calculation." },

            { t: { pa: "ਦਰਪਣ ਤੋਂ 20 cm ਦੂਰ, ਵਾਸਤਵਿਕ, ਉਲਟਾ ਅਤੇ ਵਸਤੂ ਦੇ ਬਰਾਬਰ ਆਕਾਰ ਦਾ", en: "At 20 cm from the mirror — real, inverted and the same size as the object" }, correct: true,
              r: { pa: "R = 2f = 20 cm, ਇਸ ਲਈ ਵਸਤੂ ਠੀਕ ਵਕ੍ਰਤਾ ਕੇਂਦਰ (C) 'ਤੇ ਹੈ। ਦਰਪਣ ਸੂਤਰ ਨਾਲ: 1/v = 1/f − 1/u = −1/10 + 1/20 = −1/20, ਯਾਨੀ v = −20 cm ਅਤੇ m = −v/u = −1। ਪ੍ਰਤਿਬਿੰਬ C 'ਤੇ ਹੀ, ਵਾਸਤਵਿਕ, ਉਲਟਾ, ਬਰਾਬਰ।", en: "R = 2f = 20 cm, so the object sits exactly at the centre of curvature (C). By the mirror formula 1/v = 1/f − 1/u = −1/10 + 1/20 = −1/20, so v = −20 cm and m = −v/u = −1. The image forms at C: real, inverted, same size." } },

        {

          prompt: { pa: "ਖ਼ਤਰੇ ਦੇ ਸੰਕੇਤ (ਜਿਵੇਂ ਲਾਲ ਬੱਤੀ ਤੇ ਰੁਕਣ ਦਾ ਸਿਗਨਲ) ਲਾਲ ਰੰਗ ਦੇ ਹੀ ਕਿਉਂ ਹੁੰਦੇ ਹਨ?", en: "Why are danger signals (such as stop lights) made red rather than any other colour?" },
          hint: { pa: "ਯਾਦ ਕਰੋ ਕਿ ਅਸਮਾਨ ਨੀਲਾ ਕਿਉਂ ਦਿਖਦਾ ਹੈ — ਫਿਰ ਉਹੀ ਨਿਯਮ ਉਲਟੇ ਸਿਰੇ ਵਾਲੇ ਰੰਗ 'ਤੇ ਲਗਾਓ।", en: "Recall why the sky looks blue — then apply the same rule to the colour at the opposite end of the spectrum." },
          trap: { pa: "'ਸਭ ਤੋਂ ਘੱਟ ਤਰੰਗ-ਲੰਬਾਈ' ਵਾਲਾ ਵਿਕਲਪ ਖ਼ਾਸ ਤੌਰ 'ਤੇ ਖ਼ਤਰਨਾਕ ਹੈ ਕਿਉਂਕਿ ਇਸ ਵਿੱਚ ਸਹੀ ਸ਼ਬਦ (ਤਰੰਗ-ਲੰਬਾਈ) ਵਰਤਿਆ ਗਿਆ ਹੈ ਪਰ ਦਿਸ਼ਾ ਉਲਟੀ ਹੈ। VIBGYOR ਯਾਦ ਰੱਖੋ: ਬੈਂਗਣੀ ਸਭ ਤੋਂ ਛੋਟੀ λ, ਲਾਲ ਸਭ ਤੋਂ ਵੱਡੀ।", en: "The 'shortest wavelength' option is especially dangerous because it uses the right technical word but reverses the direction. Remember VIBGYOR: violet shortest λ, red longest." },
          options: [

              r: { pa: "ਰੇਲੇ ਪ੍ਰਕੀਰਣਨ ਅਨੁਸਾਰ ਖਿੰਡਾਅ ∝ 1/λ⁴। ਲਾਲ ਦੀ λ ਸਭ ਤੋਂ ਵੱਡੀ ਹੋਣ ਕਰਕੇ ਇਹ ਧੁੰਦ ਤੇ ਧੂੰਏਂ ਵਿੱਚੋਂ ਵੀ ਲੰਘ ਜਾਂਦਾ ਹੈ ਅਤੇ ਦੂਰੋਂ ਸਾਫ਼ ਦਿਖਦਾ ਹੈ।", en: "By Rayleigh scattering, the amount scattered ∝ 1/λ⁴. Red has the largest λ, so it penetrates fog and smoke and remains clearly visible from far away." } },
            { t: { pa: "ਲਾਲ ਰੰਗ ਦੀ ਤਰੰਗ-ਲੰਬਾਈ ਸਭ ਤੋਂ ਘੱਟ ਹੈ", en: "Red has the shortest wavelength" }, correct: false,

          ],
          objective: { pa: "ਪ੍ਰਕਾਸ਼ ਦਾ ਖਿੰਡਾਅ (ਰੇਲੇ ਪ੍ਰਕੀਰਣਨ): ਖਿੰਡਾਅ ∝ 1/λ⁴। ਇਸੇ ਲਈ ਅਸਮਾਨ ਨੀਲਾ ਦਿਖਦਾ ਹੈ (ਨੀਲਾ ਵੱਧ ਖਿੰਡਦਾ ਹੈ), ਸੂਰਜ ਚੜ੍ਹਨ-ਲਹਿਣ ਵੇਲੇ ਲਾਲ ਦਿਖਦਾ ਹੈ, ਅਤੇ ਖ਼ਤਰੇ ਦੇ ਸੰਕੇਤ ਲਾਲ ਰੱਖੇ ਜਾਂਦੇ ਹਨ (ਲਾਲ ਸਭ ਤੋਂ ਘੱਟ ਖਿੰਡਦਾ ਹੈ)।", en: "Scattering of light (Rayleigh): scattering ∝ 1/λ⁴. This is why the sky looks blue (blue scatters most), why the sun looks red at sunrise and sunset, and why danger signals are red (red scatters least)." }

        {

        {

          hint: { pa: "1/α + 1/β ਨੂੰ ਇੱਕੋ ਭਿੰਨ ਵਿੱਚ ਲਿਖੋ — ਉੱਪਰ ਜੋੜ ਆਵੇਗਾ ਤੇ ਹੇਠਾਂ ਗੁਣਨਫਲ, ਜੋ ਦੋਵੇਂ ਤੁਸੀਂ ਗੁਣਾਂਕਾਂ ਤੋਂ ਸਿੱਧੇ ਕੱਢ ਸਕਦੇ ਹੋ।", en: "Combine 1/α + 1/β into a single fraction — the numerator is the sum and the denominator the product, both of which come straight from the coefficients." },
          trap: { pa: "6/5 ਸਭ ਤੋਂ ਆਮ ਗਲਤੀ ਹੈ: ਭਿੰਨ ਉਲਟੀ ਲਿਖ ਦੇਣਾ। ਹਮੇਸ਼ਾ ਪਹਿਲਾਂ (α+β)/(αβ) ਲਿਖੋ, ਫਿਰ ਮੁੱਲ ਭਰੋ — ਸਿੱਧਾ ਯਾਦ ਤੋਂ ਨਾ ਲਿਖੋ।", en: "6/5 is the classic slip: writing the fraction upside down. Always write (α+β)/(αβ) first and then substitute, rather than reciting it from memory." },
          options: [

          objective: { pa: "ਬਹੁਪਦ ax² + bx + c ਲਈ: ਸਿਫ਼ਰਾਂ ਦਾ ਜੋੜ α + β = −b/a ਅਤੇ ਗੁਣਨਫਲ αβ = c/a। ਇਹਨਾਂ ਦੋ ਸੰਬੰਧਾਂ ਨਾਲ ਸਿਫ਼ਰ ਕੱਢੇ ਬਿਨਾਂ ਹੀ 1/α + 1/β, α² + β² ਵਰਗੇ ਵਿਅੰਜਕ ਹੱਲ ਹੋ ਜਾਂਦੇ ਹਨ।", en: "For ax² + bx + c: sum of zeroes α + β = −b/a and product αβ = c/a. These two relations let you evaluate expressions like 1/α + 1/β or α² + β² without ever finding the zeroes." }

        {
          id: "MAT-CH3-02", ch: "Ch 3 · ਦੋ ਚਲਾਂ ਵਾਲੇ ਰੇਖੀ ਸਮੀਕਰਨ", competency: "Application", diff: "Hard",

        {

          prompt: { pa: "ਸਹੀ ਮੋਡਲ ਚੁਣੋ: \"He ______ swim across the river when he was only ten.\"", en: "Choose the correct modal: \"He ______ swim across the river when he was only ten.\"" },

        {
          id: "ENG-GR-15", ch: "Grammar · Subject-Verb Agreement", competency: "Analysis", diff: "Medium",
          prompt: { pa: "ਸਹੀ ਵਿਕਲਪ ਚੁਣੋ: \"One of the students ______ absent today.\"", en: "Choose the correct option: \"One of the students ______ absent today.\"" },

          trap: { pa: "'are' ਇਸ ਲਈ ਖਿੱਚਦਾ ਹੈ ਕਿਉਂਕਿ ਖ਼ਾਲੀ ਥਾਂ ਦੇ ਬਿਲਕੁਲ ਨਾਲ ਵਾਲਾ ਸ਼ਬਦ 'students' ਬਹੁਵਚਨ ਹੈ। ਇਮਤਿਹਾਨ ਇਹੀ ਧਿਆਨ-ਭਟਕਾਊ ਬਣਤਰ ਵਾਰ-ਵਾਰ ਵਰਤਦੇ ਹਨ — ਹਮੇਸ਼ਾ ਵਾਕਾਂਸ਼ ਹਟਾ ਕੇ ਜਾਂਚੋ।", en: "'Are' tempts because the word sitting right next to the blank, 'students', is plural. Exams reuse this distractor constantly — always strip out the phrase and re-check." },
          options: [
            { t: { pa: "is", en: "is" }, correct: true,
              r: { pa: "ਵਾਕ ਦਾ ਅਸਲ ਕਰਤਾ 'One' ਹੈ, ਜੋ ਇੱਕਵਚਨ ਹੈ। 'of the students' ਸਿਰਫ਼ ਸੰਬੰਧਕੀ ਵਾਕਾਂਸ਼ ਹੈ ਅਤੇ ਕ੍ਰਿਆ ਨੂੰ ਪ੍ਰਭਾਵਿਤ ਨਹੀਂ ਕਰਦਾ। 'today' ਵਰਤਮਾਨ ਕਾਲ ਦੱਸਦਾ ਹੈ।", en: "The real subject is 'One', which is singular. The phrase 'of the students' is merely prepositional and does not affect the verb. 'Today' fixes the tense as present." } },
            { t: { pa: "are", en: "are" }, correct: false,

            { t: { pa: "were", en: "were" }, correct: false,

        {

          hint: { pa: "if-ਵਾਲੇ ਹਿੱਸੇ ਦਾ ਕਾਲ ਦੇਖੋ — ਇੱਥੇ 'rains' Simple Present ਹੈ। ਹਰ ਕੰਡੀਸ਼ਨਲ ਵਿੱਚ ਦੋਵੇਂ ਹਿੱਸੇ ਜੋੜੇ ਵਿੱਚ ਚੱਲਦੇ ਹਨ।", en: "Look at the tense in the if-clause — here 'rains' is simple present. In every conditional the two halves move as a matched pair." },

          ],
          objective: { pa: "ਆਮ conditional patterns: ਪਹਿਲਾ (ਸੰਭਵ ਭਵਿੱਖ) — If + Simple Present, will + V1; ਦੂਜਾ (ਕਲਪਿਤ ਸਥਿਤੀ) — If + Simple Past, would + V1; ਤੀਜਾ (ਬੀਤੇ ਦੀ ਅਸੰਭਵ ਸਥਿਤੀ) — If + had + V3, would have + V3। ਨਤੀਜੇ ਵਾਲੇ ਹਿੱਸੇ ਵਿੱਚ ਸੰਦਰਭ ਅਨੁਸਾਰ ਹੋਰ modals ਵੀ ਆ ਸਕਦੇ ਹਨ।", en: "Common conditional patterns: first (possible future) — if + simple present, will + V1; second (unreal situation) — if + simple past, would + V1; third (unreal past) — if + had + V3, would have + V3. Other modals can appear in the result clause, depending on context." }
        },
        {

          trap: { pa: "'If' ਸ਼ਰਤ ਵਾਲਾ ਯੋਜਕ ਹੈ, ਪਰ 'If you work hard, you will not pass' ਮਿਹਨਤ ਦੇ ਬਾਵਜੂਦ ਫੇਲ੍ਹ ਹੋਣ ਦਾ ਵੱਖਰਾ ਭਾਵ ਦਿੰਦਾ ਹੈ। ਮੂਲ ਵਾਕ ਵਿੱਚ 'unless' ਦਾ ਭਾਵ 'if you do not work hard' ਹੈ।", en: "'If' is a conditional conjunction, but 'If you work hard, you will not pass' expresses a different meaning. Here, 'unless' means 'if you do not work hard'." },

            { t: { pa: "Because", en: "Because" }, correct: false,

            { t: { pa: "Although", en: "Although" }, correct: false,
              r: { pa: "'Although' ਵਿਰੋਧ ਦੱਸਦਾ ਹੈ — 'ਭਾਵੇਂ ਤੁਸੀਂ ਮਿਹਨਤ ਕਰੋ, ਫਿਰ ਵੀ ਪਾਸ ਨਹੀਂ ਹੋਵੋਗੇ', ਜੋ ਇੱਥੇ ਢੁਕਵਾਂ ਨਹੀਂ।", en: "'Although' signals contrast — 'even though you work hard, you will not pass' — which does not fit here." } }
          ],
          objective: { pa: "ਯੋਜਕਾਂ ਦੇ ਅਰਥ: unless = if not; if = ਸ਼ਰਤ; because/since = ਕਾਰਨ; although/though = ਵਿਰੋਧ; so that = ਮਕਸਦ; until/till = ਸਮਾਂ। 'If you do not study' ਅਤੇ 'Unless you study' ਆਮ ਤੌਰ 'ਤੇ ਇੱਕੋ ਸ਼ਰਤ ਦੱਸਦੇ ਹਨ।", en: "Conjunctions: unless = if not; if = condition; because/since = reason; although/though = contrast; so that = purpose; until/till = time. 'If you do not study' and 'Unless you study' usually express the same condition." }
        },
        {
          id: "ENG-GR-18", ch: "Grammar · Relative Clauses", competency: "Application", diff: "Easy",
          prompt: { pa: "ਸਹੀ ਸੰਬੰਧਵਾਚਕ ਸਰਵਨਾਮ ਚੁਣੋ: \"This is the boy ______ won the first prize.\"", en: "Choose the correct relative pronoun: \"This is the boy ______ won the first prize.\"" },
          hint: { pa: "ਦੋ ਗੱਲਾਂ ਪੁੱਛੋ: ਕੀ ਇਹ ਵਿਅਕਤੀ ਹੈ ਜਾਂ ਵਸਤੂ, ਅਤੇ ਕੀ ਉਹ ਕੰਮ ਕਰ ਰਿਹਾ ਹੈ (ਕਰਤਾ) ਜਾਂ ਉਸ ਉੱਤੇ ਕੰਮ ਹੋ ਰਿਹਾ ਹੈ (ਕਰਮ)?", en: "Ask two questions: is it a person or a thing, and is that person doing the action (subject) or receiving it (object)?" },
          trap: { pa: "'whom' ਇਸ ਲਈ ਫਸਾਉਂਦਾ ਹੈ ਕਿਉਂਕਿ ਇਹ ਵੱਧ ਰਸਮੀ ਤੇ 'ਸਹੀ' ਲੱਗਦਾ ਹੈ। ਪਰਖ ਦਾ ਤਰੀਕਾ: ਖ਼ਾਲੀ ਥਾਂ ਵਿੱਚ 'he' ਪਾ ਕੇ ਦੇਖੋ — 'he won the prize' ਸਹੀ ਬਣਦਾ ਹੈ, ਇਸ ਲਈ who ਆਵੇਗਾ (him ਹੁੰਦਾ ਤਾਂ whom)।", en: "'Whom' tempts because it sounds more formal and 'correct'. Test: substitute 'he' — 'he won the prize' works, so use who. If 'him' fitted, you would need whom." },
          options: [
            { t: { pa: "who", en: "who" }, correct: true,
              r: { pa: "'who' ਵਿਅਕਤੀਆਂ ਲਈ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ ਅਤੇ ਇੱਥੇ ਇਹ ਉਪਵਾਕ ਦੇ ਕਰਤਾ ਦਾ ਕੰਮ ਕਰ ਰਿਹਾ ਹੈ ('who won the prize')।", en: "'Who' is used for people and here it acts as the subject of the clause ('who won the prize')." } },
            { t: { pa: "which", en: "which" }, correct: false,
              r: { pa: "'which' ਵਸਤੂਆਂ ਅਤੇ ਜਾਨਵਰਾਂ ਲਈ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ, ਵਿਅਕਤੀਆਂ ਲਈ ਨਹੀਂ।", en: "'Which' is used for things and animals, not for people." } },
            { t: { pa: "whose", en: "whose" }, correct: false,
              r: { pa: "'whose' ਮਲਕੀਅਤ ਦੱਸਦਾ ਹੈ — 'the boy whose bag is red'। ਇੱਥੇ ਮਲਕੀਅਤ ਦੀ ਗੱਲ ਨਹੀਂ।", en: "'Whose' shows possession — 'the boy whose bag is red'. There is no possession here." } },
            { t: { pa: "whom", en: "whom" }, correct: false,
              r: { pa: "'whom' ਕਰਮ ਵਜੋਂ ਆਉਂਦਾ ਹੈ — 'the boy whom I met'। ਇੱਥੇ ਲੜਕਾ ਖ਼ੁਦ ਜਿੱਤਣ ਵਾਲਾ ਹੈ, ਯਾਨੀ ਕਰਤਾ।", en: "'Whom' functions as an object — 'the boy whom I met'. Here the boy is the one doing the winning, so he is the subject." } }
          ],
          objective: { pa: "ਸੰਬੰਧਵਾਚਕ ਸਰਵਨਾਮ: who — ਵਿਅਕਤੀ (ਕਰਤਾ); whom — ਵਿਅਕਤੀ (ਕਰਮ); whose — ਮਲਕੀਅਤ; which — ਵਸਤੂ ਤੇ ਜਾਨਵਰ; that — ਵਿਅਕਤੀ ਜਾਂ ਵਸਤੂ ਦੋਵਾਂ ਲਈ (ਸੀਮਿਤ ਕਰਨ ਵਾਲੇ ਉਪਵਾਕ ਵਿੱਚ)।", en: "Relative pronouns: who — person (subject); whom — person (object); whose — possession; which — things and animals; that — either people or things in a defining clause." }
        },
        {
          id: "ENG-VOC-04", ch: "Vocabulary · One-Word Substitution", competency: "Understanding", diff: "Medium",
          prompt: { pa: "ਹੇਠ ਲਿਖੇ ਲਈ ਇੱਕ ਸ਼ਬਦ ਚੁਣੋ: \"The life story of a person written by that person himself.\"", en: "Choose the one-word substitution: \"The life story of a person written by that person himself.\"" },
          hint: { pa: "ਅਗੇਤਰ 'auto-' ਦਾ ਅਰਥ ਸੋਚੋ, ਜਿਵੇਂ automatic ਜਾਂ automobile ਵਿੱਚ — ਇਹੀ ਸੁਰਾਗ਼ ਹੈ।", en: "Think about what the prefix 'auto-' means, as in automatic or automobile — that is the clue." },
          trap: { pa: "'Biography' ਸਭ ਤੋਂ ਵੱਧ ਚੁਣਿਆ ਜਾਣ ਵਾਲਾ ਗਲਤ ਜਵਾਬ ਹੈ ਕਿਉਂਕਿ ਇਹ ਲਗਭਗ ਸਹੀ ਹੈ — ਫ਼ਰਕ ਸਿਰਫ਼ ਇਹ ਹੈ ਕਿ ਲਿਖਣ ਵਾਲਾ ਕੌਣ ਹੈ। ਪ੍ਰਸ਼ਨ ਵਿੱਚ 'himself' ਵਰਗੇ ਸ਼ਬਦ ਹਮੇਸ਼ਾ ਹੇਠਾਂ ਲਕੀਰ ਖਿੱਚ ਕੇ ਪੜ੍ਹੋ।", en: "'Biography' is the most-chosen wrong answer because it is nearly right — the only difference is who does the writing. Always underline words like 'himself' in the prompt." },
          options: [
            { t: { pa: "Autobiography", en: "Autobiography" }, correct: true,
              r: { pa: "'Auto' ਦਾ ਅਰਥ ਹੈ 'ਆਪਣਾ/ਖ਼ੁਦ' ਅਤੇ 'biography' ਦਾ ਅਰਥ ਜੀਵਨੀ — ਇਸ ਲਈ ਆਪਣੇ ਹੱਥੀਂ ਲਿਖੀ ਆਪਣੀ ਜੀਵਨੀ।", en: "'Auto' means self and 'biography' means life story — hence a life story written by the person themselves." } },
            { t: { pa: "Biography", en: "Biography" }, correct: false,
              r: { pa: "ਜੀਵਨੀ ਕਿਸੇ ਹੋਰ ਵੱਲੋਂ ਲਿਖੀ ਜਾਂਦੀ ਹੈ; ਪ੍ਰਸ਼ਨ ਵਿੱਚ 'by that person himself' ਸਾਫ਼ ਲਿਖਿਆ ਹੈ।", en: "A biography is written by someone else; the question specifically says 'by that person himself'." } },
            { t: { pa: "Novel", en: "Novel" }, correct: false,
              r: { pa: "ਨਾਵਲ ਕਾਲਪਨਿਕ ਕਹਾਣੀ ਹੁੰਦੀ ਹੈ, ਸੱਚੀ ਜੀਵਨ-ਕਥਾ ਨਹੀਂ।", en: "A novel is a work of fiction, not a true life story." } },
            { t: { pa: "Diary", en: "Diary" }, correct: false,

          ],
          objective: { pa: "ਆਮ ਇੱਕ-ਸ਼ਬਦ ਬਦਲ: autobiography — ਆਪਣੀ ਲਿਖੀ ਜੀਵਨੀ; biography — ਕਿਸੇ ਹੋਰ ਦੀ ਲਿਖੀ ਜੀਵਨੀ; manuscript — ਹੱਥ-ਲਿਖਤ; illiterate — ਅਨਪੜ੍ਹ; orphan — ਅਨਾਥ; optimist — ਆਸ਼ਾਵਾਦੀ; atheist — ਨਾਸਤਿਕ।", en: "Common one-word substitutions: autobiography — life story written by oneself; biography — written by another; manuscript — a handwritten document; illiterate — unable to read or write; orphan — a child without parents; optimist — a hopeful person; atheist — one who does not believe in God." }
        },
        {
          id: "ENG-VOC-05", ch: "Vocabulary · Phrasal Verbs", competency: "Understanding", diff: "Medium",
          prompt: { pa: "ਸਹੀ ਵਾਕਾਂਸ਼ ਕ੍ਰਿਆ ਚੁਣੋ: \"The plane will ______ at six in the morning.\"", en: "Choose the correct phrasal verb: \"The plane will ______ at six in the morning.\"" },
          hint: { pa: "ਚਾਰੇ ਵਿਕਲਪਾਂ ਵਿੱਚ 'take' ਸਾਂਝਾ ਹੈ, ਇਸ ਲਈ ਅਸਲ ਅਰਥ ਦੂਜੇ ਸ਼ਬਦ ਤੋਂ ਆ ਰਿਹਾ ਹੈ। ਸੋਚੋ ਕਿ ਜਹਾਜ਼ ਜ਼ਮੀਨ ਤੋਂ ਕਿਸ ਦਿਸ਼ਾ ਵਿੱਚ ਜਾਂਦਾ ਹੈ।", en: "All four options share 'take', so the meaning comes entirely from the particle. Think about which direction a plane moves away from the ground." },
          trap: { pa: "ਵਾਕਾਂਸ਼ ਕ੍ਰਿਆਵਾਂ ਦਾ ਅਰਥ ਸ਼ਾਬਦਿਕ ਨਹੀਂ ਹੁੰਦਾ ਅਤੇ ਬਾਕੀ ਤਿੰਨੇ ਵੀ ਅਸਲੀ ਅੰਗਰੇਜ਼ੀ ਵਾਕਾਂਸ਼ ਕ੍ਰਿਆਵਾਂ ਹਨ — ਇਸੇ ਲਈ ਇਹ ਪ੍ਰਸ਼ਨ ਔਖਾ ਹੈ। ਇਹਨਾਂ ਨੂੰ ਵੱਖ-ਵੱਖ ਸ਼ਬਦਾਂ ਵਾਂਗ ਯਾਦ ਕਰਨਾ ਪੈਂਦਾ ਹੈ, ਅੰਦਾਜ਼ਾ ਨਹੀਂ ਲਗਾਇਆ ਜਾ ਸਕਦਾ।", en: "Phrasal verbs are not literal, and the other three are all genuine English phrasal verbs — which is what makes this hard. They must be memorised as separate vocabulary items, not guessed." },
          options: [
            { t: { pa: "take off", en: "take off" }, correct: true,
              r: { pa: "'take off' ਦਾ ਅਰਥ ਹੈ ਜ਼ਮੀਨ ਛੱਡ ਕੇ ਉੱਡਣਾ — ਹਵਾਈ ਜਹਾਜ਼ ਲਈ ਇਹੀ ਢੁਕਵੀਂ ਵਾਕਾਂਸ਼ ਕ੍ਰਿਆ ਹੈ।", en: "'Take off' means to leave the ground and begin flying — exactly the right phrasal verb for an aircraft." } },
            { t: { pa: "take in", en: "take in" }, correct: false,

            { t: { pa: "take over", en: "take over" }, correct: false,
              r: { pa: "'take over' ਦਾ ਅਰਥ ਹੈ ਕਿਸੇ ਦਾ ਕੰਮ ਜਾਂ ਕੰਟਰੋਲ ਸੰਭਾਲਣਾ।", en: "'Take over' means to assume control or responsibility from someone else." } },
            { t: { pa: "take after", en: "take after" }, correct: false,
              r: { pa: "'take after' ਦਾ ਅਰਥ ਹੈ ਕਿਸੇ ਨਾਲ ਮਿਲਦਾ-ਜੁਲਦਾ ਹੋਣਾ — 'She takes after her mother'।", en: "'Take after' means to resemble someone — 'She takes after her mother'." } }
          ],
          objective: { pa: "'take' ਵਾਲੀਆਂ ਆਮ ਵਾਕਾਂਸ਼ ਕ੍ਰਿਆਵਾਂ: take off — ਉੱਡਣਾ / ਕੱਪੜੇ ਉਤਾਰਨਾ; take in — ਸਮਝਣਾ ਜਾਂ ਧੋਖਾ ਦੇਣਾ; take over — ਕੰਟਰੋਲ ਸੰਭਾਲਣਾ; take after — ਮਿਲਦਾ-ਜੁਲਦਾ ਹੋਣਾ; take up — ਕੋਈ ਕੰਮ ਸ਼ੁਰੂ ਕਰਨਾ। ਸੰਬੰਧਕ ਬਦਲਣ ਨਾਲ ਪੂਰਾ ਅਰਥ ਬਦਲ ਜਾਂਦਾ ਹੈ।", en: "Common phrasal verbs with 'take': take off — to fly / to remove clothing; take in — to understand or to deceive; take over — to assume control; take after — to resemble; take up — to begin an activity. Changing the particle changes the whole meaning." }
        },
        {
          id: "ENG-COM-02", ch: "Comprehension · Details", competency: "Understanding", diff: "Medium",
          prompt: { pa: "\"Despite repeated warnings from his parents, Rohan kept riding his motorcycle without a helmet. Last Monday, his parents received a call from the hospital after he was injured in a collision on his way home.\" — ਪਹਿਰੇ ਅਨੁਸਾਰ ਸੋਮਵਾਰ ਨੂੰ ਰੋਹਨ ਨਾਲ ਕੀ ਵਾਪਰਿਆ?", en: "\"Despite repeated warnings from his parents, Rohan kept riding his motorcycle without a helmet. Last Monday, his parents received a call from the hospital after he was injured in a collision on his way home.\" — According to the passage, what happened to Rohan on Monday?" },
          hint: { pa: "ਆਖ਼ਰੀ ਵਾਕ ਵਿੱਚ ਹਸਪਤਾਲ ਦੀ ਕਾਲ ਅਤੇ ਟੱਕਰ ਦੇ ਵੇਰਵੇ ਨੂੰ ਜੋੜੋ।", en: "Connect the hospital call with the collision described in the final sentence." },

        {
          id: "ENG-COM-03", ch: "Comprehension", competency: "Analysis", diff: "Medium",
          prompt: { pa: "\"The old banyan tree in our village square has witnessed weddings, quarrels and festivals for over a hundred years. To cut it down would be to erase a living record of our shared past.\" — ਲੇਖਕ ਦਾ ਮੁੱਖ ਤਰਕ ਕੀ ਹੈ?", en: "\"The old banyan tree in our village square has witnessed weddings, quarrels and festivals for over a hundred years. To cut it down would be to erase a living record of our shared past.\" — What is the writer's main argument?" },
          hint: { pa: "ਪੁੱਛੋ ਕਿ ਲੇਖਕ ਪਾਠਕ ਨੂੰ ਕਿਸ ਗੱਲ ਲਈ ਰਾਜ਼ੀ ਕਰਨਾ ਚਾਹੁੰਦਾ ਹੈ — ਸਿਰਫ਼ ਜਾਣਕਾਰੀ ਦੇ ਰਿਹਾ ਹੈ ਜਾਂ ਕੋਈ ਪੱਖ ਲੈ ਰਿਹਾ ਹੈ?", en: "Ask what the writer wants the reader to accept — is the passage merely informing, or is it taking a side?" },
          trap: { pa: "'ਬੋਹੜ ਸੌ ਸਾਲ ਜਿਉਂਦੇ ਰਹਿੰਦੇ ਹਨ' ਸਭ ਤੋਂ ਵੱਡਾ ਫੰਦਾ ਹੈ ਕਿਉਂਕਿ ਇਹ ਪਹਿਰੇ ਵਿੱਚ ਸੱਚਮੁੱਚ ਲਿਖਿਆ ਹੈ। ਪਰ ਮੁੱਖ ਵਿਚਾਰ ਅਤੇ ਸਹਾਇਕ ਵੇਰਵੇ ਵਿੱਚ ਫ਼ਰਕ ਹੈ — ਸੱਚਾ ਹੋਣਾ ਕਾਫ਼ੀ ਨਹੀਂ, ਉਸਨੂੰ ਲੇਖਕ ਦਾ ਮਕਸਦ ਵੀ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ।", en: "'Banyans live a hundred years' is the biggest trap because the passage really does say it. But a main idea differs from a supporting detail — being true is not enough; it must also be the writer's purpose." },
          options: [
            { t: { pa: "ਰੁੱਖ ਨੂੰ ਬਚਾਇਆ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ ਕਿਉਂਕਿ ਇਹ ਪਿੰਡ ਦੇ ਸਾਂਝੇ ਇਤਿਹਾਸ ਦਾ ਹਿੱਸਾ ਹੈ", en: "The tree should be preserved because it is part of the village's shared history" }, correct: true,
              r: { pa: "ਲੇਖਕ ਰੁੱਖ ਨੂੰ 'ਸਾਡੇ ਸਾਂਝੇ ਅਤੀਤ ਦਾ ਜਿਉਂਦਾ ਰਿਕਾਰਡ' ਕਹਿੰਦਾ ਹੈ ਅਤੇ ਕੱਟਣ ਨੂੰ 'ਮਿਟਾ ਦੇਣਾ' — ਇਹ ਸਾਫ਼ ਤੌਰ 'ਤੇ ਸਾਂਭ-ਸੰਭਾਲ ਦੇ ਹੱਕ ਵਿੱਚ ਸੱਭਿਆਚਾਰਕ ਦਲੀਲ ਹੈ।", en: "The writer calls the tree 'a living record of our shared past' and describes cutting it as 'erasing' — a clear cultural argument for preservation." } },
            { t: { pa: "ਬੋਹੜ ਦੇ ਰੁੱਖ ਸੌ ਸਾਲ ਤੋਂ ਵੱਧ ਜਿਉਂਦੇ ਰਹਿੰਦੇ ਹਨ", en: "Banyan trees can live for more than a hundred years" }, correct: false,
              r: { pa: "ਇਹ ਪਹਿਰੇ ਵਿੱਚੋਂ ਲਿਆ ਗਿਆ ਇੱਕ ਤੱਥ ਤਾਂ ਹੈ, ਪਰ ਲੇਖਕ ਦਾ ਮੁੱਖ ਤਰਕ ਨਹੀਂ — ਇਹ ਸਿਰਫ਼ ਸਹਾਇਕ ਵੇਰਵਾ ਹੈ।", en: "This is a detail taken from the passage but not the writer's argument — it is only supporting information." } },
            { t: { pa: "ਪਿੰਡ ਦੇ ਚੌਕ ਨੂੰ ਮੁਰੰਮਤ ਦੀ ਲੋੜ ਹੈ", en: "The village square needs repair" }, correct: false,
              r: { pa: "ਚੌਕ ਦੀ ਮੁਰੰਮਤ ਦਾ ਪਹਿਰੇ ਵਿੱਚ ਕੋਈ ਜ਼ਿਕਰ ਨਹੀਂ।", en: "The passage says nothing about repairing the square." } },
            { t: { pa: "ਪਿੰਡ ਵਿੱਚ ਬਹੁਤ ਝਗੜੇ ਹੁੰਦੇ ਹਨ", en: "There are too many quarrels in the village" }, correct: false,
              r: { pa: "'quarrels' ਸਿਰਫ਼ ਉਹਨਾਂ ਘਟਨਾਵਾਂ ਦੀ ਸੂਚੀ ਵਿੱਚ ਆਇਆ ਹੈ ਜੋ ਰੁੱਖ ਨੇ ਦੇਖੀਆਂ; ਇਹ ਲੇਖਕ ਦੀ ਸ਼ਿਕਾਇਤ ਨਹੀਂ।", en: "'Quarrels' appears only in the list of events the tree has witnessed; it is not the writer's complaint." } }
          ],
          objective: { pa: "ਮੁੱਖ ਵਿਚਾਰ ਪਛਾਣਨਾ: ਲੇਖਕ ਜੋ ਸਿੱਧ ਕਰਨਾ ਚਾਹੁੰਦਾ ਹੈ ਉਹ ਮੁੱਖ ਵਿਚਾਰ ਹੈ; ਬਾਕੀ ਤੱਥ ਸਿਰਫ਼ ਉਸਦਾ ਸਮਰਥਨ ਕਰਦੇ ਹਨ। ਪੁੱਛੋ: 'ਲੇਖਕ ਇਹ ਪਹਿਰਾ ਕਿਉਂ ਲਿਖ ਰਿਹਾ ਹੈ?' — ਜਵਾਬ ਹੀ ਮੁੱਖ ਵਿਚਾਰ ਹੈ।", en: "Identifying the main idea: what the writer is trying to establish is the main idea; the remaining facts merely support it. Ask 'why did the writer write this?' — the answer is the main idea." }
        },
        {
          id: "ENG-GR-19", ch: "Grammar · Tenses", competency: "Application", diff: "Easy",
          prompt: { pa: "ਸਹੀ ਕਿਰਿਆ ਚੁਣੋ: \"We ______ dinner when the lights went out and interrupted our meal.\"", en: "Choose the correct verb: \"We ______ dinner when the lights went out and interrupted our meal.\"" },
          hint: { pa: "ਬੱਤੀਆਂ ਜਾਣ ਨਾਲ ਖਾਣਾ ਰੁਕ ਗਿਆ; ਉਸ ਤੋਂ ਪਹਿਲਾਂ ਖਾਣ ਦੀ ਕਿਰਿਆ ਜਾਰੀ ਸੀ।", en: "The lights going out interrupted the meal, so the action of eating was already in progress." },
          trap: { pa: "'Had' ਸਧਾਰਨ ਭੂਤ ਕਾਲ ਹੈ; ਇੱਥੇ ਵਾਕ ਸਾਫ਼ ਦੱਸਦਾ ਹੈ ਕਿ ਖਾਣਾ ਖਾਂਦੇ ਸਮੇਂ ਕਿਰਿਆ ਵਿੱਚ ਵਿਘਨ ਪਿਆ।", en: "'Had' is simple past; the sentence makes clear that an ongoing meal was interrupted." },
          options: [
            { t: { pa: "were having", en: "were having" }, correct: true, r: { pa: "'We' ਨਾਲ 'were' ਅਤੇ ਜਾਰੀ ਕਿਰਿਆ ਲਈ ਕਿਰਿਆ + ing ਆਉਂਦਾ ਹੈ।", en: "'We' takes 'were', and the action in progress takes verb + ing." } },
            { t: { pa: "had", en: "had" }, correct: false, r: { pa: "'Had' ਜਾਰੀ ਕਿਰਿਆ ਨਹੀਂ ਦੱਸਦਾ; ਵਾਕ ਵਿੱਚ ਉਸ ਸਮੇਂ ਚੱਲ ਰਹੀ ਕਿਰਿਆ ਚਾਹੀਦੀ ਹੈ।", en: "'Had' does not show an action in progress; the sentence needs the action that was happening then." } },
            { t: { pa: "are having", en: "are having" }, correct: false, r: { pa: "'Went out' ਭੂਤ ਕਾਲ ਹੈ; ਇੱਥੇ ਵਰਤਮਾਨ ਕਾਲ ਠੀਕ ਨਹੀਂ।", en: "'Went out' is in the past, so the present tense does not fit." } },
            { t: { pa: "have had", en: "have had" }, correct: false, r: { pa: "Present perfect ਇੱਥੇ ਬੀਤੇ ਸਮੇਂ ਦੀ 'when' ਘਟਨਾ ਨਾਲ ਨਹੀਂ ਮਿਲਦਾ।", en: "The present perfect does not fit this past-time 'when' event." } }
          ],
          objective: { pa: "Past continuous: was/were + ਕਿਰਿਆ-ing। ਭੂਤ ਵਿੱਚ ਜਾਰੀ ਕਿਰਿਆ ਲਈ, ਅਕਸਰ ਜਦੋਂ ਕੋਈ ਹੋਰ ਘਟਨਾ ਵਾਪਰੇ: We were eating when the bell rang.", en: "Past continuous: was/were + verb-ing. Use it for an action in progress in the past, often when another event happened: We were eating when the bell rang." }
        },
        {
          id: "ENG-GR-20", ch: "Grammar · Articles", competency: "Application", diff: "Easy",
          prompt: { pa: "ਸਹੀ article ਚੁਣੋ: \"Ravi wants to be ______ engineer.\"", en: "Choose the correct article: \"Ravi wants to be ______ engineer.\"" },
