<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BOLO.MCQ — PSEB Class 10 Question Engine</title>
<!-- Google Analytics (GA4) — shared loader, see assets/analytics.js -->
<script src="assets/analytics.js"></script>
<meta name="description" content="Bilingual Punjabi-English MCQ practice engine for PSEB Class 10 — 44 board-pattern questions across Science, Math and English with rationales, difficulty tags, flagging and performance analytics.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<style>
  :root {
    --bg-void: #000000;
    --text-bold: #ffffff;
    --text-dim: #8e9bb0;
    --panel: rgba(18, 18, 22, 0.94);
    --border: rgba(255, 255, 255, 0.08);
    --accent: #00e5ff;
    --green: #2ecc71;
    --red: #ff4d6d;
    --amber: #ffaa00;
    --fluid-curve: cubic-bezier(0.16, 1, 0.3, 1);
    --font-gurmukhi: 'Noto Sans Gurmukhi', 'Mukta Mahee', 'Gurmukhi Sangam MN', 'Nirmala UI', 'Raavi', 'Lohit Gurmukhi', sans-serif;
  }
  /* CLASSIC = light colorway matching the lecture decks (legacy palette). */
  body[data-theme="CLASSIC"] {
    --bg-void: #f8fbff;
    --text-bold: #182437;
    --text-dim: #5c6f86;
    --panel: rgba(255, 255, 255, 0.92);
    --border: rgba(11, 74, 168, 0.14);
    --green: #179c65;
    --red: #c73a2e;
    --amber: #f26a21;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg-void); }
  body {
    min-height: 100vh;
    background: var(--bg-void);
    color: var(--text-bold);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, var(--font-gurmukhi);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body::before {
    content: '';
    position: fixed;
    inset: -5%;
    z-index: -3;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.035;
  }
  .aura-bleed {
    position: fixed;
    top: -20vh;
    left: 50%;
    z-index: -2;
    width: 130vw;
    height: 90vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0, 140, 255, 0.14) 0%, rgba(0, 110, 255, 0.05) 40%, transparent 72%);
    pointer-events: none;
    transition: background 0.9s var(--fluid-curve);
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 10%, rgba(0, 0, 0, 0.94) 100%);
  }

  /* Page transition veil — matches the menu and the lecture decks so moving
     between them is one continuous dissolve instead of a hard cut. */
  .page-veil {
    position: fixed;
    inset: 0;
    z-index: 99999;
    pointer-events: none;
    background: var(--bg-void);
    opacity: 1;
    animation: veilFadeOut 420ms var(--fluid-curve) forwards;
  }
  /* Safety net: the inline script adds .page-entered shortly after load, so
     the veil can never stay up if the arrival animation never ran. */
  body.page-entered .page-veil { animation: none; opacity: 0; visibility: hidden; }
  body.page-leaving .page-veil { animation: veilFadeIn 300ms var(--fluid-curve) forwards; opacity: 1; visibility: visible; }
  @keyframes veilFadeOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
  @keyframes veilFadeIn { from { opacity: 0; visibility: visible; } to { opacity: 1; visibility: visible; } }
  @media (prefers-reduced-motion: reduce) {
    .page-veil { animation-duration: 160ms; }
    body.page-leaving .page-veil { animation-duration: 140ms; }
  }

  button { border: 0; font: inherit; color: inherit; background: none; cursor: pointer; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }

  /* ---------- Header ---------- */
  .mcq-header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 22px;
    padding: max(18px, env(safe-area-inset-top)) clamp(16px, 4vw, 44px) 16px;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.78) 78%, transparent 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .header-logo {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    color: var(--text-bold);
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 2px;
    text-decoration: none;
    white-space: nowrap;
  }
  .header-logo .dot-mode { color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); transition: color 0.5s var(--fluid-curve), text-shadow 0.5s var(--fluid-curve); }
  .home-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.3s var(--fluid-curve);
  }
  .home-pill:hover { color: #fff; border-color: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }

  .router {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
  }
  .router-btn {
    padding: 8px 14px;
    border-radius: 999px;
    color: var(--text-dim);
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    transition: all 0.3s var(--fluid-curve);
  }
  .router-btn:hover { color: #fff; }
  .router-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12); }

  .header-spacer { flex: 1; }
  .score-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 15px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    font-size: 0.64rem;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .score-pill strong { color: var(--accent); font-variant-numeric: tabular-nums; transition: color 0.4s; }
  /* Exam mode hides the live score; the class rule would otherwise beat [hidden]. */
  .score-pill[hidden] { display: none; }
  .theme-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    transition: all 0.3s var(--fluid-curve);
  }
  .theme-pill:hover { color: #fff; border-color: color-mix(in srgb, var(--accent) 55%, transparent); transform: translateY(-1px); }

  /* ---------- Stage ---------- */
  .stage {
    width: min(94vw, 860px);
    margin: clamp(8px, 2vh, 26px) auto clamp(60px, 8vh, 90px);
    animation: riseIn 0.7s var(--fluid-curve);
  }
  @keyframes riseIn { 0% { opacity: 0; transform: translateY(26px) scale(0.97); filter: blur(8px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

  .progress-track { display: flex; gap: 5px; margin-bottom: 20px; }
  .progress-seg { flex: 1; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); transition: background 0.45s var(--fluid-curve), box-shadow 0.45s; }
  .progress-seg.seen-correct { background: var(--green); box-shadow: 0 0 8px color-mix(in srgb, var(--green) 60%, transparent); }
  .progress-seg.seen-wrong { background: var(--red); box-shadow: 0 0 8px color-mix(in srgb, var(--red) 55%, transparent); }
  .progress-seg.current { background: var(--accent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }
  /* Exam mode: an answered question is marked as "recorded", never graded. */
  .progress-seg.answered { background: color-mix(in srgb, var(--accent) 55%, transparent); }

  .q-card {
    position: relative;
    padding: clamp(20px, 4.5vw, 34px);
    border: 1px solid var(--border);
    border-top: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 26px;
    background: var(--panel);
    box-shadow: 0 34px 80px rgba(0, 0, 0, 0.85), 0 0 60px -30px var(--accent), inset 0 1px 1px rgba(255, 255, 255, 0.06);
    transition: border-color 0.5s var(--fluid-curve), box-shadow 0.5s var(--fluid-curve);
  }
  .q-card.swap { animation: riseIn 0.5s var(--fluid-curve); }

  .q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
  .meta-rune {
    padding: 6px 12px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-dim);
    font-family: var(--font-gurmukhi);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .meta-rune.hot { border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); }
  .lang-flip {
    margin-left: auto;
    padding: 7px 13px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-dim);
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 1.4px;
    transition: all 0.3s var(--fluid-curve);
  }
  .lang-flip:hover { color: #fff; border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

  .q-prompt {
    font-family: var(--font-gurmukhi);
    font-size: clamp(1.04rem, 3.4vw, 1.28rem);
    font-weight: 700;
    line-height: 1.65;
    margin-bottom: 8px;
  }
  .q-prompt-sub {
    color: var(--text-dim);
    font-size: clamp(0.8rem, 2.6vw, 0.9rem);
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .option-row { display: flex; align-items: stretch; gap: 9px; margin-bottom: 10px; }
  .strike-btn {
    flex: none;
    width: 42px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 900;
    transition: all 0.3s var(--fluid-curve);
  }
  .strike-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
  .strike-btn.active { border-color: color-mix(in srgb, var(--red) 40%, transparent); background: color-mix(in srgb, var(--red) 10%, transparent); color: var(--red); }

  .option {
    flex: 1;
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 13px;
    min-height: 54px;
    padding: 14px 17px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.025);
    text-align: left;
    transition: all 0.35s var(--fluid-curve);
    overflow: hidden;
  }
  .option:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.06); transform: translateX(3px); }
  .option:disabled { cursor: default; }
  .opt-letter { flex: none; padding-top: 1px; color: var(--text-dim); font-size: 0.95rem; font-weight: 900; font-variant-numeric: tabular-nums; transition: color 0.4s; }
  .opt-text { font-family: var(--font-gurmukhi); font-size: clamp(0.86rem, 2.8vw, 0.98rem); font-weight: 600; line-height: 1.55; }
  .opt-sub { display: block; margin-top: 3px; color: var(--text-dim); font-size: 0.74rem; font-weight: 600; }

  .option-row.struck .option { opacity: 0.3; }
  .option-row.struck .opt-text { text-decoration: line-through; }

  .option.correct { border-color: color-mix(in srgb, var(--green) 65%, transparent); background: color-mix(in srgb, var(--green) 9%, transparent); box-shadow: 0 0 26px -8px var(--green); }
  .option.correct .opt-letter { color: var(--green); }
  .option.incorrect { border-color: color-mix(in srgb, var(--red) 65%, transparent); background: color-mix(in srgb, var(--red) 9%, transparent); box-shadow: 0 0 26px -8px var(--red); animation: shake 0.4s var(--fluid-curve); }
  .option.incorrect .opt-letter { color: var(--red); }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* ---------- Feedback ---------- */
  .feedback { margin-top: 22px; animation: riseIn 0.5s var(--fluid-curve); }
  .verdict { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-family: var(--font-gurmukhi); font-size: 1rem; font-weight: 900; letter-spacing: 0.4px; }
  .verdict.good { color: var(--green); text-shadow: 0 0 18px color-mix(in srgb, var(--green) 45%, transparent); }
  .verdict.bad { color: var(--red); text-shadow: 0 0 18px color-mix(in srgb, var(--red) 45%, transparent); }

  .rationale {
    margin-bottom: 8px;
    padding: 11px 15px;
    border-left: 3px solid rgba(255, 255, 255, 0.1);
    border-radius: 0 11px 11px 0;
    background: rgba(255, 255, 255, 0.02);
    color: #cbd5e1;
    font-family: var(--font-gurmukhi);
    font-size: 0.84rem;
    font-weight: 600;
    line-height: 1.65;
  }
  .rationale strong { color: #fff; }
  .rationale.good { border-left-color: var(--green); background: color-mix(in srgb, var(--green) 5%, transparent); }
  .rationale.bad { border-left-color: var(--red); background: color-mix(in srgb, var(--red) 5%, transparent); }

  .objective {
    margin-top: 16px;
    padding: 16px 18px;
    border-left: 4px solid var(--accent);
    border-radius: 0 13px 13px 0;
    background: color-mix(in srgb, var(--accent) 5%, transparent);
  }
  .objective-title { margin-bottom: 6px; color: var(--accent); font-size: 0.6rem; font-weight: 900; letter-spacing: 1.8px; text-transform: uppercase; }
  .objective-body { font-family: var(--font-gurmukhi); font-size: 0.86rem; font-weight: 600; line-height: 1.7; color: #e6edf5; }

  .action-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .q-counter { color: var(--text-dim); font-size: 0.66rem; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .btn-next {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 46px;
    padding: 12px 24px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 13px;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    color: #fff;
    font-family: var(--font-gurmukhi);
    font-size: 0.84rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    transition: all 0.3s var(--fluid-curve);
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 26px -10px var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .btn-next:disabled { opacity: 0.3; cursor: default; transform: none; box-shadow: none; }

  /* ---------- Summary ---------- */
  .summary { text-align: center; padding: clamp(10px, 3vw, 24px) 0; }
  .summary-orb {
    position: relative;
    width: 128px;
    height: 128px;
    margin: 6px auto 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #ffffff 0%, #f2feff 12%, #b6f4ff 28%, #6fdcff 46%, rgba(40, 160, 250, 0.55) 68%, rgba(16, 110, 225, 0) 100%);
    box-shadow: 0 0 48px rgba(90, 210, 255, 0.4), 0 0 110px rgba(0, 150, 255, 0.28);
    animation: orbBreathe 3s ease-in-out infinite;
  }
  @keyframes orbBreathe { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.05); filter: brightness(1.15); } }
  .summary-score { display: flex; align-items: center; justify-content: center; position: absolute; inset: 0; color: #013; font-size: 1.7rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .summary h2 { font-family: var(--font-gurmukhi); font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 900; margin-bottom: 8px; }
  .summary p { color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.92rem; font-weight: 600; line-height: 1.7; max-width: 460px; margin: 0 auto 24px; }
  .summary-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

  /* ---------- v1.1 — difficulty, flag, navigator, breakdowns ---------- */
  .meta-rune.diff-easy { border-color: color-mix(in srgb, var(--green) 30%, transparent); color: var(--green); }
  .meta-rune.diff-medium { border-color: color-mix(in srgb, var(--amber) 30%, transparent); color: var(--amber); }
  .meta-rune.diff-hard { border-color: color-mix(in srgb, var(--red) 30%, transparent); color: var(--red); }

  .flag-btn {
    padding: 6px 11px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-size: 0.66rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    transition: all 0.3s var(--fluid-curve);
  }
  .flag-btn:hover { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
  .flag-btn.active { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 60%, transparent); background: color-mix(in srgb, var(--amber) 10%, transparent); }

  .progress-seg { border: 0; padding: 0; cursor: pointer; }
  .progress-seg:hover { box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 55%, transparent); }
  .progress-seg.flagged { outline: 1.5px solid var(--amber); outline-offset: 1.5px; }

  .btn-prev {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 46px;
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-family: var(--font-gurmukhi);
    font-size: 0.78rem;
    font-weight: 800;
    transition: all 0.3s var(--fluid-curve);
  }
  .btn-prev:hover:not(:disabled) { color: var(--text-bold); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
  .btn-prev:disabled { opacity: 0.25; cursor: default; }
  .results-link {
    padding: 7px 13px;
    border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    border-radius: 999px;
    background: color-mix(in srgb, var(--amber) 8%, transparent);
    color: var(--amber);
    font-family: var(--font-gurmukhi);
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    transition: all 0.3s var(--fluid-curve);
  }
  .results-link:hover { background: color-mix(in srgb, var(--amber) 16%, transparent); transform: translateY(-1px); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto 26px; }
  .stat-box { padding: 14px 10px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255, 255, 255, 0.02); text-align: center; }
  .stat-num { display: block; color: var(--accent); font-size: 1.15rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stat-label { display: block; margin-top: 4px; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.56rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }

  .break-section { max-width: 620px; margin: 26px auto 0; text-align: left; }
  .break-title { margin-bottom: 12px; color: var(--accent); font-family: var(--font-gurmukhi); font-size: 0.62rem; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase; }
  .break-row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
  .break-name { flex: 0 0 42%; overflow: hidden; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.72rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .break-bar { flex: 1; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
  .break-fill { height: 100%; border-radius: 99px; background: var(--green); transition: width 0.8s var(--fluid-curve); }
  .break-fill.low { background: var(--red); }
  .break-fill.mid { background: var(--amber); }
  .break-score { flex: none; min-width: 44px; color: var(--text-dim); font-size: 0.68rem; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }

  .review-list { display: flex; flex-direction: column; gap: 6px; max-width: 620px; margin: 14px auto 0; text-align: left; }
  .review-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.02);
    font-family: var(--font-gurmukhi);
    text-align: left;
    transition: all 0.3s var(--fluid-curve);
  }
  .review-item:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: rgba(255, 255, 255, 0.05); transform: translateX(3px); }

            { t: { pa: "ਜ਼ਾਈਲਮ ਦੋਵੇਂ ਦਿਸ਼ਾਵਾਂ ਵਿੱਚ ਪਾਣੀ ਲਿਜਾਂਦਾ ਹੈ ਅਤੇ ਇਸ ਲਈ ATP ਖ਼ਰਚਦਾ ਹੈ", en: "Xylem carries water in both directions and spends ATP to do it" }, correct: false,

          ],
          objective: { pa: "ਪੌਦਿਆਂ ਵਿੱਚ ਪਰਿਵਹਨ: ਜ਼ਾਈਲਮ — ਪਾਣੀ ਤੇ ਖਣਿਜ, ਇੱਕ-ਦਿਸ਼ਾਵੀ (ਉੱਪਰ), ਵਾਸ਼ਪ-ਉਤਸਰਜਨ ਖਿੱਚ, ਊਰਜਾ ਨਹੀਂ ਲੱਗਦੀ। ਫਲੋਇਮ — ਭੋਜਨ (ਸਥਾਨਾਂਤਰਨ), ਦੋ-ਦਿਸ਼ਾਵੀ, ATP ਲੱਗਦੀ ਹੈ।", en: "Transport in plants: xylem — water and minerals, one-way (upward), driven by transpiration pull, needs no energy. Phloem — food (translocation), two-way, requires ATP." }
        },
        {
          id: "SCI-CH6B-02", ch: "Ch 6 · ਕੰਟਰੋਲ ਅਤੇ ਤਾਲਮੇਲ", competency: "Application", diff: "Medium",

        {

          hint: { pa: "ਹਰ ਮਾਪੇ ਦਾ ਗੁਣਸੂਤਰ ਜੋੜਾ ਲਿਖੋ (XX ਜਾਂ XY) ਤੇ ਪੁੱਛੋ ਕਿ ਕਿਸ ਕੋਲ ਦੇਣ ਲਈ ਦੋ ਵੱਖਰੇ ਵਿਕਲਪ ਹਨ।", en: "Write down each parent's pair (XX or XY) and ask which of them has two different options to pass on." },

          options: [

        {

            { t: { pa: "ਦਰਪਣ ਤੋਂ 20 cm ਦੂਰ, ਵਾਸਤਵਿਕ, ਉਲਟਾ ਅਤੇ ਵਸਤੂ ਦੇ ਬਰਾਬਰ ਆਕਾਰ ਦਾ", en: "At 20 cm from the mirror — real, inverted and the same size as the object" }, correct: true,
              r: { pa: "R = 2f = 20 cm, ਇਸ ਲਈ ਵਸਤੂ ਠੀਕ ਵਕ੍ਰਤਾ ਕੇਂਦਰ (C) 'ਤੇ ਹੈ। ਦਰਪਣ ਸੂਤਰ ਨਾਲ: 1/v = 1/f − 1/u = −1/10 + 1/20 = −1/20, ਯਾਨੀ v = −20 cm ਅਤੇ m = −v/u = −1। ਪ੍ਰਤਿਬਿੰਬ C 'ਤੇ ਹੀ, ਵਾਸਤਵਿਕ, ਉਲਟਾ, ਬਰਾਬਰ।", en: "R = 2f = 20 cm, so the object sits exactly at the centre of curvature (C). By the mirror formula 1/v = 1/f − 1/u = −1/10 + 1/20 = −1/20, so v = −20 cm and m = −v/u = −1. The image forms at C: real, inverted, same size." } },

            { t: { pa: "C ਤੋਂ ਪਰੇ, ਵਾਸਤਵਿਕ ਅਤੇ ਵੱਡਾ", en: "Beyond C — real and magnified" }, correct: false,

          prompt: { pa: "50 cm ਫੋਕਸ ਦੂਰੀ ਵਾਲੇ ਉੱਤਲ ਲੈੱਨਜ਼ ਦੀ ਸਮਰੱਥਾ (power) ਕੀ ਹੈ?", en: "What is the power of a convex lens whose focal length is 50 cm?" },

            { t: { pa: "−2 D", en: "−2 D" }, correct: false,

            { t: { pa: "+50 D", en: "+50 D" }, correct: false,

          ],
          objective: { pa: "ਲੈੱਨਜ਼ ਦੀ ਸਮਰੱਥਾ P = 1/f (f ਮੀਟਰ ਵਿੱਚ), ਇਕਾਈ ਡਾਇਆਪਟਰ (D)। ਉੱਤਲ ਲੈੱਨਜ਼ → ਧਨਾਤਮਕ P; ਅਵਤਲ ਲੈੱਨਜ਼ → ਰਿਣਾਤਮਕ P। ਸੰਪਰਕ ਵਿੱਚ ਰੱਖੇ ਲੈੱਨਜ਼ਾਂ ਦੀ ਕੁੱਲ ਸਮਰੱਥਾ ਜੁੜ ਜਾਂਦੀ ਹੈ।", en: "Power of a lens P = 1/f with f in metres, measured in dioptres (D). Convex lens → positive P; concave lens → negative P. Powers of lenses in contact simply add." }

        {

          prompt: { pa: "ਖ਼ਤਰੇ ਦੇ ਸੰਕੇਤ (ਜਿਵੇਂ ਲਾਲ ਬੱਤੀ ਤੇ ਰੁਕਣ ਦਾ ਸਿਗਨਲ) ਲਾਲ ਰੰਗ ਦੇ ਹੀ ਕਿਉਂ ਹੁੰਦੇ ਹਨ?", en: "Why are danger signals (such as stop lights) made red rather than any other colour?" },
          hint: { pa: "ਯਾਦ ਕਰੋ ਕਿ ਅਸਮਾਨ ਨੀਲਾ ਕਿਉਂ ਦਿਖਦਾ ਹੈ — ਫਿਰ ਉਹੀ ਨਿਯਮ ਉਲਟੇ ਸਿਰੇ ਵਾਲੇ ਰੰਗ 'ਤੇ ਲਗਾਓ।", en: "Recall why the sky looks blue — then apply the same rule to the colour at the opposite end of the spectrum." },
          trap: { pa: "'ਸਭ ਤੋਂ ਘੱਟ ਤਰੰਗ-ਲੰਬਾਈ' ਵਾਲਾ ਵਿਕਲਪ ਖ਼ਾਸ ਤੌਰ 'ਤੇ ਖ਼ਤਰਨਾਕ ਹੈ ਕਿਉਂਕਿ ਇਸ ਵਿੱਚ ਸਹੀ ਸ਼ਬਦ (ਤਰੰਗ-ਲੰਬਾਈ) ਵਰਤਿਆ ਗਿਆ ਹੈ ਪਰ ਦਿਸ਼ਾ ਉਲਟੀ ਹੈ। VIBGYOR ਯਾਦ ਰੱਖੋ: ਬੈਂਗਣੀ ਸਭ ਤੋਂ ਛੋਟੀ λ, ਲਾਲ ਸਭ ਤੋਂ ਵੱਡੀ।", en: "The 'shortest wavelength' option is especially dangerous because it uses the right technical word but reverses the direction. Remember VIBGYOR: violet shortest λ, red longest." },
          options: [
            { t: { pa: "ਲਾਲ ਰੰਗ ਦੀ ਤਰੰਗ-ਲੰਬਾਈ ਸਭ ਤੋਂ ਵੱਧ ਹੈ, ਇਸ ਲਈ ਇਹ ਸਭ ਤੋਂ ਘੱਟ ਖਿੰਡਦਾ ਹੈ ਤੇ ਦੂਰੋਂ ਦਿਖਦਾ ਹੈ", en: "Red has the longest wavelength, so it is scattered least and stays visible from the greatest distance" }, correct: true,
              r: { pa: "ਰੇਲੇ ਪ੍ਰਕੀਰਣਨ ਅਨੁਸਾਰ ਖਿੰਡਾਅ ∝ 1/λ⁴। ਲਾਲ ਦੀ λ ਸਭ ਤੋਂ ਵੱਡੀ ਹੋਣ ਕਰਕੇ ਇਹ ਧੁੰਦ ਤੇ ਧੂੰਏਂ ਵਿੱਚੋਂ ਵੀ ਲੰਘ ਜਾਂਦਾ ਹੈ ਅਤੇ ਦੂਰੋਂ ਸਾਫ਼ ਦਿਖਦਾ ਹੈ।", en: "By Rayleigh scattering, the amount scattered ∝ 1/λ⁴. Red has the largest λ, so it penetrates fog and smoke and remains clearly visible from far away." } },
            { t: { pa: "ਲਾਲ ਰੰਗ ਦੀ ਤਰੰਗ-ਲੰਬਾਈ ਸਭ ਤੋਂ ਘੱਟ ਹੈ", en: "Red has the shortest wavelength" }, correct: false,

            { t: { pa: "ਲਾਲ ਰੰਗ ਅੱਖ ਨੂੰ ਸਭ ਤੋਂ ਵੱਧ ਗਰਮੀ ਦਿੰਦਾ ਹੈ", en: "Red delivers the most heat to the eye" }, correct: false,

            { t: { pa: "ਲਾਲ ਰੰਗ ਹਵਾ ਵਿੱਚ ਸਭ ਤੋਂ ਤੇਜ਼ ਚੱਲਦਾ ਹੈ", en: "Red travels fastest through air" }, correct: false,

        {

          prompt: { pa: "3 cm ਅਰਧ-ਵਿਆਸ ਵਾਲੇ ਇੱਕ ਠੋਸ ਗੋਲੇ ਨੂੰ ਪਿਘਲਾ ਕੇ 3 cm ਅਰਧ-ਵਿਆਸ ਵਾਲਾ ਬੇਲਨ (cylinder) ਬਣਾਇਆ ਗਿਆ। ਬੇਲਨ ਦੀ ਉਚਾਈ ਕਿੰਨੀ ਹੋਵੇਗੀ?", en: "A solid sphere of radius 3 cm is melted and recast into a cylinder of radius 3 cm. What is the height of the cylinder?" },

          hint: { pa: "'Although' ਵਿਰੋਧ ਦਾ ਸੰਕੇਤ ਦਿੰਦਾ ਹੈ — ਅਸਲ ਗੱਲ ਦੂਜੇ ਹਿੱਸੇ ਵਿੱਚ ਹੈ।", en: "'Although' sets up a contrast — the real point is in the second half of the sentence." },
          trap: { pa: "'ਮੀਂਹ ਨੇ ਬਿਜਾਈ ਰੋਕ ਦਿੱਤੀ' ਉਦੋਂ ਚੁਣਿਆ ਜਾਂਦਾ ਹੈ ਜਦੋਂ ਸਿਰਫ਼ ਪਹਿਲਾ ਅੱਧ ਪੜ੍ਹਿਆ ਜਾਵੇ। Although / Though / Even though ਤੋਂ ਬਾਅਦ ਵਾਲਾ ਹਿੱਸਾ ਹਮੇਸ਼ਾ ਰੁਕਾਵਟ ਦੱਸਦਾ ਹੈ, ਨਤੀਜਾ ਨਹੀਂ।", en: "'The rain stopped the sowing' gets chosen when only the first half is read. After although / though / even though, that clause states the obstacle — never the outcome." },
          prompt: { pa: "\"Although it was raining heavily, the farmers continued sowing.\" — ਵਾਕ ਦਾ ਭਾਵ ਕੀ ਹੈ?", en: "\"Although it was raining heavily, the farmers continued sowing.\" — What does the sentence imply?" },
          options: [
            { t: { pa: "ਮੀਂਹ ਦੇ ਬਾਵਜੂਦ ਕਿਸਾਨਾਂ ਨੇ ਬਿਜਾਈ ਜਾਰੀ ਰੱਖੀ", en: "Despite the rain, the farmers kept sowing" }, correct: true,
              r: { pa: "'Although' ਵਿਰੋਧ ਦਿਖਾਉਂਦਾ ਹੈ — ਰੁਕਾਵਟ ਦੇ ਬਾਵਜੂਦ ਕੰਮ ਜਾਰੀ ਰਿਹਾ।", en: "'Although' signals contrast — the action continued despite the obstacle." } },
            { t: { pa: "ਮੀਂਹ ਕਾਰਨ ਬਿਜਾਈ ਰੁਕ ਗਈ", en: "The rain stopped the sowing" }, correct: false,
              r: { pa: "'Continued' ਸਾਫ਼ ਦੱਸਦਾ ਹੈ ਕਿ ਕੰਮ ਰੁਕਿਆ ਨਹੀਂ।", en: "'Continued' clearly says the work did not stop." } },
            { t: { pa: "ਕਿਸਾਨਾਂ ਨੇ ਮੀਂਹ ਦੀ ਉਡੀਕ ਕੀਤੀ", en: "The farmers waited for rain" }, correct: false,
              r: { pa: "ਮੀਂਹ ਪਹਿਲਾਂ ਹੀ ਪੈ ਰਿਹਾ ਸੀ — ਉਡੀਕ ਦੀ ਗੱਲ ਨਹੀਂ।", en: "It was already raining — no waiting involved." } },
            { t: { pa: "ਮੀਂਹ ਹਲਕਾ ਸੀ", en: "The rain was light" }, correct: false,
              r: { pa: "'Heavily' ਦਾ ਮਤਲਬ ਤੇਜ਼ ਮੀਂਹ ਹੈ, ਹਲਕਾ ਨਹੀਂ।", en: "'Heavily' means intense rain, not light." } }
          ],
          objective: { pa: "'Although/though/even though' = ਵਿਰੋਧ ਜੋੜਕ (contrast connector)। ਮੁੱਖ ਵਾਕ ਦੀ ਕਿਰਿਆ ਹੀ ਅਸਲ ਨਤੀਜਾ ਦੱਸਦੀ ਹੈ।", en: "'Although/though/even though' are contrast connectors. The main clause verb carries the actual outcome." }
        }
      ,
        {
          id: "ENG-GR-09", ch: "Grammar · Tenses", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ ਵਿਕਲਪ ਚੁਣੋ: \"I ______ my keys, so I cannot open the door.\"", en: "Choose the correct option: \"I ______ my keys, so I cannot open the door.\"" },
          hint: { pa: "ਦੂਜੇ ਹਿੱਸੇ 'so I cannot open the door' ਵੱਲ ਧਿਆਨ ਦਿਓ — ਇਹ ਵਰਤਮਾਨ ਵਿੱਚ ਹੈ। ਪਹਿਲਾ ਹਿੱਸਾ ਵਰਤਮਾਨ ਨਾਲ ਜੁੜਿਆ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ।", en: "Look at the second half — 'so I cannot open the door' is in the present. The first half must therefore connect to the present." },
          trap: { pa: "'lost' ਸਭ ਤੋਂ ਵੱਧ ਚੁਣਿਆ ਜਾਂਦਾ ਹੈ ਕਿਉਂਕਿ ਕੰਮ ਸੱਚਮੁੱਚ ਬੀਤੇ ਵਿੱਚ ਹੋਇਆ ਹੈ। ਪਰਖ ਦਾ ਤਰੀਕਾ: ਜੇ ਵਾਕ ਵਿੱਚ ਬੀਤੇ ਸਮੇਂ ਦਾ ਕੋਈ ਸ਼ਬਦ (yesterday) ਨਹੀਂ ਅਤੇ ਨਤੀਜਾ ਹੁਣ ਦਾ ਹੈ, ਤਾਂ Present Perfect ਲਾਓ।", en: "'lost' is most often chosen because the action really did happen in the past. Test: if there is no past time marker (like yesterday) and the result is current, use the present perfect." },
          options: [
            { t: { pa: "have lost", en: "have lost" }, correct: true,
              r: { pa: "Present Perfect ਉਸ ਬੀਤੀ ਘਟਨਾ ਲਈ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ ਜਿਸਦਾ ਨਤੀਜਾ ਹੁਣ ਵੀ ਮੌਜੂਦ ਹੈ। ਚਾਬੀਆਂ ਪਹਿਲਾਂ ਗੁਆਚੀਆਂ, ਪਰ ਨਤੀਜਾ (ਦਰਵਾਜ਼ਾ ਨਾ ਖੁੱਲ੍ਹਣਾ) ਹੁਣ ਹੈ।", en: "The present perfect is used for a past action whose result still matters now. The keys were lost earlier, but the consequence — not being able to open the door — is present." } },
            { t: { pa: "lost", en: "lost" }, correct: false,
              r: { pa: "Simple Past ਸਿਰਫ਼ ਬੀਤੇ ਸਮੇਂ ਦੀ ਘਟਨਾ ਦੱਸਦਾ ਹੈ ਤੇ ਆਮ ਤੌਰ 'ਤੇ ਸਮਾਂ ਵੀ ਦਿੱਤਾ ਹੁੰਦਾ ਹੈ (yesterday)। ਇੱਥੇ ਵਰਤਮਾਨ ਨਾਲ ਜੁੜਿਆ ਨਤੀਜਾ ਦੱਸਣਾ ਹੈ।", en: "The simple past merely reports a finished past event and usually comes with a time marker (yesterday). Here the link to the present result is what matters." } },
            { t: { pa: "am losing", en: "am losing" }, correct: false,
              r: { pa: "Present Continuous ਹੁਣ ਚੱਲ ਰਹੇ ਕੰਮ ਲਈ ਹੈ; ਚਾਬੀ ਗੁਆਉਣਾ ਲਗਾਤਾਰ ਚੱਲਣ ਵਾਲਾ ਕੰਮ ਨਹੀਂ।", en: "The present continuous describes an action in progress; losing keys is not an ongoing activity." } },
            { t: { pa: "had lost", en: "had lost" }, correct: false,
              r: { pa: "Past Perfect ਲਈ ਬੀਤੇ ਸਮੇਂ ਦੀ ਕੋਈ ਦੂਜੀ ਘਟਨਾ ਹੋਣੀ ਚਾਹੀਦੀ ਹੈ ਜਿਸ ਤੋਂ ਪਹਿਲਾਂ ਇਹ ਵਾਪਰੀ ਹੋਵੇ; ਇੱਥੇ ਅਜਿਹੀ ਕੋਈ ਘਟਨਾ ਨਹੀਂ।", en: "The past perfect needs a second past event for this one to precede; there is no such event here." } }
          ],
          objective: { pa: "Present Perfect (has/have + V₃) ਉਸ ਕੰਮ ਲਈ ਜੋ ਬੀਤੇ ਵਿੱਚ ਹੋਇਆ ਪਰ ਜਿਸਦਾ ਅਸਰ ਹੁਣ ਹੈ। ਸੰਕੇਤ ਸ਼ਬਦ: just, already, yet, never, so far। Simple Past ਬੀਤੇ ਦੇ ਖ਼ਤਮ ਹੋ ਚੁੱਕੇ ਕੰਮ ਲਈ (yesterday, last week)।", en: "Present perfect (has/have + V₃) is for a past action with a present consequence. Signal words: just, already, yet, never, so far. Simple past is for a finished past action (yesterday, last week)." }
        },
        {
          id: "ENG-GR-10", ch: "Grammar · Voice", competency: "Application", diff: "Medium",
          prompt: { pa: "ਹੇਠ ਲਿਖੇ ਵਾਕ ਨੂੰ ਕਰਮ ਵਾਚ ਵਿੱਚ ਬਦਲੋ: \"The teacher praised the students.\"", en: "Change the following sentence into the passive voice: \"The teacher praised the students.\"" },
          hint: { pa: "ਪਹਿਲਾਂ ਮੂਲ ਵਾਕ ਦਾ ਕਾਲ ਪਛਾਣੋ (ਇੱਥੇ Simple Past), ਫਿਰ be ਦਾ ਉਹੀ ਕਾਲ ਵਾਲਾ ਰੂਪ ਚੁਣੋ ਤੇ ਕਰਤਾ ਦੇ ਵਚਨ ਨਾਲ ਮਿਲਾਓ।", en: "Identify the tense of the original first (simple past here), then pick the matching form of 'be' and make it agree with the new subject." },
          trap: { pa: "'was praised' ਇਸ ਲਈ ਫਸਾਉਂਦਾ ਹੈ ਕਿਉਂਕਿ ਕਾਲ ਤਾਂ ਸਹੀ ਹੈ — ਗਲਤੀ ਸਿਰਫ਼ ਵਚਨ ਦੀ ਹੈ। ਕਰਮ ਵਾਚ ਵਿੱਚ ਹਮੇਸ਼ਾ ਦੋ ਗੱਲਾਂ ਜਾਂਚੋ: ਕਾਲ ਵੀ ਤੇ ਨਵੇਂ ਕਰਤਾ ਨਾਲ ਮੇਲ ਵੀ।", en: "'was praised' tempts because the tense is right — only the number is wrong. In the passive always check two things: the tense *and* agreement with the new subject." },
          options: [
            { t: { pa: "The students were praised by the teacher.", en: "The students were praised by the teacher." }, correct: true,
              r: { pa: "ਕਰਮ (the students) ਕਰਤਾ ਦੀ ਥਾਂ ਆਉਂਦਾ ਹੈ; ਕ੍ਰਿਆ Simple Past ਹੈ ਇਸ ਲਈ was/were + V₃ ਵਰਤੋ। 'students' ਬਹੁਵਚਨ ਹੈ, ਇਸ ਲਈ 'were praised'। ਅਸਲੀ ਕਰਤਾ 'by' ਨਾਲ ਪਿੱਛੇ ਆਉਂਦਾ ਹੈ।", en: "The object (the students) moves to the front; the verb is simple past, so use was/were + V₃. 'Students' is plural, hence 'were praised'. The original doer follows with 'by'." } },
            { t: { pa: "The students are praised by the teacher.", en: "The students are praised by the teacher." }, correct: false,
              r: { pa: "'are' ਵਰਤਮਾਨ ਕਾਲ ਹੈ; ਮੂਲ ਵਾਕ ਬੀਤੇ ਕਾਲ ਵਿੱਚ ਹੈ। ਕਰਮ ਵਾਚ ਵਿੱਚ ਬਦਲਦੇ ਸਮੇਂ ਕਾਲ ਕਦੇ ਨਹੀਂ ਬਦਲਦਾ।", en: "'are' is present tense, but the original is past. The tense must never change when converting to the passive." } },
            { t: { pa: "The students was praised by the teacher.", en: "The students was praised by the teacher." }, correct: false,
              r: { pa: "'students' ਬਹੁਵਚਨ ਹੈ, ਇਸ ਲਈ 'was' ਨਹੀਂ 'were' ਆਵੇਗਾ — ਕਰਤਾ-ਕ੍ਰਿਆ ਮੇਲ ਦੀ ਗਲਤੀ।", en: "'Students' is plural, so it takes 'were', not 'was' — this is a subject–verb agreement error." } },
            { t: { pa: "The students have been praised by the teacher.", en: "The students have been praised by the teacher." }, correct: false,
              r: { pa: "ਇਹ Present Perfect ਦਾ ਕਰਮ ਵਾਚ ਹੈ, ਜੋ 'The teacher has praised…' ਦਾ ਰੂਪ ਹੁੰਦਾ। ਮੂਲ ਵਾਕ Simple Past ਵਿੱਚ ਹੈ।", en: "That is the passive of the present perfect, matching 'The teacher has praised…'. The original is simple past." } }
          ],
          objective: { pa: "ਕਰਮ ਵਾਚ ਬਣਾਉਣ ਦੇ ਕਦਮ: (1) ਕਰਮ ਨੂੰ ਕਰਤਾ ਬਣਾਓ, (2) ਕਾਲ ਅਨੁਸਾਰ be ਦਾ ਸਹੀ ਰੂਪ + V₃ ਲਗਾਓ, (3) ਅਸਲੀ ਕਰਤਾ ਨੂੰ 'by' ਨਾਲ ਅਖ਼ੀਰ ਵਿੱਚ ਰੱਖੋ। ਕਾਲ ਹਮੇਸ਼ਾ ਉਹੀ ਰਹਿੰਦਾ ਹੈ।", en: "Steps for the passive: (1) make the object the new subject, (2) use the correct form of 'be' for that tense + V₃, (3) put the original doer at the end with 'by'. The tense never changes." }
        },
        {
          id: "ENG-GR-11", ch: "Grammar · Narration", competency: "Application", diff: "Hard",
          prompt: { pa: "ਸਹੀ ਅਪ੍ਰਤੱਖ ਕਥਨ ਚੁਣੋ: The teacher said to the boys, \"Sit down.\"", en: "Choose the correct indirect speech: The teacher said to the boys, \"Sit down.\"" },
          hint: { pa: "ਪਹਿਲਾਂ ਪਛਾਣੋ ਕਿ ਅੰਦਰਲਾ ਵਾਕ ਕਿਸ ਕਿਸਮ ਦਾ ਹੈ — ਬਿਆਨ, ਪ੍ਰਸ਼ਨ, ਜਾਂ ਹੁਕਮ। 'Sit down.' ਹੁਕਮ ਹੈ, ਇਸ ਲਈ ਬਣਤਰ ਵੀ ਹੁਕਮ ਵਾਲੀ ਹੋਵੇਗੀ।", en: "First identify the type of sentence inside the quotes — statement, question or command. 'Sit down.' is a command, so it needs the command structure." },
          trap: { pa: "ਸਭ ਤੋਂ ਵੱਡਾ ਫੰਦਾ ਹੁਕਮ ਨੂੰ 'said that' ਨਾਲ ਰਿਪੋਰਟ ਕਰਨਾ ਹੈ, ਕਿਉਂਕਿ ਵਿਦਿਆਰਥੀ ਸਿਰਫ਼ ਬਿਆਨ ਵਾਲਾ ਨਿਯਮ ਹੀ ਯਾਦ ਰੱਖਦੇ ਹਨ। ਹੁਕਮ ਤੇ ਬੇਨਤੀ ਵਿੱਚ ਕਦੇ 'that' ਨਹੀਂ ਆਉਂਦਾ — ਹਮੇਸ਼ਾ 'to + V₁'।", en: "The biggest trap is reporting a command with 'said that', because students memorise only the statement rule. Commands and requests never take 'that' — always 'to + V₁'." },
          options: [
            { t: { pa: "The teacher ordered the boys to sit down.", en: "The teacher ordered the boys to sit down." }, correct: true,
              r: { pa: "ਆਗਿਆਸੂਚਕ ਵਾਕ (imperative) ਨੂੰ ਅਪ੍ਰਤੱਖ ਕਥਨ ਵਿੱਚ ਬਦਲਣ ਲਈ ordered/told/requested ਵਰਤ ਕੇ ਕ੍ਰਿਆ ਨੂੰ 'to + V₁' ਬਣਾਇਆ ਜਾਂਦਾ ਹੈ। 'that' ਨਹੀਂ ਲੱਗਦਾ।", en: "To report an imperative, use a verb like ordered/told/requested and change the verb to 'to + V₁'. No 'that' clause is used." } },
            { t: { pa: "The teacher said that the boys sat down.", en: "The teacher said that the boys sat down." }, correct: false,
              r: { pa: "ਇਹ ਹੁਕਮ ਨੂੰ ਬਿਆਨ ਬਣਾ ਦਿੰਦਾ ਹੈ ਤੇ ਅਰਥ ਹੀ ਬਦਲ ਜਾਂਦਾ ਹੈ — ਹੁਕਮ ਦੇਣਾ ਤੇ ਇਹ ਦੱਸਣਾ ਕਿ ਉਹ ਬੈਠ ਗਏ, ਦੋ ਵੱਖਰੀਆਂ ਗੱਲਾਂ ਹਨ।", en: "This turns a command into a statement and changes the meaning — giving an order is not the same as reporting that they sat down." } },
            { t: { pa: "The teacher ordered the boys that they should sit down.", en: "The teacher ordered the boys that they should sit down." }, correct: false,
              r: { pa: "ਆਗਿਆਸੂਚਕ ਵਾਕਾਂ ਵਿੱਚ 'that' ਉਪਵਾਕ ਨਹੀਂ ਵਰਤਿਆ ਜਾਂਦਾ; ਸਹੀ ਬਣਤਰ 'to + V₁' ਹੈ।", en: "Imperatives are not reported with a 'that' clause; the correct structure is 'to + V₁'." } },
            { t: { pa: "The teacher said to the boys to sit down.", en: "The teacher said to the boys to sit down." }, correct: false,
              r: { pa: "ਹੁਕਮ ਲਈ 'said to' ਨਹੀਂ ਵਰਤਿਆ ਜਾਂਦਾ; ਰਿਪੋਰਟਿੰਗ ਕ੍ਰਿਆ ordered ਜਾਂ told ਹੋਣੀ ਚਾਹੀਦੀ ਹੈ।", en: "'Said to' is not used for commands; the reporting verb must be ordered or told." } }
          ],
          objective: { pa: "ਅਪ੍ਰਤੱਖ ਕਥਨ — ਵਾਕ ਦੀ ਕਿਸਮ ਅਨੁਸਾਰ: ਬਿਆਨ → said that…; ਪ੍ਰਸ਼ਨ → asked if/wh-word (ਕ੍ਰਮ ਸਿੱਧਾ); ਹੁਕਮ → ordered/told + to + V₁; ਬੇਨਤੀ → requested + to + V₁; ਸਲਾਹ → advised + to + V₁।", en: "Indirect speech by sentence type: statement → said that…; question → asked if / wh-word (with statement word order); command → ordered/told + to + V₁; request → requested + to + V₁; advice → advised + to + V₁." }
        },
        {
          id: "ENG-GR-12", ch: "Grammar · Modals", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ ਮੋਡਲ ਚੁਣੋ: \"He ______ swim across the river when he was only ten.\"", en: "Choose the correct modal: \"He ______ swim across the river when he was only ten.\"" },
          hint: { pa: "ਵਾਕ ਦਾ ਕਾਲ ਦੇਖੋ — 'was' ਦੱਸ ਰਿਹਾ ਹੈ ਕਿ ਗੱਲ ਬੀਤੇ ਦੀ ਹੈ। ਮੋਡਲ ਨੂੰ ਵੀ ਓਹੀ ਕਾਲ ਦੱਸਣਾ ਪਵੇਗਾ।", en: "Check the tense — 'was' shows the sentence is about the past. The modal must match that time frame." },
          trap: { pa: "'can' ਸਭ ਤੋਂ ਵੱਧ ਚੁਣਿਆ ਜਾਂਦਾ ਹੈ ਕਿਉਂਕਿ ਅਰਥ (ਸਮਰੱਥਾ) ਬਿਲਕੁਲ ਸਹੀ ਹੈ — ਗਲਤੀ ਸਿਰਫ਼ ਕਾਲ ਦੀ ਹੈ। ਮੋਡਲ ਚੁਣਦੇ ਸਮੇਂ ਦੋ ਗੱਲਾਂ ਜਾਂਚੋ: ਅਰਥ ਵੀ ਤੇ ਕਾਲ ਵੀ।", en: "'Can' is the most-chosen answer because the meaning (ability) is exactly right — only the tense is wrong. When choosing a modal, check both the meaning and the time frame." },
          options: [
            { t: { pa: "could", en: "could" }, correct: true,
              r: { pa: "'could' ਬੀਤੇ ਸਮੇਂ ਦੀ ਸਮਰੱਥਾ (past ability) ਦੱਸਦਾ ਹੈ। ਵਾਕ ਵਿੱਚ 'when he was only ten' ਸਾਫ਼ ਬੀਤਾ ਸਮਾਂ ਹੈ, ਇਸ ਲਈ can ਦਾ ਭੂਤ ਰੂਪ could ਲੱਗੇਗਾ।", en: "'Could' expresses past ability. The clause 'when he was only ten' is clearly in the past, so we need could, the past form of can." } },
            { t: { pa: "can", en: "can" }, correct: false,
              r: { pa: "'can' ਵਰਤਮਾਨ ਸਮਰੱਥਾ ਲਈ ਹੈ; ਇਹ ਵਾਕ ਦੇ ਬੀਤੇ ਕਾਲ ('was') ਨਾਲ ਮੇਲ ਨਹੀਂ ਖਾਂਦਾ।", en: "'Can' is for present ability and clashes with the past tense 'was' in the sentence." } },
            { t: { pa: "may", en: "may" }, correct: false,
              r: { pa: "'may' ਸੰਭਾਵਨਾ ਜਾਂ ਇਜਾਜ਼ਤ ਦੱਸਦਾ ਹੈ, ਸਮਰੱਥਾ ਨਹੀਂ।", en: "'May' expresses possibility or permission, not ability." } },
            { t: { pa: "should", en: "should" }, correct: false,
              r: { pa: "'should' ਸਲਾਹ ਜਾਂ ਫ਼ਰਜ਼ ਦੱਸਦਾ ਹੈ; ਇੱਥੇ ਉਸਦੀ ਯੋਗਤਾ ਦੀ ਗੱਲ ਹੋ ਰਹੀ ਹੈ।", en: "'Should' expresses advice or obligation; here the sentence is about his capability." } }
          ],
          objective: { pa: "ਮੋਡਲ ਅਤੇ ਉਹਨਾਂ ਦੇ ਕੰਮ: can — ਵਰਤਮਾਨ ਸਮਰੱਥਾ; could — ਬੀਤੀ ਸਮਰੱਥਾ ਜਾਂ ਨਿਮਰ ਬੇਨਤੀ; may/might — ਸੰਭਾਵਨਾ ਤੇ ਇਜਾਜ਼ਤ; must — ਲਾਜ਼ਮੀ ਫ਼ਰਜ਼; should — ਸਲਾਹ। ਮੋਡਲ ਤੋਂ ਬਾਅਦ ਹਮੇਸ਼ਾ ਕ੍ਰਿਆ ਦਾ ਮੂਲ ਰੂਪ (V₁) ਆਉਂਦਾ ਹੈ।", en: "Modals and their functions: can — present ability; could — past ability or a polite request; may/might — possibility and permission; must — strong obligation; should — advice. A modal is always followed by the base form of the verb (V₁)." }
        },
        {
          id: "ENG-GR-13", ch: "Grammar · Prepositions", competency: "Application", diff: "Easy",
          prompt: { pa: "ਸਹੀ ਸੰਬੰਧਕ ਚੁਣੋ: \"My sister is very good ______ mathematics.\"", en: "Choose the correct preposition: \"My sister is very good ______ mathematics.\"" },
          hint: { pa: "ਇੱਥੇ ਨਿਪੁੰਨਤਾ ਦੀ ਗੱਲ ਹੋ ਰਹੀ ਹੈ, ਲਾਭ ਦੀ ਨਹੀਂ। ਕਿਸੇ ਵਿਸ਼ੇ ਵਿੱਚ ਹੁਨਰ ਲਈ ਕਿਹੜਾ ਸੰਬੰਧਕ ਨਿਸ਼ਚਿਤ ਹੈ?", en: "The sentence is about proficiency, not benefit. Which preposition is fixed for skill in a subject?" },
          trap: { pa: "'in' ਇਸ ਲਈ ਬਹੁਤ ਖਿੱਚਦਾ ਹੈ ਕਿਉਂਕਿ ਬੋਲਚਾਲ ਵਿੱਚ ਲੋਕ ਅਕਸਰ 'good in maths' ਕਹਿ ਦਿੰਦੇ ਹਨ। ਇਮਤਿਹਾਨ ਵਿੱਚ ਮਿਆਰੀ ਰੂਪ 'good at' ਹੀ ਸਹੀ ਮੰਨਿਆ ਜਾਂਦਾ ਹੈ।", en: "'In' is very tempting because people often say 'good in maths' in casual speech. In the exam the standard form 'good at' is the one marked correct." },
          options: [
            { t: { pa: "at", en: "at" }, correct: true,
              r: { pa: "'good at' ਇੱਕ ਨਿਸ਼ਚਿਤ ਸੰਯੋਜਨ (fixed collocation) ਹੈ ਜੋ ਕਿਸੇ ਹੁਨਰ ਜਾਂ ਵਿਸ਼ੇ ਵਿੱਚ ਨਿਪੁੰਨਤਾ ਦੱਸਦਾ ਹੈ — good at maths, good at cricket।", en: "'Good at' is a fixed collocation used for skill or proficiency in a subject or activity — good at maths, good at cricket." } },
            { t: { pa: "in", en: "in" }, correct: false,
              r: { pa: "'good in' ਆਮ ਤੌਰ 'ਤੇ ਗਲਤ ਮੰਨਿਆ ਜਾਂਦਾ ਹੈ; ਹੁਨਰ ਲਈ ਹਮੇਸ਼ਾ 'good at' ਵਰਤੋ।", en: "'Good in' is generally treated as incorrect; for a skill always use 'good at'." } },
            { t: { pa: "for", en: "for" }, correct: false,
              r: { pa: "'good for' ਦਾ ਅਰਥ ਹੈ 'ਲਾਭਦਾਇਕ' — ਜਿਵੇਂ 'Milk is good for health'। ਇਹ ਨਿਪੁੰਨਤਾ ਨਹੀਂ ਦੱਸਦਾ।", en: "'Good for' means beneficial — as in 'Milk is good for health'. It does not express proficiency." } },
            { t: { pa: "with", en: "with" }, correct: false,
              r: { pa: "'good with' ਲੋਕਾਂ ਜਾਂ ਚੀਜ਼ਾਂ ਨੂੰ ਸੰਭਾਲਣ ਲਈ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ (good with children), ਵਿਸ਼ੇ ਲਈ ਨਹੀਂ।", en: "'Good with' is used for handling people or things (good with children), not for a school subject." } }
          ],
          objective: { pa: "ਵਿਸ਼ੇਸ਼ਣਾਂ ਨਾਲ ਲੱਗਣ ਵਾਲੇ ਨਿਸ਼ਚਿਤ ਸੰਬੰਧਕ: good/bad at (ਹੁਨਰ), good for (ਲਾਭ), good with (ਸੰਭਾਲਣਾ), interested in, afraid of, proud of, fond of, angry with (ਵਿਅਕਤੀ), angry at (ਗੱਲ)।", en: "Fixed prepositions after adjectives: good/bad at (skill), good for (benefit), good with (handling), interested in, afraid of, proud of, fond of, angry with (a person), angry at (a thing)." }
        },
        {
          id: "ENG-GR-14", ch: "Grammar · Determiners", competency: "Analysis", diff: "Hard",
          prompt: { pa: "ਸਹੀ ਵਿਕਲਪ ਚੁਣੋ: \"There is ______ milk in the jug, so we must buy some more.\"", en: "Choose the correct option: \"There is ______ milk in the jug, so we must buy some more.\"" },
          hint: { pa: "ਦੋ ਗੱਲਾਂ ਤੈਅ ਕਰੋ: (1) 'milk' ਗਿਣਨਯੋਗ ਹੈ ਜਾਂ ਨਹੀਂ, (2) ਵਾਕ ਕਮੀ ਦੱਸ ਰਿਹਾ ਹੈ ਜਾਂ ਕਾਫ਼ੀ ਹੋਣਾ।", en: "Settle two things: (1) is 'milk' countable or uncountable, and (2) is the sentence reporting a shortage or a sufficiency?" },
          trap: { pa: "'a little' ਸਭ ਤੋਂ ਵੱਡਾ ਫੰਦਾ ਹੈ ਕਿਉਂਕਿ ਵਿਆਕਰਨ ਪੱਖੋਂ ਇਹ ਬਿਲਕੁਲ ਸਹੀ ਬੈਠਦਾ ਹੈ — ਫ਼ਰਕ ਸਿਰਫ਼ ਅਰਥ ਦਾ ਹੈ। ਸਿਰਫ਼ ਇੱਕ 'a' ਪੂਰੇ ਵਾਕ ਦਾ ਭਾਵ ਉਲਟਾ ਦਿੰਦਾ ਹੈ, ਇਸ ਲਈ ਵਾਕ ਦਾ ਦੂਜਾ ਹਿੱਸਾ ਜ਼ਰੂਰ ਪੜ੍ਹੋ।", en: "'A little' is the biggest trap because it fits perfectly on grammar alone — the difference is purely in meaning. A single 'a' reverses the sense, so always read the rest of the sentence." },
          options: [
            { t: { pa: "little", en: "little" }, correct: true,
              r: { pa: "'little' ਦਾ ਅਰਥ ਹੈ 'ਨਾ-ਮਾਤਰ, ਲਗਭਗ ਕੁਝ ਵੀ ਨਹੀਂ' — ਇਹ ਨਾਂਹ-ਪੱਖੀ ਭਾਵ ਦਿੰਦਾ ਹੈ। ਵਾਕ ਦਾ ਦੂਜਾ ਹਿੱਸਾ 'must buy some more' ਇਸੇ ਕਮੀ ਨੂੰ ਸਾਬਤ ਕਰਦਾ ਹੈ।", en: "'Little' means hardly any, almost none — a negative sense. The second clause, 'must buy some more', confirms exactly that shortage." } },
            { t: { pa: "a little", en: "a little" }, correct: false,
              r: { pa: "'a little' ਦਾ ਭਾਵ ਹਾਂ-ਪੱਖੀ ਹੈ — 'ਥੋੜ੍ਹਾ ਪਰ ਕਾਫ਼ੀ'। ਜੇ ਦੁੱਧ ਕਾਫ਼ੀ ਹੁੰਦਾ ਤਾਂ ਹੋਰ ਖ਼ਰੀਦਣ ਦੀ ਲੋੜ ਨਾ ਪੈਂਦੀ।", en: "'A little' is positive — some, and enough. If there were enough milk, there would be no need to buy more." } },
            { t: { pa: "few", en: "few" }, correct: false,
              r: { pa: "'few' ਸਿਰਫ਼ ਗਿਣਨਯੋਗ ਬਹੁਵਚਨ ਨਾਂਵਾਂ ਨਾਲ ਆਉਂਦਾ ਹੈ (few books)। 'milk' ਅਗਿਣਨਯੋਗ ਹੈ।", en: "'Few' is used only with countable plural nouns (few books). 'Milk' is uncountable." } },
            { t: { pa: "a few", en: "a few" }, correct: false,
              r: { pa: "'a few' ਵੀ ਗਿਣਨਯੋਗ ਨਾਂਵਾਂ ਲਈ ਹੈ, ਅਤੇ ਇਸਦਾ ਭਾਵ ਵੀ ਹਾਂ-ਪੱਖੀ ਹੈ — ਦੋਵੇਂ ਪੱਖੋਂ ਗਲਤ।", en: "'A few' is also for countable nouns and carries a positive sense — wrong on both counts." } }
          ],
          objective: { pa: "ਮਾਤਰਾ ਦੱਸਣ ਵਾਲੇ ਨਿਰਧਾਰਕ: ਅਗਿਣਨਯੋਗ ਨਾਂਵਾਂ ਨਾਲ little (ਨਾ-ਮਾਤਰ) ਅਤੇ a little (ਥੋੜ੍ਹਾ ਪਰ ਕਾਫ਼ੀ); ਗਿਣਨਯੋਗ ਬਹੁਵਚਨ ਨਾਲ few (ਨਾ-ਮਾਤਰ) ਅਤੇ a few (ਕੁਝ ਪਰ ਕਾਫ਼ੀ)। 'a' ਲੱਗਣ ਨਾਲ ਭਾਵ ਨਾਂਹ-ਪੱਖੀ ਤੋਂ ਹਾਂ-ਪੱਖੀ ਹੋ ਜਾਂਦਾ ਹੈ।", en: "Quantifying determiners: with uncountable nouns use little (hardly any) and a little (some, enough); with countable plurals use few (hardly any) and a few (some, enough). Adding 'a' flips the sense from negative to positive." }
        },
        {
          id: "ENG-GR-15", ch: "Grammar · Subject-Verb Agreement", competency: "Analysis", diff: "Medium",
          prompt: { pa: "ਸਹੀ ਵਿਕਲਪ ਚੁਣੋ: \"One of the students ______ absent today.\"", en: "Choose the correct option: \"One of the students ______ absent today.\"" },
          hint: { pa: "'of the students' ਨੂੰ ਵਾਕ ਵਿੱਚੋਂ ਹਟਾ ਕੇ ਪੜ੍ਹੋ — ਬਚਦਾ ਹੈ 'One ______ absent today'। ਹੁਣ ਕ੍ਰਿਆ ਸਾਫ਼ ਦਿਖ ਜਾਵੇਗੀ।", en: "Mentally delete 'of the students' and read what remains: 'One ______ absent today.' The right verb becomes obvious." },
          trap: { pa: "'are' ਇਸ ਲਈ ਖਿੱਚਦਾ ਹੈ ਕਿਉਂਕਿ ਖ਼ਾਲੀ ਥਾਂ ਦੇ ਬਿਲਕੁਲ ਨਾਲ ਵਾਲਾ ਸ਼ਬਦ 'students' ਬਹੁਵਚਨ ਹੈ। ਇਮਤਿਹਾਨ ਇਹੀ ਧਿਆਨ-ਭਟਕਾਊ ਬਣਤਰ ਵਾਰ-ਵਾਰ ਵਰਤਦੇ ਹਨ — ਹਮੇਸ਼ਾ ਵਾਕਾਂਸ਼ ਹਟਾ ਕੇ ਜਾਂਚੋ।", en: "'Are' tempts because the word sitting right next to the blank, 'students', is plural. Exams reuse this distractor constantly — always strip out the phrase and re-check." },
          options: [
            { t: { pa: "is", en: "is" }, correct: true,
              r: { pa: "ਵਾਕ ਦਾ ਅਸਲ ਕਰਤਾ 'One' ਹੈ, ਜੋ ਇੱਕਵਚਨ ਹੈ। 'of the students' ਸਿਰਫ਼ ਸੰਬੰਧਕੀ ਵਾਕਾਂਸ਼ ਹੈ ਅਤੇ ਕ੍ਰਿਆ ਨੂੰ ਪ੍ਰਭਾਵਿਤ ਨਹੀਂ ਕਰਦਾ। 'today' ਵਰਤਮਾਨ ਕਾਲ ਦੱਸਦਾ ਹੈ।", en: "The real subject is 'One', which is singular. The phrase 'of the students' is merely prepositional and does not affect the verb. 'Today' fixes the tense as present." } },
            { t: { pa: "are", en: "are" }, correct: false,
              r: { pa: "'are' ਬਹੁਵਚਨ ਹੈ ਤੇ ਇਹ ਗਲਤੀ ਨਾਲ 'students' ਨਾਲ ਮੇਲ ਕਰ ਰਿਹਾ ਹੈ, ਜਦਕਿ ਕਰਤਾ 'One' ਹੈ।", en: "'Are' is plural and wrongly agrees with 'students', whereas the subject is 'One'." } },
            { t: { pa: "were", en: "were" }, correct: false,
              r: { pa: "ਇਹ ਬਹੁਵਚਨ ਵੀ ਹੈ ਤੇ ਭੂਤ ਕਾਲ ਵੀ; 'today' ਨਾਲ ਕਾਲ ਦਾ ਵੀ ਮੇਲ ਨਹੀਂ ਖਾਂਦਾ।", en: "This is both plural and past tense; it also clashes with 'today'." } },
            { t: { pa: "have been", en: "have been" }, correct: false,
              r: { pa: "'have' ਬਹੁਵਚਨ ਸਹਾਇਕ ਕ੍ਰਿਆ ਹੈ; ਇੱਕਵਚਨ ਕਰਤਾ ਨਾਲ 'has been' ਆਉਂਦਾ, ਪਰ ਇੱਥੇ ਸਧਾਰਨ 'is' ਹੀ ਢੁਕਵਾਂ ਹੈ।", en: "'Have' is the plural auxiliary; a singular subject would take 'has been', though simple 'is' is what fits here." } }
          ],
          objective: { pa: "ਕਰਤਾ-ਕ੍ਰਿਆ ਮੇਲ: ਕ੍ਰਿਆ ਹਮੇਸ਼ਾ ਅਸਲ ਕਰਤਾ ਨਾਲ ਮੇਲ ਖਾਂਦੀ ਹੈ, ਵਿਚਕਾਰ ਆਏ ਸੰਬੰਧਕੀ ਵਾਕਾਂਸ਼ ਨਾਲ ਨਹੀਂ। 'One of the…', 'Each of the…', 'Neither of the…' — ਸਭ ਇੱਕਵਚਨ ਕ੍ਰਿਆ ਲੈਂਦੇ ਹਨ।", en: "Subject–verb agreement: the verb agrees with the true subject, never with an intervening prepositional phrase. 'One of the…', 'Each of the…' and 'Neither of the…' all take a singular verb." }
        },
        {
          id: "ENG-GR-16", ch: "Grammar · Conditionals", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ ਵਿਕਲਪ ਚੁਣੋ: \"If it rains tomorrow, we ______ the match.\"", en: "Choose the correct option: \"If it rains tomorrow, we ______ the match.\"" },
          hint: { pa: "if-ਵਾਲੇ ਹਿੱਸੇ ਦਾ ਕਾਲ ਦੇਖੋ — ਇੱਥੇ 'rains' Simple Present ਹੈ। ਹਰ ਕੰਡੀਸ਼ਨਲ ਵਿੱਚ ਦੋਵੇਂ ਹਿੱਸੇ ਜੋੜੇ ਵਿੱਚ ਚੱਲਦੇ ਹਨ।", en: "Look at the tense in the if-clause — here 'rains' is simple present. In every conditional the two halves move as a matched pair." },
          trap: { pa: "'would cancel' ਸਭ ਤੋਂ ਵੱਧ ਚੁਣਿਆ ਜਾਂਦਾ ਹੈ ਕਿਉਂਕਿ 'would' ਸੁਣਨ ਵਿੱਚ ਵੱਧ ਨਿਮਰ ਤੇ ਸਹੀ ਲੱਗਦਾ ਹੈ। ਪਰ ਜੇ if-ਵਾਲੇ ਹਿੱਸੇ ਵਿੱਚ Simple Present ਹੈ, ਤਾਂ ਦੂਜੇ ਹਿੱਸੇ ਵਿੱਚ 'will' ਹੀ ਆਵੇਗਾ।", en: "'Would cancel' is most often chosen because 'would' sounds more polite and refined. But if the if-clause is in the simple present, the main clause must take 'will'." },
          options: [
            { t: { pa: "will cancel", en: "will cancel" }, correct: true,
              r: { pa: "ਇਹ ਪਹਿਲਾ ਕੰਡੀਸ਼ਨਲ ਹੈ — ਭਵਿੱਖ ਦੀ ਸੰਭਵ ਸਥਿਤੀ। ਬਣਤਰ: If + Simple Present, … will + V₁। 'tomorrow' ਦੱਸਦਾ ਹੈ ਕਿ ਗੱਲ ਅਸਲ ਤੇ ਸੰਭਵ ਹੈ।", en: "This is the first conditional — a real, possible future situation. Structure: If + simple present, … will + V₁. 'Tomorrow' signals that it is realistic." } },
            { t: { pa: "would cancel", en: "would cancel" }, correct: false,
              r: { pa: "'would' ਦੂਜੇ ਕੰਡੀਸ਼ਨਲ ਲਈ ਹੈ, ਜਿੱਥੇ if-ਵਾਲੇ ਹਿੱਸੇ ਵਿੱਚ Simple Past ਆਉਂਦਾ ਹੈ ('If it rained…')।", en: "'Would' belongs to the second conditional, where the if-clause takes the simple past ('If it rained…')." } },
            { t: { pa: "cancelled", en: "cancelled" }, correct: false,
              r: { pa: "ਭੂਤ ਕਾਲ ਭਵਿੱਖ ਦੀ ਸ਼ਰਤ ਨਾਲ ਮੇਲ ਨਹੀਂ ਖਾਂਦਾ; ਵਾਕ ਦਾ ਅਰਥ ਹੀ ਵਿਗੜ ਜਾਂਦਾ ਹੈ।", en: "A past form cannot follow a future condition; it breaks the meaning of the sentence." } },
            { t: { pa: "would have cancelled", en: "would have cancelled" }, correct: false,
              r: { pa: "ਇਹ ਤੀਜਾ ਕੰਡੀਸ਼ਨਲ ਹੈ, ਜੋ ਬੀਤੇ ਦੀ ਅਸੰਭਵ ਸਥਿਤੀ ਲਈ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ ('If it had rained…')।", en: "That is the third conditional, used for an unreal past situation ('If it had rained…')." } }
          ],
          objective: { pa: "ਕੰਡੀਸ਼ਨਲ ਵਾਕ: ਪਹਿਲਾ (ਸੰਭਵ ਭਵਿੱਖ) — If + Simple Present, will + V₁। ਦੂਜਾ (ਵਰਤਮਾਨ ਦੀ ਕਲਪਨਾ) — If + Simple Past, would + V₁। ਤੀਜਾ (ਬੀਤੇ ਦੀ ਅਸੰਭਵ ਸਥਿਤੀ) — If + had + V₃, would have + V₃।", en: "Conditionals: first (possible future) — If + simple present, will + V₁. Second (unreal present) — If + simple past, would + V₁. Third (unreal past) — If + had + V₃, would have + V₃." }
        },
        {
          id: "ENG-GR-17", ch: "Grammar · Conjunctions", competency: "Analysis", diff: "Medium",
          prompt: { pa: "ਸਹੀ ਯੋਜਕ ਚੁਣੋ: \"______ you work hard, you will not pass the examination.\"", en: "Choose the correct conjunction: \"______ you work hard, you will not pass the examination.\"" },
          hint: { pa: "ਖ਼ਾਲੀ ਥਾਂ ਵਿੱਚ ਹਰ ਵਿਕਲਪ ਪਾ ਕੇ ਪੜ੍ਹੋ ਤੇ ਦੇਖੋ ਕਿ ਕਿਹੜਾ ਵਾਕ ਤਰਕ ਨਾਲ ਸਹੀ ਬਣਦਾ ਹੈ — ਮੁੱਖ ਹਿੱਸੇ ਵਿੱਚ 'will not pass' ਹੈ।", en: "Try each option in the blank and see which produces a logical sentence — remember the main clause says 'will not pass'." },
          trap: { pa: "'If' ਸਭ ਤੋਂ ਵੱਡਾ ਫੰਦਾ ਹੈ ਕਿਉਂਕਿ ਇਹ ਵੀ ਸ਼ਰਤ ਵਾਲਾ ਯੋਜਕ ਹੈ ਤੇ ਵਿਆਕਰਨ ਪੱਖੋਂ ਠੀਕ ਬੈਠਦਾ ਹੈ। ਪਰ 'unless' ਵਿੱਚ ਨਾਂਹ ਪਹਿਲਾਂ ਹੀ ਹੈ; 'If' ਵਰਤਣਾ ਹੋਵੇ ਤਾਂ ਵਾਕ 'If you do not work hard…' ਬਣਾਉਣਾ ਪੈਂਦਾ।", en: "'If' is the biggest trap because it is also a conditional conjunction and fits grammatically. But 'unless' already contains the negative; to use 'if' you would have to write 'If you do not work hard…'." },
          options: [
            { t: { pa: "Unless", en: "Unless" }, correct: true,
              r: { pa: "'Unless' ਦਾ ਅਰਥ ਹੈ 'if not'। ਵਾਕ ਬਣਦਾ ਹੈ: ਜੇ ਤੁਸੀਂ ਮਿਹਨਤ ਨਹੀਂ ਕਰਦੇ, ਤਾਂ ਪਾਸ ਨਹੀਂ ਹੋਵੋਗੇ। ਧਿਆਨ ਰੱਖੋ ਕਿ 'unless' ਵਿੱਚ ਨਾਂਹ ਪਹਿਲਾਂ ਹੀ ਸ਼ਾਮਲ ਹੈ, ਇਸ ਲਈ ਉਸ ਹਿੱਸੇ ਵਿੱਚ 'not' ਦੁਬਾਰਾ ਨਹੀਂ ਲਗਦਾ।", en: "'Unless' means 'if not'. The sentence reads: if you do not work hard, you will not pass. Note that 'unless' already carries the negative, so its clause never takes another 'not'." } },
            { t: { pa: "If", en: "If" }, correct: false,
              r: { pa: "'If' ਨਾਲ ਅਰਥ ਉਲਟ ਹੋ ਜਾਵੇਗਾ — 'ਜੇ ਤੁਸੀਂ ਮਿਹਨਤ ਕਰੋਗੇ ਤਾਂ ਪਾਸ ਨਹੀਂ ਹੋਵੋਗੇ', ਜੋ ਬੇਤੁਕਾ ਹੈ।", en: "'If' would reverse the meaning — 'if you work hard, you will not pass' — which makes no sense." } },
            { t: { pa: "Because", en: "Because" }, correct: false,
              r: { pa: "'Because' ਕਾਰਨ ਦੱਸਦਾ ਹੈ, ਸ਼ਰਤ ਨਹੀਂ; ਵਾਕ ਸ਼ਰਤ ਵਾਲਾ ਹੈ।", en: "'Because' gives a reason, not a condition; this sentence is conditional." } },
            { t: { pa: "Although", en: "Although" }, correct: false,
              r: { pa: "'Although' ਵਿਰੋਧ ਦੱਸਦਾ ਹੈ — 'ਭਾਵੇਂ ਤੁਸੀਂ ਮਿਹਨਤ ਕਰੋ, ਫਿਰ ਵੀ ਪਾਸ ਨਹੀਂ ਹੋਵੋਗੇ', ਜੋ ਇੱਥੇ ਢੁਕਵਾਂ ਨਹੀਂ।", en: "'Although' signals contrast — 'even though you work hard, you will not pass' — which does not fit here." } }
          ],
          objective: { pa: "ਯੋਜਕ ਅਤੇ ਉਹਨਾਂ ਦੇ ਅਰਥ: unless = if not (ਸ਼ਰਤ, ਨਾਂਹ ਸਮੇਤ); if = ਸ਼ਰਤ; because/since = ਕਾਰਨ; although/though = ਵਿਰੋਧ; so that = ਮਕਸਦ; until/till = ਸਮਾਂ। 'Unless' ਵਾਲੇ ਹਿੱਸੇ ਵਿੱਚ ਕਦੇ ਦੂਜੀ ਨਾਂਹ ਨਾ ਲਾਓ।", en: "Conjunctions and their meanings: unless = if not (condition, already negative); if = condition; because/since = reason; although/though = contrast; so that = purpose; until/till = time. Never add a second negative in an 'unless' clause." }
        },
        {

          hint: { pa: "ਦੋ ਗੱਲਾਂ ਪੁੱਛੋ: ਕੀ ਇਹ ਵਿਅਕਤੀ ਹੈ ਜਾਂ ਵਸਤੂ, ਅਤੇ ਕੀ ਉਹ ਕੰਮ ਕਰ ਰਿਹਾ ਹੈ (ਕਰਤਾ) ਜਾਂ ਉਸ ਉੱਤੇ ਕੰਮ ਹੋ ਰਿਹਾ ਹੈ (ਕਰਮ)?", en: "Ask two questions: is it a person or a thing, and is that person doing the action (subject) or receiving it (object)?" },

        },
