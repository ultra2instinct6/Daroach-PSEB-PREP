<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BOLO.MCQ — PSEB Class 10 Question Engine</title>
<meta name="description" content="Bilingual Punjabi-English MCQ practice engine for PSEB Class 10 — 44 board-pattern questions across Science, Math and English with rationales, difficulty tags, flagging and performance analytics.">
<style>
  :root {
    --bg-void: #000000;
    --text-bold: #ffffff;
    --text-dim: #8e9bb0;
    --panel: rgba(18, 18, 22, 0.94);
    --border: rgba(255, 255, 255, 0.08);
    --accent: #00e5ff;
    --green: #2ecc71;
    --red: #ff4d6d;
    --amber: #ffaa00;
    --fluid-curve: cubic-bezier(0.16, 1, 0.3, 1);
    --font-gurmukhi: 'Noto Sans Gurmukhi', 'Mukta Mahee', 'Gurmukhi Sangam MN', 'Nirmala UI', 'Raavi', 'Lohit Gurmukhi', sans-serif;
  }
  /* CLASSIC = light colorway matching the lecture decks (legacy palette). */
  body[data-theme="CLASSIC"] {
    --bg-void: #f8fbff;
    --text-bold: #182437;
    --text-dim: #5c6f86;
    --panel: rgba(255, 255, 255, 0.92);
    --border: rgba(11, 74, 168, 0.14);
    --green: #179c65;
    --red: #c73a2e;
    --amber: #f26a21;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg-void); }
  body {
    min-height: 100vh;
    background: var(--bg-void);
    color: var(--text-bold);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, var(--font-gurmukhi);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body::before {
    content: '';
    position: fixed;
    inset: -5%;
    z-index: -3;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.035;
  }
  .aura-bleed {
    position: fixed;
    top: -20vh;
    left: 50%;
    z-index: -2;
    width: 130vw;
    height: 90vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0, 140, 255, 0.14) 0%, rgba(0, 110, 255, 0.05) 40%, transparent 72%);
    pointer-events: none;
    transition: background 0.9s var(--fluid-curve);
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 10%, rgba(0, 0, 0, 0.94) 100%);
  }

  button { border: 0; font: inherit; color: inherit; background: none; cursor: pointer; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }

  /* ---------- Header ---------- */
  .mcq-header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 22px;
    padding: max(18px, env(safe-area-inset-top)) clamp(16px, 4vw, 44px) 16px;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.78) 78%, transparent 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .header-logo {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    color: var(--text-bold);
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 2px;
    text-decoration: none;
    white-space: nowrap;
  }
  .header-logo .dot-mode { color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); transition: color 0.5s var(--fluid-curve), text-shadow 0.5s var(--fluid-curve); }
  .home-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.3s var(--fluid-curve);
  }
  .home-pill:hover { color: #fff; border-color: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }

  .router {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
  }
  .router-btn {
    padding: 8px 14px;
    border-radius: 999px;
    color: var(--text-dim);
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    transition: all 0.3s var(--fluid-curve);
  }
  .router-btn:hover { color: #fff; }
  .router-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12); }

  .header-spacer { flex: 1; }
  .score-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 15px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    font-size: 0.64rem;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .score-pill strong { color: var(--accent); font-variant-numeric: tabular-nums; transition: color 0.4s; }
  .theme-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    transition: all 0.3s var(--fluid-curve);
  }
  .theme-pill:hover { color: #fff; border-color: color-mix(in srgb, var(--accent) 55%, transparent); transform: translateY(-1px); }

  /* ---------- Stage ---------- */
  .stage {
    width: min(94vw, 860px);
    margin: clamp(8px, 2vh, 26px) auto clamp(60px, 8vh, 90px);
    animation: riseIn 0.7s var(--fluid-curve);
  }
  @keyframes riseIn { 0% { opacity: 0; transform: translateY(26px) scale(0.97); filter: blur(8px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

  .progress-track { display: flex; gap: 5px; margin-bottom: 20px; }
  .progress-seg { flex: 1; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); transition: background 0.45s var(--fluid-curve), box-shadow 0.45s; }
  .progress-seg.seen-correct { background: var(--green); box-shadow: 0 0 8px color-mix(in srgb, var(--green) 60%, transparent); }
  .progress-seg.seen-wrong { background: var(--red); box-shadow: 0 0 8px color-mix(in srgb, var(--red) 55%, transparent); }
  .progress-seg.current { background: var(--accent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent); }

  .q-card {
    position: relative;
    padding: clamp(20px, 4.5vw, 34px);
    border: 1px solid var(--border);
    border-top: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 26px;
    background: var(--panel);
    box-shadow: 0 34px 80px rgba(0, 0, 0, 0.85), 0 0 60px -30px var(--accent), inset 0 1px 1px rgba(255, 255, 255, 0.06);
    transition: border-color 0.5s var(--fluid-curve), box-shadow 0.5s var(--fluid-curve);
  }
  .q-card.swap { animation: riseIn 0.5s var(--fluid-curve); }

  .q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
  .meta-rune {
    padding: 6px 12px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-dim);
    font-family: var(--font-gurmukhi);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .meta-rune.hot { border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); }
  .lang-flip {
    margin-left: auto;
    padding: 7px 13px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-dim);
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 1.4px;
    transition: all 0.3s var(--fluid-curve);
  }
  .lang-flip:hover { color: #fff; border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

  .q-prompt {
    font-family: var(--font-gurmukhi);
    font-size: clamp(1.04rem, 3.4vw, 1.28rem);
    font-weight: 700;
    line-height: 1.65;
    margin-bottom: 8px;
  }
  .q-prompt-sub {
    color: var(--text-dim);
    font-size: clamp(0.8rem, 2.6vw, 0.9rem);
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .option-row { display: flex; align-items: stretch; gap: 9px; margin-bottom: 10px; }
  .strike-btn {
    flex: none;
    width: 42px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 900;
    transition: all 0.3s var(--fluid-curve);
  }
  .strike-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
  .strike-btn.active { border-color: color-mix(in srgb, var(--red) 40%, transparent); background: color-mix(in srgb, var(--red) 10%, transparent); color: var(--red); }

  .option {
    flex: 1;
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 13px;
    min-height: 54px;
    padding: 14px 17px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.025);
    text-align: left;
    transition: all 0.35s var(--fluid-curve);
    overflow: hidden;
  }
  .option:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.06); transform: translateX(3px); }
  .option:disabled { cursor: default; }
  .opt-letter { flex: none; padding-top: 1px; color: var(--text-dim); font-size: 0.95rem; font-weight: 900; font-variant-numeric: tabular-nums; transition: color 0.4s; }
  .opt-text { font-family: var(--font-gurmukhi); font-size: clamp(0.86rem, 2.8vw, 0.98rem); font-weight: 600; line-height: 1.55; }
  .opt-sub { display: block; margin-top: 3px; color: var(--text-dim); font-size: 0.74rem; font-weight: 600; }

  .option-row.struck .option { opacity: 0.3; }
  .option-row.struck .opt-text { text-decoration: line-through; }

  .option.correct { border-color: color-mix(in srgb, var(--green) 65%, transparent); background: color-mix(in srgb, var(--green) 9%, transparent); box-shadow: 0 0 26px -8px var(--green); }
  .option.correct .opt-letter { color: var(--green); }
  .option.incorrect { border-color: color-mix(in srgb, var(--red) 65%, transparent); background: color-mix(in srgb, var(--red) 9%, transparent); box-shadow: 0 0 26px -8px var(--red); animation: shake 0.4s var(--fluid-curve); }
  .option.incorrect .opt-letter { color: var(--red); }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* ---------- Feedback ---------- */
  .feedback { margin-top: 22px; animation: riseIn 0.5s var(--fluid-curve); }
  .verdict { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-family: var(--font-gurmukhi); font-size: 1rem; font-weight: 900; letter-spacing: 0.4px; }
  .verdict.good { color: var(--green); text-shadow: 0 0 18px color-mix(in srgb, var(--green) 45%, transparent); }
  .verdict.bad { color: var(--red); text-shadow: 0 0 18px color-mix(in srgb, var(--red) 45%, transparent); }

  .rationale {
    margin-bottom: 8px;
    padding: 11px 15px;
    border-left: 3px solid rgba(255, 255, 255, 0.1);
    border-radius: 0 11px 11px 0;
    background: rgba(255, 255, 255, 0.02);
    color: #cbd5e1;
    font-family: var(--font-gurmukhi);
    font-size: 0.84rem;
    font-weight: 600;
    line-height: 1.65;
  }
  .rationale strong { color: #fff; }
  .rationale.good { border-left-color: var(--green); background: color-mix(in srgb, var(--green) 5%, transparent); }
  .rationale.bad { border-left-color: var(--red); background: color-mix(in srgb, var(--red) 5%, transparent); }

  .objective {
    margin-top: 16px;
    padding: 16px 18px;
    border-left: 4px solid var(--accent);
    border-radius: 0 13px 13px 0;
    background: color-mix(in srgb, var(--accent) 5%, transparent);
  }
  .objective-title { margin-bottom: 6px; color: var(--accent); font-size: 0.6rem; font-weight: 900; letter-spacing: 1.8px; text-transform: uppercase; }
  .objective-body { font-family: var(--font-gurmukhi); font-size: 0.86rem; font-weight: 600; line-height: 1.7; color: #e6edf5; }

  .action-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .q-counter { color: var(--text-dim); font-size: 0.66rem; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .btn-next {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 46px;
    padding: 12px 24px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 13px;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    color: #fff;
    font-family: var(--font-gurmukhi);
    font-size: 0.84rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    transition: all 0.3s var(--fluid-curve);
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 26px -10px var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .btn-next:disabled { opacity: 0.3; cursor: default; transform: none; box-shadow: none; }

  /* ---------- Summary ---------- */
  .summary { text-align: center; padding: clamp(10px, 3vw, 24px) 0; }
  .summary-orb {
    position: relative;
    width: 128px;
    height: 128px;
    margin: 6px auto 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #ffffff 0%, #f2feff 12%, #b6f4ff 28%, #6fdcff 46%, rgba(40, 160, 250, 0.55) 68%, rgba(16, 110, 225, 0) 100%);
    box-shadow: 0 0 48px rgba(90, 210, 255, 0.4), 0 0 110px rgba(0, 150, 255, 0.28);
    animation: orbBreathe 3s ease-in-out infinite;
  }
  @keyframes orbBreathe { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.05); filter: brightness(1.15); } }
  .summary-score { display: flex; align-items: center; justify-content: center; position: absolute; inset: 0; color: #013; font-size: 1.7rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .summary h2 { font-family: var(--font-gurmukhi); font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 900; margin-bottom: 8px; }
  .summary p { color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.92rem; font-weight: 600; line-height: 1.7; max-width: 460px; margin: 0 auto 24px; }
  .summary-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

  /* ---------- v1.1 — difficulty, flag, navigator, breakdowns ---------- */
  .meta-rune.diff-easy { border-color: color-mix(in srgb, var(--green) 30%, transparent); color: var(--green); }
  .meta-rune.diff-medium { border-color: color-mix(in srgb, var(--amber) 30%, transparent); color: var(--amber); }
  .meta-rune.diff-hard { border-color: color-mix(in srgb, var(--red) 30%, transparent); color: var(--red); }

  .flag-btn {
    padding: 6px 11px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-size: 0.66rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    transition: all 0.3s var(--fluid-curve);
  }
  .flag-btn:hover { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
  .flag-btn.active { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 60%, transparent); background: color-mix(in srgb, var(--amber) 10%, transparent); }

  .progress-seg { border: 0; padding: 0; cursor: pointer; }
  .progress-seg:hover { box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 55%, transparent); }
  .progress-seg.flagged { outline: 1.5px solid var(--amber); outline-offset: 1.5px; }

  .btn-prev {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 46px;
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
    font-family: var(--font-gurmukhi);
    font-size: 0.78rem;
    font-weight: 800;
    transition: all 0.3s var(--fluid-curve);
  }
  .btn-prev:hover:not(:disabled) { color: var(--text-bold); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
  .btn-prev:disabled { opacity: 0.25; cursor: default; }
  .results-link {
    padding: 7px 13px;
    border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    border-radius: 999px;
    background: color-mix(in srgb, var(--amber) 8%, transparent);
    color: var(--amber);
    font-family: var(--font-gurmukhi);
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    transition: all 0.3s var(--fluid-curve);
  }
  .results-link:hover { background: color-mix(in srgb, var(--amber) 16%, transparent); transform: translateY(-1px); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto 26px; }
  .stat-box { padding: 14px 10px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255, 255, 255, 0.02); text-align: center; }
  .stat-num { display: block; color: var(--accent); font-size: 1.15rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stat-label { display: block; margin-top: 4px; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.56rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }

  .break-section { max-width: 620px; margin: 26px auto 0; text-align: left; }
  .break-title { margin-bottom: 12px; color: var(--accent); font-family: var(--font-gurmukhi); font-size: 0.62rem; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase; }
  .break-row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
  .break-name { flex: 0 0 42%; overflow: hidden; color: var(--text-dim); font-family: var(--font-gurmukhi); font-size: 0.72rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .break-bar { flex: 1; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
  .break-fill { height: 100%; border-radius: 99px; background: var(--green); transition: width 0.8s var(--fluid-curve); }
  .break-fill.low { background: var(--red); }
  .break-fill.mid { background: var(--amber); }
  .break-score { flex: none; min-width: 44px; color: var(--text-dim); font-size: 0.68rem; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }

  .review-list { display: flex; flex-direction: column; gap: 6px; max-width: 620px; margin: 14px auto 0; text-align: left; }
  .review-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.02);
    font-family: var(--font-gurmukhi);
    text-align: left;
    transition: all 0.3s var(--fluid-curve);
  }
  .review-item:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: rgba(255, 255, 255, 0.05); transform: translateX(3px); }
  .rv-num { flex: none; color: var(--text-dim); font-size: 0.68rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .rv-verdict { flex: none; font-size: 0.85rem; font-weight: 900; }
  .rv-verdict.rv-good { color: var(--green); }
  .rv-verdict.rv-bad { color: var(--red); }
  .rv-verdict.rv-skip { color: var(--text-dim); }
  .rv-text { flex: 1; overflow: hidden; color: var(--text-bold); font-size: 0.76rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .rv-flag { flex: none; color: var(--amber); font-size: 0.8rem; }

  body[data-theme="CLASSIC"] .flag-btn { border-color: rgba(11, 74, 168, 0.18); background: rgba(11, 86, 197, 0.05); }
  body[data-theme="CLASSIC"] .btn-prev { border-color: rgba(11, 74, 168, 0.16); background: rgba(11, 86, 197, 0.04); }
  body[data-theme="CLASSIC"] .stat-box, body[data-theme="CLASSIC"] .review-item { border-color: rgba(11, 74, 168, 0.14); background: rgba(11, 86, 197, 0.035); }
  body[data-theme="CLASSIC"] .break-bar { background: rgba(11, 74, 168, 0.12); }
  body[data-theme="CLASSIC"] .review-item:hover { background: rgba(11, 86, 197, 0.08); }

  /* ---------- CLASSIC (light) colorway — matches lecture deck legacy palette ---------- */
  html:has(body[data-theme="CLASSIC"]) { background: #f8fbff; }
  body[data-theme="CLASSIC"] { background: linear-gradient(145deg, #f8fbff 0%, #eef4ff 100%); }

          options: [

            { t: { pa: "Old (ਪੁਰਾਣਾ)", en: "Old" }, correct: false,

            { t: { pa: "Historic (ਇਤਿਹਾਸਕ)", en: "Historic" }, correct: false,

          ],
          objective: { pa: "Antonym ਜਾਲ: ਵਿਕਲਪਾਂ ਵਿੱਚ ਅਕਸਰ ਸਮਾਨਾਰਥੀ ਲੁਕੇ ਹੁੰਦੇ ਹਨ। ਪਹਿਲਾਂ ਹਰ ਵਿਕਲਪ ਨੂੰ 'ਸਮਾਨ' ਜਾਂ 'ਉਲਟ' ਵਿੱਚ ਵੰਡੋ, ਫਿਰ ਚੁਣੋ।", en: "Antonym trap: options often hide synonyms. First sort each option into 'same' vs 'opposite', then pick." }
        },
        {
          id: "ENG-VOC-03", ch: "Vocabulary · Idioms", competency: "Understanding", diff: "Medium",
          prompt: { pa: "ਮੁਹਾਵਰੇ \"once in a blue moon\" ਦਾ ਕੀ ਅਰਥ ਹੈ?", en: "What does the idiom \"once in a blue moon\" mean?" },
          options: [

            { t: { pa: "ਹਰ ਰਾਤ (every night)", en: "Every night" }, correct: false,
              r: { pa: "ਚੰਦ ਹਰ ਰਾਤ ਦਿਸਦਾ ਹੈ ਪਰ ਮੁਹਾਵਰਾ ਦੁਰਲੱਭਤਾ ਦੱਸਦਾ ਹੈ — ਸ਼ਾਬਦਿਕ ਅਰਥ ਦਾ ਜਾਲ।", en: "The moon appears nightly, but the idiom is about rarity — a literal-meaning trap." } },
            { t: { pa: "ਮਹੀਨੇ ਵਿੱਚ ਇੱਕ ਨਿਸ਼ਚਿਤ ਵਾਰ", en: "At a fixed time every month" }, correct: false,
              r: { pa: "ਮੁਹਾਵਰਾ ਕਿਸੇ ਸਮਾਂ-ਸਾਰਣੀ ਬਾਰੇ ਨਹੀਂ, ਦੁਰਲੱਭਤਾ ਬਾਰੇ ਹੈ।", en: "The idiom is not about a schedule; it is about rarity." } },
            { t: { pa: "ਪੂਰਨਮਾਸ਼ੀ ਦੌਰਾਨ (during a full moon)", en: "During a full moon" }, correct: false,
              r: { pa: "ਮੁਹਾਵਰੇ ਸ਼ਾਬਦਿਕ ਨਹੀਂ ਹੁੰਦੇ — ਚੰਦ ਸਿਰਫ਼ ਦੁਰਲੱਭਤਾ ਦਾ ਪ੍ਰਤੀਕ ਹੈ।", en: "Idioms are not literal — the moon here is only a symbol of rarity." } }
          ],
          objective: { pa: "ਮੁਹਾਵਰਿਆਂ ਦੇ ਅਰਥ ਗ਼ੈਰ-ਸ਼ਾਬਦਿਕ ਹੁੰਦੇ ਹਨ। ਬੋਰਡ ਦੇ ਪਸੰਦੀਦਾ: once in a blue moon (ਕਦੇ-ਕਦਾਈਂ), a piece of cake (ਬਹੁਤ ਸੌਖਾ), at the eleventh hour (ਆਖ਼ਰੀ ਮੌਕੇ)।", en: "Idioms carry non-literal meanings. Board favourites: once in a blue moon (rarely), a piece of cake (very easy), at the eleventh hour (at the last moment)." }
        },
        {
          id: "ENG-GR-02", ch: "Grammar · Voice", competency: "Analysis", diff: "Medium",
          prompt: { pa: "\"The letter was written by Riya.\" — ਇਹ ਵਾਕ ਕਿਸ voice ਵਿੱਚ ਹੈ?", en: "\"The letter was written by Riya.\" — Which voice is this sentence in?" },
          options: [
            { t: { pa: "Passive Voice", en: "Passive Voice" }, correct: true,
              r: { pa: "ਕਰਮ (the letter) ਵਾਕ ਦਾ subject ਬਣਿਆ ਹੈ ਅਤੇ ਬਣਤਰ 'was + written (V3) + by' ਹੈ — ਇਹ passive ਦੀ ਪਛਾਣ ਹੈ।", en: "The object (the letter) is the subject, with 'was + written (V3) + by' — the passive structure." } },
            { t: { pa: "Active Voice", en: "Active Voice" }, correct: false,
              r: { pa: "Active ਹੁੰਦਾ: \"Riya wrote the letter.\" — ਕਰਤਾ ਪਹਿਲਾਂ ਆਉਂਦਾ ਹੈ।", en: "Active would be: \"Riya wrote the letter.\" — the doer comes first." } },
            { t: { pa: "Indirect Speech", en: "Indirect Speech" }, correct: false,
              r: { pa: "Speech (direct/indirect) ਕਹੇ ਗਏ ਸ਼ਬਦਾਂ ਬਾਰੇ ਹੈ — ਇੱਥੇ ਕੋਈ ਕਥਨ ਨਹੀਂ।", en: "Speech (direct/indirect) is about quoting words — there's no quotation here." } },
            { t: { pa: "Imperative Sentence", en: "Imperative Sentence" }, correct: false,
              r: { pa: "Imperative ਹੁਕਮ/ਬੇਨਤੀ ਹੁੰਦਾ ਹੈ (\"Write the letter!\") — ਇਹ ਬਿਆਨ ਹੈ।", en: "An imperative gives a command (\"Write the letter!\") — this is a statement." } }
          ],
          objective: { pa: "Passive ਪਛਾਣ: object ਅੱਗੇ + be-verb + V3 (+ by ਕਰਤਾ)। ਬੋਰਡ ਪ੍ਰੀਖਿਆ ਵਿੱਚ voice ਬਦਲਣ ਦੇ ਪ੍ਰਸ਼ਨ ਆਮ ਹਨ।", en: "Passive test: object first + be-verb + V3 (+ by agent). Voice transformation is a frequent board exam task." }
        },
        {
          id: "ENG-COM-01", ch: "Comprehension", competency: "Analysis", diff: "Medium",
          prompt: { pa: "\"Although it was raining heavily, the farmers continued sowing.\" — ਵਾਕ ਦਾ ਭਾਵ ਕੀ ਹੈ?", en: "\"Although it was raining heavily, the farmers continued sowing.\" — What does the sentence imply?" },
          options: [
            { t: { pa: "ਮੀਂਹ ਦੇ ਬਾਵਜੂਦ ਕਿਸਾਨਾਂ ਨੇ ਬਿਜਾਈ ਜਾਰੀ ਰੱਖੀ", en: "Despite the rain, the farmers kept sowing" }, correct: true,
              r: { pa: "'Although' ਵਿਰੋਧ ਦਿਖਾਉਂਦਾ ਹੈ — ਰੁਕਾਵਟ ਦੇ ਬਾਵਜੂਦ ਕੰਮ ਜਾਰੀ ਰਿਹਾ।", en: "'Although' signals contrast — the action continued despite the obstacle." } },
            { t: { pa: "ਮੀਂਹ ਕਾਰਨ ਬਿਜਾਈ ਰੁਕ ਗਈ", en: "The rain stopped the sowing" }, correct: false,
              r: { pa: "'Continued' ਸਾਫ਼ ਦੱਸਦਾ ਹੈ ਕਿ ਕੰਮ ਰੁਕਿਆ ਨਹੀਂ।", en: "'Continued' clearly says the work did not stop." } },
            { t: { pa: "ਕਿਸਾਨਾਂ ਨੇ ਮੀਂਹ ਦੀ ਉਡੀਕ ਕੀਤੀ", en: "The farmers waited for rain" }, correct: false,
              r: { pa: "ਮੀਂਹ ਪਹਿਲਾਂ ਹੀ ਪੈ ਰਿਹਾ ਸੀ — ਉਡੀਕ ਦੀ ਗੱਲ ਨਹੀਂ।", en: "It was already raining — no waiting involved." } },
            { t: { pa: "ਮੀਂਹ ਹਲਕਾ ਸੀ", en: "The rain was light" }, correct: false,
              r: { pa: "'Heavily' ਦਾ ਮਤਲਬ ਤੇਜ਼ ਮੀਂਹ ਹੈ, ਹਲਕਾ ਨਹੀਂ।", en: "'Heavily' means intense rain, not light." } }
          ],
          objective: { pa: "'Although/though/even though' = ਵਿਰੋਧ ਜੋੜਕ (contrast connector)। ਮੁੱਖ ਵਾਕ ਦੀ ਕਿਰਿਆ ਹੀ ਅਸਲ ਨਤੀਜਾ ਦੱਸਦੀ ਹੈ।", en: "'Although/though/even though' are contrast connectors. The main clause verb carries the actual outcome." }
        }
      ]
    }
  };

  /* ---------------- State ---------------- */
  const STORE_KEY = "bolo_mcq_v1";
  const THEME_KEY = "bolo.theme.v1";
  const THEMES = {
    NEON: {
      label: "Neon",
      subjectAccents: { SCIENCE: "#00e5ff", MATH: "#2ecc71", ENGLISH: "#b026ff" }
    },
    CLASSIC: {
      label: "Classic",
      subjectAccents: { SCIENCE: "#0b56c5", MATH: "#f26a21", ENGLISH: "#179c65" }
    }
  };
  let subject = "SCIENCE";
  let lang = "pa";
  let theme = "NEON";
  let qIndex = 0;
  let answers = {};   // { [qid]: pickedIndex }
  let struck = {};    // { [qid]: { [optIndex]: true } }
  let flags = {};     // { [qid]: true } — marked for review
  let times = {};     // { [qid]: ms spent before answering }
  let order = null;   // null = bank order; array of indices when shuffled
  let optOrders = {}; // { [qid]: permutation } — options shuffled per run to kill position bias
  let qShownAt = Date.now();
  let finished = false;

  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY)) || {};
    if (saved.lang === "en" || saved.lang === "pa") lang = saved.lang;
    if (BANKS[saved.subject]) subject = saved.subject;
  } catch (e) {}
  try {
    const savedTheme = JSON.parse(localStorage.getItem(THEME_KEY)) || {};
    if (THEMES[savedTheme.theme]) theme = savedTheme.theme;
  } catch (e) {}

  const qCard = document.getElementById("qCard");
  const progressTrack = document.getElementById("progressTrack");
  const scoreVal = document.getElementById("scoreVal");
  const logoDot = document.getElementById("logoDot");
  const auraBleed = document.getElementById("auraBleed");
  const announcer = document.getElementById("ariaAnnouncer");
  const themePill = document.getElementById("themePill");

  const bank = () => BANKS[subject];
  const questions = () => {
    const qs = bank().questions;
    return order ? order.map(i => qs[i]) : qs;
  };
  const q = () => questions()[qIndex];
  function opts(qq) {
    let ord = optOrders[qq.id];
    if (!ord) {
      ord = qq.options.map((_, i) => i);
      for (let i = ord.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [ord[i], ord[j]] = [ord[j], ord[i]];
      }
      optOrders[qq.id] = ord;
    }
    return ord.map(i => qq.options[i]);
  }
  const primary = obj => obj[lang];
  const secondary = obj => obj[lang === "pa" ? "en" : "pa"];
  const activeAccent = () => THEMES[theme].subjectAccents[subject] || "#00e5ff";

  function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ subject, lang })); } catch (e) {} }
  function persistTheme() { try { localStorage.setItem(THEME_KEY, JSON.stringify({ theme })); } catch (e) {} }
  function updateThemePill() {
    if (!themePill) return;
    const label = THEMES[theme].label;
    themePill.textContent = "Theme: " + label;
    themePill.setAttribute("aria-label", "Switch color theme. Current: " + label);
  }
  function applyTheme(themeName, announce) {
    theme = THEMES[themeName] ? themeName : "NEON";
    document.body.dataset.theme = theme;
    updateThemePill();
    persistTheme();
    if (announce) announcer.textContent = "Theme " + THEMES[theme].label;
    render();
  }

  function applyAccent() {
    const accent = activeAccent();
    document.documentElement.style.setProperty("--accent", accent);
    auraBleed.style.background = "radial-gradient(ellipse at center, " + accent + "22 0%, " + accent + "0d 40%, transparent 72%)";
  }

  function scoreParts() {
    let correct = 0, attempted = 0;
    questions().forEach((qq, i) => {
      const picked = answers[qq.id];
      if (picked === undefined) return;
      attempted++;
      if (opts(qq)[picked].correct) correct++;
    });
    return { correct, attempted };
  }

  function renderScore() {
    const s = scoreParts();
    scoreVal.textContent = s.correct + " / " + s.attempted;
  }

  function renderProgress() {
    progressTrack.innerHTML = "";
    questions().forEach((qq, i) => {
      const seg = document.createElement("button");
      seg.type = "button";
      seg.className = "progress-seg";
      seg.dataset.jump = i;
      const picked = answers[qq.id];
      if (picked !== undefined) seg.classList.add(opts(qq)[picked].correct ? "seen-correct" : "seen-wrong");
      if (flags[qq.id]) seg.classList.add("flagged");
      if (i === qIndex && !finished) seg.classList.add("current");
      seg.setAttribute("aria-label", "Go to question " + (i + 1) +
        (picked !== undefined ? (opts(qq)[picked].correct ? " (correct)" : " (incorrect)") : " (unanswered)") +
        (flags[qq.id] ? ", flagged" : ""));
      progressTrack.appendChild(seg);
    });
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  function renderQuestion() {
    const qq = q();
    const picked = answers[qq.id];
    const isAnswered = picked !== undefined;
    const strikes = struck[qq.id] || {};
    const langBtnLabel = lang === "pa" ? "EN ⇄ ਪੰਜਾਬੀ" : "ਪੰਜਾਬੀ ⇄ EN";

    let html = '<div class="q-meta">' +
      '<span class="meta-rune hot">' + esc(primary(bank().label)) + '</span>' +
      '<span class="meta-rune">' + esc(qq.ch) + '</span>' +
      '<span class="meta-rune">' + esc(qq.competency) + '</span>' +
      (qq.diff ? '<span class="meta-rune diff-' + qq.diff.toLowerCase() + '">' + esc(qq.diff) + '</span>' : '') +
      '<button class="flag-btn' + (flags[qq.id] ? " active" : "") + '" type="button" data-flag aria-pressed="' + (flags[qq.id] ? "true" : "false") + '" aria-label="Flag question for review">' + (flags[qq.id] ? "⚑ Flagged" : "⚐ Flag") + '</button>' +
      '<button class="lang-flip" type="button" data-flip-lang>' + langBtnLabel + '</button>' +
      '</div>' +
      '<div class="q-prompt">' + primary(qq.prompt) + '</div>' +
      '<div class="q-prompt-sub">' + secondary(qq.prompt) + '</div>';

    const letters = ["A", "B", "C", "D", "E"];
    const shown = opts(qq);
    shown.forEach((opt, i) => {
      let optClass = "option";
      let rowClass = "option-row";
      let strikeClass = "strike-btn";
      if (strikes[i] && !isAnswered) { rowClass += " struck"; strikeClass += " active"; }
      if (isAnswered) {
        if (opt.correct) optClass += " correct";
        else if (picked === i) optClass += " incorrect";
      }
      const subT = secondary(opt.t) !== primary(opt.t) ? '<span class="opt-sub">' + secondary(opt.t) + '</span>' : '';
      html += '<div class="' + rowClass + '">' +
        '<button class="' + strikeClass + '" type="button" data-strike="' + i + '" aria-label="Rule out option ' + letters[i] + '" ' + (isAnswered ? "disabled" : "") + '>✕</button>' +
        '<button class="' + optClass + '" type="button" data-pick="' + i + '" ' + (isAnswered ? "disabled" : "") + '>' +
        '<span class="opt-letter">' + letters[i] + '.</span>' +
        '<span class="opt-text">' + primary(opt.t) + subT + '</span>' +
        '</button></div>';
    });

    if (isAnswered) {
      const wasCorrect = shown[picked].correct;
      html += '<div class="feedback">' +
        '<div class="verdict ' + (wasCorrect ? "good" : "bad") + '">' +
        (wasCorrect ? (lang === "pa" ? "✓ ਸਹੀ ਉੱਤਰ!" : "✓ Correct!") : (lang === "pa" ? "✕ ਗਲਤ ਉੱਤਰ" : "✕ Incorrect")) +
        '</div>';
      shown.forEach((opt, i) => {
        let rClass = "rationale";
        if (opt.correct) rClass += " good";
        else if (picked === i) rClass += " bad";
        html += '<div class="' + rClass + '"><strong>' + letters[i] + '.</strong> ' + primary(opt.r) + '</div>';
      });
      html += '<div class="objective"><div class="objective-title">' +
        (lang === "pa" ? "ਵਿੱਦਿਅਕ ਉਦੇਸ਼ · Educational Objective" : "Educational Objective · ਵਿੱਦਿਅਕ ਉਦੇਸ਼") +
        '</div><div class="objective-body">' + primary(qq.objective) + '</div></div></div>';
    }

    const isLast = qIndex === questions().length - 1;
    const total = questions().length;
    const answeredCount = questions().filter(x => answers[x.id] !== undefined).length;
    const nextLabel = isLast ? (lang === "pa" ? "ਨਤੀਜਾ ਦੇਖੋ" : "See Results") : (
      isAnswered ? (lang === "pa" ? "ਅਗਲਾ ਪ੍ਰਸ਼ਨ" : "Next Question") : (lang === "pa" ? "ਛੱਡੋ" : "Skip"));
    html += '<div class="action-bar">' +
      '<button class="btn-prev" type="button" data-prev ' + (qIndex === 0 ? "disabled" : "") + '>◀ ' + (lang === "pa" ? "ਪਿਛਲਾ" : "Prev") + '</button>' +
      '<span class="q-counter">' + (lang === "pa" ? "ਪ੍ਰਸ਼ਨ" : "Question") + " " + (qIndex + 1) + " / " + total + '</span>' +
      (answeredCount === total && !isLast ? '<button class="results-link" type="button" data-finish>' + (lang === "pa" ? "ਨਤੀਜਾ ਦੇਖੋ ▸" : "See Results ▸") + '</button>' : '') +
      '<button class="btn-next" type="button" data-next>' + nextLabel + ' <span>▶</span></button>' +
      '</div>';

    qCard.innerHTML = html;
    qCard.classList.remove("swap");
    void qCard.offsetWidth;
    qCard.classList.add("swap");
  }

  function fmtTime(ms) {
    const s = Math.round(ms / 1000);
    return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s";
  }

  function renderSummary() {
    const qs = questions();
    const s = scoreParts();
    const total = qs.length;
    const skipped = total - s.attempted;
    const wrong = s.attempted - s.correct;
    const pct = total ? Math.round((s.correct / total) * 100) : 0;
    const accuracy = s.attempted ? Math.round((s.correct / s.attempted) * 100) : 0;
    const timedIds = qs.filter(x => times[x.id] !== undefined && answers[x.id] !== undefined);
    const avgMs = timedIds.length ? timedIds.reduce((a, x) => a + times[x.id], 0) / timedIds.length : 0;

    const heading = pct >= 80 ? (lang === "pa" ? "ਸ਼ਾਨਦਾਰ ਪ੍ਰਦਰਸ਼ਨ!" : "Outstanding!") :
      pct >= 50 ? (lang === "pa" ? "ਵਧੀਆ ਕੋਸ਼ਿਸ਼!" : "Good effort!") :
      (lang === "pa" ? "ਦੁਬਾਰਾ ਅਭਿਆਸ ਕਰੋ" : "Keep practising");
    const body = lang === "pa"
      ? "ਤੁਸੀਂ " + total + " ਵਿੱਚੋਂ " + s.correct + " ਪ੍ਰਸ਼ਨ ਸਹੀ ਕੀਤੇ। ਹਰ ਵਿਆਖਿਆ ਨੂੰ ਦੁਬਾਰਾ ਪੜ੍ਹਨਾ ਸਭ ਤੋਂ ਤੇਜ਼ ਰੀਵੀਜ਼ਨ ਹੈ।"
      : "You answered " + s.correct + " of " + total + " correctly. Re-reading each rationale is the fastest revision.";

    let html = '<div class="summary">' +
      '<div class="summary-orb"><span class="summary-score">' + pct + '%</span></div>' +
      '<h2>' + heading + '</h2><p>' + body + '</p>' +
      '<div class="stat-grid">' +
      '<div class="stat-box"><span class="stat-num" style="color:var(--green)">' + s.correct + '</span><span class="stat-label">' + (lang === "pa" ? "ਸਹੀ" : "Correct") + '</span></div>' +
      '<div class="stat-box"><span class="stat-num" style="color:var(--red)">' + wrong + '</span><span class="stat-label">' + (lang === "pa" ? "ਗਲਤ" : "Incorrect") + '</span></div>' +
      '<div class="stat-box"><span class="stat-num">' + skipped + '</span><span class="stat-label">' + (lang === "pa" ? "ਛੱਡੇ" : "Skipped") + '</span></div>' +
      '<div class="stat-box"><span class="stat-num">' + accuracy + '%</span><span class="stat-label">' + (lang === "pa" ? "ਸ਼ੁੱਧਤਾ" : "Accuracy") + '</span></div>' +
      (avgMs ? '<div class="stat-box"><span class="stat-num">' + fmtTime(avgMs) + '</span><span class="stat-label">' + (lang === "pa" ? "ਔਸਤ ਸਮਾਂ/ਪ੍ਰਸ਼ਨ" : "Avg Time/Q") + '</span></div>' : '') +
      '</div>';

    // per-chapter breakdown
    const byCh = {};
    qs.forEach(x => {
      const key = x.ch;
      byCh[key] = byCh[key] || { total: 0, correct: 0 };
      byCh[key].total++;
      const p = answers[x.id];
      if (p !== undefined && opts(x)[p].correct) byCh[key].correct++;
    });
    html += '<div class="break-section"><div class="break-title">' + (lang === "pa" ? "ਅਧਿਆਇ ਅਨੁਸਾਰ ਪ੍ਰਦਰਸ਼ਨ" : "Performance by Chapter") + '</div>';
    Object.keys(byCh).forEach(key => {
      const c = byCh[key];
      const p = Math.round((c.correct / c.total) * 100);
      const cls = p >= 70 ? "" : p >= 40 ? " mid" : " low";
      html += '<div class="break-row"><span class="break-name">' + esc(key) + '</span>' +
        '<span class="break-bar"><span class="break-fill' + cls + '" style="width:' + p + '%"></span></span>' +
        '<span class="break-score">' + c.correct + '/' + c.total + '</span></div>';
    });
    html += '</div>';

    // per-difficulty breakdown
    const byDiff = {};
    qs.forEach(x => {
      const key = x.diff || "—";
      byDiff[key] = byDiff[key] || { total: 0, correct: 0 };
      byDiff[key].total++;
      const p = answers[x.id];
      if (p !== undefined && opts(x)[p].correct) byDiff[key].correct++;
    });
    const diffOrder = ["Easy", "Medium", "Hard", "—"].filter(k => byDiff[k]);
    if (diffOrder.length > 1) {
      html += '<div class="break-section"><div class="break-title">' + (lang === "pa" ? "ਮੁਸ਼ਕਲ ਪੱਧਰ ਅਨੁਸਾਰ" : "Performance by Difficulty") + '</div>';
      diffOrder.forEach(key => {
        const c = byDiff[key];
        const p = Math.round((c.correct / c.total) * 100);
        const cls = p >= 70 ? "" : p >= 40 ? " mid" : " low";
        html += '<div class="break-row"><span class="break-name">' + esc(key) + '</span>' +
          '<span class="break-bar"><span class="break-fill' + cls + '" style="width:' + p + '%"></span></span>' +
          '<span class="break-score">' + c.correct + '/' + c.total + '</span></div>';
      });
      html += '</div>';
    }

    // review list — tap any question to revisit its rationale
    html += '<div class="break-section"><div class="break-title">' + (lang === "pa" ? "ਪ੍ਰਸ਼ਨ ਸਮੀਖਿਆ — ਵਿਆਖਿਆ ਲਈ ਛੂਹੋ" : "Question Review — tap to revisit") + '</div><div class="review-list">';
    qs.forEach((x, i) => {
      const p = answers[x.id];
      const v = p === undefined ? '<span class="rv-verdict rv-skip">—</span>' :
        (opts(x)[p].correct ? '<span class="rv-verdict rv-good">✓</span>' : '<span class="rv-verdict rv-bad">✕</span>');
      html += '<button class="review-item" type="button" data-review="' + i + '">' +
        '<span class="rv-num">Q' + (i + 1) + '</span>' + v +
        '<span class="rv-text">' + primary(x.prompt) + '</span>' +
        (flags[x.id] ? '<span class="rv-flag">⚑</span>' : '') +
        '</button>';
    });
    html += '</div></div>';

    html += '<div class="summary-actions" style="margin-top:26px;">' +
      '<button class="btn-next" type="button" data-restart>↻ ' + (lang === "pa" ? "ਦੁਬਾਰਾ ਅਭਿਆਸ" : "Practice Again") + '</button>' +
      '<button class="btn-next" type="button" data-shuffle>⤨ ' + (lang === "pa" ? "ਮਿਲਾ ਕੇ ਦੁਬਾਰਾ" : "Shuffle & Retry") + '</button>' +
      '<a class="btn-next" href="index.html" style="text-decoration:none;">◂ ' + (lang === "pa" ? "ਮੁੱਖ ਮੇਨੂ" : "Main Menu") + '</a>' +
      '</div></div>';

    qCard.innerHTML = html;
    announcer.textContent = heading + " " + pct + "%";
  }

  function render() {
    applyAccent();
    renderScore();
    renderProgress();
    if (finished) renderSummary(); else renderQuestion();
  }

  function resetRun(shuffle) {
    qIndex = 0; answers = {}; struck = {}; flags = {}; times = {}; optOrders = {}; finished = false;
    if (shuffle) {
      const n = bank().questions.length;
      order = Array.from({ length: n }, (_, i) => i);
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
    } else {
      order = null;
    }
    qShownAt = Date.now();
  }

  function setSubject(s) {
    if (!BANKS[s] || s === subject) return;
    subject = s;
    resetRun(false);
    document.querySelectorAll("[data-subject]").forEach(b => b.classList.toggle("active", b.dataset.subject === subject));
    logoDot.textContent = ".MCQ";
    persist();
    render();
  }

  function goTo(i) {
    if (i < 0 || i >= questions().length) return;
    qIndex = i;
    finished = false;
    qShownAt = Date.now();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  document.body.addEventListener("click", e => {
    const themeBtn = e.target.closest("[data-toggle-theme]");
    if (themeBtn) {
      const nextTheme = theme === "NEON" ? "CLASSIC" : "NEON";
      applyTheme(nextTheme, true);
      return;
    }

    const subjBtn = e.target.closest("[data-subject]");
    if (subjBtn) { setSubject(subjBtn.dataset.subject); return; }

    const flip = e.target.closest("[data-flip-lang]");
    if (flip) { lang = lang === "pa" ? "en" : "pa"; persist(); render(); return; }

    const flagBtn = e.target.closest("[data-flag]");
    if (flagBtn) {
      const qq = q();
      flags[qq.id] = !flags[qq.id];
      announcer.textContent = flags[qq.id] ? "Question flagged for review" : "Flag removed";
      render();
      return;
    }

    const jumpSeg = e.target.closest("[data-jump]");
    if (jumpSeg) { goTo(parseInt(jumpSeg.dataset.jump, 10)); return; }

    const reviewBtn = e.target.closest("[data-review]");
    if (reviewBtn) { goTo(parseInt(reviewBtn.dataset.review, 10)); return; }

    const finishBtn = e.target.closest("[data-finish]");
    if (finishBtn) { finished = true; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }

    const prevBtn = e.target.closest("[data-prev]");
    if (prevBtn && !prevBtn.disabled) { goTo(qIndex - 1); return; }

    const strikeBtn = e.target.closest("[data-strike]");
    if (strikeBtn && !strikeBtn.disabled) {
      const qq = q();
      const i = parseInt(strikeBtn.dataset.strike, 10);
      struck[qq.id] = struck[qq.id] || {};
      struck[qq.id][i] = !struck[qq.id][i];
      renderQuestion();
      return;
    }

    const pickBtn = e.target.closest("[data-pick]");
    if (pickBtn && !pickBtn.disabled) {
      const qq = q();
      const i = parseInt(pickBtn.dataset.pick, 10);
      if ((struck[qq.id] || {})[i]) return; // struck options are ruled out
      answers[qq.id] = i;
      times[qq.id] = (times[qq.id] || 0) + (Date.now() - qShownAt);
      const wasCorrect = opts(qq)[i].correct;
      announcer.textContent = wasCorrect ? "Correct" : "Incorrect";
      render();
      return;
    }

    const nextBtn = e.target.closest("[data-next]");
    if (nextBtn && !nextBtn.disabled) {
      if (qIndex < questions().length - 1) { qIndex++; qShownAt = Date.now(); render(); }
      else { finished = true; render(); }
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    const shuffleBtn = e.target.closest("[data-shuffle]");
    if (shuffleBtn) {
      resetRun(true);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    const restartBtn = e.target.closest("[data-restart]");
    if (restartBtn) {
      resetRun(false);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
  });

  document.addEventListener("keydown", e => {
    if (finished) return;
    const letters = { a: 0, b: 1, c: 2, d: 3 };
    const key = e.key.toLowerCase();
    if (key in letters) {
      const i = letters[key];
      const qq = q();
      if (answers[qq.id] === undefined && opts(qq)[i] && !(struck[qq.id] || {})[i]) {
        answers[qq.id] = i;
        times[qq.id] = (times[qq.id] || 0) + (Date.now() - qShownAt);
        render();
      }
    } else if (key === "f") {
      const qq = q();
      flags[qq.id] = !flags[qq.id];
      render();
    } else if (key === "arrowleft") {
      if (qIndex > 0) goTo(qIndex - 1);
    } else if (key === "enter" || key === "arrowright") {
      if (qIndex < questions().length - 1) { qIndex++; qShownAt = Date.now(); render(); }
      else if (answers[q().id] !== undefined) { finished = true; render(); }
    }
  });

  document.querySelectorAll("[data-subject]").forEach(b => b.classList.toggle("active", b.dataset.subject === subject));
  applyTheme(theme, false);
})();
</script>
<script defer src="assets/bmc-coffee.js"></script>
