          trap: { pa: "'A' ਅਤੇ 'an' ਅਗਲੇ ਅੱਖਰ ਦੇ ਨਾਂ ਨਾਲ ਨਹੀਂ, ਉਸਦੀ ਆਵਾਜ਼ ਨਾਲ ਚੁਣੇ ਜਾਂਦੇ ਹਨ।", en: "Choose 'a' or 'an' by the next word's sound, not just its first written letter." },
          options: [
            { t: { pa: "an", en: "an" }, correct: true, r: { pa: "'Engineer' ਸਵਰ ਦੀ ਆਵਾਜ਼ ਨਾਲ ਸ਼ੁਰੂ ਹੁੰਦਾ ਹੈ, ਇਸ ਲਈ 'an' ਸਹੀ ਹੈ।", en: "'Engineer' begins with a vowel sound, so 'an' is correct." } },
            { t: { pa: "a", en: "a" }, correct: false, r: { pa: "'A' ਵਿਅੰਜਨ ਦੀ ਆਵਾਜ਼ ਤੋਂ ਪਹਿਲਾਂ ਆਉਂਦਾ ਹੈ; 'engineer' ਦੀ ਸ਼ੁਰੂਆਤੀ ਆਵਾਜ਼ ਸਵਰ ਹੈ।", en: "'A' comes before a consonant sound; 'engineer' begins with a vowel sound." } },
            { t: { pa: "the", en: "the" }, correct: false, r: { pa: "ਇੱਥੇ ਕਿਸੇ ਖ਼ਾਸ ਇੰਜੀਨੀਅਰ ਦੀ ਗੱਲ ਨਹੀਂ, ਇਸ ਲਈ definite article ਦੀ ਲੋੜ ਨਹੀਂ।", en: "The sentence does not identify a particular engineer, so a definite article is not needed." } },
            { t: { pa: "ਕੋਈ article ਨਹੀਂ", en: "no article" }, correct: false, r: { pa: "ਇਕਵਚਨ ਗਿਣਤੀਯੋਗ ਪੇਸ਼ੇ ਤੋਂ ਪਹਿਲਾਂ ਆਮ ਤੌਰ 'ਤੇ article ਲੱਗਦਾ ਹੈ।", en: "A singular countable profession normally needs an article." } }
          ],
          objective: { pa: "ਇਕਵਚਨ ਗਿਣਤੀਯੋਗ ਨਾਂਵ ਤੋਂ ਪਹਿਲਾਂ a/an ਲੱਗਦਾ ਹੈ। 'An' ਸਵਰ ਦੀ ਆਵਾਜ਼ ਤੋਂ ਪਹਿਲਾਂ ਅਤੇ 'a' ਵਿਅੰਜਨ ਦੀ ਆਵਾਜ਼ ਤੋਂ ਪਹਿਲਾਂ ਆਉਂਦਾ ਹੈ: an hour, a university.", en: "Use a/an before a singular countable noun. Use 'an' before a vowel sound and 'a' before a consonant sound: an hour, a university." }
        },
        {
          id: "ENG-GR-21", ch: "Grammar · Pronouns", competency: "Application", diff: "Easy",
          prompt: { pa: "ਸਹੀ ਸਰਵਨਾਮ ਚੁਣੋ: \"The teacher praised Meena and ______ for our project.\"", en: "Choose the correct pronoun: \"The teacher praised Meena and ______ for our project.\"" },
          hint: { pa: "ਅਧਿਆਪਕ ਨੇ ਕਿਸ ਦੀ ਪ੍ਰਸ਼ੰਸਾ ਕੀਤੀ? ਖਾਲੀ ਥਾਂ ਵਾਲਾ ਸਰਵਨਾਮ ਕਰਮ ਹੈ।", en: "Who did the teacher praise? The pronoun in the blank is an object." },
          trap: { pa: "'I' ਬੋਲਣ ਵਾਲੇ ਲਈ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ, ਪਰ ਇਸ ਵਾਕ ਵਿੱਚ ਸਰਵਨਾਮ ਕਿਰਿਆ ਦਾ ਕਰਮ ਹੈ।", en: "'I' names the speaker as a subject, but here the pronoun receives the action." },
          options: [
            { t: { pa: "me", en: "me" }, correct: true, r: { pa: "ਕਿਰਿਆ 'praised' ਦਾ ਕਰਮ ਹੋਣ ਕਰਕੇ object pronoun 'me' ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ।", en: "'Me' is the object pronoun because it receives the action of 'praised'." } },
            { t: { pa: "I", en: "I" }, correct: false, r: { pa: "'I' subject ਰੂਪ ਹੈ; ਇੱਥੇ ਕਰਮ ਰੂਪ 'me' ਚਾਹੀਦਾ ਹੈ।", en: "'I' is the subject form; this sentence needs the object form 'me'." } },
            { t: { pa: "my", en: "my" }, correct: false, r: { pa: "'My' ਮਾਲਕੀ ਦੱਸਦਾ ਹੈ ਅਤੇ ਇਸ ਤੋਂ ਬਾਅਦ ਨਾਂਵ ਆਉਂਦਾ ਹੈ।", en: "'My' shows possession and must be followed by a noun." } },
            { t: { pa: "mine", en: "mine" }, correct: false, r: { pa: "'Mine' ਮਾਲਕੀ ਵਾਲਾ ਸਰਵਨਾਮ ਹੈ, ਇਸਨੂੰ ਇੱਥੇ ਕਿਰਿਆ ਦਾ ਕਰਮ ਨਹੀਂ ਬਣਾਇਆ ਜਾ ਸਕਦਾ।", en: "'Mine' is a possessive pronoun, not the object needed after 'praised'." } }
          ],
          objective: { pa: "ਕਿਰਿਆ ਦੇ ਕਰਤਾ ਲਈ I/he/she/we/they; ਕਰਮ ਲਈ me/him/her/us/them ਵਰਤੋ। ਦੋ ਨਾਂਵ 'and' ਨਾਲ ਜੁੜੇ ਹੋਣ 'ਤੇ ਵੀ ਇਹੀ ਨਿਯਮ ਰਹਿੰਦਾ ਹੈ।", en: "Use I/he/she/we/they for subjects and me/him/her/us/them for objects. The same rule applies when two objects are joined by 'and'." }
        },
        {
          id: "ENG-GR-22", ch: "Grammar · Voice", competency: "Application", diff: "Easy",
          prompt: { pa: "ਵਾਕ ਦਾ ਸਹੀ passive ਰੂਪ ਚੁਣੋ: \"The school celebrates Independence Day every year.\"", en: "Choose the correct passive form: \"The school celebrates Independence Day every year.\"" },
          hint: { pa: "Passive ਵਿੱਚ Independence Day ਕਰਮ ਤੋਂ ਵਾਕ ਦਾ ਕਰਤਾ ਬਣਦਾ ਹੈ; present simple ਲਈ 'is + V3' ਵਰਤੋ।", en: "In the passive, Independence Day becomes the subject; use 'is + past participle' for the simple present." },
          trap: { pa: "'Celebrated' ਇਕੱਲਾ ਕਾਫ਼ੀ ਨਹੀਂ; passive ਵਾਕ ਵਿੱਚ ਸਹਾਇਕ ਕਿਰਿਆ ਵੀ ਲੋੜੀਂਦੀ ਹੈ।", en: "'Celebrated' alone is not enough; a passive sentence also needs a helping verb." },
          options: [
            { t: { pa: "Independence Day is celebrated by the school every year.", en: "Independence Day is celebrated by the school every year." }, correct: true, r: { pa: "Present simple passive ਦੀ ਬਣਤਰ is + V3 ਹੈ; celebrate ਦਾ V3 'celebrated' ਹੈ।", en: "The simple present passive is is + V3; the past participle of celebrate is celebrated." } },
            { t: { pa: "Independence Day celebrated the school every year.", en: "Independence Day celebrated the school every year." }, correct: false, r: { pa: "ਇਹ active simple past ਹੈ ਅਤੇ ਅਰਥ ਵੀ ਉਲਟ ਕਰ ਦਿੰਦਾ ਹੈ।", en: "This is active simple past and reverses who does the celebrating." } },
            { t: { pa: "Independence Day was celebrated by the school every year.", en: "Independence Day was celebrated by the school every year." }, correct: false, r: { pa: "'Every year' ਆਦਤ ਦੱਸਦਾ ਹੈ; simple past 'was' ਨਹੀਂ, simple present 'is' ਲੋੜੀਂਦਾ ਹੈ।", en: "'Every year' describes a regular practice, so use simple present 'is', not past 'was'." } },
            { t: { pa: "Independence Day is celebrate by the school every year.", en: "Independence Day is celebrate by the school every year." }, correct: false, r: { pa: "Passive ਵਿੱਚ be ਤੋਂ ਬਾਅਦ ਕਿਰਿਆ ਦਾ past participle 'celebrated' ਆਉਂਦਾ ਹੈ।", en: "A passive needs the past participle 'celebrated' after the form of be." } }
          ],
          objective: { pa: "Passive voice: ਕਰਮ + be (ਸਹੀ ਕਾਲ ਵਿੱਚ) + ਕਿਰਿਆ ਦਾ ਤੀਜਾ ਰੂਪ (V3)। 'By + ਕਰਤਾ' ਸਿਰਫ਼ ਉਦੋਂ ਜੋੜੋ ਜਦੋਂ ਕਰਤਾ ਦੱਸਣਾ ਲਾਭਦਾਇਕ ਹੋਵੇ।", en: "Passive voice: object + be (in the correct tense) + past participle (V3). Include 'by + agent' when naming the doer is useful." }
        },
        {
          id: "ENG-GR-23", ch: "Grammar · Modals", competency: "Application", diff: "Easy",
          prompt: { pa: "ਕਾਨੂੰਨੀ ਲਾਜ਼ਮੀ ਗੱਲ ਲਈ ਸਹੀ modal ਚੁਣੋ: \"You ______ wear a helmet while riding a two-wheeler; it is the law.\"", en: "Choose the modal for a legal requirement: \"You ______ wear a helmet while riding a two-wheeler; it is the law.\"" },
          hint: { pa: "ਸੰਕੇਤ ਹੈ ਕਿ ਇਹ ਸਿਰਫ਼ ਸਲਾਹ ਨਹੀਂ, ਕਾਨੂੰਨ ਦੀ ਲਾਜ਼ਮੀ ਸ਼ਰਤ ਹੈ।", en: "The clue says this is not merely advice; it is a legal requirement." },
          trap: { pa: "'Should' ਸਲਾਹ ਦਿੰਦਾ ਹੈ; ਵਾਕ ਵਿੱਚ ਕਾਨੂੰਨੀ ਫ਼ਰਜ਼ ਲਈ ਹੋਰ ਮਜ਼ਬੂਤ modal ਚਾਹੀਦਾ ਹੈ।", en: "'Should' gives advice; the sentence calls for a stronger modal expressing obligation." },
          options: [
            { t: { pa: "must", en: "must" }, correct: true, r: { pa: "'Must' ਮਜ਼ਬੂਤ ਲਾਜ਼ਮੀ ਫ਼ਰਜ਼ ਦੱਸਦਾ ਹੈ ਅਤੇ ਕਾਨੂੰਨ ਵਾਲੇ ਸੰਕੇਤ ਨਾਲ ਮੇਲ ਖਾਂਦਾ ਹੈ।", en: "'Must' expresses strong obligation and fits the legal requirement." } },
            { t: { pa: "might", en: "might" }, correct: false, r: { pa: "'Might' ਸੰਭਾਵਨਾ ਦੱਸਦਾ ਹੈ, ਲਾਜ਼ਮੀ ਨਿਯਮ ਨਹੀਂ।", en: "'Might' expresses possibility, not a requirement." } },
            { t: { pa: "could", en: "could" }, correct: false, r: { pa: "'Could' ਯੋਗਤਾ ਜਾਂ ਨਿਮਰ ਬੇਨਤੀ ਦੱਸ ਸਕਦਾ ਹੈ; ਇਹ ਕਾਨੂੰਨੀ ਫ਼ਰਜ਼ ਨਹੀਂ ਦੱਸਦਾ।", en: "'Could' can express ability or a polite request, not a legal obligation." } },
            { t: { pa: "would", en: "would" }, correct: false, r: { pa: "'Would' ਇੱਥੇ ਕਾਨੂੰਨੀ ਲਾਜ਼ਮੀਅਤ ਦਾ ਅਰਥ ਨਹੀਂ ਦਿੰਦਾ।", en: "'Would' does not express the legal obligation required here." } }
          ],
          objective: { pa: "Modals ਤੋਂ ਬਾਅਦ ਕਿਰਿਆ ਦਾ ਮੂਲ ਰੂਪ ਆਉਂਦਾ ਹੈ। Must = ਮਜ਼ਬੂਤ ਫ਼ਰਜ਼; should = ਸਲਾਹ; might = ਸੰਭਾਵਨਾ; could = ਸਮਰੱਥਾ ਜਾਂ ਨਿਮਰ ਬੇਨਤੀ।", en: "Use the base verb after a modal. Must = strong obligation; should = advice; might = possibility; could = ability or a polite request." }
        },
        {
          id: "ENG-GR-24", ch: "Grammar · Question Tags", competency: "Application", diff: "Easy",
          prompt: { pa: "ਸਹੀ question tag ਚੁਣੋ: \"They have finished the work, ______?\"", en: "Choose the correct question tag: \"They have finished the work, ______?\"" },
          hint: { pa: "ਮੁੱਖ ਵਾਕ ਸਕਾਰਾਤਮਕ ਹੈ; tag ਨਕਾਰਾਤਮਕ ਹੋਵੇਗਾ ਅਤੇ 'have' ਹੀ ਦੁਹਰਾਇਆ ਜਾਵੇਗਾ।", en: "The main statement is positive; use a negative tag and repeat the auxiliary 'have'." },
          trap: { pa: "Tag ਵਿੱਚ ਨਾਂਵ 'They' ਦੁਬਾਰਾ ਨਹੀਂ ਆਉਂਦਾ; ਇਸਦੀ ਥਾਂ ਸਰਵਨਾਮ 'they' ਵਰਤੋ।", en: "Do not repeat the noun in the tag; use the pronoun 'they'." },
          options: [
            { t: { pa: "haven't they?", en: "haven't they?" }, correct: true, r: { pa: "ਸਕਾਰਾਤਮਕ ਵਾਕ ਤੋਂ ਬਾਅਦ ਨਕਾਰਾਤਮਕ tag: have → haven't ਅਤੇ they → they।", en: "A positive statement takes a negative tag: have becomes haven't, and they stays they." } },
            { t: { pa: "have they?", en: "have they?" }, correct: false, r: { pa: "ਸਕਾਰਾਤਮਕ ਵਾਕ ਦੇ ਬਾਅਦ ਆਮ ਤੌਰ 'ਤੇ ਨਕਾਰਾਤਮਕ tag ਆਉਂਦਾ ਹੈ।", en: "A positive statement normally takes a negative tag." } },
            { t: { pa: "don't they?", en: "don't they?" }, correct: false, r: { pa: "ਮੁੱਖ ਵਾਕ ਵਿੱਚ ਸਹਾਇਕ ਕਿਰਿਆ 'have' ਹੈ; tag ਵਿੱਚ 'do' ਨਹੀਂ ਵਰਤਣਾ।", en: "The main clause uses the auxiliary 'have', so the tag must not use 'do'." } },
            { t: { pa: "haven't we?", en: "haven't we?" }, correct: false, r: { pa: "Tag ਵਿੱਚ ਮੁੱਖ ਵਾਕ ਵਾਲਾ ਕਰਤਾ 'they' ਹੀ ਸਰਵਨਾਮ ਵਜੋਂ ਰਹਿੰਦਾ ਹੈ।", en: "The tag uses the same subject as the statement: 'they'." } }
          ],
          objective: { pa: "Question tag ਦਾ ਨਿਯਮ: ਸਕਾਰਾਤਮਕ ਬਿਆਨ + ਨਕਾਰਾਤਮਕ tag; ਨਕਾਰਾਤਮਕ ਬਿਆਨ + ਸਕਾਰਾਤਮਕ tag। ਸਹਾਇਕ ਕਿਰਿਆ ਅਤੇ ਕਰਤਾ ਦਾ ਸਰਵਨਾਮ ਦੁਹਰਾਓ।", en: "Question-tag rule: positive statement + negative tag; negative statement + positive tag. Repeat the auxiliary and the subject pronoun." }
        },
        {

          hint: { pa: "ਅਜਿਹੀ ਥਾਂ ਦੀ ਕਲਪਨਾ ਕਰੋ ਜਿੱਥੇ ਸ਼ੋਰ ਜਾਂ ਝਗੜਾ ਨਾ ਹੋਵੇ।", en: "Picture a place without noise or disturbance." },

            { t: { pa: "busy", en: "busy" }, correct: false, r: { pa: "'Busy' ਕੰਮ ਜਾਂ ਰੁਝੇਵੇਂ ਬਾਰੇ ਹੈ, ਸ਼ਾਂਤੀ ਬਾਰੇ ਨਹੀਂ।", en: "'Busy' describes activity, not a peaceful atmosphere." } }
          ],

        },
        {
          id: "ENG-GR-25", ch: "Grammar · Tenses", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ ਕਿਰਿਆ-ਰੂਪ ਚੁਣੋ: \"My uncle ______ in Ludhiana since 2018, and he still lives there.\"", en: "Choose the correct verb form: \"My uncle ______ in Ludhiana since 2018, and he still lives there.\"" },
          hint: { pa: "'Since 2018' ਸ਼ੁਰੂਆਤੀ ਸਮਾਂ ਦੱਸਦਾ ਹੈ ਅਤੇ 'still lives there' ਦੱਸਦਾ ਹੈ ਕਿ ਗੱਲ ਹੁਣ ਤੱਕ ਜਾਰੀ ਹੈ।", en: "'Since 2018' gives the starting point, and 'still lives there' confirms the situation continues now." },
          trap: { pa: "'Lived' ਸਧਾਰਨ ਭੂਤ ਕਾਲ ਹੈ; 'still lives there' ਦੱਸਦਾ ਹੈ ਕਿ ਰਹਿਣਾ ਅਜੇ ਵੀ ਜਾਰੀ ਹੈ।", en: "'Lived' is simple past, but 'still lives there' says that the situation continues now." },
          options: [
            { t: { pa: "has lived", en: "has lived" }, correct: true, r: { pa: "ਇਕਵਚਨ 'My uncle' ਨਾਲ has ਆਉਂਦਾ ਹੈ; present perfect ਅਤੇ since 2018 ਮਿਲ ਕੇ ਅੱਜ ਤੱਕ ਦੀ ਰਹਾਇਸ਼ ਦੱਸਦੇ ਹਨ।", en: "The singular 'my uncle' takes has; the present perfect and 'since 2018' describe residence continuing up to now." } },
            { t: { pa: "lived", en: "lived" }, correct: false, r: { pa: "ਇਹ ਭੂਤ ਵਿੱਚ ਮੁੱਕੀ ਸਥਿਤੀ ਦੱਸਦਾ ਹੈ, ਜਦਕਿ ਵਾਕ ਵਿੱਚ ਹੁਣ ਤੱਕ ਰਹਿਣ ਦਾ ਭਾਵ ਹੈ।", en: "This suggests a completed past situation, but the sentence means he still lives there." } },
            { t: { pa: "have lived", en: "have lived" }, correct: false, r: { pa: "'My uncle' ਇਕਵਚਨ ਹੈ, ਇਸ ਲਈ 'have' ਦੀ ਥਾਂ 'has' ਲੱਗੇਗਾ।", en: "'My uncle' is singular, so use 'has', not 'have'." } },
            { t: { pa: "is living", en: "is living" }, correct: false, r: { pa: "Present continuous ਮੌਜੂਦਾ ਤੌਰ 'ਤੇ ਚੱਲ ਰਹੀ ਕਿਰਿਆ ਦੱਸਦਾ ਹੈ, ਪਰ 'since 2018' ਸ਼ੁਰੂਆਤੀ ਸਮੇਂ ਤੋਂ ਲਗਾਤਾਰ ਹਾਲਤ ਜੋੜਦਾ ਹੈ।", en: "The present continuous describes an action happening now; 'since 2018' connects the situation to its starting point." } }
          ],
          objective: { pa: "Present perfect: has/have + V3। Since ਸ਼ੁਰੂਆਤੀ ਸਮਾਂ ਦੱਸਦਾ ਹੈ ਅਤੇ for ਮਿਆਦ: since 2018, for six years.", en: "Present perfect: has/have + V3. Use since for a starting point and for for a duration: since 2018, for six years." }
        },
        {
          id: "ENG-GR-26", ch: "Grammar · Narration", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ indirect speech ਚੁਣੋ: Rita said to me, \"Do you know the answer?\"", en: "Choose the correct indirect speech: Rita said to me, \"Do you know the answer?\"" },
          hint: { pa: "ਇਹ yes/no ਸਵਾਲ ਹੈ। Indirect speech ਵਿੱਚ 'if' ਲਗਾਓ ਅਤੇ ਸਵਾਲ ਵਾਲਾ ਸ਼ਬਦ-ਕ੍ਰਮ ਸਧਾਰਨ ਬਿਆਨ ਬਣਾਓ।", en: "This is a yes/no question. Use 'if' and change the question word order to statement word order." },
          trap: { pa: "Indirect question ਵਿੱਚ 'if' ਤੋਂ ਬਾਅਦ 'do you know' ਨਹੀਂ, 'I knew' ਵਾਲਾ ਸਧਾਰਨ ਕ੍ਰਮ ਆਵੇਗਾ।", en: "An indirect question uses statement order after 'if', not the direct-question form 'do you know'." },
          options: [
            { t: { pa: "Rita asked me if I knew the answer.", en: "Rita asked me if I knew the answer." }, correct: true, r: { pa: "ਸਵਾਲ ਲਈ asked, yes/no ਲਈ if, 'you' ਦੀ ਥਾਂ I ਅਤੇ past reporting verb ਤੋਂ ਬਾਅਦ know ਦੀ ਥਾਂ knew।", en: "Use asked for the question, if for a yes/no question, change 'you' to 'I', and backshift know to knew." } },
            { t: { pa: "Rita asked me that did I know the answer.", en: "Rita asked me that did I know the answer." }, correct: false, r: { pa: "Yes/no indirect question ਵਿੱਚ 'that' ਨਹੀਂ ਅਤੇ helping verb ਕਰਤਾ ਤੋਂ ਪਹਿਲਾਂ ਨਹੀਂ ਆਉਂਦੀ।", en: "A yes/no indirect question uses 'if', not 'that', and does not invert the subject and auxiliary." } },
            { t: { pa: "Rita said me if I know the answer.", en: "Rita said me if I know the answer." }, correct: false, r: { pa: "ਕਿਸੇ ਨੂੰ ਸਵਾਲ ਕਰਨ ਲਈ 'asked me' ਵਰਤੋ; ਇੱਥੇ ਕਾਲ ਵੀ ਪਿੱਛੇ ਨਹੀਂ ਗਿਆ।", en: "Use 'asked me' to report a question; the tense has also not been backshifted." } },
            { t: { pa: "Rita asked that do I know the answer.", en: "Rita asked that do I know the answer." }, correct: false, r: { pa: "'That' ਤੋਂ ਬਾਅਦ direct question ਵਾਲਾ ਸ਼ਬਦ-ਕ੍ਰਮ ਨਹੀਂ ਆਉਂਦਾ।", en: "Do not use direct-question word order after 'that' in reported speech." } }
          ],
          objective: { pa: "Yes/no ਸਵਾਲ ਦਾ indirect ਰੂਪ: asked + object + if/whether + ਕਰਤਾ + ਕਿਰਿਆ। Past reporting verb ਤੋਂ ਬਾਅਦ ਅਕਸਰ ਕਾਲ ਇੱਕ ਕਦਮ ਪਿੱਛੇ ਜਾਂਦਾ ਹੈ।", en: "Report a yes/no question with asked + object + if/whether + subject + verb. After a past reporting verb, the tense often shifts back one step." }
        },
        {
          id: "ENG-GR-27", ch: "Grammar · Voice", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ passive ਵਾਕ ਚੁਣੋ: \"The flood damaged several fields last year.\"", en: "Choose the correct passive sentence: \"The flood damaged several fields last year.\"" },
          hint: { pa: "ਕਰਮ 'several fields' ਨੂੰ ਅੱਗੇ ਲਿਆਓ; 'last year' ਕਰਕੇ passive ਵੀ ਭੂਤ ਕਾਲ ਵਿੱਚ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ।", en: "Move the object 'several fields' to the front; 'last year' means the passive must also be in the past." },
          trap: { pa: "Past simple passive ਵਿੱਚ 'were' ਆਉਂਦਾ ਹੈ; ਮੂਲ ਵਾਕ ਦਾ ਕਰਤਾ 'the flood' ਬਹੁਵਚਨ ਨਹੀਂ।", en: "The simple past passive uses were here because the new subject 'several fields' is plural." },
          options: [
            { t: { pa: "Several fields were damaged by the flood last year.", en: "Several fields were damaged by the flood last year." }, correct: true, r: { pa: "ਬਹੁਵਚਨ ਕਰਤਾ 'several fields' + were + damaged (V3) = ਸਹੀ past passive।", en: "Plural subject 'several fields' + were + damaged (V3) forms the correct past passive." } },
            { t: { pa: "Several fields was damaged by the flood last year.", en: "Several fields was damaged by the flood last year." }, correct: false, r: { pa: "'Fields' ਬਹੁਵਚਨ ਹੈ, ਇਸ ਲਈ 'was' ਨਹੀਂ, 'were' ਚਾਹੀਦਾ ਹੈ।", en: "'Fields' is plural, so use 'were', not 'was'." } },
            { t: { pa: "Several fields are damaged by the flood last year.", en: "Several fields are damaged by the flood last year." }, correct: false, r: { pa: "'Last year' ਮੁੱਕੇ ਹੋਏ ਭੂਤ ਸਮੇਂ ਲਈ ਹੈ; present 'are' ਨਹੀਂ ਵਰਤਣਾ।", en: "'Last year' marks a completed past time, so do not use present 'are'." } },
            { t: { pa: "The flood was damaged by several fields last year.", en: "The flood was damaged by several fields last year." }, correct: false, r: { pa: "ਇਸ ਚੋਣ ਵਿੱਚ ਕਰਤਾ ਅਤੇ ਕਰਮ ਉਲਟ ਗਏ ਹਨ: ਖੇਤਾਂ ਨੂੰ ਨੁਕਸਾਨ ਹੋਇਆ ਸੀ।", en: "This reverses the agent and receiver: the fields received the damage." } }

        },
        {

          prompt: { pa: "ਸਹੀ preposition ਚੁਣੋ: \"The children have been waiting ______ two hours.\"", en: "Choose the correct preposition: \"The children have been waiting ______ two hours.\"" },
          hint: { pa: "Two hours ਮਿਆਦ ਹੈ ਜਾਂ ਸ਼ੁਰੂ ਹੋਣ ਦਾ ਖ਼ਾਸ ਸਮਾਂ?", en: "Does 'two hours' name a duration or a starting point?" },

            { t: { pa: "since", en: "since" }, correct: false, r: { pa: "'Since' ਇੱਕ ਸ਼ੁਰੂਆਤੀ ਬਿੰਦੂ ਨਾਲ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ, ਮਿਆਦ ਨਾਲ ਨਹੀਂ।", en: "'Since' is used with a starting point, not a duration." } },

            { t: { pa: "from", en: "from" }, correct: false, r: { pa: "'From' ਨਾਲ ਆਮ ਤੌਰ 'ਤੇ ਸ਼ੁਰੂਆਤੀ ਸਮਾਂ ਅਤੇ ਅਕਸਰ 'to/until' ਨਾਲ ਅੰਤ ਵੀ ਦੱਸਿਆ ਜਾਂਦਾ ਹੈ।", en: "'From' usually marks a starting point, often with an ending point such as 'to' or 'until'." } }

        },
        {
          id: "ENG-GR-29", ch: "Grammar · Conjunctions", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ conjunction ਚੁਣੋ: \"______ he was nervous, he spoke clearly.\"", en: "Choose the correct conjunction: \"______ he was nervous, he spoke clearly.\"" },
          hint: { pa: "ਦੋ ਹਿੱਸਿਆਂ ਵਿੱਚ ਉਮੀਦ ਤੋਂ ਉਲਟ ਨਤੀਜਾ ਹੈ: ਘਬਰਾਹਟ ਦੇ ਬਾਵਜੂਦ ਉਸਨੇ ਸਾਫ਼ ਬੋਲਿਆ।", en: "The two clauses show a contrast: he spoke clearly in spite of being nervous." },
          trap: { pa: "'Because' ਕਾਰਨ ਦੱਸਦਾ ਹੈ, ਪਰ ਇੱਥੇ ਕਾਰਨ ਨਹੀਂ, ਉਲਟ ਹਾਲਤ ਦੱਸੀ ਜਾ ਰਹੀ ਹੈ।", en: "'Because' gives a reason, but this sentence expresses contrast, not cause." },
          options: [
            { t: { pa: "Although", en: "Although" }, correct: true, r: { pa: "'Although' ਪੂਰੇ ਕਰਤਾ-ਕਿਰਿਆ ਵਾਲੇ clause ਤੋਂ ਪਹਿਲਾਂ ਆ ਕੇ ਵਿਰੋਧ ਦੱਸਦਾ ਹੈ।", en: "'Although' introduces a full subject-and-verb clause to express contrast." } },
            { t: { pa: "Because", en: "Because" }, correct: false, r: { pa: "ਇਸ ਨਾਲ ਅਰਥ ਹੋਵੇਗਾ ਕਿ ਉਹ ਘਬਰਾਇਆ ਸੀ ਇਸੇ ਕਰਕੇ ਸਾਫ਼ ਬੋਲਿਆ; ਇਹ ਅਰਥ ਨਹੀਂ ਬਣਦਾ।", en: "This would say that he spoke clearly because he was nervous, which is not the intended contrast." } },
            { t: { pa: "Unless", en: "Unless" }, correct: false, r: { pa: "'Unless' ਦਾ ਅਰਥ 'ਜੇ ਨਹੀਂ' ਹੈ; ਇਹ ਵਿਰੋਧ ਲਈ ਨਹੀਂ।", en: "'Unless' means 'if not'; it does not introduce this contrast." } },
            { t: { pa: "So", en: "So" }, correct: false, r: { pa: "'So' ਨਤੀਜਾ ਦੱਸਦਾ ਹੈ; ਇੱਥੇ ਨਤੀਜਾ ਘਬਰਾਹਟ ਦੇ ਉਲਟ ਹੈ।", en: "'So' signals a result, but this sentence needs a contrast." } }
          ],
          objective: { pa: "Although + ਕਰਤਾ + ਕਿਰਿਆ ਵਾਲਾ clause ਨਾਲ ਵਿਰੋਧ ਦੱਸਦਾ ਹੈ। Despite/in spite of ਤੋਂ ਬਾਅਦ ਨਾਂਵ ਜਾਂ ਕਿਰਿਆ-ing ਆਉਂਦੀ ਹੈ: Although it rained; despite the rain.", en: "Although introduces a contrasting clause with a subject and verb. Despite/in spite of take a noun or verb-ing: Although it rained; despite the rain." }

        {
          id: "ENG-GR-30", ch: "Grammar · Subject-Verb Agreement", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ ਕਿਰਿਆ ਚੁਣੋ: \"One of the girls ______ the district-level race every year.\"", en: "Choose the correct verb: \"One of the girls ______ the district-level race every year.\"" },
          hint: { pa: "ਵਾਕ ਦਾ ਮੁੱਖ ਕਰਤਾ 'girls' ਨਹੀਂ; ਸ਼ੁਰੂ ਵਿੱਚ ਆਏ ਸ਼ਬਦ 'One' ਨੂੰ ਪਛਾਣੋ।", en: "The subject is not 'girls'; identify the word 'One' at the start of the subject." },
          trap: { pa: "'Girls' ਨੇੜੇ ਹੋਣ ਕਰਕੇ 'run' ਚੁਣਨ ਦਾ ਮਨ ਕਰਦਾ ਹੈ, ਪਰ ਮੁੱਖ ਕਰਤਾ ਇਕਵਚਨ 'One' ਹੈ।", en: "'Run' is tempting because 'girls' is nearby, but the grammatical subject is the singular 'One'." },
          options: [
            { t: { pa: "runs", en: "runs" }, correct: true, r: { pa: "'One of the girls' ਦਾ ਮੁੱਖ ਕਰਤਾ 'One' ਇਕਵਚਨ ਹੈ, ਇਸ ਲਈ simple present ਵਿੱਚ 'runs' ਲੱਗਦਾ ਹੈ।", en: "The head subject in 'one of the girls' is singular 'one', so simple present takes 'runs'." } },
            { t: { pa: "run", en: "run" }, correct: false, r: { pa: "'Run' ਬਹੁਵਚਨ ਕਰਤਾ ਨਾਲ ਹੁੰਦਾ ਹੈ; ਇੱਥੇ 'One' ਇਕਵਚਨ ਹੈ।", en: "'Run' goes with a plural subject; 'one' is singular here." } },
            { t: { pa: "ran", en: "ran" }, correct: false, r: { pa: "'Every year' ਆਦਤ ਦੱਸਦਾ ਹੈ, ਇਸ ਲਈ simple present ਚਾਹੀਦਾ ਹੈ, past 'ran' ਨਹੀਂ।", en: "'Every year' describes a habit, so use simple present, not past 'ran'." } },
            { t: { pa: "is run", en: "is run" }, correct: false, r: { pa: "ਇਹ passive ਬਣਤਰ ਹੈ ਅਤੇ ਵਾਕ ਵਿੱਚ ਦੌੜਨ ਵਾਲੀ ਲੜਕੀ ਆਪ ਕਰਤਾ ਹੈ।", en: "This is a passive form, but the girl is the one doing the running." } }
          ],
          objective: { pa: "'One of + plural noun' ਤੋਂ ਬਾਅਦ ਇਕਵਚਨ ਕਿਰਿਆ ਵਰਤੋ, ਕਿਉਂਕਿ ਵਾਕ ਦਾ ਕਰਤਾ 'one' ਹੈ: One of my friends lives here.", en: "Use a singular verb after 'one of + plural noun' because the subject is 'one': One of my friends lives here." }
        },
        {
          id: "ENG-COM-04", ch: "Comprehension · Main Idea", competency: "Analysis", diff: "Medium",
          prompt: { pa: "\"After noticing younger children waiting outside school for parents who worked late, Harjit began keeping the village library open until six. Soon, two neighbours volunteered to help. The children used the time to read or finish their homework.\" — ਲਾਇਬ੍ਰੇਰੀ ਛੇ ਵਜੇ ਤੱਕ ਖੁੱਲ੍ਹੀ ਰੱਖਣ ਦਾ ਮੁੱਖ ਲਾਭ ਕੀ ਸੀ?", en: "\"After noticing younger children waiting outside school for parents who worked late, Harjit began keeping the village library open until six. Soon, two neighbours volunteered to help. The children used the time to read or finish their homework.\" — What was the main benefit of keeping the library open until six?" },
          hint: { pa: "ਪਹਿਲੇ ਵਾਕ ਵਿੱਚ ਬੱਚਿਆਂ ਦੀ ਮੁਸ਼ਕਲ ਅਤੇ ਆਖ਼ਰੀ ਵਾਕ ਵਿੱਚ ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ ਉਹਨਾਂ ਦੇ ਕੀਤੇ ਕੰਮ ਨੂੰ ਜੋੜੋ।", en: "Connect the children's problem in the first sentence with what they did at the library in the last." },
          trap: { pa: "ਗੁਆਂਢੀਆਂ ਦਾ ਮਦਦ ਲਈ ਆਉਣਾ ਸਹਾਇਕ ਵੇਰਵਾ ਹੈ; ਸਵਾਲ ਬੱਚਿਆਂ ਨੂੰ ਹੋਏ ਲਾਭ ਬਾਰੇ ਹੈ।", en: "The neighbours volunteering is a supporting detail; the question asks how the children benefited." },
          options: [
            { t: { pa: "ਬੱਚਿਆਂ ਨੂੰ ਮਾਪਿਆਂ ਦੇ ਆਉਣ ਤੱਕ ਪੜ੍ਹਨ ਜਾਂ ਹੋਮਵਰਕ ਕਰਨ ਦੀ ਥਾਂ ਮਿਲੀ।", en: "The children had a place to read or do homework while waiting for their parents." }, correct: true, r: { pa: "ਪਹਿਰੇ ਵਿੱਚ ਬੱਚੇ ਮਾਪਿਆਂ ਦੀ ਉਡੀਕ ਕਰਦੇ ਸਨ ਅਤੇ ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ ਪੜ੍ਹਦੇ ਜਾਂ ਹੋਮਵਰਕ ਕਰਦੇ ਸਨ।", en: "The passage says the children waited for their parents and used the library to read or do homework." } },
            { t: { pa: "ਲਾਇਬ੍ਰੇਰੀ ਸਕੂਲ ਦੀ ਥਾਂ ਲੈ ਗਈ।", en: "The library replaced the school." }, correct: false, r: { pa: "ਬੱਚੇ ਸਕੂਲ ਤੋਂ ਬਾਅਦ ਉਡੀਕ ਕਰਦੇ ਸਨ; ਲਾਇਬ੍ਰੇਰੀ ਨੇ ਸਕੂਲ ਦੀ ਥਾਂ ਨਹੀਂ ਲਈ।", en: "The children waited after school; the library did not replace it." } },
            { t: { pa: "ਮਾਪਿਆਂ ਨੇ ਕੰਮ ਕਰਨਾ ਛੱਡ ਦਿੱਤਾ।", en: "The parents stopped working." }, correct: false, r: { pa: "ਪਹਿਰੇ ਵਿੱਚ ਮਾਪਿਆਂ ਦੇ ਕੰਮ ਦੇ ਸਮੇਂ ਬਦਲਣ ਦਾ ਕੋਈ ਜ਼ਿਕਰ ਨਹੀਂ।", en: "The passage never says the parents changed their work schedules." } },
            { t: { pa: "ਬੱਚਿਆਂ ਨੇ ਗੁਆਂਢੀਆਂ ਨੂੰ ਕਿਤਾਬਾਂ ਪੜ੍ਹ ਕੇ ਸੁਣਾਈਆਂ।", en: "The children read books aloud to the neighbours." }, correct: false, r: { pa: "ਗੁਆਂਢੀ ਮਦਦ ਲਈ ਆਏ ਸਨ, ਪਰ ਉਹਨਾਂ ਨੂੰ ਪੜ੍ਹ ਕੇ ਸੁਣਾਉਣ ਦੀ ਗੱਲ ਨਹੀਂ।", en: "The neighbours volunteered to help, but the passage does not say the children read to them." } }
          ],
          objective: { pa: "ਪੜ੍ਹਨ ਸਮਝ ਵਿੱਚ ਮੁੱਖ ਲਾਭ ਲੱਭਣ ਲਈ ਸਮੱਸਿਆ ਅਤੇ ਉਸਦੇ ਹੱਲ ਵਾਲੇ ਵੇਰਵੇ ਜੋੜੋ। ਸਿਰਫ਼ ਸਹੀ ਲੱਗਣ ਵਾਲਾ ਪਰ ਪਹਿਰੇ ਵਿੱਚ ਨਾ ਦਿੱਤਾ ਜਵਾਬ ਨਾ ਚੁਣੋ।", en: "To identify a passage's main benefit, connect the problem with the details showing its solution. Do not choose an answer that sounds plausible but is not supported by the text." }
        },
        {
          id: "ENG-GR-31", ch: "Grammar · Narration", competency: "Application", diff: "Hard",
          prompt: { pa: "ਸਹੀ indirect speech ਚੁਣੋ: The coach said to the players, \"Do not waste time.\"", en: "Choose the correct indirect speech: The coach said to the players, \"Do not waste time.\"" },
          hint: { pa: "ਇਹ ਨਕਾਰਾਤਮਕ ਹੁਕਮ ਹੈ। Reporting verb ਤੋਂ ਬਾਅਦ 'not to + ਕਿਰਿਆ ਦਾ ਮੂਲ ਰੂਪ' ਵਰਤੋ।", en: "This is a negative command. Use 'not to + base verb' after the reporting verb." },
          trap: { pa: "ਆਮ ਬਿਆਨ ਵਾਂਗ 'that they did not waste' ਨਾ ਬਣਾਓ; ਹੁਕਮ ਦੀ ਬਣਤਰ 'told + ਕਰਮ + not to' ਹੈ।", en: "Do not report a command as an ordinary 'that they did not waste' statement; use 'told + object + not to'." },
          options: [
            { t: { pa: "The coach told the players not to waste time.", en: "The coach told the players not to waste time." }, correct: true, r: { pa: "ਹੁਕਮ ਲਈ told + object ਅਤੇ ਨਕਾਰਾਤਮਕ infinitive not to waste ਸਹੀ ਬਣਤਰ ਹੈ।", en: "For a command, told + object and the negative infinitive not to waste form the correct structure." } },
            { t: { pa: "The coach told that the players do not waste time.", en: "The coach told that the players do not waste time." }, correct: false, r: { pa: "'Tell' ਤੋਂ ਬਾਅਦ ਕਰਮ ਲੋੜੀਂਦਾ ਹੈ; ਹੁਕਮ ਲਈ 'that' clause ਨਹੀਂ, 'not to' ਲੱਗਦਾ ਹੈ।", en: "'Tell' needs an object; report the command with 'not to', not a 'that' clause." } },
            { t: { pa: "The coach said the players to not wasted time.", en: "The coach said the players to not wasted time." }, correct: false, r: { pa: "ਹੁਕਮ ਲਈ ਇੱਥੇ 'said' ਦੀ ਥਾਂ 'told' ਅਤੇ 'wasted' ਦੀ ਥਾਂ ਮੂਲ ਰੂਪ 'waste' ਚਾਹੀਦਾ ਹੈ।", en: "Use 'told' rather than 'said' for this command, and the base form 'waste', not 'wasted'." } },
            { t: { pa: "The coach asked the players if they wasted time.", en: "The coach asked the players if they wasted time." }, correct: false, r: { pa: "ਇਹ ਹੁਕਮ ਹੈ, yes/no ਸਵਾਲ ਨਹੀਂ; 'if' ਇਸ ਲਈ ਨਹੀਂ ਵਰਤਦੇ।", en: "This is a command, not a yes/no question, so do not use 'if'." } }
          ],
          objective: { pa: "Reported commands: told/ordered/advised + object + (not) to + V1। ਉਦਾਹਰਨ: 'Don't run' → The teacher told us not to run.", en: "Report commands with told/ordered/advised + object + (not) to + V1. Example: 'Don't run' → The teacher told us not to run." }
        },
        {
          id: "ENG-GR-32", ch: "Grammar · Subject-Verb Agreement", competency: "Analysis", diff: "Hard",
          prompt: { pa: "ਸਹੀ ਕਿਰਿਆ ਚੁਣੋ: \"Neither the teachers nor the principal ______ available yesterday.\"", en: "Choose the correct verb: \"Neither the teachers nor the principal ______ available yesterday.\"" },
          hint: { pa: "'Neither ... nor' ਵਿੱਚ verb ਦੇ ਨੇੜੇ ਆਉਣ ਵਾਲੇ subject ਨੂੰ ਦੇਖੋ। 'Yesterday' ਵੀ ਕਾਲ ਦਾ ਸੰਕੇਤ ਹੈ।", en: "With 'neither ... nor', check the subject nearest to the verb. 'Yesterday' also signals the tense." },
          trap: { pa: "'Teachers' ਬਹੁਵਚਨ ਹੈ ਪਰ ਕਿਰਿਆ ਦੇ ਸਭ ਤੋਂ ਨੇੜੇ 'principal' ਇਕਵਚਨ ਹੈ; ਭੂਤ ਕਾਲ ਵੀ ਲਾਜ਼ਮੀ ਹੈ।", en: "'Teachers' is plural, but the nearer subject 'principal' is singular; the past tense matters too." },
          options: [
            { t: { pa: "was", en: "was" }, correct: true, r: { pa: "'Neither ... nor' ਵਿੱਚ ਨੇੜਲਾ subject 'principal' ਇਕਵਚਨ ਹੈ ਅਤੇ 'yesterday' ਲਈ past 'was' ਆਉਂਦਾ ਹੈ।", en: "With 'neither ... nor', the nearer subject 'principal' is singular, and 'yesterday' calls for past 'was'." } },
            { t: { pa: "were", en: "were" }, correct: false, r: { pa: "'Were' ਇੱਥੇ ਨੇੜਲੇ ਇਕਵਚਨ subject 'principal' ਨਾਲ ਨਹੀਂ ਮਿਲਦਾ।", en: "'Were' does not agree with the nearer singular subject 'principal'." } },
            { t: { pa: "are", en: "are" }, correct: false, r: { pa: "ਇਹ ਵਰਤਮਾਨ ਕਾਲ ਹੈ, ਪਰ 'yesterday' ਭੂਤ ਕਾਲ ਮੰਗਦਾ ਹੈ।", en: "This is present tense, but 'yesterday' requires the past." } },
            { t: { pa: "have been", en: "have been" }, correct: false, r: { pa: "ਇਕਵਚਨ 'principal' ਨਾਲ 'has been' ਆਉਂਦਾ ਹੈ; ਨਾਲੇ 'yesterday' ਅਨੁਕੂਲ ਨਹੀਂ।", en: "A singular 'principal' would take 'has been', and the present perfect does not fit 'yesterday'." } }
          ],
          objective: { pa: "'Either ... or' ਅਤੇ 'neither ... nor' ਵਿੱਚ ਕਿਰਿਆ ਆਮ ਤੌਰ 'ਤੇ ਉਸ subject ਨਾਲ ਮਿਲਦੀ ਹੈ ਜੋ ਕਿਰਿਆ ਦੇ ਨੇੜੇ ਹੋਵੇ। ਕਾਲ ਦੱਸਣ ਵਾਲੇ ਸ਼ਬਦ ਵੀ ਜਾਂਚੋ।", en: "With 'either ... or' and 'neither ... nor', the verb generally agrees with the subject nearest to it. Also check time markers for tense." }
        },
        {
          id: "ENG-GR-33", ch: "Grammar · Degrees of Comparison", competency: "Transformation", diff: "Hard",
          prompt: { pa: "ਅਰਥ ਬਦਲੇ ਬਿਨਾਂ ਵਾਕ ਪੂਰਾ ਕਰੋ: \"Very few cities in Punjab are as busy as Ludhiana.\" Ludhiana is ______.", en: "Complete the sentence without changing its meaning: \"Very few cities in Punjab are as busy as Ludhiana.\" Ludhiana is ______." },
          hint: { pa: "'Very few ... as busy as' ਦਾ ਭਾਵ ਹੈ ਕਿ Ludhiana ਨਾਲੋਂ ਥੋੜ੍ਹੇ ਹੀ ਸ਼ਹਿਰ ਵੱਧ ਰੁਝੇਵੇਂ ਵਾਲੇ ਹਨ।", en: "'Very few ... as busy as' means that only a small number of cities are busier than Ludhiana." },
          trap: { pa: "'The busiest city' ਕਹਿਣ ਨਾਲ ਦਾਅਵਾ ਬਹੁਤ ਵਧ ਜਾਂਦਾ ਹੈ: ਮੂਲ ਵਾਕ ਇਹ ਨਹੀਂ ਕਹਿੰਦਾ ਕਿ Ludhiana ਸਭ ਤੋਂ ਵੱਧ ਰੁਝੇਵੇਂ ਵਾਲਾ ਇਕੱਲਾ ਸ਼ਹਿਰ ਹੈ।", en: "'The busiest city' overstates the original: it does not say Ludhiana is the single busiest city." },
          options: [
            { t: { pa: "one of the busiest cities in Punjab.", en: "one of the busiest cities in Punjab." }, correct: true, r: { pa: "ਦੋਵੇਂ ਵਾਕ ਕਹਿੰਦੇ ਹਨ ਕਿ ਬਹੁਤ ਘੱਟ ਸ਼ਹਿਰ Ludhiana ਜਿੰਨੇ ਰੁਝੇਵੇਂ ਵਾਲੇ ਹਨ।", en: "Both sentences say that only a few cities are as busy as Ludhiana." } },
            { t: { pa: "the only busy city in Punjab.", en: "the only busy city in Punjab." }, correct: false, r: { pa: "ਮੂਲ ਵਾਕ ਇਹ ਨਹੀਂ ਕਹਿੰਦਾ ਕਿ ਹੋਰ ਕੋਈ ਵੀ ਸ਼ਹਿਰ ਰੁਝੇਵੇਂ ਵਾਲਾ ਨਹੀਂ।", en: "The original does not say that no other city is busy." } },
            { t: { pa: "busier than every other city in Punjab.", en: "busier than every other city in Punjab." }, correct: false, r: { pa: "ਇਹ 'ਸਭ ਤੋਂ ਵੱਧ' ਹੋਣ ਦਾ ਪੱਕਾ ਦਾਅਵਾ ਕਰਦਾ ਹੈ, ਜੋ ਮੂਲ ਵਾਕ ਵਿੱਚ ਨਹੀਂ।", en: "This makes a definite 'busiest of all' claim that the original does not make." } },
            { t: { pa: "less busy than most cities in Punjab.", en: "less busy than most cities in Punjab." }, correct: false, r: { pa: "ਇਹ ਮੂਲ ਵਾਕ ਦੇ ਭਾਵ ਦਾ ਉਲਟ ਹੈ।", en: "This reverses the meaning of the original sentence." } }
          ],
          objective: { pa: "'Very few + plural noun + are as ... as X' ਨੂੰ 'X is one of the + superlative + plural noun' ਵਿੱਚ ਬਦਲਿਆ ਜਾ ਸਕਦਾ ਹੈ। 'One of' ਤੋਂ ਬਾਅਦ ਬਹੁਵਚਨ ਨਾਂਵ ਆਉਂਦਾ ਹੈ।", en: "Change 'Very few + plural noun + are as ... as X' to 'X is one of the + superlative + plural noun'. Use a plural noun after 'one of'." }
        },
        {
          id: "ENG-GR-34", ch: "Grammar · Conjunctions", competency: "Application", diff: "Hard",
          prompt: { pa: "ਸਹੀ ਜੋੜ ਚੁਣੋ: \"No sooner had the bell rung ______ the students left the classroom.\"", en: "Choose the correct pair: \"No sooner had the bell rung ______ the students left the classroom.\"" },
          hint: { pa: "ਇਹ ਨਿਸ਼ਚਿਤ ਜੋੜਾ ਹੈ ਜੋ ਦੱਸਦਾ ਹੈ ਕਿ ਦੂਜੀ ਘਟਨਾ ਲਗਭਗ ਤੁਰੰਤ ਪਹਿਲੀ ਤੋਂ ਬਾਅਦ ਹੋਈ।", en: "This fixed pair shows that the second event happened immediately after the first." },
          trap: { pa: "'Than' ਨੂੰ 'then' ਨਾ ਸਮਝੋ: fixed conjunction 'no sooner ... than' ਹੈ।", en: "Do not confuse 'than' with 'then': the fixed conjunction is 'no sooner ... than'." },
          options: [
            { t: { pa: "than", en: "than" }, correct: true, r: { pa: "'No sooner ... than' ਘਟਨਾਵਾਂ ਦੇ ਤੁਰੰਤ ਕ੍ਰਮ ਲਈ ਮਿਆਰੀ ਜੋੜਾ ਹੈ।", en: "'No sooner ... than' is the standard pair for events happening in quick succession." } },
            { t: { pa: "when", en: "when" }, correct: false, r: { pa: "'Hardly/scarcely ... when' ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ; 'no sooner' ਨਾਲ 'than' ਆਉਂਦਾ ਹੈ।", en: "'Hardly/scarcely ... when' is used, but 'no sooner' takes 'than'." } },
            { t: { pa: "then", en: "then" }, correct: false, r: { pa: "'Then' ਸਮੇਂ ਦਾ ਕਿਰਿਆ-ਵਿਸ਼ੇਸ਼ਣ ਹੈ; ਇਸ ਬਣਤਰ ਦਾ ਜੋੜਕ 'than' ਹੈ।", en: "'Then' is an adverb of time; this construction requires the conjunction 'than'." } },
            { t: { pa: "while", en: "while" }, correct: false, r: { pa: "'While' ਇੱਕੋ ਸਮੇਂ ਚੱਲ ਰਹੀਆਂ ਘਟਨਾਵਾਂ ਦੱਸਦਾ ਹੈ, ਪਰ ਇੱਥੇ ਇੱਕ ਘਟਨਾ ਤੁਰੰਤ ਬਾਅਦ ਹੋਈ।", en: "'While' describes simultaneous actions, but here one event followed the other." } }
          ],
          objective: { pa: "ਇਹ conjunction ਜੋੜੇ ਯਾਦ ਰੱਖੋ: no sooner ... than; hardly/scarcely ... when; either ... or; neither ... nor; not only ... but also.", en: "Learn these conjunction pairs: no sooner ... than; hardly/scarcely ... when; either ... or; neither ... nor; not only ... but also." }
        },
        {
          id: "ENG-VOC-07", ch: "Vocabulary · Words in Context", competency: "Understanding", diff: "Hard",
          prompt: { pa: "\"Sonia checked every figure in the account twice before submitting it; she is meticulous.\" 'Meticulous' ਦਾ ਕੀ ਅਰਥ ਹੈ?", en: "\"Sonia checked every figure in the account twice before submitting it; she is meticulous.\" What does \"meticulous\" mean?" },
          hint: { pa: "ਉਸਦੇ ਕੰਮ ਕਰਨ ਦੇ ਢੰਗ ਅਤੇ ਅੰਕ ਦੋ ਵਾਰ ਜਾਂਚਣ ਵੱਲ ਧਿਆਨ ਦਿਓ।", en: "Use the way she works and her habit of checking each figure twice as clues." },

          options: [

        {

        {
          id: "ENG-GR-35", ch: "Grammar · Sentence Transformation", competency: "Transformation", diff: "Hard",
          prompt: { pa: "ਅਰਥ ਬਦਲੇ ਬਿਨਾਂ ਵਾਕ ਬਦਲੋ: \"The box is too heavy for Rani to lift.\"", en: "Choose the sentence that keeps the meaning of: \"The box is too heavy for Rani to lift.\"" },
          hint: { pa: "'Too ... to' ਦਾ ਭਾਵ ਹੈ ਕਿ ਭਾਰ ਇੰਨਾ ਵੱਧ ਹੈ ਕਿ Rani ਡੱਬਾ ਨਹੀਂ ਚੁੱਕ ਸਕਦੀ।", en: "'Too ... to' means the weight is so great that Rani cannot lift the box." },
          trap: { pa: "'Too' ਨੂੰ 'very' ਨਾਲ ਬਦਲਣ ਨਾਲ ਅसमਰੱਥਾ ਵਾਲਾ ਭਾਵ ਖੋ ਜਾਂਦਾ ਹੈ।", en: "Replacing 'too' with 'very' loses the meaning that she cannot do it." },
          options: [
            { t: { pa: "The box is so heavy that Rani cannot lift it.", en: "The box is so heavy that Rani cannot lift it." }, correct: true, r: { pa: "'Too heavy to lift' ਅਤੇ 'so heavy that ... cannot lift' ਇੱਕੋ ਅਸਮਰੱਥਾ ਦੱਸਦੇ ਹਨ।", en: "'Too heavy to lift' and 'so heavy that ... cannot lift' express the same inability." } },
            { t: { pa: "The box is so heavy that Rani can lift it.", en: "The box is so heavy that Rani can lift it." }, correct: false, r: { pa: "'Can lift' ਮੂਲ ਵਾਕ ਦਾ ਉਲਟ ਹੈ; ਮੂਲ ਵਿੱਚ ਭਾਰ ਕਰਕੇ ਉਹ ਨਹੀਂ ਚੁੱਕ ਸਕਦੀ।", en: "'Can lift' reverses the original: its weight prevents her from lifting it." } },
            { t: { pa: "The box is very heavy, but Rani lifted it easily.", en: "The box is very heavy, but Rani lifted it easily." }, correct: false, r: { pa: "ਇਹ Rani ਵੱਲੋਂ ਡੱਬਾ ਚੁੱਕਣ ਦੀ ਨਵੀਂ ਘਟਨਾ ਜੋੜਦਾ ਹੈ, ਜੋ ਮੂਲ ਵਾਕ ਵਿੱਚ ਨਹੀਂ।", en: "This adds a new event in which Rani lifts the box, which the original does not state." } },

          ],
          objective: { pa: "'Too + adjective + to + verb' ਅਸਮਰੱਥਾ ਦੱਸ ਸਕਦਾ ਹੈ: too heavy to lift = so heavy that someone cannot lift it. ਵਾਕ ਬਦਲਦੇ ਸਮੇਂ ਕਰਤਾ ਅਤੇ ਭਾਵ ਦੋਵੇਂ ਇੱਕੋ ਰੱਖੋ।", en: "'Too + adjective + to + verb' can express inability: too heavy to lift = so heavy that someone cannot lift it. Keep both the subject and the meaning unchanged when transforming a sentence." }

          prompt: { pa: "ਸਹੀ punctuation ਵਾਲਾ ਵਾਕ ਚੁਣੋ:", en: "Choose the correctly punctuated sentence:" },

          trap: { pa: "ਸਿੱਧੇ ਕਹੇ ਸਵਾਲ ਦੇ question mark ਨੂੰ quotation marks ਤੋਂ ਬਾਹਰ ਨਾ ਰੱਖੋ।", en: "Do not place the question mark outside the quotation marks when it belongs to the quoted question." },

            { t: { pa: "Raj asked me \"Where is the library?\"", en: "Raj asked me \"Where is the library?\"" }, correct: false, r: { pa: "Quoted ਸਿੱਧੀ ਗੱਲ ਤੋਂ ਪਹਿਲਾਂ reporting clause ਨੂੰ comma ਨਾਲ ਵੱਖ ਕਰੋ।", en: "Separate the reporting clause from the quoted direct speech with a comma." } }

        {

          hint: { pa: "ਸ਼ਬਦ ਦੇ ਸ਼ੁਰੂ ਵਿੱਚ ਅਗੇਤਰ ਲਗਾ ਕੇ ਅਰਥ ਦਾ ਉਲਟ ਬਣਾਇਆ ਜਾ ਸਕਦਾ ਹੈ।", en: "A prefix is added to the beginning of a word; some prefixes reverse its meaning." },
          trap: { pa: "ਅਜਿਹਾ ਅਗੇਤਰ ਚੁਣੋ ਜੋ 'kind' ਦਾ ਉਲਟ ਬਣਾਏ, ਸਿਰਫ਼ ਨਵਾਂ ਸ਼ਬਦ ਨਹੀਂ।", en: "Choose a prefix that reverses the meaning of 'kind', not merely one that forms another word." },

          trap: { pa: "'Interesting' ਆਮ ਤੌਰ 'ਤੇ ਭਾਵ ਪੈਦਾ ਕਰਨ ਵਾਲੀ ਚੀਜ਼ ਲਈ ਅਤੇ 'interested' ਭਾਵ ਮਹਿਸੂਸ ਕਰਨ ਵਾਲੇ ਵਿਅਕਤੀ ਲਈ ਆਉਂਦਾ ਹੈ।", en: "'Interesting' usually describes what causes a feeling; 'interested' describes the person experiencing it." },
          options: [
            { t: { pa: "interesting, interested", en: "interesting, interested" }, correct: true, r: { pa: "ਮੈਚ interesting ਸੀ, ਕਿਉਂਕਿ ਉਸਨੇ ਦਿਲਚਸਪੀ ਪੈਦਾ ਕੀਤੀ; ਬੱਚੇ interested ਸਨ।", en: "The match was interesting because it caused interest; the children were interested." } },
            { t: { pa: "interested, interesting", en: "interested, interesting" }, correct: false, r: { pa: "ਇਸ ਨਾਲ ਮੈਚ ਨੂੰ ਭਾਵ ਮਹਿਸੂਸ ਕਰਨ ਵਾਲਾ ਅਤੇ ਬੱਚਿਆਂ ਨੂੰ ਭਾਵ ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਦੱਸਿਆ ਜਾਵੇਗਾ।", en: "This would describe the match as experiencing interest and the children as causing it." } },
            { t: { pa: "interest, interested", en: "interest, interested" }, correct: false, r: { pa: "ਪਹਿਲੀ ਖਾਲੀ ਥਾਂ ਵਿੱਚ ਵਿਸ਼ੇਸ਼ਣ 'interesting' ਚਾਹੀਦਾ ਹੈ, ਨਾਂਵ 'interest' ਨਹੀਂ।", en: "The first blank needs the adjective 'interesting', not the noun 'interest'." } },
            { t: { pa: "interesting, interest", en: "interesting, interest" }, correct: false, r: { pa: "ਦੂਜੀ ਖਾਲੀ ਥਾਂ ਵਿੱਚ ਬੱਚਿਆਂ ਦੀ ਹਾਲਤ ਦੱਸਣ ਲਈ ਵਿਸ਼ੇਸ਼ਣ 'interested' ਚਾਹੀਦਾ ਹੈ।", en: "The second blank needs the adjective 'interested' to describe the children." } }
          ],
          objective: { pa: "-ing ਰੂਪ ਅਕਸਰ ਭਾਵ ਪੈਦਾ ਕਰਨ ਵਾਲੇ ਕਾਰਨ ਨੂੰ ਦੱਸਦਾ ਹੈ (an exciting game); -ed ਰੂਪ ਭਾਵ ਮਹਿਸੂਸ ਕਰਨ ਵਾਲੇ ਨੂੰ (excited children)।", en: "The -ing form often describes what causes a feeling (an exciting game); the -ed form describes the person experiencing it (excited children)." }
        },
        {
          id: "ENG-GR-43", ch: "Grammar · Conjunctions", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ conjunction ਚੁਣੋ: \"Wait here ______ the doctor calls your name.\"", en: "Choose the correct conjunction: \"Wait here ______ the doctor calls your name.\"" },
          hint: { pa: "ਵਾਕ ਕਹਿੰਦਾ ਹੈ ਕਿ ਡਾਕਟਰ ਦਾ ਨਾਮ ਲੈਣ ਤੱਕ ਇੱਥੇ ਉਡੀਕ ਕਰਨੀ ਹੈ।", en: "The instruction is to wait up to the time when the doctor calls your name." },
          trap: { pa: "'Unless' ਦਾ ਅਰਥ 'ਜੇ ਨਹੀਂ' ਹੈ; ਇੱਥੇ 'ਜਦੋਂ ਤੱਕ' ਵਾਲਾ ਭਾਵ ਚਾਹੀਦਾ ਹੈ।", en: "'Unless' means 'if not'; this sentence needs the meaning 'up to the time when'." },
          options: [
            { t: { pa: "until", en: "until" }, correct: true, r: { pa: "'Until' ਉਡੀਕ ਕਦੋਂ ਤੱਕ ਕਰਨੀ ਹੈ, ਇਹ ਦੱਸਦਾ ਹੈ।", en: "'Until' says how long to wait." } },
            { t: { pa: "unless", en: "unless" }, correct: false, r: { pa: "'Unless' ਦਾ ਭਾਵ ਹੈ 'ਜੇ ਡਾਕਟਰ ਨਾਮ ਨਾ ਲਵੇ'; ਇਹ ਇੱਥੇ ਚਾਹੀਦਾ ਅਰਥ ਨਹੀਂ।", en: "'Unless' would mean 'if the doctor does not call'; that is not the intended meaning." } },
            { t: { pa: "because", en: "because" }, correct: false, r: { pa: "'Because' ਕਾਰਨ ਦੱਸਦਾ ਹੈ, ਉਡੀਕ ਦੀ ਆਖ਼ਰੀ ਹੱਦ ਨਹੀਂ।", en: "'Because' gives a reason, not the endpoint of the wait." } },
            { t: { pa: "although", en: "although" }, correct: false, r: { pa: "'Although' ਵਿਰੋਧ ਦੱਸਦਾ ਹੈ; ਇੱਥੇ ਸਮੇਂ ਦੀ ਹੱਦ ਦੱਸਣੀ ਹੈ।", en: "'Although' expresses contrast; this sentence needs a time limit." } }
          ],
          objective: { pa: "'Until' ਕਿਸੇ ਸਮੇਂ ਜਾਂ ਘਟਨਾ ਤੱਕ ਲਈ ਹੈ; 'unless' ਦਾ ਅਰਥ 'ਜੇ ਨਹੀਂ' ਹੈ। ਉਦਾਹਰਨ: Wait until six; You will not pass unless you study.", en: "'Until' means up to a time or event; 'unless' means if not. Example: Wait until six; You will not pass unless you study." }
        },
        {
          id: "ENG-GR-44", ch: "Grammar · Conditionals", competency: "Application", diff: "Medium",
          prompt: { pa: "First conditional ਵਾਲਾ ਸਹੀ ਵਾਕ ਚੁਣੋ:", en: "Choose the sentence with the correct first conditional:" },
          hint: { pa: "ਸੰਭਵ ਭਵਿੱਖੀ ਸ਼ਰਤ ਵਿੱਚ if-clause ਲਈ present ਅਤੇ ਨਤੀਜੇ ਲਈ will + ਕਿਰਿਆ ਦਾ ਮੂਲ ਰੂਪ ਵਰਤੋ।", en: "For a possible future condition, use the present in the if-clause and will + base verb for the result." },
          trap: { pa: "ਇਸ pattern ਵਿੱਚ if-clause ਤੋਂ ਬਾਅਦ will ਨਹੀਂ ਆਉਂਦਾ; will ਨਤੀਜੇ ਵਾਲੇ ਹਿੱਸੇ ਵਿੱਚ ਆਉਂਦਾ ਹੈ।", en: "In this pattern, do not put will in the if-clause; it belongs in the result clause." },
          options: [
            { t: { pa: "If the rain stops, we will play outside.", en: "If the rain stops, we will play outside." }, correct: true, r: { pa: "First conditional: if + simple present 'stops', will + ਮੂਲ ਕਿਰਿਆ 'play'।", en: "First conditional: if + simple present 'stops', followed by will + base verb 'play'." } },
            { t: { pa: "If the rain will stop, we play outside.", en: "If the rain will stop, we play outside." }, correct: false, r: { pa: "ਇਸ conditional pattern ਵਿੱਚ if-clause ਵਿੱਚ simple present 'stops' ਚਾਹੀਦਾ ਹੈ।", en: "This conditional pattern uses the simple present 'stops' in the if-clause." } },
            { t: { pa: "If the rain stopped, we will play outside.", en: "If the rain stopped, we will play outside." }, correct: false, r: { pa: "ਇੱਥੇ simple past 'stopped' ਦੂਜੇ conditional ਨਾਲ ਜਾਵੇਗਾ, will ਵਾਲੇ first conditional ਨਾਲ ਨਹੀਂ।", en: "The simple past 'stopped' belongs with the second conditional, not this first conditional with will." } },
            { t: { pa: "If the rain stops, we would played outside.", en: "If the rain stops, we would played outside." }, correct: false, r: { pa: "First conditional ਦੇ ਨਤੀਜੇ ਵਿੱਚ 'will + play' ਚਾਹੀਦਾ ਹੈ; 'would played' ਸਹੀ ਬਣਤਰ ਨਹੀਂ।", en: "The first conditional result needs 'will + play'; 'would played' is not a correct form." } }
          ],
          objective: { pa: "First conditional ਸੰਭਵ ਭਵਿੱਖੀ ਨਤੀਜੇ ਲਈ: If + simple present, will + V1। ਉਦਾਹਰਨ: If we leave now, we will catch the bus.", en: "Use the first conditional for a possible future result: If + simple present, will + V1. Example: If we leave now, we will catch the bus." }
        },
        {
          id: "ENG-GR-45", ch: "Grammar · Narration", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ indirect speech ਚੁਣੋ: Aman said, \"I have finished my homework.\"", en: "Choose the correct indirect speech: Aman said, \"I have finished my homework.\"" },
          hint: { pa: "Reporting verb 'said' ਭੂਤ ਕਾਲ ਵਿੱਚ ਹੈ; present perfect ਨੂੰ past perfect ਅਤੇ 'I' ਨੂੰ Aman ਬਣਾਓ।", en: "The reporting verb 'said' is in the past; backshift the present perfect to past perfect and change 'I' to Aman." },
          trap: { pa: "'Finished' ਪਿਛਲੇ ਕੰਮ ਦੀ ਗੱਲ ਹੈ, ਪਰ 'have finished' ਨੂੰ indirect speech ਵਿੱਚ 'had finished' ਬਣਾਉਣਾ ਹੈ।", en: "The action is already in the past, but indirect speech backshifts 'have finished' to 'had finished'." },
          options: [
            { t: { pa: "Aman said that he had finished his homework.", en: "Aman said that he had finished his homework." }, correct: true, r: { pa: "Past reporting verb ਤੋਂ ਬਾਅਦ have finished → had finished ਅਤੇ 'I' → 'he' ਹੁੰਦਾ ਹੈ।", en: "After a past reporting verb, have finished becomes had finished and 'I' becomes 'he'." } },
            { t: { pa: "Aman said that I have finished my homework.", en: "Aman said that I have finished my homework." }, correct: false, r: { pa: "ਬਿਆਨ ਕਰਨ ਵਾਲਾ Aman ਹੈ, ਇਸ ਲਈ 'I' ਦੀ ਥਾਂ 'he' ਅਤੇ ਕਾਲ ਦੀ ਥਾਂ 'had finished' ਚਾਹੀਦਾ ਹੈ।", en: "Aman is the speaker, so use 'he' instead of 'I' and backshift to 'had finished'." } },
            { t: { pa: "Aman said that he has finished his homework.", en: "Aman said that he has finished his homework." }, correct: false, r: { pa: "Past reporting verb 'said' ਤੋਂ ਬਾਅਦ present perfect 'has finished' ਨੂੰ ਆਮ ਤੌਰ 'ਤੇ past perfect 'had finished' ਕਰਦੇ ਹਨ।", en: "After the past reporting verb 'said', backshift the present perfect 'has finished' to past perfect 'had finished'." } },
            { t: { pa: "Aman said that he finished his homework tomorrow.", en: "Aman said that he finished his homework tomorrow." }, correct: false, r: { pa: "ਮੂਲ ਵਾਕ ਵਿੱਚ 'tomorrow' ਨਹੀਂ ਅਤੇ finished ਨਾਲ ਕੰਮ ਦੀ completion ਦਾ ਕਾਲ ਵੀ ਬਦਲ ਗਿਆ।", en: "The original has no 'tomorrow', and changing the tense to 'finished' loses the reported completion." } }
          ],
          objective: { pa: "Past reporting verb ਤੋਂ ਬਾਅਦ ਆਮ tense shifts ਯਾਦ ਰੱਖੋ: am/is → was, present simple → past simple, has/have + V3 → had + V3। Sarvanam ਬੋਲਣ ਵਾਲੇ ਅਨੁਸਾਰ ਬਦਲਦਾ ਹੈ।", en: "After a past reporting verb, common tense shifts are: am/is → was, simple present → simple past, and has/have + V3 → had + V3. Change pronouns to match the original speaker." }
        },
        {
          id: "ENG-GR-46", ch: "Grammar · Prepositions", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ preposition ਚੁਣੋ: \"Our school is situated ______ the post office and the public library.\"", en: "Choose the correct preposition: \"Our school is situated ______ the post office and the public library.\"" },
          hint: { pa: "ਸਕੂਲ ਦੀ ਥਾਂ ਦੋ ਸਾਫ਼-ਸਾਫ਼ ਦੱਸੀਆਂ ਇਮਾਰਤਾਂ ਦੇ ਸਬੰਧ ਵਿੱਚ ਹੈ।", en: "The school's location is described in relation to two specific landmarks." },
          trap: { pa: "'Among' ਕਿਸੇ ਸਮੂਹ ਦੇ ਵਿਚਕਾਰ ਲਈ ਹੈ; ਇੱਥੇ ਦੋ ਵੱਖਰੇ ਪਛਾਣੇ ਗਏ ਨਿਸ਼ਾਨਾਂ ਦੇ ਦਰਮਿਆਨ ਥਾਂ ਦੱਸੋ।", en: "'Among' describes a position within a group; this sentence locates the school relative to two separately named landmarks." },
          options: [
            { t: { pa: "between", en: "between" }, correct: true, r: { pa: "ਸਕੂਲ ਦੀ ਥਾਂ ਦੋ ਖ਼ਾਸ ਥਾਵਾਂ—ਡਾਕਘਰ ਅਤੇ ਜਨਤਕ ਲਾਇਬ੍ਰੇਰੀ—ਦੇ ਵਿਚਕਾਰ ਦੱਸੀ ਗਈ ਹੈ, ਇਸ ਲਈ between ਸਹੀ ਹੈ।", en: "The school is located relative to two specific places—the post office and the public library—so 'between' is correct." } },
            { t: { pa: "among", en: "among" }, correct: false, r: { pa: "'Among' ਸਮੂਹ ਦੇ ਅੰਦਰ ਲਈ ਹੈ; ਇੱਥੇ ਡਾਕਘਰ ਅਤੇ ਲਾਇਬ੍ਰੇਰੀ ਦੋ ਵੱਖਰੇ ਨਿਸ਼ਾਨ ਹਨ।", en: "'Among' describes a position within a group; here the post office and library are two separate landmarks." } },
            { t: { pa: "under", en: "under" }, correct: false, r: { pa: "'Under' ਕਿਸੇ ਚੀਜ਼ ਦੇ ਹੇਠਾਂ ਹੋਣ ਲਈ ਹੈ; ਇੱਥੇ ਸਕੂਲ ਦੋ ਥਾਵਾਂ ਦੇ ਵਿਚਕਾਰ ਹੈ।", en: "'Under' means below something; this sentence locates the school between two places." } },
            { t: { pa: "during", en: "during" }, correct: false, r: { pa: "'During' ਕਿਸੇ ਸਮੇਂ ਦੇ ਦੌਰਾਨ ਲਈ ਹੈ; ਇੱਥੇ ਥਾਂ ਦਾ ਸਬੰਧ ਦੋ ਥਾਵਾਂ ਨਾਲ ਹੈ।", en: "'During' refers to a period of time; this sentence describes a location between two places." } }
          ],
          objective: { pa: "ਦੋ ਵੱਖਰੇ ਪਛਾਣੇ ਬਿੰਦੂਆਂ ਦੇ ਵਿਚਕਾਰ ਲਈ between ਅਤੇ ਕਿਸੇ ਸਮੂਹ ਦੇ ਅੰਦਰ ਲਈ among ਵਰਤੋ। Between ਹਮੇਸ਼ਾ ਸਿਰਫ਼ ਦੋ ਚੀਜ਼ਾਂ ਲਈ ਸੀਮਿਤ ਨਹੀਂ ਹੁੰਦਾ।", en: "Use 'between' for a relationship involving distinct, identified points and 'among' for a position within a group. 'Between' is not limited to only two items." }
        },
        {

          prompt: { pa: "ਵਾਕਾਂਸ਼ ਕ੍ਰਿਆ 'look after' ਦਾ ਕੀ ਅਰਥ ਹੈ? \"Meena looks after her younger sister while their mother is at work.\"", en: "What does the phrasal verb 'look after' mean? \"Meena looks after her younger sister while their mother is at work.\"" },
          hint: { pa: "ਜਦੋਂ ਮਾਂ ਕੰਮ 'ਤੇ ਹੈ, Meena ਆਪਣੀ ਛੋਟੀ ਭੈਣ ਲਈ ਕੀ ਕਰਦੀ ਹੈ?", en: "While their mother is at work, what does Meena do for her younger sister?" },
          trap: { pa: "'Look after' ਦਾ ਅਰਥ ਕਿਸੇ ਦੇ ਪਿੱਛੇ ਵੇਖਣਾ ਨਹੀਂ; ਇਹ ਉਸਦੀ ਦੇਖਭਾਲ ਕਰਨ ਦਾ ਮੁਹਾਵਰਾਤਮਕ ਅਰਥ ਹੈ।", en: "'Look after' does not mean to look behind someone; it is an idiomatic expression meaning to care for someone." },
          options: [
            { t: { pa: "ਦੇਖਭਾਲ ਕਰਨੀ", en: "to take care of" }, correct: true, r: { pa: "Meena ਛੋਟੀ ਭੈਣ ਦੀ ਦੇਖਭਾਲ ਕਰਦੀ ਹੈ, ਇਸ ਲਈ 'look after' ਦਾ ਅਰਥ 'take care of' ਹੈ।", en: "Meena cares for her younger sister, so 'look after' means 'take care of'." } },
            { t: { pa: "ਬਾਅਦ ਵਿੱਚ ਵੇਖਣਾ", en: "to look at later" }, correct: false, r: { pa: "ਸ਼ਬਦਾਂ ਦਾ ਸਿੱਧਾ ਅਰਥ ਲੈਣ ਨਾਲ ਵਾਕਾਂਸ਼ ਕ੍ਰਿਆ ਦਾ ਅਸਲੀ ਅਰਥ ਨਹੀਂ ਮਿਲਦਾ।", en: "Taking the words literally misses the phrasal verb's actual meaning." } },
            { t: { pa: "ਖੋਜ ਕਰਨੀ", en: "to search for" }, correct: false, r: { pa: "'Look for' ਦਾ ਅਰਥ ਖੋਜਣਾ ਹੈ; 'look after' ਦਾ ਅਰਥ ਦੇਖਭਾਲ ਕਰਨਾ ਹੈ।", en: "'Look for' means to search; 'look after' means to care for." } },
            { t: { pa: "ਉਡੀਕ ਕਰਨੀ", en: "to wait for" }, correct: false, r: { pa: "'Wait for' ਉਡੀਕ ਕਰਨ ਲਈ ਹੈ; ਵਾਕ ਵਿੱਚ Meena ਭੈਣ ਦੀ ਸੰਭਾਲ ਕਰਦੀ ਹੈ।", en: "'Wait for' means to await someone; the sentence says Meena cares for her sister." } }

        },
        {

          trap: { pa: "ਪੰਜਾਬੀ ਦੀ ਭਵਿੱਖੀ ਗੱਲ ਨੂੰ ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ if-clause ਅੰਦਰ 'will' ਪਾ ਕੇ ਨਾ ਲਿਖੋ।", en: "Do not translate the future Punjabi condition by putting 'will' inside the English if-clause." },

        {

          hint: { pa: "ਇਕਵਚਨ third-person ਕਰਤਾ ਨਾਲ simple present ਦੇ ਸਵਾਲ ਵਿੱਚ Does ਵਰਤੋ; ਮੁੱਖ ਕਿਰਿਆ ਮੂਲ ਰੂਪ ਵਿੱਚ ਰਹਿੰਦੀ ਹੈ।", en: "Use 'Does' to form a simple-present question with a third-person singular subject; keep the main verb in its base form." },
          trap: { pa: "Does ਲੱਗਣ ਤੋਂ ਬਾਅਦ ਮੁੱਖ ਕਿਰਿਆ 'play' ਰਹਿੰਦੀ ਹੈ—'plays' ਨਹੀਂ।", en: "After 'Does', the main verb stays 'play', not 'plays'." },

        {
          id: "ENG-GR-64", ch: "Grammar · Punctuation", competency: "Application", diff: "Easy",
          prompt: { pa: "ਦੋ ਪੂਰੇ ਵਾਕਾਂ ਨੂੰ ਸਹੀ ਤਰ੍ਹਾਂ ਜੋੜਨ ਵਾਲਾ ਵਾਕ ਚੁਣੋ।", en: "Choose the sentence that correctly joins two complete clauses." },
          hint: { pa: "ਜਦੋਂ and ਦੋ ਪੂਰੇ ਵਾਕ ਜੋੜਦਾ ਹੈ, ਤਾਂ ਆਮ ਤੌਰ 'ਤੇ and ਤੋਂ ਪਹਿਲਾਂ comma ਲੱਗਦਾ ਹੈ।", en: "When 'and' joins two complete clauses, a comma is generally placed before 'and'." },
          trap: { pa: "ਦੋਹਾਂ ਹਿੱਸਿਆਂ ਵਿੱਚ ਆਪਣਾ subject ਅਤੇ verb ਹੈ: 'The bell rang' ਅਤੇ 'the students entered'।", en: "Both parts have their own subject and verb: 'The bell rang' and 'the students entered'." },
          options: [
            { t: { pa: "The bell rang, and the students entered the classroom.", en: "The bell rang, and the students entered the classroom." }, correct: true, r: { pa: "ਦੋ independent clauses ਨੂੰ and ਨਾਲ ਜੋੜਿਆ ਹੈ; and ਤੋਂ ਪਹਿਲਾਂ comma ਸਹੀ ਹੈ।", en: "The two independent clauses are joined by 'and'; the comma before 'and' is correct." } },
            { t: { pa: "The bell rang and, the students entered the classroom.", en: "The bell rang and, the students entered the classroom." }, correct: false, r: { pa: "Comma 'and' ਤੋਂ ਪਹਿਲਾਂ ਆਉਂਦਾ ਹੈ, ਇਸ ਤੋਂ ਬਾਅਦ ਨਹੀਂ।", en: "The comma belongs before 'and', not after it." } },
            { t: { pa: "The bell rang the students entered the classroom.", en: "The bell rang the students entered the classroom." }, correct: false, r: { pa: "ਦੋ ਪੂਰੇ ਵਾਕਾਂ ਨੂੰ ਬਿਨਾਂ ਜੋੜਕ ਜਾਂ ਵਿਰਾਮ-ਚਿੰਨ੍ਹ ਦੇ ਸਿੱਧਾ ਨਹੀਂ ਜੋੜਨਾ ਚਾਹੀਦਾ।", en: "Two complete clauses should not be run together without a conjunction or punctuation." } },
            { t: { pa: "The bell rang, the students entered the classroom.", en: "The bell rang, the students entered the classroom." }, correct: false, r: { pa: "ਸਿਰਫ਼ comma ਨਾਲ ਦੋ ਪੂਰੇ ਵਾਕ ਜੋੜਨਾ comma splice ਹੈ; and ਵਰਗਾ ਜੋੜਕ ਵੀ ਲਗਾਓ।", en: "Joining two complete clauses with only a comma creates a comma splice; add a conjunction such as 'and'." } }

          hint: { pa: "ਹਵਾ ਮਨੁੱਖ ਵਾਂਗ ਫੁਸਫੁਸਾਉਂਦੀ ਹੈ—ਦੇਖੋ ਕਿ ਕੁਦਰਤੀ ਚੀਜ਼ ਨੂੰ ਮਨੁੱਖੀ ਕੰਮ ਦਿੱਤਾ ਗਿਆ ਹੈ ਜਾਂ ਨਹੀਂ।", en: "The wind is described as whispering like a person; notice whether a human action is given to something non-human." },

          trap: { pa: "ਪਹਿਲਾ ਵਾਕ ਸਮੱਸਿਆ ਦੱਸਦਾ ਹੈ; ਪੂਰਾ ਪਾਠ ਵਿਦਿਆਰਥੀਆਂ ਵੱਲੋਂ ਜਾਣਕਾਰੀ ਇਕੱਠੀ ਕਰਨ ਅਤੇ ਮੁਰੰਮਤ ਦੀ ਯੋਜਨਾ ਬਣਨ ਤੱਕ ਜਾਂਦਾ ਹੈ।", en: "The first sentence gives the problem; the whole passage follows student information through to repair planning." },
          options: [
            { t: { pa: "ਵਿਦਿਆਰਥੀਆਂ ਨੇ ਸਥਾਨਕ ਸਮੱਸਿਆ ਦਾ ਨਕਸ਼ਾ ਬਣਾਕੇ ਕੌਂਸਲ ਨੂੰ ਮੁਰੰਮਤ ਦੀ ਯੋਜਨਾ ਬਣਾਉਣ ਵਿੱਚ ਮਦਦ ਕੀਤੀ।", en: "Students mapped a local problem and helped the council plan repairs." }, correct: true,
              r: { pa: "ਇਹ ਸਮੱਸਿਆ, ਵਿਦਿਆਰਥੀਆਂ ਦੇ ਕੰਮ ਅਤੇ ਉਸ ਦੇ ਨਤੀਜੇ—ਤਿੰਨਾਂ ਨੂੰ ਸਮੇਟਦਾ ਹੈ।", en: "This captures the problem, the students' action, and its result." } },
            { t: { pa: "ਜ਼ਿਲ੍ਹਾ ਹਸਪਤਾਲ ਦੀ ਬੱਸ ਹਰ ਰੋਜ਼ ਦੇਰ ਨਾਲ ਆਉਂਦੀ ਸੀ।", en: "The district-hospital bus was late every day." }, correct: false,
              r: { pa: "ਪਾਠ ਕਹਿੰਦਾ ਹੈ ਕਿ ਬੱਸ ਅਕਸਰ ਮੀਂਹ ਤੋਂ ਬਾਅਦ ਦੇਰ ਨਾਲ ਹੁੰਦੀ ਸੀ; ਇਹ ਪੂਰੇ ਪਾਠ ਦਾ ਮੁੱਖ ਵਿਚਾਰ ਨਹੀਂ।", en: "The passage says the bus was often delayed after heavy rain; this is only one detail, not the main idea." } },
            { t: { pa: "ਵਿਦਿਆਰਥੀਆਂ ਨੇ ਹਸਪਤਾਲ ਜਾਣ ਲਈ ਨਵਾਂ ਰਸਤਾ ਲੱਭਿਆ।", en: "The students found a new route to the hospital." }, correct: false,
              r: { pa: "ਨਕਸ਼ਾ ਪਾਣੀ ਭਰੇ ਟੋਇਆਂ ਦਾ ਸੀ ਅਤੇ ਕੌਂਸਲ ਨੇ ਇਸ ਨਾਲ ਮੁਰੰਮਤ ਦੀ ਯੋਜਨਾ ਬਣਾਈ; ਨਵਾਂ ਰਸਤਾ ਨਹੀਂ ਲੱਭਿਆ।", en: "The map showed flooded potholes and helped plan repairs; it did not identify a new route." } },
            { t: { pa: "ਅਗਲੇ ਮਾਨਸੂਨ ਤੋਂ ਪਹਿਲਾਂ ਸਾਰੀ ਸੜਕ ਦੀ ਮੁਰੰਮਤ ਹੋ ਗਈ ਸੀ।", en: "The entire road had been repaired before the next monsoon." }, correct: false,
              r: { pa: "ਪਾਠ ਸਿਰਫ਼ ਮੁਰੰਮਤ ਦੀ ਯੋਜਨਾ ਬਣਾਉਣ ਦੀ ਗੱਲ ਕਰਦਾ ਹੈ, ਸਾਰੀ ਮੁਰੰਮਤ ਪੂਰੀ ਹੋਣ ਦੀ ਨਹੀਂ।", en: "The passage says repairs were planned, not that the entire road was repaired." } }
          ],
          objective: { pa: "Main idea ਲੱਭਦੇ ਸਮੇਂ ਪਾਠ ਦੇ ਸਾਰੇ ਵਾਕਾਂ ਨੂੰ ਜੋੜਨ ਵਾਲਾ ਵਿਚਾਰ ਚੁਣੋ; ਇੱਕ ਵੇਰਵੇ ਨੂੰ ਪੂਰੇ ਪਾਠ ਦਾ ਮੁੱਖ ਵਿਚਾਰ ਨਾ ਮੰਨੋ।", en: "To identify the main idea, choose the point that connects the whole passage; do not mistake one detail for the central idea." }
        },
        {
          id: "ENG-GR-71", ch: "Grammar · Degrees of Comparison", competency: "Application", diff: "Easy",
          prompt: { pa: "ਸਹੀ comparative adjective ਚੁਣੋ: \"This road is ______ than the old one.\"", en: "Choose the correct comparative adjective: \"This road is ______ than the old one.\"" },
          hint: { pa: "Than ਦੋ ਚੀਜ਼ਾਂ ਦੀ ਤੁਲਨਾ ਦਾ ਸੰਕੇਤ ਹੈ; 'narrow' ਦਾ comparative ਰੂਪ ਬਣਾਓ।", en: "'Than' signals a comparison between two things; form the comparative of 'narrow'." },
          trap: { pa: "Than ਦੋ ਚੀਜ਼ਾਂ ਦੀ ਤੁਲਨਾ ਦੱਸਦਾ ਹੈ; superlative ਨਹੀਂ, comparative ਵਰਤੋ।", en: "'Than' compares two things; use a comparative, not a superlative." },
          options: [
            { t: { pa: "narrower", en: "narrower" }, correct: true, r: { pa: "'Narrow' ਦਾ comparative 'narrower' ਹੈ; ਤੁਲਨਾ ਤੋਂ ਪਹਿਲਾਂ than ਆਉਂਦਾ ਹੈ।", en: "The comparative of 'narrow' is 'narrower', used with 'than' for this comparison." } },
            { t: { pa: "narrowest", en: "narrowest" }, correct: false, r: { pa: "'Narrowest' superlative ਹੈ, ਜੋ ਤਿੰਨ ਜਾਂ ਵੱਧ ਵਿੱਚ ਸਭ ਤੋਂ ਵੱਧ ਦੱਸਦਾ ਹੈ।", en: "'Narrowest' is the superlative, used for the greatest degree in a group." } },
            { t: { pa: "more narrower", en: "more narrower" }, correct: false, r: { pa: "Comparative ਨੂੰ ਦੋ ਵਾਰ ਨਾ ਲਗਾਓ; 'more' ਜਾਂ '-er' ਵਿੱਚੋਂ ਇੱਕ ਵਰਤੋ।", en: "Do not mark the comparative twice; use either 'more' or '-er', not both." } },
            { t: { pa: "narrow", en: "narrow" }, correct: false, r: { pa: "Than ਨਾਲ ਤੁਲਨਾ ਲਈ comparative ਰੂਪ ਚਾਹੀਦਾ ਹੈ, ਸਿਰਫ਼ ਮੂਲ adjective ਨਹੀਂ।", en: "A comparison with 'than' needs the comparative form, not the base adjective." } }
          ],
          objective: { pa: "ਛੋਟੇ adjectives ਵਿੱਚ ਅਕਸਰ -er comparative ਅਤੇ -est superlative ਬਣਾਉਂਦਾ ਹੈ: narrow, narrower, narrowest।", en: "Short adjectives often form the comparative with -er and the superlative with -est: narrow, narrower, narrowest." }
        },
        {
          id: "ENG-GR-72", ch: "Grammar · Demonstratives", competency: "Application", diff: "Easy",
          prompt: { pa: "ਨੇੜੇ ਪਈਆਂ ਕਈ ਸੇਬਾਂ ਵੱਲ ਇਸ਼ਾਰਾ ਕਰਦੇ ਹੋਏ ਸਹੀ ਸ਼ਬਦ ਚੁਣੋ: \"______ apples are ripe.\"", en: "Choose the correct demonstrative for several apples nearby: \"______ apples are ripe.\"" },
          hint: { pa: "ਨੇੜੇ ਲਈ this/these ਅਤੇ ਦੂਰ ਲਈ that/those ਵਰਤੋ; plural ਨਾਂਵ ਨਾਲ plural ਰੂਪ ਚਾਹੀਦਾ ਹੈ।", en: "Use this/these for nearby things and that/those for distant things; a plural noun needs a plural form." },
          trap: { pa: "Apples ਬਹੁਵਚਨ ਹੈ ਅਤੇ ਨੇੜੇ ਹਨ—ਦੋਵੇਂ ਸੰਕੇਤ ਇਕੱਠੇ ਦੇਖੋ।", en: "'Apples' is plural and the fruit is nearby; use both clues." },
          options: [
            { t: { pa: "These", en: "These" }, correct: true, r: { pa: "These ਨੇੜੇ ਦੀਆਂ ਕਈ ਚੀਜ਼ਾਂ ਲਈ ਹੈ ਅਤੇ apples ਨਾਲ ਵਚਨ ਵਿੱਚ ਮਿਲਦਾ ਹੈ।", en: "'These' refers to several nearby things and agrees with the plural noun 'apples'." } },
            { t: { pa: "This", en: "This" }, correct: false, r: { pa: "This ਇਕਵਚਨ ਨੇੜੀ ਚੀਜ਼ ਲਈ ਹੈ; apples ਬਹੁਵਚਨ ਹੈ।", en: "'This' is singular; 'apples' is plural." } },
            { t: { pa: "Those", en: "Those" }, correct: false, r: { pa: "Those ਦੂਰ ਪਈਆਂ ਕਈ ਚੀਜ਼ਾਂ ਲਈ ਹੈ; ਵਾਕ ਵਿੱਚ ਸੇਬ ਨੇੜੇ ਹਨ।", en: "'Those' is plural but refers to things farther away; the apples are nearby." } },
            { t: { pa: "That", en: "That" }, correct: false, r: { pa: "That ਦੂਰ ਦੀ ਇਕਵਚਨ ਚੀਜ਼ ਲਈ ਹੈ; ਇੱਥੇ ਚੀਜ਼ਾਂ ਨੇੜੇ ਅਤੇ ਬਹੁਵਚਨ ਹਨ।", en: "'That' is singular and distant; these items are nearby and plural." } }
          ],
          objective: { pa: "Demonstratives: this (ਨੇੜੇ, ਇਕਵਚਨ), these (ਨੇੜੇ, ਬਹੁਵਚਨ), that (ਦੂਰ, ਇਕਵਚਨ), those (ਦੂਰ, ਬਹੁਵਚਨ)।", en: "Demonstratives: this (near, singular), these (near, plural), that (far, singular), those (far, plural)." }
        },
        {
          id: "ENG-GR-73", ch: "Grammar · Question Words", competency: "Application", diff: "Easy",
          prompt: { pa: "ਸਵਾਲ ਦਾ ਜਵਾਬ 'By bus' ਹੈ। ਸਹੀ ਸਵਾਲੀ ਸ਼ਬਦ ਚੁਣੋ: \"______ do you travel to school?\"", en: "The answer is 'By bus.' Choose the correct question word: \"______ do you travel to school?\"" },
          hint: { pa: "ਜਵਾਬ ਆਵਾਜਾਈ ਦੇ ਢੰਗ ਬਾਰੇ ਹੈ, ਥਾਂ ਜਾਂ ਸਮੇਂ ਬਾਰੇ ਨਹੀਂ।", en: "The answer tells the means of travel, not a place or a time." },
          trap: { pa: "How ਤਰੀਕਾ ਪੁੱਛਦਾ ਹੈ; where ਥਾਂ ਅਤੇ when ਸਮਾਂ ਪੁੱਛਦਾ ਹੈ।", en: "'How' asks about a manner or means; 'where' asks about place and 'when' about time." },
          options: [
            { t: { pa: "How", en: "How" }, correct: true, r: { pa: "'How' ਤਰੀਕਾ ਪੁੱਛਦਾ ਹੈ; 'by bus' ਯਾਤਰਾ ਦਾ ਢੰਗ ਦੱਸਦਾ ਹੈ।", en: "'How' asks about the way or means; 'by bus' gives the means of travel." } },
            { t: { pa: "Where", en: "Where" }, correct: false, r: { pa: "'Where' ਥਾਂ ਪੁੱਛਦਾ ਹੈ; 'by bus' ਥਾਂ ਨਹੀਂ ਦੱਸਦਾ।", en: "'Where' asks for a place; 'by bus' is not a place." } },
            { t: { pa: "When", en: "When" }, correct: false, r: { pa: "'When' ਸਮਾਂ ਪੁੱਛਦਾ ਹੈ; ਇੱਥੇ ਸਵਾਲ ਯਾਤਰਾ ਦੇ ਢੰਗ ਬਾਰੇ ਹੈ।", en: "'When' asks about time; this question is about the means of travel." } },
            { t: { pa: "Why", en: "Why" }, correct: false, r: { pa: "'Why' ਕਾਰਨ ਪੁੱਛਦਾ ਹੈ; 'by bus' ਕਾਰਨ ਨਹੀਂ, ਸਾਧਨ ਹੈ।", en: "'Why' asks for a reason; 'by bus' gives a means, not a reason." } }
          ],
          objective: { pa: "Question words: who—ਕੌਣ, where—ਕਿੱਥੇ, when—ਕਦੋਂ, why—ਕਿਉਂ, how—ਕਿਵੇਂ/ਕਿਸ ਤਰੀਕੇ ਨਾਲ।", en: "Question words: who asks about a person, where a place, when a time, why a reason, and how a manner or means." }
        },
        {
          id: "ENG-GR-74", ch: "Grammar · Imperatives", competency: "Application", diff: "Easy",
          prompt: { pa: "ਗਿੱਲੇ ਰੰਗ ਬਾਰੇ ਸਹੀ ਨਕਾਰਾਤਮਕ ਹਦਾਇਤ ਚੁਣੋ।", en: "Choose the correct negative instruction about wet paint." },
          hint: { pa: "ਨਕਾਰਾਤਮਕ imperative ਵਿੱਚ Do not ਜਾਂ Don't ਤੋਂ ਬਾਅਦ ਕਿਰਿਆ ਦਾ ਮੂਲ ਰੂਪ ਆਉਂਦਾ ਹੈ।", en: "A negative imperative uses Do not or Don't followed by the base form of the verb." },
          trap: { pa: "Do not ਤੋਂ ਬਾਅਦ touch ਲਿਖੋ, touches ਜਾਂ touched ਨਹੀਂ।", en: "Use 'touch' after 'Do not', not 'touches' or 'touched'." },
          options: [
            { t: { pa: "Do not touch the wet paint.", en: "Do not touch the wet paint." }, correct: true, r: { pa: "ਨਕਾਰਾਤਮਕ ਹੁਕਮ ਦੀ ਬਣਤਰ Do not + ਮੂਲ ਕਿਰਿਆ ਹੈ: Do not touch।", en: "The negative command is Do not + base verb: Do not touch." } },
            { t: { pa: "Does not touch the wet paint.", en: "Does not touch the wet paint." }, correct: false, r: { pa: "Does not ਆਮ ਤੌਰ 'ਤੇ ਤੀਜੇ ਪੁਰਖ ਦੇ ਬਿਆਨ ਵਿੱਚ ਆਉਂਦਾ ਹੈ; ਹਦਾਇਤ ਲਈ Do not ਵਰਤੋ।", en: "'Does not' belongs in a third-person statement; use 'Do not' for an instruction." } },
            { t: { pa: "Not touches the wet paint.", en: "Not touches the wet paint." }, correct: false, r: { pa: "ਨਕਾਰਾਤਮਕ imperative ਵਿੱਚ Do not ਲਗਦਾ ਹੈ ਅਤੇ ਕਿਰਿਆ ਮੂਲ ਰੂਪ ਵਿੱਚ ਰਹਿੰਦੀ ਹੈ।", en: "A negative imperative uses 'Do not' and keeps the verb in its base form." } },
            { t: { pa: "Did not touch the wet paint.", en: "Did not touch the wet paint." }, correct: false, r: { pa: "Did not ਭੂਤਕਾਲੀ ਬਿਆਨ ਹੈ; ਇੱਥੇ ਮੌਜੂਦਾ ਹਦਾਇਤ ਚਾਹੀਦੀ ਹੈ।", en: "'Did not' makes a past statement; this needs a present instruction." } }
          ],
          objective: { pa: "Imperative ਹਦਾਇਤ ਜਾਂ ਬੇਨਤੀ ਲਈ verb ਦੇ ਮੂਲ ਰੂਪ ਨਾਲ ਸ਼ੁਰੂ ਹੁੰਦਾ ਹੈ; ਨਕਾਰਾਤਮਕ imperative: Do not/Don't + V1।", en: "An imperative gives an instruction or request and starts with the base verb; a negative imperative is Do not/Don't + V1." }
        },
        {
          id: "ENG-VOC-12", ch: "Vocabulary · Words in Context", competency: "Understanding", diff: "Easy",
          prompt: { pa: "\"After walking for hours in the heat, the exhausted hikers rested in the shade.\" 'Exhausted' ਦਾ ਕੀ ਅਰਥ ਹੈ?", en: "\"After walking for hours in the heat, the exhausted hikers rested in the shade.\" What does \"exhausted\" mean?" },
          hint: { pa: "ਘੰਟਿਆਂ ਤੱਕ ਗਰਮੀ ਵਿੱਚ ਤੁਰਨ ਤੋਂ ਬਾਅਦ ਯਾਤਰੀਆਂ ਨੂੰ ਕਿਵੇਂ ਮਹਿਸੂਸ ਹੋਇਆ ਹੋਵੇਗਾ?", en: "How would the hikers likely feel after walking for hours in the heat?" },
          trap: { pa: "ਵਾਕ ਵਿੱਚ hikers ਰੁਕ ਕੇ ਆਰਾਮ ਕਰਦੇ ਹਨ; ਸੰਦਰਭ ਤੋਂ ਥਕਾਵਟ ਦਾ ਅਰਥ ਲੱਭੋ।", en: "The hikers stop to rest; use that context to work out the word's meaning." },
          options: [

            { t: { pa: "ਬਹੁਤ ਉਤਸ਼ਾਹਿਤ", en: "very excited" }, correct: false, r: { pa: "Excited ਖੁਸ਼ੀ ਜਾਂ ਉਤਸੁਕਤਾ ਹੈ; ਇਹ ਤੁਰਨ ਮਗਰੋਂ ਆਰਾਮ ਕਰਨ ਦੇ ਸੰਦਰਭ ਨਾਲ ਨਹੀਂ ਮਿਲਦਾ।", en: "'Excited' means eager or enthusiastic, which does not fit the need to rest after walking." } },
            { t: { pa: "ਬਹੁਤ ਭੁੱਖੇ", en: "very hungry" }, correct: false, r: { pa: "ਭੁੱਖ ਖਾਣ ਦੀ ਲੋੜ ਹੈ; ਵਾਕ ਲੰਮੇ ਸਫ਼ਰ ਤੋਂ ਬਾਅਦ ਸਰੀਰਕ ਥਕਾਵਟ ਦੱਸਦਾ ਹੈ।", en: "Hunger is a need for food; the context points to tiredness after a long walk." } },
            { t: { pa: "ਬਹੁਤ ਗੁੱਸੇ", en: "very angry" }, correct: false, r: { pa: "ਗੁੱਸੇ ਦਾ ਕੋਈ ਸੰਕੇਤ ਨਹੀਂ; ਤੁਰਨ ਅਤੇ ਆਰਾਮ ਕਰਨ ਦਾ ਸੰਦਰਭ ਥਕਾਵਟ ਦੱਸਦਾ ਹੈ।", en: "There is no sign of anger; walking and resting point to tiredness." } }
          ],
          objective: { pa: "Vocabulary ਦਾ ਅਰਥ ਸੰਦਰਭ ਤੋਂ ਪਛਾਣੋ: ਨੇੜਲੇ ਕਿਰਿਆ-ਸ਼ਬਦ, ਕਾਰਨ ਅਤੇ ਨਤੀਜੇ ਅਕਸਰ ਸੁਰਾਗ਼ ਦਿੰਦੇ ਹਨ।", en: "Infer vocabulary from context: nearby actions, causes, and results often provide clues to a word's meaning." }
        },
        {

          prompt: { pa: "ਪਾਠ ਪੜ੍ਹੋ: \"The class planted marigold seeds on Monday. They watered the pots each morning. On Friday, the first green shoots appeared.\" ਪਹਿਲੇ ਹਰੇ ਅੰਕੁਰ ਕਿਹੜੇ ਦਿਨ ਦਿਖੇ?", en: "Read: \"The class planted marigold seeds on Monday. They watered the pots each morning. On Friday, the first green shoots appeared.\" On which day did the first green shoots appear?" },
          hint: { pa: "ਆਖ਼ਰੀ ਵਾਕ ਵਿੱਚ ਅੰਕੁਰ ਦਿਖਣ ਵਾਲਾ ਦਿਨ ਸਿੱਧਾ ਦਿੱਤਾ ਹੈ।", en: "The final sentence directly states the day the shoots appeared." },

            { t: { pa: "ਐਤਵਾਰ ਨੂੰ", en: "On Sunday" }, correct: false, r: { pa: "ਐਤਵਾਰ ਦਾ ਜ਼ਿਕਰ ਨਹੀਂ; ਪਾਠ ਅਨੁਸਾਰ ਅੰਕੁਰ ਸ਼ੁੱਕਰਵਾਰ ਨੂੰ ਦਿਖੇ।", en: "Sunday is not mentioned; according to the passage, the shoots appeared on Friday." } }
          ],
          objective: { pa: "Reading comprehension ਵਿੱਚ ਮੰਗਿਆ ਗਿਆ ਖ਼ਾਸ ਵੇਰਵਾ ਲੱਭੋ ਅਤੇ ਮਿਲਦੇ-ਜੁਲਦੇ ਹੋਰ ਵੇਰਵੇ—ਜਿਵੇਂ ਬੀਜ ਲਗਾਉਣ ਦਾ ਦਿਨ—ਨਾਲ ਗਲਤਫ਼ਹਮੀ ਨਾ ਕਰੋ।", en: "For a reading-detail question, locate the specific fact asked for and distinguish it from related details, such as the day the seeds were planted." }

        {

          hint: { pa: "ਇੱਥੇ ਸਖ਼ਤ ਹੁਕਮ ਨਹੀਂ, ਸਗੋਂ ਲਾਭਦਾਇਕ ਸਲਾਹ ਦਿੱਤੀ ਜਾ ਰਹੀ ਹੈ।", en: "This gives helpful advice rather than a strict command." },
          trap: { pa: "Should ਸਲਾਹ ਦਿੰਦਾ ਹੈ; might ਸੰਭਾਵਨਾ ਅਤੇ can ਸਮਰੱਥਾ/ਇਜਾਜ਼ਤ ਦੱਸਦੇ ਹਨ।", en: "'Should' gives advice; 'might' expresses possibility and 'can' ability or permission." },
          options: [

            { t: { pa: "might", en: "might" }, correct: false, r: { pa: "'Might' ਸੰਭਾਵਨਾ ਦੱਸਦਾ ਹੈ, ਸਿੱਧੀ ਸਲਾਹ ਨਹੀਂ।", en: "'Might' expresses possibility, not direct advice." } },
            { t: { pa: "can", en: "can" }, correct: false, r: { pa: "'Can' ਸਮਰੱਥਾ ਜਾਂ ਇਜਾਜ਼ਤ ਦੱਸਦਾ ਹੈ; ਇੱਥੇ ਸਲਾਹ ਦੇਣੀ ਹੈ।", en: "'Can' expresses ability or permission; the sentence needs advice." } },
            { t: { pa: "would", en: "would" }, correct: false, r: { pa: "'Would' ਇੱਥੇ ਸਲਾਹ ਦੇਣ ਵਾਲਾ ਆਮ modal ਨਹੀਂ; 'should see' ਸਹੀ ਹੈ।", en: "'Would' is not the usual advice modal here; 'should see' expresses the intended advice." } }
          ],
          objective: { pa: "Should ਦੀ ਵਰਤੋਂ ਸਲਾਹ ਅਤੇ ਉਚਿਤ ਕੰਮ ਲਈ ਕਰੋ: You should revise before the test.", en: "Use 'should' for advice or a recommended action: You should revise before the test." }
        },
        {
          id: "ENG-GR-76", ch: "Grammar · Voice", competency: "Application", diff: "Medium",
          prompt: { pa: "ਸਹੀ ਕਰਮਵਾਚੀ ਰੂਪ ਚੁਣੋ: \"The workers have repaired the bridge.\"", en: "Choose the correct passive form: \"The workers have repaired the bridge.\"" },
          hint: { pa: "ਮੂਲ ਵਾਕ present perfect ਵਿੱਚ ਹੈ। Passive ਲਈ has/have been + V₃ ਲਗਾਓ ਅਤੇ ਨਵੇਂ subject ਨਾਲ has/have ਮਿਲਾਓ।", en: "The original is present perfect. Form the passive with has/have been + V₃ and make has/have agree with the new subject." },
          trap: { pa: "Bridge ਇਕਵਚਨ ਹੈ, ਇਸ ਲਈ 'has been repaired' ਆਵੇਗਾ; 'have repaired' active ਬਣਤਰ ਹੈ।", en: "'Bridge' is singular, so use 'has been repaired'; 'have repaired' is the active form." },
          options: [
            { t: { pa: "The bridge has been repaired by the workers.", en: "The bridge has been repaired by the workers." }, correct: true, r: { pa: "ਕਰਮ bridge ਨਵਾਂ subject ਬਣਿਆ; present perfect passive ਦੀ ਬਣਤਰ has been + V₃ ਹੈ।", en: "The object 'bridge' becomes the subject; the present perfect passive is has been + V₃." } },
            { t: { pa: "The bridge have been repaired by the workers.", en: "The bridge have been repaired by the workers." }, correct: false, r: { pa: "Bridge ਇਕਵਚਨ ਹੈ, ਇਸ ਲਈ 'have' ਨਹੀਂ, 'has' ਵਰਤੋ।", en: "'Bridge' is singular, so use 'has', not 'have'." } },
            { t: { pa: "The bridge has repaired by the workers.", en: "The bridge has repaired by the workers." }, correct: false, r: { pa: "Present perfect passive ਵਿੱਚ has ਤੋਂ ਬਾਅਦ been ਵੀ ਲਾਜ਼ਮੀ ਹੈ: has been repaired।", en: "The present perfect passive also needs 'been' after 'has': has been repaired." } },
            { t: { pa: "The workers have been repaired the bridge.", en: "The workers have been repaired the bridge." }, correct: false, r: { pa: "ਇਸ ਚੋਣ ਵਿੱਚ ਕਰਤਾ ਅਤੇ ਕਰਮ ਦੀ ਭੂਮਿਕਾ ਗਲਤ ਹੋ ਗਈ; bridge ਨਵਾਂ subject ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ।", en: "This reverses the agent and receiver; the bridge should become the new subject." } }
          ],
          objective: { pa: "Present perfect passive: ਕਰਮ + has/have been + V₃ (+ by + ਕਰਤਾ): The letters have been sent.", en: "Present perfect passive: object + has/have been + V₃ (+ by + agent): The letters have been sent." }
        },
        {

          options: [

            { t: { pa: "visiting", en: "visiting" }, correct: false, r: { pa: "ਇਸ ਅਰਥ ਵਿੱਚ 'decide' ਤੋਂ ਬਾਅਦ gerund ਨਹੀਂ, to-infinitive ਵਰਤਦੇ ਹਨ।", en: "In this meaning, 'decide' takes a to-infinitive rather than a gerund." } },
            { t: { pa: "visit", en: "visit" }, correct: false, r: { pa: "ਇੱਥੇ 'decided' ਤੋਂ ਬਾਅਦ 'to' ਲੋੜੀਂਦਾ ਹੈ: decided to visit।", en: "This use of 'decided' needs 'to': decided to visit." } },
            { t: { pa: "visited", en: "visited" }, correct: false, r: { pa: "'Visited' ਭੂਤਕਾਲੀ ਰੂਪ ਹੈ ਅਤੇ 'decided' ਤੋਂ ਬਾਅਦ ਇਸ ਤਰ੍ਹਾਂ ਨਹੀਂ ਆਉਂਦਾ।", en: "'Visited' is a past-tense form and does not follow 'decided' in this construction." } }
          ],

        },
        {
          id: "ENG-VOC-13", ch: "Vocabulary · Phrasal Verbs", competency: "Understanding", diff: "Medium",
          prompt: { pa: "\"The match was put off because of heavy rain.\" ਇਸ ਵਾਕ ਵਿੱਚ 'put off' ਦਾ ਕੀ ਅਰਥ ਹੈ?", en: "What does the phrasal verb 'put off' mean in \"The match was put off because of heavy rain\"?" },
          hint: { pa: "ਮੀਂਹ ਕਾਰਨ ਮੈਚ ਕਿਸੇ ਹੋਰ ਸਮੇਂ ਲਈ ਰੱਖਿਆ ਗਿਆ—ਇਸ ਕਾਰਵਾਈ ਲਈ ਕਿਹੜਾ ਸ਼ਬਦ ਹੈ?", en: "The rain caused the match to be moved to a later time—which meaning fits?" },
          trap: { pa: "Put off ਦਾ ਇੱਥੇ ਸ਼ਾਬਦਿਕ ਅਰਥ ਨਹੀਂ; ਮੈਚ ਰੱਦ ਨਹੀਂ, ਬਾਅਦ ਲਈ ਟਾਲਿਆ ਗਿਆ।", en: "Do not read 'put off' literally here; the match was delayed, not cancelled." },
          options: [
            { t: { pa: "ਮੁਲਤਵੀ ਕਰਨਾ", en: "postpone" }, correct: true, r: { pa: "ਮੀਂਹ ਕਾਰਨ ਮੈਚ ਬਾਅਦ ਲਈ ਰੱਖਿਆ ਗਿਆ; 'put off' ਦਾ ਅਰਥ postpone ਹੈ।", en: "The rain moved the match to a later time; 'put off' means postpone." } },
            { t: { pa: "ਸ਼ੁਰੂ ਕਰਨਾ", en: "begin" }, correct: false, r: { pa: "ਮੈਚ ਸ਼ੁਰੂ ਨਹੀਂ ਹੋਇਆ; ਇਸਨੂੰ ਬਾਅਦ ਲਈ ਟਾਲਿਆ ਗਿਆ।", en: "The match did not begin; it was moved to a later time." } },
            { t: { pa: "ਜਿੱਤਣਾ", en: "win" }, correct: false, r: { pa: "ਵਾਕ ਨਤੀਜੇ ਜਾਂ ਜਿੱਤ ਬਾਰੇ ਨਹੀਂ, ਸਮਾਂ ਬਦਲਣ ਬਾਰੇ ਹੈ।", en: "The sentence is about changing the time, not the result of the match." } },
            { t: { pa: "ਰੱਦ ਕਰਨਾ", en: "cancel" }, correct: false, r: { pa: "Postpone ਕਰਨ ਦਾ ਅਰਥ ਬਾਅਦ ਕਰਨਾ ਹੈ; cancel ਕਰਨ ਦਾ ਅਰਥ ਪੂਰੀ ਤਰ੍ਹਾਂ ਰੱਦ ਕਰਨਾ ਹੈ।", en: "To postpone is to delay until later; to cancel is to call it off completely." } }

          objective: { pa: "Phrasal verb put off ਦਾ ਅਰਥ ਮੁਲਤਵੀ ਕਰਨਾ ਹੈ। ਤੁਲਨਾ: call off = ਰੱਦ ਕਰਨਾ; carry on = ਜਾਰੀ ਰੱਖਣਾ।", en: "The phrasal verb 'put off' means postpone. Compare: call off = cancel; carry on = continue." }

        {
          id: "ENG-GR-78", ch: "Grammar · Conjunctions", competency: "Application", diff: "Medium",
          prompt: { pa: "ਨਤੀਜਾ ਦੱਸਣ ਵਾਲਾ conjunction ਚੁਣੋ: \"The road was blocked, ______ we took another route.\"", en: "Choose the conjunction that introduces the result: \"The road was blocked, ______ we took another route.\"" },
          hint: { pa: "ਪਹਿਲਾ ਹਿੱਸਾ ਕਾਰਨ/ਸਥਿਤੀ ਹੈ; ਦੂਜਾ ਹਿੱਸਾ ਉਸਦੇ ਨਤੀਜੇ ਵਜੋਂ ਹੋਇਆ।", en: "The first clause gives the situation; the second tells what happened as a result." },
          trap: { pa: "So ਨਤੀਜਾ ਜੋੜਦਾ ਹੈ; because ਕਾਰਨ ਤੋਂ ਪਹਿਲਾਂ ਆਵੇਗਾ, ਜਿਵੇਂ 'We took another route because the road was blocked.'", en: "'So' introduces a result; 'because' would introduce the reason, as in 'We took another route because the road was blocked.'" },
          options: [
            { t: { pa: "so", en: "so" }, correct: true, r: { pa: "ਸੜਕ ਬੰਦ ਹੋਣ ਕਰਕੇ ਅਸੀਂ ਹੋਰ ਰਸਤਾ ਲਿਆ; 'so' ਨਤੀਜਾ ਦੱਸਦਾ ਹੈ।", en: "The blocked road led us to take another route; 'so' introduces that result." } },
            { t: { pa: "because", en: "because" }, correct: false, r: { pa: "ਇਸ ਕ੍ਰਮ ਵਿੱਚ because ਕਾਰਨ ਵਾਲੇ clause ਤੋਂ ਪਹਿਲਾਂ ਆਉਂਦਾ; ਵਾਕ ਨੂੰ ਮੁੜ ਬਣਾਉਣਾ ਪਵੇਗਾ।", en: "'Because' would introduce the reason; the sentence would need a different clause order." } },
            { t: { pa: "although", en: "although" }, correct: false, r: { pa: "'Although' ਵਿਰੋਧ ਦੱਸਦਾ ਹੈ; ਇੱਥੇ ਦੂਜੀ ਗੱਲ ਪਹਿਲੀ ਦਾ ਨਤੀਜਾ ਹੈ।", en: "'Although' signals contrast; the second clause is a result of the first." } },
            { t: { pa: "unless", en: "unless" }, correct: false, r: { pa: "'Unless' ਸ਼ਰਤ ਦੱਸਦਾ ਹੈ; ਇੱਥੇ ਸੜਕ ਬੰਦ ਹੋਣ ਦਾ ਨਤੀਜਾ ਦੱਸਿਆ ਹੈ।", en: "'Unless' introduces a condition; this sentence gives a result of the blocked road." } }
          ],
          objective: { pa: "Cause-result ਜੋੜ ਵਿੱਚ because ਕਾਰਨ ਵਾਲਾ clause ਸ਼ੁਰੂ ਕਰਦਾ ਹੈ; so ਨਤੀਜੇ ਵਾਲਾ clause ਸ਼ੁਰੂ ਕਰਦਾ ਹੈ।", en: "In cause-and-result sentences, 'because' introduces the reason and 'so' introduces the result." }
        },
        {
          id: "ENG-COM-12", ch: "Comprehension · Inference", competency: "Analysis", diff: "Medium",

          hint: { pa: "Aman ਨੇ ਪਾਣੀ ਦੀ ਕਮੀ ਬਾਰੇ ਸੁਣ ਕੇ ਆਪਣੀਆਂ ਰੋਜ਼ਾਨਾ ਆਦਤਾਂ ਵਿੱਚ ਕੀ ਬਦਲਾਅ ਕੀਤਾ?", en: "After hearing about the shortage, what did Aman change in his everyday actions?" },
          trap: { pa: "ਪਾਠ ਉਸਦੇ ਪਾਣੀ ਬਚਾਉਣ ਵਾਲੇ ਕੰਮ ਦੱਸਦਾ ਹੈ; ਇਹ ਨਹੀਂ ਦੱਸਦਾ ਕਿ ਉਸਦੇ ਕੰਮਾਂ ਨਾਲ ਪੂਰੇ ਇਲਾਕੇ ਦੀ ਕਮੀ ਖ਼ਤਮ ਹੋ ਗਈ।", en: "The passage describes actions that save water; it does not say those actions ended the shortage for the whole area." },
          options: [
            { t: { pa: "Aman ਪਾਣੀ ਬਚਾਉਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰ ਰਿਹਾ ਹੈ।", en: "Aman is trying to conserve water." }, correct: true, r: { pa: "ਨਲ ਬੰਦ ਕਰਨਾ ਅਤੇ ਬਾਲਟੀ ਵਰਤਣਾ ਦੋਵੇਂ ਘੱਟ ਪਾਣੀ ਵਰਤਣ ਦੇ ਤਰੀਕੇ ਹਨ।", en: "Turning off the tap and using a bucket are both ways to use less water." } },
            { t: { pa: "ਕੌਂਸਲ ਨੇ ਪਾਣੀ ਦੀ ਕਮੀ ਪੂਰੀ ਤਰ੍ਹਾਂ ਖ਼ਤਮ ਕਰ ਦਿੱਤੀ।", en: "The council completely ended the water shortage." }, correct: false, r: { pa: "ਪਾਠ ਕੌਂਸਲ ਦੇ ਐਲਾਨ ਬਾਰੇ ਦੱਸਦਾ ਹੈ, ਕਮੀ ਖ਼ਤਮ ਹੋਣ ਬਾਰੇ ਨਹੀਂ।", en: "The passage mentions the council's announcement, not that the shortage ended." } },
