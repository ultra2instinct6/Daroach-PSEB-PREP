<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BOLO.FLASH — PSEB Class 10 Flashcard Engine</title>
<!-- Google Analytics (GA4) — shared loader, see assets/analytics.js -->
<script src="assets/analytics.js"></script>
<meta name="description" content="Bilingual Punjabi-English spaced-repetition flashcards for PSEB Class 10 — 540+ vocabulary and concept cards with 3D flip, Again/Good recall grading and mastery tracking across all 16 chapters.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<style>
  :root {
    --bg-void: #000000;
    --text-bold: #ffffff;
    --text-dim: #8e9bb0;
    --panel: rgba(18, 18, 22, 0.94);
    --border: rgba(255, 255, 255, 0.08);
    --accent: #2ecc71;
    --green: #2ecc71;
    --red: #ff4d6d;
    --amber: #ffaa00;
    --chem: #00e5ff;
    --bio: #2ecc71;
    --phy: #b026ff;
    --env: #ffaa00;
    --fluid-curve: cubic-bezier(0.16, 1, 0.3, 1);
    --font-gurmukhi: 'Noto Sans Gurmukhi', 'Mukta Mahee', 'Gurmukhi Sangam MN', 'Nirmala UI', 'Raavi', 'Lohit Gurmukhi', sans-serif;
  }
  /* CLASSIC = light colorway matching the lecture decks (legacy palette). */
  body[data-theme="CLASSIC"] {
    --bg-void: #f8fbff;
    --text-bold: #182437;
    --text-dim: #5c6f86;
    --panel: rgba(255, 255, 255, 0.92);
    --border: rgba(11, 74, 168, 0.14);
    --accent: #f26a21;
    --green: #179c65;
    --red: #c73a2e;
    --amber: #f26a21;
    --chem: #0b56c5;
    --bio: #179c65;
    --phy: #083b85;
    --env: #f26a21;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg-void); }
  body {
    min-height: 100vh;
    background: var(--bg-void);
    color: var(--text-bold);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, var(--font-gurmukhi);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body::before {
    content: '';
    position: fixed;
    inset: -5%;
    z-index: -3;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.035;
  }
  .aura-bleed {
    position: fixed;
    top: -20vh;
    left: 50%;
    z-index: -2;
    width: 130vw;
    height: 90vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(46, 204, 113, 0.13) 0%, rgba(46, 204, 113, 0.045) 40%, transparent 72%);
    pointer-events: none;
    transition: background 0.9s var(--fluid-curve);
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 10%, rgba(0, 0, 0, 0.94) 100%);
  }
  body[data-theme="CLASSIC"]::after { background: none; }
  body[data-theme="CLASSIC"]::before { background-image: radial-gradient(rgba(11, 86, 197, 0.5) 1px, transparent 1px); opacity: 0.05; }

  /* Page transition veil — matches the menu, the lecture decks and BOLO.MCQ so
     moving between surfaces is one continuous dissolve instead of a hard cut. */
  .page-veil {
    position: fixed;
    inset: 0;
    z-index: 99999;
    pointer-events: none;
    background: var(--bg-void);
    opacity: 1;
    animation: veilFadeOut 420ms var(--fluid-curve) forwards;
  }
  body.page-entered .page-veil { animation: none; opacity: 0; visibility: hidden; }
  body.page-leaving .page-veil { animation: veilFadeIn 300ms var(--fluid-curve) forwards; opacity: 1; visibility: visible; }
  @keyframes veilFadeOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
  @keyframes veilFadeIn { from { opacity: 0; visibility: visible; } to { opacity: 1; visibility: visible; } }
  @media (prefers-reduced-motion: reduce) {
    .page-veil { animation-duration: 160ms; }
    body.page-leaving .page-veil { animation-duration: 140ms; }
  }

  button { border: 0; font: inherit; color: inherit; background: none; cursor: pointer; }
  /* The stage panels use display:flex, which would defeat the hidden attribute. */
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }

  /* ---------- Header ---------- */
  .flash-header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 18px;
    padding: max(18px, env(safe-area-inset-top)) clamp(16px, 4vw, 44px) 12px;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.78) 78%, transparent 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  body[data-theme="CLASSIC"] .flash-header { background: linear-gradient(180deg, rgba(248, 251, 255, 0.95) 0%, rgba(248, 251, 255, 0.82) 78%, transparent 100%); }
  .header-logo {
    font-weight: 900;
    font-size: 1.02rem;
    letter-spacing: 2.6px;
    color: var(--text-bold);
    text-decoration: none;
    white-space: nowrap;
  }
  .header-logo .dot-mode { color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); transition: color 0.5s var(--fluid-curve); }
  body[data-theme="CLASSIC"] .header-logo .dot-mode { text-shadow: none; }
  .home-pill, .theme-pill, .tool-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    color: var(--text-dim);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.25s, border-color 0.25s, transform 0.15s;
  }
  .home-pill:hover, .theme-pill:hover, .tool-pill:hover { color: var(--text-bold); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .home-pill:active, .theme-pill:active, .tool-pill:active { transform: scale(0.96); }
  .router, .dir-switch {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
  }
  .router-btn {
    padding: 7px 13px;
    border-radius: 999px;
    color: var(--text-dim);
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    white-space: nowrap;
    transition: color 0.25s, background 0.25s, box-shadow 0.25s;
  }
  .router-btn.active {
    color: #fff;
    background: color-mix(in srgb, var(--accent) 82%, #000);
    box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  body[data-theme="CLASSIC"] .router-btn.active { background: var(--accent); box-shadow: none; }
  .header-spacer { flex: 1; }
  .score-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 9%, transparent);
    color: var(--text-dim);
    font-size: 0.72rem;
    font-weight: 800;
    white-space: nowrap;
  }
  .score-pill strong { color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ---------- Chapter chips ---------- */
  .chip-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px clamp(16px, 4vw, 44px) 12px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chip-bar::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    color: var(--text-dim);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.4px;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.12s;
  }
  .chip:active { transform: scale(0.95); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sub, var(--accent)); box-shadow: 0 0 8px var(--sub, var(--accent)); }
  body[data-theme="CLASSIC"] .chip .dot { box-shadow: none; }
  .chip.active {
    color: var(--text-bold);
    border-color: color-mix(in srgb, var(--sub, var(--accent)) 55%, transparent);
    background: color-mix(in srgb, var(--sub, var(--accent)) 13%, var(--panel));
  }

  /* ---------- Stage ---------- */
  .stage {
    max-width: 720px;
    margin: 0 auto;
    padding: 6px clamp(16px, 4vw, 32px) 40px;
  }
  .progress-track {
    height: 5px;
    border-radius: 99px;
    background: color-mix(in srgb, var(--text-dim) 16%, transparent);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 75%, #fff 0%), var(--accent));
    box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 55%, transparent);
    transition: width 0.4s var(--fluid-curve);
  }
  body[data-theme="CLASSIC"] .progress-fill { box-shadow: none; }
  .deck-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    color: var(--text-dim);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums;
  }
  .deck-meta .due-flag { color: var(--amber); }
  .deck-meta .mastered-flag { color: var(--accent); }

  /* ---------- 3D flip card ----------
     The scene owns the perspective; the inner element rotates, so both faces
     stay in the same box and never "jump". Nothing between the perspective
     and the rotating element sets overflow, which would flatten the 3D
     context in WebKit (same recipe as the in-deck Quick Revision cards). */
  .scene {
    perspective: 1500px;
    min-height: clamp(320px, 52vh, 460px);
    display: flex;
    cursor: pointer;
    touch-action: pan-y;
    outline: none;
  }
  .scene:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 24px; }
  .flip {
    position: relative;
    flex: 1;
    transform-style: preserve-3d;
    transition: transform 0.5s var(--fluid-curve);
  }
  .scene.is-flipped .flip { transform: rotateY(180deg); }
  .scene.fly-left .flip { transition: transform 0.3s ease-in, opacity 0.3s; transform: translateX(-120%) rotate(-8deg); opacity: 0; }
  .scene.fly-right .flip { transition: transform 0.3s ease-in, opacity 0.3s; transform: translateX(120%) rotate(8deg); opacity: 0; }
  .scene.deal .flip { animation: dealIn 0.42s var(--fluid-curve); }
  @keyframes dealIn { from { transform: translateY(26px) scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(20px, 4vw, 32px);
    border: 1px solid var(--border);
    border-top: 3px solid var(--sub, var(--accent));
    border-radius: 22px;
    background: var(--panel);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow-y: auto;
  }
  body[data-theme="CLASSIC"] .face { box-shadow: 0 18px 44px rgba(24, 60, 130, 0.14); }
  .face.back { transform: rotateY(180deg); border-top-color: var(--accent); }
  /* Keep the face turned away from the student un-clickable. */
  .scene:not(.is-flipped) .face.back { pointer-events: none; }
  .scene.is-flipped .face.front { pointer-events: none; }
  .face-top { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .card-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border: 1px solid color-mix(in srgb, var(--sub, var(--accent)) 40%, transparent);
    border-radius: 999px;
    color: var(--sub, var(--accent));
    font-size: 0.62rem;
    font-weight: 900;
    letter-spacing: 1.4px;
    text-transform: uppercase;
  }
  .card-kicker { color: var(--text-dim); font-size: 0.62rem; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase; }
  .tts-btn {
    margin-left: auto;
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text-dim);
    font-size: 0.95rem;
    transition: color 0.2s, border-color 0.2s, transform 0.12s;
  }
  .tts-btn:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .tts-btn:active { transform: scale(0.9); }
  .card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center; padding: 8px 0; }
  .card-main { font-size: clamp(1.5rem, 4.6vw, 2.2rem); font-weight: 800; line-height: 1.35; overflow-wrap: break-word; }
  .card-main.gurmukhi { font-family: var(--font-gurmukhi); }
  .card-sub { color: var(--text-dim); font-size: clamp(0.95rem, 2.6vw, 1.1rem); font-weight: 600; }
  .card-phonetic { color: var(--text-dim); font-size: 0.9rem; font-weight: 700; letter-spacing: 0.6px; }
  .card-phonetic .pa-ph { font-family: var(--font-gurmukhi); letter-spacing: 0; }
  .card-answer { color: var(--accent); font-size: clamp(1.5rem, 4.6vw, 2.1rem); font-weight: 800; line-height: 1.35; text-shadow: 0 0 26px color-mix(in srgb, var(--accent) 30%, transparent); }
  body[data-theme="CLASSIC"] .card-answer { text-shadow: none; }
  .card-answer-pa { font-family: var(--font-gurmukhi); color: var(--text-bold); font-size: clamp(1.1rem, 3.4vw, 1.5rem); font-weight: 700; }
  .why-box {
    margin-top: 6px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: color-mix(in srgb, var(--text-dim) 7%, transparent);
    color: var(--text-bold);
    font-size: 0.95rem;
    line-height: 1.6;
    text-align: left;
  }
  .why-box .why-pa { display: block; margin-top: 5px; font-family: var(--font-gurmukhi); color: var(--text-dim); }
  .flip-hint { text-align: center; color: var(--text-dim); font-size: 0.68rem; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; opacity: 0.75; }

  /* Reduced motion / no-3D fallback: plain show-hide so the answer stays reachable. */
  @media (prefers-reduced-motion: reduce) {
    .flip { transition: none; }
    .scene.deal .flip { animation: none; }
    .scene.fly-left .flip, .scene.fly-right .flip { transition: none; }
    .progress-fill { transition: none; }
  }
  @supports not (transform-style: preserve-3d) {
    .flip { transform: none !important; }
    .face { position: static; }
    .face.back { transform: none; margin-top: 12px; }
    .scene:not(.is-flipped) .face.back { display: none; }
    .scene.is-flipped .face.front { display: none; }
  }

  /* ---------- Controls ---------- */
  .controls { display: flex; gap: 10px; margin-top: 18px; }
  .controls button {
    flex: 1;
    padding: 15px 10px;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 900;
    letter-spacing: 0.4px;
    transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
  }
  .controls button:active { transform: scale(0.96); }
  .controls button:disabled { opacity: 0.35; cursor: default; transform: none; }
  .btn-again { border: 1px solid color-mix(in srgb, var(--red) 55%, transparent); background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
  .btn-again:not(:disabled):hover { box-shadow: 0 0 22px color-mix(in srgb, var(--red) 25%, transparent); }
  .btn-flip { border: 1px solid var(--border); background: var(--panel); color: var(--text-bold); flex: 1.3; }
  .btn-flip:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .btn-good { border: 1px solid color-mix(in srgb, var(--green) 55%, transparent); background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
  .btn-good:not(:disabled):hover { box-shadow: 0 0 22px color-mix(in srgb, var(--green) 25%, transparent); }
  .controls .key-hint { display: block; margin-top: 3px; font-size: 0.6rem; font-weight: 700; letter-spacing: 1px; opacity: 0.6; }
  .sub-controls { display: flex; justify-content: center; gap: 16px; margin-top: 12px; }
  .ghost-btn { color: var(--text-dim); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.6px; padding: 8px 12px; border-radius: 10px; transition: color 0.2s; }
  .ghost-btn:hover { color: var(--text-bold); }
  .ghost-btn:disabled { opacity: 0.3; cursor: default; }

  /* ---------- Empty / loading / summary panels ---------- */
  .panel-card {
    min-height: clamp(300px, 48vh, 430px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: clamp(24px, 5vw, 40px);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 22px;
    background: var(--panel);
    text-align: center;
    animation: dealIn 0.42s var(--fluid-curve);
  }
  .panel-card h2 { font-size: clamp(1.3rem, 4vw, 1.7rem); font-weight: 900; }
  .panel-card .pa-line { font-family: var(--font-gurmukhi); color: var(--text-dim); font-size: 1rem; }
  .panel-card p { color: var(--text-dim); font-size: 0.95rem; line-height: 1.6; max-width: 46ch; }
  .summary-grid { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
  .summary-stat {
    min-width: 108px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: color-mix(in srgb, var(--text-dim) 6%, transparent);
  }
  .summary-stat .num { display: block; font-size: 1.7rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .summary-stat .lbl { display: block; margin-top: 3px; color: var(--text-dim); font-size: 0.64rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; }
  .summary-stat.good .num { color: var(--green); }
  .summary-stat.again .num { color: var(--red); }
  .summary-stat.mastered .num { color: var(--accent); }
  .panel-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .panel-actions .primary {
    padding: 13px 22px;
    border-radius: 14px;
    background: color-mix(in srgb, var(--accent) 82%, #000);
    color: #fff;
    font-weight: 900;
    box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 30%, transparent);
    transition: transform 0.12s;
  }
  body[data-theme="CLASSIC"] .panel-actions .primary { background: var(--accent); box-shadow: none; }
  .panel-actions .primary:active { transform: scale(0.96); }
  .panel-actions .secondary { padding: 13px 22px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); color: var(--text-bold); font-weight: 800; }
  .shimmer {
    width: 70%;
    max-width: 340px;
    height: 20px;
    border-radius: 8px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--text-dim) 12%, transparent) 25%, color-mix(in srgb, var(--text-dim) 26%, transparent) 50%, color-mix(in srgb, var(--text-dim) 12%, transparent) 75%);
    background-size: 200% 100%;
    animation: shimmerMove 1.3s linear infinite;
  }
  .shimmer.short { width: 42%; height: 14px; }
  @keyframes shimmerMove { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(26px, env(safe-area-inset-bottom));
    z-index: 200;
    transform: translate(-50%, 20px);
    padding: 11px 20px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    color: var(--text-bold);
    font-size: 0.8rem;
    font-weight: 800;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s var(--fluid-curve);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    .flash-header { gap: 8px 10px; padding-bottom: 10px; }
    .header-logo { font-size: 0.9rem; letter-spacing: 2px; }
    .home-pill { padding: 7px 10px; font-size: 0.66rem; }
    .router-btn { padding: 6px 10px; font-size: 0.62rem; }
    .theme-pill { font-size: 0.64rem; padding: 7px 10px; }
    .score-pill { font-size: 0.64rem; padding: 7px 11px; }
    .scene { min-height: clamp(300px, 50vh, 420px); }
    .controls button { padding: 13px 8px; font-size: 0.85rem; }
    .controls .key-hint { display: none; }
  }
</style>
<link rel="preload" href="assets/fonts/noto-sans-gurmukhi-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/gurmukhi-type.css">
</head>
<body>
<div class="page-veil" aria-hidden="true"></div>
<div class="aura-bleed" id="auraBleed"></div>
<div id="ariaAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<header class="flash-header">
  <a class="header-logo" href="index.html">BOLO<span class="dot-mode">.FLASH</span></a>
  <a class="home-pill" href="index.html">◂ Menu</a>
  <nav class="router" id="deckRouter" aria-label="Deck selector">
    <button class="router-btn active" type="button" data-deck="VOCAB">ਸ਼ਬਦਾਵਲੀ Vocab</button>
    <button class="router-btn" type="button" data-deck="CONCEPT">ਸੰਕਲਪ Concepts</button>
  </nav>
  <div class="dir-switch" id="dirSwitch" role="group" aria-label="Card direction">
    <button class="router-btn active" type="button" data-dir="EN2PA">EN → ਪੰ</button>
    <button class="router-btn" type="button" data-dir="PA2EN">ਪੰ → EN</button>
  </div>
  <span class="header-spacer"></span>
  <button class="tool-pill" type="button" id="shuffleBtn" aria-label="Shuffle deck">🔀 Shuffle</button>
  <button class="theme-pill" type="button" id="themePill" aria-label="Switch color theme">Theme: Neon</button>
  <span class="score-pill" id="masteryPill">★ <strong id="masteryVal">0</strong>&nbsp;mastered</span>
</header>

<nav class="chip-bar" id="chipBar" aria-label="Chapter filter"></nav>

<main class="stage" id="stage">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="deck-meta">
    <span id="cardCounter">Card 0 / 0</span>
    <span><span class="due-flag" id="dueFlag" hidden>⏳ <span id="dueCount">0</span> due</span></span>
    <span class="mastered-flag" id="scopeMastered">★ 0 / 0</span>
  </div>

  <div class="scene" id="scene" tabindex="0" role="button" aria-label="Flashcard. Press Space or Enter to flip.">
    <div class="flip" id="flip">
      <div class="face front" id="faceFront"></div>
      <div class="face back" id="faceBack"></div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="btn-again" type="button" id="againBtn">✕ Again<span class="key-hint">KEY 1</span></button>
    <button class="btn-flip" type="button" id="flipBtn">↻ Flip Card<span class="key-hint">SPACE</span></button>
    <button class="btn-good" type="button" id="goodBtn">✓ Got It<span class="key-hint">KEY 2</span></button>
  </div>
  <div class="sub-controls">
    <button class="ghost-btn" type="button" id="undoBtn" disabled>↶ Undo</button>
    <button class="ghost-btn" type="button" id="skipBtn">Skip ▸</button>
  </div>
</main>

<div class="toast" id="toast" role="status">Ready</div>

<script src="assets/chapters.js"></script>
<script src="assets/glossary.js"></script>
<script>
(function () {
  "use strict";

  /* ================= Constants & storage ================= */
  const THEME_KEY = "bolo.theme.v1";        // shared with index.html + mcq.html
  const STORE_KEY = "bolo.flash.v1";        // SRS boxes + preferences
  const STUDY_KEY = "pseb.study.v1";        // shared study-streak ledger

  const CHAPTERS = window.PSEB_CHAPTERS || [];
  const GLOSSARY = (window.PSEB_GLOSSARY && window.PSEB_GLOSSARY.terms) || [];
  const toGurPh = (window.PSEB_GLOSSARY && window.PSEB_GLOSSARY.gurmukhiPhonetic) || (s => "");

  const SUBJECT_VAR = { chemistry: "--chem", biology: "--bio", physics: "--phy", environment: "--env" };
  const SUBJECT_PA = { chemistry: "ਰਸਾਇਣ", biology: "ਜੀਵ ਵਿਗਿਆਨ", physics: "ਭੌਤਿਕ", environment: "ਵਾਤਾਵਰਣ" };
  const CH_BY_N = {};
  CHAPTERS.forEach(c => { CH_BY_N[c.n] = c; });

  /* Leitner ladder: minutes/days until a card is due again per box (1-5).
     Box 4+ counts as "mastered". "Again" always drops a card back to box 1. */
  const BOX_INTERVALS_MS = [10 * 60e3, 1 * 864e5, 3 * 864e5, 7 * 864e5, 21 * 864e5];
  const MASTERED_BOX = 4;

  function readJson(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; } }
  function writeJson(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

  const store = readJson(STORE_KEY);
  if (!store.srs || typeof store.srs !== "object") store.srs = {};
  if (!store.prefs || typeof store.prefs !== "object") store.prefs = {};
  function persistStore() { writeJson(STORE_KEY, store); }

  let deck = store.prefs.deck === "CONCEPT" ? "CONCEPT" : "VOCAB";
  let dir = store.prefs.dir === "PA2EN" ? "PA2EN" : "EN2PA";
  /* Selected chapter numbers; empty array = all chapters. */
  let chapterSel = Array.isArray(store.prefs.chapters) ? store.prefs.chapters.filter(n => CH_BY_N[n]) : [];

  /* ================= Theme ================= */
  let theme = "NEON";
  try { const t = readJson(THEME_KEY); if (t.theme === "CLASSIC") theme = "CLASSIC"; } catch (e) {}
  const themePill = document.getElementById("themePill");
  function applyTheme() {
    document.body.dataset.theme = theme;
    themePill.textContent = "Theme: " + (theme === "CLASSIC" ? "Classic" : "Neon");
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "CLASSIC" ? "#f8fbff" : "#000000");
    const aura = document.getElementById("auraBleed");
    aura.style.background = theme === "CLASSIC"
      ? "radial-gradient(ellipse at center, rgba(242,106,33,0.12) 0%, rgba(242,106,33,0.04) 40%, transparent 72%)"
      : "radial-gradient(ellipse at center, rgba(46,204,113,0.13) 0%, rgba(46,204,113,0.045) 40%, transparent 72%)";
  }
  themePill.addEventListener("click", () => {
    theme = theme === "NEON" ? "CLASSIC" : "NEON";
    writeJson(THEME_KEY, { theme });
    applyTheme();
    toast("Theme: " + (theme === "CLASSIC" ? "Classic" : "Neon"));
  });
  applyTheme();

  /* ================= Card sources ================= */
  /* Vocabulary cards come straight from the shared glossary (works offline and
     over file://). Concept cards are mined from the Say-It-Back slides that
     already live inside each chapter deck (data-q / data-a / data-pa /
     data-explain), fetched lazily per chapter and cached in memory. */
  const vocabCards = GLOSSARY.map((t, i) => ({
    id: "v:" + t.en.toLowerCase(),
    kind: "V",
    ch: (t.ch && t.ch[0]) || 1,
    chAll: t.ch || [1],
    en: t.en,
    pa: t.pa,
    ph: t.ph || ""
  }));

  const conceptCache = {};   // chapter n -> array of cards
  const conceptFailed = {};  // chapter n -> true (fetch failed; retryable)
  let conceptLoadToken = 0;

  function parseConceptCards(html, chNum) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const nodes = doc.querySelectorAll("[data-q][data-a]");
    const cards = [];
    nodes.forEach((el, i) => {
      const q = el.getAttribute("data-q") || "";
      const a = el.getAttribute("data-a") || "";
      if (!q || !a) return;
      cards.push({
        id: "c:" + chNum + ":" + (el.id || i),
        kind: "C",
        ch: chNum,
        q, a,
        pa: el.getAttribute("data-pa") || "",
        ex: el.getAttribute("data-explain") || "",
        exPa: el.getAttribute("data-explain-pa") || ""
      });
    });
    return cards;
  }

  function loadConceptChapters(chNums) {
    const pending = chNums.filter(n => !conceptCache[n] && CH_BY_N[n] && CH_BY_N[n].file);
    if (!pending.length) return Promise.resolve();
    return Promise.all(pending.map(n =>
      fetch(encodeURI(CH_BY_N[n].file))
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(html => { conceptCache[n] = parseConceptCards(html, n); delete conceptFailed[n]; })
        .catch(() => { conceptFailed[n] = true; })
    ));
  }

  /* ================= Scope & queue ================= */
  function scopeChapters() { return chapterSel.length ? chapterSel : CHAPTERS.map(c => c.n); }

  function scopeCards() {
    const chs = scopeChapters();
    if (deck === "VOCAB") {
      const set = new Set(chs);
      return vocabCards.filter(c => c.chAll.some(n => set.has(n)));
    }
    let out = [];
    chs.forEach(n => { if (conceptCache[n]) out = out.concat(conceptCache[n]); });
    return out;
  }

  function srsOf(id) { return store.srs[id] || null; }
  function isDue(id, now) { const s = srsOf(id); return !!s && s.d <= now; }
  function isMastered(id) { const s = srsOf(id); return !!s && s.b >= MASTERED_BOX; }

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* Session queue: overdue reviews first (oldest due leads), then brand-new
     cards, then everything else — each band shuffled so runs feel fresh. */
  function buildQueue() {
    const now = Date.now();
    const cards = scopeCards();
    const due = [], fresh = [], rest = [];
    cards.forEach(c => {
      const s = srsOf(c.id);
      if (!s) fresh.push(c);
      else if (s.d <= now) due.push(c);
      else rest.push(c);
    });
    due.sort((a, b) => srsOf(a.id).d - srsOf(b.id).d);
    return due.concat(shuffled(fresh), shuffled(rest));
  }

  /* ================= Session state ================= */
  let queue = [];
  let idx = 0;
  let flipped = false;
  let finished = false;
  let loading = false;
  let sessionGood = 0, sessionAgain = 0;
  let againIds = [];          // unique tricky card ids this session
  let lastAction = null;      // { id, prevSrs, wasRequeued, idxBefore } for Undo

  const scene = document.getElementById("scene");
  const flip = document.getElementById("flip");
  const faceFront = document.getElementById("faceFront");
  const faceBack = document.getElementById("faceBack");
  const controls = document.getElementById("controls");
  const subControls = document.querySelector(".sub-controls");
  const againBtn = document.getElementById("againBtn");
  const goodBtn = document.getElementById("goodBtn");
  const flipBtn = document.getElementById("flipBtn");
  const undoBtn = document.getElementById("undoBtn");
  const skipBtn = document.getElementById("skipBtn");
  const progressFill = document.getElementById("progressFill");
  const cardCounter = document.getElementById("cardCounter");
  const dueFlag = document.getElementById("dueFlag");
  const dueCount = document.getElementById("dueCount");
  const scopeMastered = document.getElementById("scopeMastered");
  const masteryVal = document.getElementById("masteryVal");
  const dirSwitch = document.getElementById("dirSwitch");
  const announcer = document.getElementById("ariaAnnouncer");
  const toastEl = document.getElementById("toast");
  let toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  /* ================= Rendering ================= */
  function subjectVarFor(card) {
    const ch = CH_BY_N[card.ch];
    return "var(" + (SUBJECT_VAR[(ch && ch.subject) || "chemistry"] || "--chem") + ")";
  }
  function chapterLabel(card) {
    const ch = CH_BY_N[card.ch];
    const subj = ch ? (SUBJECT_PA[ch.subject] || "") : "";
    return "Ch " + card.ch + (subj ? " · " + subj : "");
  }

  function ttsButton(text, lang) {
    if (!("speechSynthesis" in window) || !text) return "";
    return '<button class="tts-btn" type="button" data-tts="' + esc(text) + '" data-tts-lang="' + lang + '" aria-label="Speak">🔊</button>';
  }

  function renderCard(card) {
    const sub = subjectVarFor(card);
    scene.style.setProperty("--sub", sub);
    let frontHtml, backHtml;
    if (card.kind === "V") {
      const frontIsEn = dir === "EN2PA";
      const frontText = frontIsEn ? card.en : card.pa;
      const backText = frontIsEn ? card.pa : card.en;
      frontHtml =
        '<div class="face-top"><span class="card-tag">' + esc(chapterLabel(card)) + '</span>' +
        '<span class="card-kicker">ਸ਼ਬਦ · Term</span>' + ttsButton(card.en, "en") + '</div>' +
        '<div class="card-body">' +
          '<div class="card-main' + (frontIsEn ? "" : " gurmukhi") + '">' + esc(frontText) + '</div>' +
          (frontIsEn && card.ph ? '<div class="card-phonetic">' + esc(card.ph) + '</div>' : "") +
        '</div>' +
        '<div class="flip-hint">Tap / Space ਉਲਟਾਓ</div>';
      const gurPh = card.ph ? toGurPh(card.ph) : "";
      backHtml =
        '<div class="face-top"><span class="card-tag">' + esc(chapterLabel(card)) + '</span>' +
        '<span class="card-kicker">ਜਵਾਬ · Answer</span>' + ttsButton(card.en, "en") + '</div>' +
        '<div class="card-body">' +
          '<div class="card-answer' + (frontIsEn ? " gurmukhi" : "") + '">' + esc(backText) + '</div>' +
          '<div class="card-sub' + (frontIsEn ? "" : " gurmukhi") + '">' + esc(frontText) + '</div>' +
          (card.ph ? '<div class="card-phonetic">' + esc(card.ph) + (gurPh ? ' · <span class="pa-ph">' + esc(gurPh) + '</span>' : "") + '</div>' : "") +
        '</div>' +
        '<div class="flip-hint">✕ Again &nbsp;·&nbsp; ✓ Got It</div>';
    } else {
      frontHtml =
        '<div class="face-top"><span class="card-tag">' + esc(chapterLabel(card)) + '</span>' +
        '<span class="card-kicker">ਪ੍ਰਸ਼ਨ · Question</span>' + ttsButton(card.q, "en") + '</div>' +
        '<div class="card-body"><div class="card-main">' + esc(card.q) + '</div></div>' +
        '<div class="flip-hint">Tap / Space ਉਲਟਾਓ</div>';
      backHtml =
        '<div class="face-top"><span class="card-tag">' + esc(chapterLabel(card)) + '</span>' +
        '<span class="card-kicker">ਜਵਾਬ · Answer</span>' + ttsButton(card.a, "en") + '</div>' +
        '<div class="card-body">' +
          '<div class="card-answer">' + esc(card.a) + '</div>' +
          (card.pa && card.pa !== card.a ? '<div class="card-answer-pa">' + esc(card.pa) + '</div>' : "") +
          (card.ex ? '<div class="why-box">' + esc(card.ex) + (card.exPa ? '<span class="why-pa">' + esc(card.exPa) + '</span>' : "") + '</div>' : "") +
        '</div>' +
        '<div class="flip-hint">✕ Again &nbsp;·&nbsp; ✓ Got It</div>';
    }
    faceFront.innerHTML = frontHtml;
    faceBack.innerHTML = backHtml;
  }

  function renderPanel(html) {
    faceFront.innerHTML = "";
    faceBack.innerHTML = "";
    scene.hidden = true;
    controls.hidden = true;
    subControls.hidden = true;
    let panel = document.getElementById("panelCard");
    if (!panel) {
      panel = document.createElement("section");
      panel.className = "panel-card";
      panel.id = "panelCard";
      scene.parentNode.insertBefore(panel, scene);
    }
    panel.hidden = false;
    panel.innerHTML = html;
  }
  function hidePanel() {
    const panel = document.getElementById("panelCard");
    if (panel) panel.hidden = true;
    scene.hidden = false;
    controls.hidden = false;
    subControls.hidden = false;
  }

  function updateMeta() {
    const cards = scopeCards();
    const now = Date.now();
    const due = cards.filter(c => isDue(c.id, now)).length;
    const mastered = cards.filter(c => isMastered(c.id)).length;
    const masteredAll = Object.keys(store.srs).filter(id => store.srs[id].b >= MASTERED_BOX).length;
    cardCounter.textContent = finished || !queue.length ? "Card — / " + queue.length : "Card " + (idx + 1) + " / " + queue.length;
    dueFlag.hidden = due === 0;
    dueCount.textContent = String(due);
    scopeMastered.textContent = "★ " + mastered + " / " + cards.length;
    masteryVal.textContent = String(masteredAll);
    progressFill.style.width = queue.length ? Math.round((Math.min(idx, queue.length) / queue.length) * 100) + "%" : "0%";
  }

  function showCurrent(deal) {
    if (finished) return;
    if (idx >= queue.length) { showSummary(); return; }
    hidePanel();
    flipped = false;
    scene.classList.remove("is-flipped", "fly-left", "fly-right");
    renderCard(queue[idx]);
    updateGradeButtons();
    if (deal) {
      scene.classList.remove("deal");
      void scene.offsetWidth;
      scene.classList.add("deal");
    }
    updateMeta();
    const card = queue[idx];
    announcer.textContent = "Card " + (idx + 1) + " of " + queue.length + ". " + (card.kind === "V" ? (dir === "EN2PA" ? card.en : card.pa) : card.q);
  }

  function updateGradeButtons() {
    /* Grading is available once the answer has been seen — this keeps the
       Again/Good judgement honest without blocking keyboard power users
       (they can still flip first with Space). */
    againBtn.disabled = !flipped;
    goodBtn.disabled = !flipped;
    flipBtn.innerHTML = flipped
      ? '↻ Show Question<span class="key-hint">SPACE</span>'
      : '↻ Flip Card<span class="key-hint">SPACE</span>';
  }

  function doFlip() {
    if (finished || loading || idx >= queue.length) return;
    flipped = !flipped;
    scene.classList.toggle("is-flipped", flipped);
    updateGradeButtons();
    if (flipped) markStudyTouch();
  }

  /* ================= Grading (Leitner) ================= */
  function grade(good) {
    if (finished || loading || idx >= queue.length || !flipped) return;
    const card = queue[idx];
    const prev = srsOf(card.id) ? { ...srsOf(card.id) } : null;
    const now = Date.now();
    let s = srsOf(card.id) || { b: 0, d: 0, s: 0, l: 0 };
    s = { ...s };
    s.s += 1;
    if (good) {
      /* A brand-new card answered correctly jumps straight to box 2 (1 day). */
      s.b = s.b === 0 ? 2 : Math.min(s.b + 1, 5);
    } else {
      s.b = 1;
      s.l += 1;
    }
    s.d = now + BOX_INTERVALS_MS[s.b - 1];
    store.srs[card.id] = s;
    persistStore();

    let wasRequeued = false;
    if (good) { sessionGood += 1; }
    else {
      sessionAgain += 1;
      if (againIds.indexOf(card.id) === -1) againIds.push(card.id);
      /* Tricky card comes back a few cards later in this same session. */
      const at = Math.min(idx + 1 + 4, queue.length);
      queue.splice(at, 0, card);
      wasRequeued = true;
    }
    lastAction = { id: card.id, prevSrs: prev, wasRequeued, idxBefore: idx, wasGood: good };
    undoBtn.disabled = false;
    markStudyTouch();

    scene.classList.add(good ? "fly-right" : "fly-left");
    const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 40 : 260;
    setTimeout(() => { idx += 1; showCurrent(true); }, delay);
  }

  function undo() {
    if (!lastAction || loading) return;
    const { id, prevSrs, wasRequeued, idxBefore, wasGood } = lastAction;
    if (prevSrs) store.srs[id] = prevSrs; else delete store.srs[id];
    persistStore();
    if (wasGood) sessionGood = Math.max(0, sessionGood - 1);
    else {
      sessionAgain = Math.max(0, sessionAgain - 1);
      if (wasRequeued) {
        /* Remove the requeued copy that sits after the original position. */
        for (let i = idxBefore + 1; i < queue.length; i++) {
          if (queue[i].id === id) { queue.splice(i, 1); break; }
        }
      }
    }
    finished = false;
    idx = idxBefore;
    lastAction = null;
    undoBtn.disabled = true;
    showCurrent(true);
    toast("↶ Undone");
  }

  function skip() {
    if (finished || loading || idx >= queue.length) return;
    scene.classList.add("fly-right");
    const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 40 : 200;
    setTimeout(() => { idx += 1; showCurrent(true); }, delay);
  }

  /* ================= Summary / empty states ================= */
  function showSummary() {
    finished = true;
    updateMeta();
    progressFill.style.width = "100%";
    const cards = scopeCards();
    const mastered = cards.filter(c => isMastered(c.id)).length;
    const graded = sessionGood + sessionAgain;
    const pct = graded ? Math.round((sessionGood / graded) * 100) : 0;
    const headline = pct >= 85 ? "ਸ਼ਾਬਾਸ਼! Outstanding recall." : pct >= 60 ? "ਵਧੀਆ! Solid session." : "ਕੋਸ਼ਿਸ਼ ਜਾਰੀ ਰੱਖੋ! Keep drilling.";
    renderPanel(
      '<h2>Session Complete</h2>' +
      '<div class="pa-line">' + esc(headline) + '</div>' +
      '<div class="summary-grid">' +
        '<div class="summary-stat good"><span class="num">' + sessionGood + '</span><span class="lbl">✓ Got It</span></div>' +
        '<div class="summary-stat again"><span class="num">' + sessionAgain + '</span><span class="lbl">✕ Again</span></div>' +
        '<div class="summary-stat mastered"><span class="num">' + mastered + '</span><span class="lbl">★ Mastered</span></div>' +
      '</div>' +
      '<p>Mastered cards go quiet for up to 21 days, then return right when you are about to forget them — come back tomorrow for the next wave.</p>' +
      '<div class="panel-actions">' +
        (againIds.length ? '<button class="primary" type="button" data-act="tricky">⚡ Repeat ' + againIds.length + ' Tricky</button>' : "") +
        '<button class="' + (againIds.length ? "secondary" : "primary") + '" type="button" data-act="restart">↺ New Session</button>' +
        '<a class="secondary" style="text-decoration:none;display:inline-flex;align-items:center;" href="index.html">◂ Menu</a>' +
      '</div>'
    );
    announcer.textContent = "Session complete. " + sessionGood + " correct, " + sessionAgain + " to review again.";
  }

  function showEmpty(message, showRetry) {
    finished = true;
    renderPanel(
      '<h2>ਕੋਈ ਕਾਰਡ ਨਹੀਂ · No cards here</h2>' +
      '<p>' + esc(message) + '</p>' +
      '<div class="panel-actions">' +
        (showRetry ? '<button class="primary" type="button" data-act="retry">↻ Retry</button>' : "") +
        '<button class="secondary" type="button" data-act="all-chapters">Show All Chapters</button>' +
      '</div>'
    );
  }

  function showLoading() {
    renderPanel(
      '<h2>ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ…</h2>' +
      '<div class="shimmer"></div><div class="shimmer short"></div>' +
      '<p>Mining concept cards from the lecture decks…</p>'
    );
  }

  /* ================= Session bootstrap ================= */
  function startSession(announceShuffle) {
    finished = false;
    sessionGood = 0; sessionAgain = 0; againIds = [];
    lastAction = null; undoBtn.disabled = true;
    idx = 0;

    if (deck === "CONCEPT") {
      const chs = scopeChapters();
      const missing = chs.filter(n => !conceptCache[n]);
      if (missing.length) {
        loading = true;
        const token = ++conceptLoadToken;
        showLoading();
        loadConceptChapters(missing).then(() => {
          if (token !== conceptLoadToken) return; // superseded by a newer request
          loading = false;
          finishStart(announceShuffle);
        });
        return;
      }
    }
    finishStart(announceShuffle);
  }

  function finishStart(announceShuffle) {
    queue = buildQueue();
    if (!queue.length) {
      const chs = scopeChapters();
      const failed = chs.filter(n => conceptFailed[n]);
      if (deck === "CONCEPT" && failed.length) {
        showEmpty("Concept cards could not be loaded for the selected chapters. Check your connection (or open the app over http) and retry.", true);
      } else {
        showEmpty("Try widening the chapter filter — the selected chapters have no cards in this deck.", false);
      }
      updateMeta();
      return;
    }
    showCurrent(true);
    if (announceShuffle) toast("🔀 Deck shuffled");
  }

  /* ================= Chapter chips ================= */
  const chipBar = document.getElementById("chipBar");
  function renderChips() {
    let html = '<button class="chip' + (chapterSel.length === 0 ? " active" : "") + '" type="button" data-ch="ALL"><span class="dot"></span>ਸਾਰੇ All</button>';
    CHAPTERS.forEach(c => {
      const active = chapterSel.indexOf(c.n) !== -1;
      html += '<button class="chip' + (active ? " active" : "") + '" type="button" data-ch="' + c.n + '" style="--sub: var(' + (SUBJECT_VAR[c.subject] || "--chem") + ')" title="' + esc(c.title) + '"><span class="dot"></span>Ch ' + c.n + '</button>';
    });
    chipBar.innerHTML = html;
  }
  chipBar.addEventListener("click", e => {
    const chip = e.target.closest("[data-ch]");
    if (!chip) return;
    if (chip.dataset.ch === "ALL") chapterSel = [];
    else {
      const n = parseInt(chip.dataset.ch, 10);
      const at = chapterSel.indexOf(n);
      if (at === -1) chapterSel.push(n); else chapterSel.splice(at, 1);
      chapterSel.sort((a, b) => a - b);
    }
    store.prefs.chapters = chapterSel;
    persistStore();
    renderChips();
    startSession(false);
  });

  /* ================= Header controls ================= */
  document.getElementById("deckRouter").addEventListener("click", e => {
    const btn = e.target.closest("[data-deck]");
    if (!btn || btn.dataset.deck === deck) return;
    deck = btn.dataset.deck;
    store.prefs.deck = deck;
    persistStore();
    document.querySelectorAll("[data-deck]").forEach(b => b.classList.toggle("active", b.dataset.deck === deck));
    dirSwitch.style.display = deck === "VOCAB" ? "" : "none";
    startSession(false);
  });
  dirSwitch.addEventListener("click", e => {
    const btn = e.target.closest("[data-dir]");
    if (!btn || btn.dataset.dir === dir) return;
    dir = btn.dataset.dir;
    store.prefs.dir = dir;
    persistStore();
    document.querySelectorAll("[data-dir]").forEach(b => b.classList.toggle("active", b.dataset.dir === dir));
    startSession(false);
  });
  document.getElementById("shuffleBtn").addEventListener("click", () => startSession(true));

  /* ================= Card interactions ================= */
  flipBtn.addEventListener("click", doFlip);
  againBtn.addEventListener("click", () => grade(false));
  goodBtn.addEventListener("click", () => grade(true));
  undoBtn.addEventListener("click", undo);
  skipBtn.addEventListener("click", skip);

  scene.addEventListener("click", e => {
    const tts = e.target.closest("[data-tts]");
    if (tts) { speak(tts.dataset.tts, tts.dataset.ttsLang); e.stopPropagation(); return; }
    if (swipeMoved) return;
    doFlip();
  });

  /* Panel (summary / empty state) action buttons. */
  document.getElementById("stage").addEventListener("click", e => {
    const act = e.target.closest("[data-act]");
    if (!act) return;
    if (act.dataset.act === "restart") startSession(false);
    if (act.dataset.act === "retry") {
      scopeChapters().forEach(n => { if (conceptFailed[n]) delete conceptFailed[n]; });
      startSession(false);
    }
    if (act.dataset.act === "all-chapters") {
      chapterSel = [];
      store.prefs.chapters = [];
      persistStore();
      renderChips();
      startSession(false);
    }
    if (act.dataset.act === "tricky") {
      const ids = new Set(againIds);
      const pool = scopeCards().filter(c => ids.has(c.id));
      finished = false;
      sessionGood = 0; sessionAgain = 0; againIds = [];
      lastAction = null; undoBtn.disabled = true;
      queue = shuffled(pool);
      idx = 0;
      showCurrent(true);
      toast("⚡ Tricky cards only");
    }
  });

  /* Swipe: after the answer is revealed, fling left = Again, right = Got It.
     Before the flip a horizontal fling simply flips the card. */
  let swipeStartX = null, swipeStartY = null, swipeMoved = false;
  scene.addEventListener("pointerdown", e => {
    if (e.target.closest("[data-tts]")) return;
    swipeStartX = e.clientX; swipeStartY = e.clientY; swipeMoved = false;
  });
  scene.addEventListener("pointerup", e => {
    if (swipeStartX === null) return;
    const dx = e.clientX - swipeStartX;
    const dy = e.clientY - swipeStartY;
    swipeStartX = null;
    if (Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      swipeMoved = true;
      if (!flipped) doFlip();
      else grade(dx > 0);
      setTimeout(() => { swipeMoved = false; }, 350);
    }
  });
  scene.addEventListener("pointercancel", () => { swipeStartX = null; });

  /* Keyboard: Space/Enter flip · 1/X again · 2/G good · S shuffle · U undo. */
  document.addEventListener("keydown", e => {
    if (e.target && /^(input|textarea|select)$/i.test(e.target.tagName)) return;
    if (e.key === " " || e.key === "Enter") {
      if (e.target === scene || !e.target.closest("button, a")) { e.preventDefault(); doFlip(); }
    }
    else if (e.key === "1" || e.key === "x" || e.key === "X" || e.key === "ArrowLeft") { if (flipped) grade(false); }
    else if (e.key === "2" || e.key === "g" || e.key === "G" || e.key === "ArrowRight") { if (flipped) grade(true); }
    else if (e.key === "s" || e.key === "S") startSession(true);
    else if (e.key === "u" || e.key === "U") undo();
  });

  /* ================= Text-to-speech ================= */
  function speak(text, lang) {
    try {
      const synth = window.speechSynthesis;
      if (!synth) return;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === "pa" ? "pa-IN" : "en-IN";
      u.rate = 0.92;
      synth.speak(u);
    } catch (e) {}
  }

  /* ================= Study streak ledger =================
     Same ledger the lecture decks write (seconds studied per day), so
     flashcard time counts toward the home-screen streak flame. */
  let lastStudyTouch = 0;
  function markStudyTouch() {
    const now = Date.now();
    if (now - lastStudyTouch < 30e3) return; // throttle writes
    const gap = lastStudyTouch ? Math.min(120, Math.round((now - lastStudyTouch) / 1000)) : 30;
    lastStudyTouch = now;
    const s = readJson(STUDY_KEY);
    if (!s.days) s.days = {};
    const d = new Date();
    const mo = d.getMonth() + 1, da = d.getDate();
    const k = d.getFullYear() + "-" + (mo < 10 ? "0" : "") + mo + "-" + (da < 10 ? "0" : "") + da;
    s.days[k] = (s.days[k] || 0) + gap;
    writeJson(STUDY_KEY, s);
  }

  /* ================= Page veil & boot ================= */
  function reducedMotion() { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } }
  setTimeout(() => document.body.classList.add("page-entered"), 700);
  document.addEventListener("click", e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const link = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!link || (link.target && link.target !== "_self") || link.hasAttribute("download")) return;
    const raw = link.getAttribute("href") || "";
    if (!raw || raw.charAt(0) === "#" || /^(mailto:|tel:|javascript:)/i.test(raw)) return;
    let url;
    try { url = new URL(link.href, window.location.href); } catch (err) { return; }
    if (url.origin !== window.location.origin || url.pathname === window.location.pathname) return;
    e.preventDefault();
    document.body.classList.add("page-leaving");
    const target = link.href;
    setTimeout(() => { window.location.href = target; }, reducedMotion() ? 120 : 260);
  });
  window.addEventListener("pageshow", e => { if (e.persisted) document.body.classList.remove("page-leaving"); });

  dirSwitch.style.display = deck === "VOCAB" ? "" : "none";
  document.querySelectorAll("[data-deck]").forEach(b => b.classList.toggle("active", b.dataset.deck === deck));
  document.querySelectorAll("[data-dir]").forEach(b => b.classList.toggle("active", b.dataset.dir === dir));
  renderChips();
  startSession(false);
}());
</script>
<script defer src="assets/pwa.js"></script>
<script defer src="assets/bmc-coffee.js"></script>
</body>
